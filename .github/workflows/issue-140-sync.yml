name: Issue 140 scoped sync

on:
  push:
    branches:
      - fix/issue-140-past-bundle-cache

permissions:
  contents: write

jobs:
  sync-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-140-past-bundle-cache
          fetch-depth: 0

      - name: Sync latest dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          git merge --no-edit origin/dev

      - name: Install browser test runtime
        run: |
          npm install --global playwright
          playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
          echo "BROWSER_CHANNEL=chromium" >> "$GITHUB_ENV"

      - name: Run issue 140 regression and related checks after sync
        run: |
          node scripts/test_past_bundle_cache_upgrade.cjs
          node scripts/test_official_competency_runtime.cjs
          node scripts/test_past_answer_count.cjs
          node scripts/test_past_progress_migration.cjs
          node scripts/test_past_answer_feedback.cjs
          node scripts/test_dev_asset_resolution.cjs
          node scripts/test_official_bundle_browser.cjs
          node scripts/test_source_aware_weakness.cjs
          git diff --check origin/dev...HEAD

      - name: Remove temporary runner and push sync
        run: |
          git rm .github/workflows/issue-140-sync.yml
          git commit -m "chore: remove issue 140 temporary sync runner"
          git push origin HEAD:fix/issue-140-past-bundle-cache
