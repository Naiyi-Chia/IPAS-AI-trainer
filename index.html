"Loss 通常越低越好，accuracy 通常越高越好；應讓停止規則的改善方向與監控指標一致，並設定適當最小改善幅度。沿用 loss 的低值比較規則或只觀察訓練表現，都不符合驗證 accuracy 的監控目標。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q475","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23304","topicName":"模型調整與優化","concept":"Early Stopping","difficulty":"medium","question":"為何依驗證表現提早停止訓練，可視為一種正則化手段？","options":["限制過度貼合訓練細節的時間，減少繼續擬合雜訊","增加模型的隱藏層與參數，讓訓練資料更容易被記住","將驗證資料合併進訓練集，讓每輪訓練的樣本更多","將測試資料用於每輪更新，讓測試誤差下降得更快"],"answer":0,"explanation":"Early Stopping 限制訓練進程，可能減少模型持續擬合訓練雜訊。它不直接增加模型容量，也不是把驗證或測試資料納入權重更新；仍不保證完全避免過擬合。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q476","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23304","topicName":"模型調整與優化","concept":"Early Stopping","difficulty":"medium","question":"某停止規則設定 patience=5，定義為連續 5 輪未達改善門檻便停止。第 3 輪等待期間指標再次改善，等待計數通常如何處理？","options":["維持原計數，累計整次訓練中所有未改善輪數","直接停止訓練，因為先前已有未改善的輪數","重設等待計數，再從新的最佳值觀察後續改善","固定再跑兩輪，不論之後是否又出現新的改善"],"answer":2,"explanation":"當指標達到設定的改善門檻，最佳值更新並重設等待計數，之後重新計算連續未改善輪數。本題明定規則，避免不同實作的基準值或暖身設定造成歧義。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q477","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23304","topicName":"模型調整與優化","concept":"Early Stopping","difficulty":"medium","question":"validation loss 最低出現在 epoch 42，訓練於 epoch 47 提早停止。若部署目標是使用最佳驗證版本，應如何處理權重？","options":["使用第 47 輪權重，因為訓練停止代表已自動選到最佳","載入第 42 輪權重，用 checkpoint 或恢復設定","使用第 1 輪權重，因為提早停止應選擇最早訓練版本","平均第 42 與 47 輪權重，視為原本停止規則選到的版本"],"answer":1,"explanation":"最佳驗證版本是第 42 輪，需保存並載入該 checkpoint，或啟用恢復最佳權重的設定。停止訓練不必然自動恢復最佳權重；最後一輪或權重平均也不等同該版本。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q478","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23402","topicName":"演算法偏見與公平性","concept":"公平性指標取捨","difficulty":"hard","question":"貸款模型以「符合資格」為正類。整體準確率高，但兩群體中符合資格者被錯拒的比例不同。哪項評估最直接檢查這個問題？","options":["比較各群體樣本數，確認兩組是否有相同的人數","比較各群體核准率，確認整體被選取的比例是否相同","比較各群體精確率，確認獲核准者符合資格的比例","比較各群體漏判率，確認符合資格者被錯拒的比例"],"answer":3,"explanation":"符合資格卻被拒絕是 false negative，應比較群體 FNR，或等價地比較 TPR。核准率、精確率與樣本數各回答不同問題；整體準確率可能掩蓋此差異。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q479","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23402","topicName":"演算法偏見與公平性","concept":"公平性指標取捨","difficulty":"hard","question":"團隊移除性別欄位後宣稱模型已公平，但其他特徵可能與性別相關。哪項理由最能指出這個結論的不足？","options":["其他特徵可能保留代理訊號，仍需檢查各群體的結果","各群體都使用相同決策閾值，可據此確認群體待遇","整體準確率高於原先模型，可據此確認群體待遇","模型以同一演算法處理各群體，可據此確認群體待遇"],"answer":0,"explanation":"不直接使用敏感屬性不代表沒有代理訊號或群體傷害。需依情境檢查資料及分群結果；相同閾值、較高整體準確率或相同演算法，都不能取代群體影響評估。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q480","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23402","topicName":"演算法偏見與公平性","concept":"公平性指標取捨","difficulty":"hard","question":"二元模型在兩群體的正向預測比例相同，但真陽性率與假陽性率不同。對公平指標的解讀，哪項正確？","options":["demographic parity 未達成；equalized odds 已達成","demographic parity 已達成；equalized odds 未達成","demographic parity 已達成；equalized odds 已達成","demographic parity 未達成；equalized odds 未達成"],"answer":1,"explanation":"Demographic parity 比較群體正向預測比例；equalized odds 同時要求群體 TPR 與 FPR 相同。前者達成並不表示後者達成，更不代表所有公平問題都已解決。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q481","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23402","topicName":"演算法偏見與公平性","concept":"公平性指標取捨","difficulty":"hard","question":"正類表示應獲服務者。A 群體 100 位正類中漏判 10 位，B 群體 20 位正類中漏判 8 位。哪項分群分析最合理？","options":["A 群體漏判 10 位高於 B 的 8 位，故 A 的漏判率較高","兩群體合計漏判 18 位，可用此總數取代群體漏判率","A 漏判率 10%、B 為 40%，平均可能掩蓋落差","B 群體正類人數較少，應以總樣本數代替正類分母"],"answer":2,"explanation":"FNR 的分母是實際正類：A 為 10/100=10%，B 為 8/20=40%。只比錯誤人數或合計數會忽略群體分母與待遇落差；估計的可靠性還需考量樣本數。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q482","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23402","topicName":"演算法偏見與公平性","concept":"公平性指標取捨","difficulty":"hard","question":"模型移除敏感欄位，但郵遞區號可能作為代理變數。要評估此特徵的公平性影響，哪種實驗較適當？","options":["比較移除前後的整體準確率，以平均效能變化判定公平","比較移除前後的正向預測總數，以總選取率判定群體待遇","比較移除前後的特徵重要性，以重要性排名判定群體待遇","比較移除前後的分群錯誤率，連同效能與情境評估"],"answer":3,"explanation":"可用特徵移除實驗檢查分群結果與效能變化，並依傷害情境評估。代理關係不等於此特徵必須一律移除，移除也不保證公平；整體平均、總選取率或特徵排名不足以評估不同群體的待遇。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q483","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23402","topicName":"演算法偏見與公平性","concept":"公平性指標取捨","difficulty":"hard","question":"服務資格模型中，正類表示符合資格。團隊首要關切是兩群體符合資格者被錯拒的比例相近。哪個指標最直接對應此目標？","options":["比較各群體正向預測比例，作為人口統計平等指標","比較各群體正向預測的精確率，作為預測值平等指標","比較各群體真陽性率，作為機會平等指標","比較各群體總正確比例，作為整體準確率指標"],"answer":2,"explanation":"Equal opportunity（機會平等）比較群體 TPR；因 FNR=1−TPR，也直接對應符合資格者被錯拒的比例。其他指標著重選取率、精確率或總準確率，不能直接代表題述傷害目標。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"}]};

function competencyEvidence(){
  const by=new Map();
  Object.entries(state.attempts).forEach(([id,a])=>{
    const q=getQuestionById(id);
    if(!q||!Object.prototype.hasOwnProperty.call(DB.topics,q.topic))return;
    if(!by.has(q.topic))by.set(q.topic,{topic:q.topic,name:DB.topics[q.topic],subject:q.subject,
      combined:{correct:0,answered:0},official:{correct:0,answered:0},selfAuthored:{correct:0,answered:0}});
    const row=by.get(q.topic),source=id.startsWith('PAST-')?row.official:row.selfAuthored;
    [row.combined,source].forEach(v=>{v.answered++;if(a.correct)v.correct++});
  });
  const rows=[...by.values()];
  rows.forEach(row=>{
    [row.combined,row.official,row.selfAuthored].forEach(v=>v.accuracy=v.answered?v.correct/v.answered:null);
    row.insufficient=row.combined.answered<3;
    row.weak=!row.insufficient&&row.combined.accuracy<.70;
    row.drillAvailable=DB.questions.some(q=>q.topic===row.topic);
  });
  rows.sort((a,b)=>a.combined.accuracy-b.combined.accuracy||a.topic.localeCompare(b.topic));
  const formal=rows.filter(row=>row.weak),fallback=!formal.length;
  const selected=new Set((fallback?rows.slice(0,4):formal).map(row=>row.topic));
  rows.forEach(row=>row.fallback=fallback&&selected.has(row.topic));
  return {rows,selected,fallback};
}

function buildStratifiedExam(pool,n){
  const groups={};
  shuffle(pool).forEach(q=>(groups[q.topic]||(groups[q.topic]=[])).push(q));
  const keys=shuffle(Object.keys(groups)); const out=[];
  let safety=0;
  while(out.length<n && safety++<5000){
    let moved=false;
    for(const k of keys){
      if(groups[k].length && out.length<n){out.push(groups[k].pop());moved=true;}
    }
    if(!moved)break;
  }
  return shuffle(out);
}

function cleanBundledOption(value,letter){
  const raw=String(value||"").trim();
  for(const prefix of [`(${letter})`,`（${letter}）`,`${letter}.`,`${letter}、`]){

  }
  return raw;
}
function bundledQuestionToRuntime(paper,q,sharedContexts={}){
  const topic=q.competency_topic;
  if(typeof topic!=="string"||!Object.prototype.hasOwnProperty.call(DB.topics,topic)||!topic.startsWith(paper.subject)||q.competency_mapping_status!=="verified"||typeof q.competency_mapping_note!=="string")throw new Error(`內建題目能力映射無效：${paper.id} Q${q.question_no}`);
  const letters=["A","B","C","D"];
  const sharedContext=q.shared_context_id?sharedContexts[q.shared_context_id]:null;
  if(q.shared_context_id&&(!sharedContext||sharedContext.paper_id!==paper.id))throw new Error(`缺少本題共用情境：${q.shared_context_id}`);
  const sourcePages=q.source_page_start?`PDF P${q.source_page_start}${q.source_page_end&&q.source_page_end!==q.source_page_start?`–${q.source_page_end}`:""}`:"官方 PDF";
  return {
    id:`PAST-${paper.id}-${q.question_no}`,number:q.question_no,level:paper.level,subject:paper.subject,
    topic,topicName:DB.topics[topic],paperTitle:`${paper.year} 年 ${paper.session} ${paper.name}`,
    competency_topic:topic,competency_mapping_status:q.competency_mapping_status,competency_mapping_note:q.competency_mapping_note,
    difficulty:"official",question:q.question_text,
    options:letters.map(letter=>cleanBundledOption(q.options?.[letter],letter)),
    answer:letters.indexOf(q.answer),hasVisual:!!q.has_visual,
    visualAssets:Array.isArray(q.visual_assets)?q.visual_assets:[],
    sharedContextId:q.shared_context_id||null,sharedContext,
    sourcePageStart:q.source_page_start,sourcePageEnd:q.source_page_end,sourceNote:q.notes||"",
    explanation:`官方公告試題正解：${q.answer}`,
    sourceType:`iPAS 官方公告試題（verified canonical bundle；${sourcePages}）`
  };
}
async function loadOfficialPastBundle(){
  if(officialPastBundle)return officialPastBundle;
  if(!officialPastBundlePromise){
    officialPastBundlePromise=fetch(bundledAssetUrl(OFFICIAL_PAST_BUNDLE_PATH),{cache:"force-cache"})
      .then(r=>{if(!r.ok)throw new Error(`內建考古題資料 HTTP ${r.status}`);return r.json()})
      .then(data=>{
        if(data?.schema_version!==4||data?.source?.competency_mapping_status!=="verified"||data?.source?.row_count!==700||!Array.isArray(data?.papers)||data.papers.length!==14||!data.shared_contexts)throw new Error("內建考古題資料版本或筆數不符");
        const nextIndex=new Map();
        data.papers.forEach(bp=>{
          const paper=pastPapers.find(p=>p.id===bp.paper_id);
          if(!paper||bp.subject!==paper.subject||!Array.isArray(bp.questions)||bp.questions.length!==50)throw new Error(`內建考卷不完整：${bp.paper_id||"unknown"}`);
          bp.questions.forEach(q=>{
            if(q.verification_status!=="verified")throw new Error(`內建題目尚未 verified：${bp.paper_id} Q${q.question_no}`);
            const runtime=bundledQuestionToRuntime(paper,q,data.shared_contexts);
            if(runtime.answer<0||runtime.options.length!==4)throw new Error(`內建題目格式錯誤：${runtime.id}`);
            nextIndex.set(runtime.id,runtime);
          });
        });
        if(nextIndex.size!==700)throw new Error(`內建題目索引筆數錯誤：${nextIndex.size}`);
        officialPastQuestionIndex.clear();
        nextIndex.forEach((q,id)=>officialPastQuestionIndex.set(id,q));
        officialPastBundle=data;
        return data;
      }).catch(error=>{officialPastBundlePromise=null;throw error});
  }
  return officialPastBundlePromise;
}

  const data=await loadOfficialPastBundle();
  const bp=data.papers.find(p=>p.paper_id===paper.id);
  if(!bp)throw new Error(`找不到內建考卷：${paper.id}`);
  const questions=bp.questions.map(q=>officialPastQuestionIndex.get(`PAST-${paper.id}-${q.question_no}`));
  return {meta:{paperId:paper.id,title:`${paper.year} 年 ${paper.session} ${paper.subject} ${paper.name}`,pdf:paper.pdf,source:"canonical-bundle",sourceFile:bp.source_pdf_file,contentVersion:2},questions};
}

function paperProgress(p){
  const prefix=`PAST-${p.id}-`;
  const ids=Object.keys(state.attempts).filter(id=>id.startsWith(prefix));
  const correct=ids.filter(id=>state.attempts[id]?.correct).length;
  return {answered:ids.length,correct};
}
function currentPastProgress(){
  const answered=pastPaperSet.filter(q=>state.attempts[q.id]).length;
  const correct=pastPaperSet.filter(q=>state.attempts[q.id]?.correct).length;
  const accuracy=answered?Math.round(correct/answered*100):null;
  return {answered,correct,accuracy};
}
function pastProgressText(){
  const prog=currentPastProgress();
  return prog.answered
    ? `已作答 ${prog.answered} 題 · 答對 ${prog.correct} 題 · 目前正確率 ${prog.accuracy}%`
    : '尚未作答 · 作答後會自動儲存在此裝置';
}
function pastQuestionStateText(){
  const q=pastPaperSet[pastIndex];
  const prior=q?state.attempts[q.id]:null;
  return prior?`本題目前紀錄：${prior.correct?'✓ 正確':'✕ 錯誤'}`:'本題尚未作答';
}
function updatePastProgressStatus(){
  const el=qs('#pastScoreStatus');
  if(el)el.textContent=pastProgressText();
  const count=qs('#pastAnsweredCount');
  if(count)count.textContent=`已作答：${currentPastProgress().answered}/${pastPaperSet.length} 題`;
}
function updatePastQuestionState(){
  const el=qs('#pastQuestionState');
  if(el)el.textContent=pastQuestionStateText();
}
function pastScrollBehavior(){
  return window.matchMedia?.('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
}
function focusPastQuestionStart(){
  setTimeout(()=>{
    const target=qs('#pastQuestionStart');
    if(!target)return;
    target.scrollIntoView({behavior:pastScrollBehavior(),block:'start'});
    target.focus({preventScroll:true});
  },0);
}
function focusPastCompletion(){
  setTimeout(()=>{
    const target=qs('#pastCompletion');
    if(!target)return;
    target.scrollIntoView({behavior:pastScrollBehavior(),block:'start'});
    target.focus({preventScroll:true});
  },0);
}
function showPastQuizView(){
  qs('#past').innerHTML='<div id="pastQuizArea"></div>';
  renderPastQuiz();
}
function exitPastQuiz(){
  pastPaperSet=[];pastIndex=0;pastAnswered=false;pastPaperMeta=null;
  renderPastPapers();
  setTimeout(()=>qs('#pastPapersHeading')?.focus(),0);
}
function renderPastPapers(){
  const group=(level)=>pastPapers.filter(p=>p.level===level);
  const paperCard=(p,i)=>{
    const prog=paperProgress(p), score=prog.answered?Math.round(prog.correct/prog.answered*100):null;
    return `<div class="card c6">
      <div class="qmeta"><span class="qmetaPrimary">${p.year} 年 ${p.session} · ${p.subject}</span><span class="qmetaSecondary">${p.level}</span></div>
      <h3 style="margin:8px 0 5px">${esc(p.name)}</h3>
      <div class="small">考試日期：${p.date}　｜　官方 PDF：約 ${p.size}</div>
      <div class="small" style="margin-top:7px">${prog.answered?`已作答 ${prog.answered} 題 · 答對 ${prog.correct} 題${score!==null?` · 目前正確率 ${score}%`:''}`:'尚未作答 · 作答後會自動記錄進度'}</div>
      <div class="controls" style="margin-top:12px">
        <button class="btn primary" onclick="loadPastPaperById('${p.id}')">${prog.answered?'繼續刷題':'開始刷題'}</button>
        <a class="btn secondary" style="display:inline-block;text-decoration:none" href="${p.pdf}" target="_blank" rel="noopener">查看官方 PDF</a>
      </div>
    </div>`;
  };
  qs("#past").innerHTML=`
    <div class="card" style="margin-bottom:12px">
      <div class="examtop"><div><h3 id="pastPapersHeading" tabindex="-1" style="margin:0">官方考古題</h3><div class="small" style="margin-top:5px">${pastPapers.length} 份官方公告試題，直接點「開始刷題」即可</div></div>
      <a class="btn secondary" style="text-decoration:none" href="${officialLearningResources}" target="_blank" rel="noopener">官方歷屆考題頁</a></div>
      <div id="pastLoadStatus" class="small" role="status" aria-live="polite" style="margin-top:8px"></div>
    </div>
    <h3>初級 Lv1</h3><div class="grid">${group("初級").map(p=>paperCard(p,pastPapers.indexOf(p))).join("")}</div>
    <h3 style="margin-top:22px">中級 Lv2</h3><div class="grid">${group("中級").map(p=>paperCard(p,pastPapers.indexOf(p))).join("")}</div>`;
}

async function prewarmOfficialBundle(){
  try{
    if(navigator.connection&&navigator.connection.saveData)return;
    await loadOfficialPastBundle();
  }catch(e){console.warn("內建官方考古題預載失敗",e)}
}
async function loadPastPaperById(id){
  const paper=pastPapers.find(p=>p.id===id);
  if(!paper)return;
  const status=qs("#pastLoadStatus");
  try{
    if(status)status.textContent=`正在開啟 ${paper.year} 年 ${paper.session} ${paper.subject}…`;
    const parsed=await getBundledPastPaper(paper);
    pastPaperSet=parsed.questions;pastPaperMeta=parsed.meta;pastAnswered=false;
    const firstUnanswered=pastPaperSet.findIndex(q=>!state.attempts[q.id]);
    pastIndex=firstUnanswered>=0?firstUnanswered:0;
    showPastQuizView();
    focusPastQuestionStart();
  }catch(err){
    console.error(err);
    if(status)status.innerHTML=`<span class="bad">暫時無法開卷：</span>${esc(err.message||String(err))}　<a href="${paper.pdf}" target="_blank" rel="noopener">查看官方 PDF</a>`;
  }
}
function renderPastSharedContext(q){
  const context=q.sharedContext;
  if(!context)return "";
  const pages=`PDF 第 ${context.source_page_start}${context.source_page_end!==context.source_page_start?`–${context.source_page_end}`:""} 頁`;
  return `<details class="pastSharedContext" open style="margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:10px">
    <summary style="cursor:pointer;font-weight:700;padding:8px 0">本題共用情境 <span class="small">（${esc(pages)}）</span></summary>
    <pre class="pastSharedContextText" style="white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;font-size:1rem;line-height:1.7;margin:12px 0">${esc(context.text)}</pre>
    ${renderPastVisuals({number:q.number,visualAssets:context.visual_assets},"題組共用視覺")}
  </details>`;
}
function renderPastVisuals(q,visualLabel="官方原題視覺"){
  const list=Array.isArray(q.visualAssets)?q.visualAssets:[];
  if(list.length){
    return `<div class="pastVisualGrid" style="display:grid;gap:10px;margin:12px 0">${list.map((src,i)=>{
      const optionMatch=String(src).match(/_([a-d])\.png$/i);
      const label=optionMatch?`選項 ${optionMatch[1].toUpperCase()} 官方視覺`:`${visualLabel} ${i+1}/${list.length}`;
      return `<figure style="margin:0"><img src="${esc(bundledAssetUrl(src))}" alt="${esc(label)}，第 ${q.number} 題" loading="lazy" style="display:block;max-width:100%;height:auto;margin:0 auto;border:1px solid var(--line);border-radius:10px"><figcaption class="small" style="margin-top:4px;text-align:center">${esc(label)}</figcaption></figure>`;
    }).join("")}</div>`;
  }
  return q.hasVisual&&!q.sharedContext?.visual_assets?.length?`<div class="notice" style="margin:8px 0"><b>此題包含官方視覺資訊，但內建資產未能顯示。</b> 請用「核對官方原題 PDF」查看來源。</div>`:"";
}

function renderPastQuiz(){
  const area=qs('#pastQuizArea');
  if(!area)return;
  if(!pastPaperSet.length){
    area.innerHTML='';
    return;
  }
  const q=pastPaperSet[pastIndex];
  const prog=currentPastProgress();
  area.innerHTML=`<div class="card questionCard officialQuestion" style="margin-bottom:12px">
    <div class="pastQuizTop pastQuestionStart" id="pastQuestionStart" tabindex="-1" aria-label="第 ${q.number} 題開始">
      <div class="qmeta"><span class="qmetaPrimary">官方考古題 · 第 ${q.number} 題</span><span class="qmetaSecondary">${esc(pastPaperMeta?.title||'')}</span></div>
      <button class="btn secondary pastExitBtn" onclick="exitPastQuiz()">← 返回考卷列表</button>
    </div>
    <div id="pastScoreStatus" class="pastQuizStatus" role="status" aria-live="polite">${pastProgressText()}</div>
    <div class="pastQuestionFacts">
      <span>題目位置：第 ${pastIndex+1}/${pastPaperSet.length} 題</span>
      <span id="pastAnsweredCount">已作答：${prog.answered}/${pastPaperSet.length} 題</span>
      <span id="pastQuestionState" aria-live="polite">${pastQuestionStateText()}</span>
      <span><a href="${pastPaperMeta?.pdf||'#'}" target="_blank" rel="noopener">核對官方原題 PDF</a></span>
    </div>
    <div class="pastMobileNav" aria-label="考古題快速導覽">
      <span class="small"><b>第 ${pastIndex+1}/${pastPaperSet.length} 題</b></span>
      <div class="controls"><button class="btn secondary" onclick="pastPrev()" ${pastIndex===0?"disabled":""}>上一題</button><button class="btn primary" onclick="pastNext()">${pastIndex===pastPaperSet.length-1?"完成":"下一題"}</button></div>
    </div>
    <div class="progress" role="progressbar" aria-label="目前題目位置" aria-valuemin="1" aria-valuemax="${pastPaperSet.length}" aria-valuenow="${pastIndex+1}"><div style="width:${(pastIndex+1)/pastPaperSet.length*100}%"></div></div>
    ${renderPastSharedContext(q)}
    <div class="qtext" tabindex="-1">${esc(q.question)}</div>
    ${renderPastVisuals(q)}
    <div id="pastOpts" role="group" aria-label="作答選項" tabindex="-1">${q.options.map((o,i)=>`<button class="option" data-i="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</button>`).join('')}</div>
    <div class="navrow">
      <div><button class="btn secondary" onclick="pastPrev()" ${pastIndex===0?"disabled":""}>上一題</button> <button class="btn secondary" onclick="reportPastQuestion()">回報此題</button></div>
      <div><button class="btn secondary" onclick="restartPastQuiz()">重新作答本份</button> <button class="btn primary" onclick="pastNext()">${pastIndex===pastPaperSet.length-1?"完成這份":"下一題"}</button></div>
    </div>
  </div>`;
  qsa('#pastOpts .option').forEach(b=>b.onclick=()=>answerPast(+b.dataset.i));
}

function answerPast(i){
  if(pastAnswered) return;
  pastAnswered=true;
  const q=pastPaperSet[pastIndex], ok=i===q.answer;
  state.attempts[q.id]={correct:ok,last:Date.now(),subject:'PAST',topic:pastPaperMeta?.title||'官方考古題'};
  if(ok) delete state.wrong[q.id]; else state.wrong[q.id]=true;
  save();
  updatePastProgressStatus();
  updatePastQuestionState();
  qsa('#pastOpts .option').forEach((b,idx)=>{
    b.disabled=true;
    if(idx===q.answer)b.classList.add('correct');
    if(idx===i && !ok)b.classList.add('wrong');
    if(idx===q.answer || idx===i){
      const label=document.createElement('span');
      label.className='pastOptionState';
      label.textContent=idx===q.answer?(idx===i?'你的答案 · 官方正解':'官方正解'):'你的答案 · 錯誤';
      b.appendChild(label);
    }
  });
  qs('#pastOpts').focus();
}

function pastNext(){
  if(!pastPaperSet.length)return;
  if(pastIndex<pastPaperSet.length-1){
    pastIndex++;pastAnswered=false;renderPastQuiz();focusPastQuestionStart();
  }else{
    const answered=pastPaperSet.filter(q=>state.attempts[q.id]).length;
    const correct=pastPaperSet.filter(q=>state.attempts[q.id]&&state.attempts[q.id].correct).length;
    const score=answered?Math.round(correct/pastPaperSet.length*100):0;
    qs('#pastQuizArea').innerHTML=`<div class="card questionCard" id="pastCompletion" tabindex="-1"><h3>這份官方考古題完成了</h3><div class="kpi ${score>=70?'good':'bad'}">${score} 分</div><p>${correct}/${pastPaperSet.length} 題正確。作答紀錄已保留在此裝置，你可以返回考卷列表選其他考卷，或重新作答本份。</p><div class="controls"><button class="btn secondary" onclick="exitPastQuiz()">返回考卷列表</button><button class="btn primary" onclick="restartPastQuiz()">重新作答這份</button></div></div>`;
    focusPastCompletion();
  }
}
function pastPrev(){
  if(pastIndex>0){pastIndex--;pastAnswered=false;renderPastQuiz();focusPastQuestionStart();}
}
function restartPastQuiz(){
  pastIndex=0;pastAnswered=false;
  if(!qs('#pastQuizArea'))qs('#past').innerHTML='<div id="pastQuizArea"></div>';
  renderPastQuiz();focusPastQuestionStart();
}

function getQuestionById(id){
  return DB.questions.find(x=>x.id===id)||officialPastQuestionIndex.get(id);
}
function renderWrong(){
  const ids=Object.keys(state.wrong);
  if(ids.some(id=>id.startsWith("PAST-"))&&!officialPastBundle){
    qs("#wrong").innerHTML='<div class="card"><h3 style="margin-top:0">錯題本</h3><p class="small">正在載入內建官方錯題資料…</p></div>';
    loadOfficialPastBundle().then(()=>{if(qs("#wrong")?.classList.contains("active"))renderWrong()}).catch(e=>console.warn("官方錯題資料載入失敗",e));
    return;
  }
  const qsx=ids.map(getQuestionById).filter(Boolean);
  qs("#wrong").innerHTML=`<div class="card"><div class="examtop"><h3 style="margin:0">錯題本（${qsx.length}）</h3><button class="btn secondary" onclick="startWrongPractice()">重刷錯題</button></div>
  ${qsx.length?qsx.slice(0,120).map(q=>`<div class="topicbar"><div><b>${esc(q.id)}</b> ${esc(q.question)}<div class="small">${esc(q.subject||'')}｜${esc(q.topic||'')} ${esc(q.topicName||'')}</div></div></div>`).join(""):"目前沒有錯題。"}</div>`;
}
async function startWrongPractice(){
  const ids=Object.keys(state.wrong);
  if(ids.some(id=>id.startsWith("PAST-"))&&!officialPastBundle){
    try{await loadOfficialPastBundle()}catch(e){console.warn("官方錯題資料載入失敗",e)}
  }
  const arr=shuffle(ids.map(getQuestionById).filter(Boolean));
  if(!arr.length)return;
  switchPanel("practice");renderPractice();
  beginPracticeSession(arr,`錯題本｜${arr.length} 題`);
}

let statsRenderRequest=0;
function renderStats(){
  const request=++statsRenderRequest;
  if(needsCompetencyMetadata()){
    qs('#stats').innerHTML='<div class="card" role="status">正在載入官方作答的章節資料，準備合併分析…</div>';
    return loadOfficialPastBundle().then(()=>{if(request===statsRenderRequest&&qs("#stats")?.classList.contains("active"))renderStats()}).catch(()=>{
      if(request!==statsRenderRequest)return;
      qs('#stats').innerHTML='<div class="card" role="alert"><p>官方章節資料載入失敗，暫時無法顯示完整分析。作答紀錄已保留。</p><button class="btn secondary" onclick="renderStats()">重新載入</button></div>';
    });
  }
  const {rows}=competencyEvidence();
  let hist=state.examHistory||[];
  const pastRows=pastPapers.map(p=>{const pr=paperProgress(p);return {...p,...pr,score:pr.answered?Math.round(pr.correct/pr.answered*100):null}}).filter(p=>p.answered);
  qs("#stats").innerHTML=`<div class="grid"><div class="card c8"><h3 style="margin-top:0">能力小章節弱點分析</h3>
  <p class="small">官方考古題與自編題逐題等權合併，每題採最近一次結果，做題順序不限。至少 3 題且正確率低於 70% 為弱項；1–2 題僅供初步參考。沒有正式弱項時，最多選 4 個相對較弱章節作為備援練習。</p>
  ${rows.length?rows.map(v=>{
    const p=Math.round(v.combined.accuracy*100),m=officialScopeMeta(v.subject,v.topic);
    const status=v.weak?'弱項':v.insufficient?'資料不足（初步訊號）':'目前未達弱項門檻';
    return `<div class="topicbar competencyRow" data-topic="${esc(v.topic)}">
      <div class="competencyHeading"><h4>${esc(v.topic)}｜${esc(v.name)}</h4><span class="${v.weak?'bad':'small'}">${status}</span></div>
      <div class="competencyResult"><b>合併 ${v.combined.correct}/${v.combined.answered} 正確 · ${p}%</b><div class="bar" aria-hidden="true"><i style="width:${p}%"></i></div></div>
      <div class="small competencySources"><span>官方考古題 ${v.official.correct}/${v.official.answered} 正確</span><span>自編題 ${v.selfAuthored.correct}/${v.selfAuthored.answered} 正確</span></div>
      ${v.fallback?'<div class="small">相對較弱／備援選題，非確定弱項。</div>':''}
      ${!v.drillAvailable?'<div class="small">此章節目前沒有對應自編題，診斷仍保留，可先複習章節。</div>':''}
      <a class="competencyReview" href="${esc(m.url)}" target="_blank" rel="noopener" aria-label="${esc(`複習 ${v.topic} ${v.name}｜${m.section}`)}">複習此章節 ↗</a>
    </div>`;
  }).join(""):"尚無能力章節作答資料。官方考古題或自編題的作答都可建立弱點分析。"}</div>
  <div class="card c4"><h3 style="margin-top:0">官方考古題進度</h3><p class="small">依考卷顯示的來源進度；章節診斷請看「能力小章節弱點分析」。</p>${pastRows.length?pastRows.slice(0,10).map(h=>`<div class="topicbar"><div><b>${h.year} ${h.session} ${h.subject}</b><div class="small">${h.answered} 題已作答</div></div><b class="${h.score>=70?'good':'bad'}">${h.score}%</b></div>`).join(""):"尚無考古題作答紀錄"}
  <h3>最近模擬</h3>${hist.length?hist.slice(0,6).map(h=>`<div class="topicbar"><div><b>${h.subject}</b><div class="small">${new Date(h.date).toLocaleDateString()}</div></div><b class="${h.score>=70?'good':'bad'}">${h.score}</b></div>`).join(""):"尚無模擬紀錄"}
  <button class="btn danger" style="margin-top:12px" onclick="resetAll()">清除全部進度</button></div></div>`;
}
function resetAll(){
  if(confirm("確定清除所有作答、錯題與模擬紀錄？")){
    localStorage.removeItem("ipasAIState");
    localStorage.removeItem(PAST_MIGRATION_BACKUP_KEY);
    localStorage.removeItem("ipasOfficialPastCacheV2");
    location.reload();
  }
}
function renderScope(){
 const groups={};
 Object.keys(DB.topics).forEach(t=>{let sub=t.slice(0,3).replace(/^L/,"L"); let candidates=Object.keys(DB.subjects).filter(s=>t.startsWith(s)); let s=candidates.sort((a,b)=>b.length-a.length)[0]; if(!groups[s])groups[s]=[];groups[s].push(t)});
 qs("#scope").innerHTML=`<div class="card"><h3 style="margin-top:0">115 年官方評鑑範圍</h3>
 <p class="small">下列代碼與名稱依 iPAS 115 年 AI 應用規劃師能力鑑定簡章整理。</p>
 ${Object.keys(DB.subjects).map(s=>`<h4>${subjectLabel(s)}</h4><div class="scopeList">${(groups[s]||[]).map(t=>{const m=officialScopeMeta(s,t);const label=`開啟 ${s} 官方學習指引｜${m.section}${m.page?`｜PDF 第 ${m.page} 頁`:""}`;return `<a class="scopeLink" href="${m.url}" target="_blank" rel="noopener" title="${esc(label)}" aria-label="${esc(label)}"><b>${t}</b> ${esc(DB.topics[t])} ↗</a>`}).join("")}</div>`).join("")}
 <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
 <p><a href="${officialLearningResources}" target="_blank" rel="noopener">iPAS 官方學習資源</a>　｜　<a href="${officialBrochure}" target="_blank" rel="noopener">115 年官方簡章</a>　｜　<a href="${officialSite}" target="_blank" rel="noopener">iPAS 官方網站</a></p>
 <div class="notice"><b>中級報考結構：</b>L21「人工智慧技術應用與規劃」為共同科目，另由 L22「大數據處理分析與應用」或 L23「機器學習技術與應用」擇一。若你想兩張中級證書方向都準備，本工具也可以三科全部刷。</div>
 </div>`;
}

renderHome();renderPractice();renderExam();renderPastPapers();renderScope();
setTimeout(()=>prewarmOfficialBundle(),0);
</script>
