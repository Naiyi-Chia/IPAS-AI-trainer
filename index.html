<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>iPAS AI 應用規劃師刷題工具｜初級＋中級</title>
<style>
:root{
  --bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#596579;--line:#e4e7ec;
  --brand:#4f46e5;--brand2:#7c3aed;--ok:#087443;--bad:#b42318;--warn:#b54708;
  --soft:#eef2ff;--focus:#a5b4fc
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
button,select,input{font:inherit}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,[tabindex="-1"]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{max-width:1120px;margin:auto;padding:14px 16px 84px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:white;font-weight:800;flex:0 0 auto}
h1{font-size:clamp(22px,2.5vw,26px);line-height:1.2;margin:0;letter-spacing:-.015em}
h2{font-size:22px;line-height:1.3}
h3{font-size:18px;line-height:1.35}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;padding:4px 0 8px;position:sticky;top:0;background:rgba(246,247,251,.97);backdrop-filter:blur(10px);z-index:5;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:0;background:transparent;padding:8px 11px;border-radius:9px;cursor:pointer;scroll-snap-align:start;transition:background-color .16s ease,color .16s ease;min-height:40px;color:#344054;font-weight:650}
.tab:hover{background:#eef2f6}
.tab.active{background:#111827;color:white}
.panel{display:none;padding-top:12px}
.panel.active{display:block}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:none}
.questionCard{max-width:820px;margin-inline:auto}
.officialQuestion .qtext,.officialQuestion .option{white-space:pre-wrap;overflow-wrap:anywhere}
.metricCard{background:#fafbfc;padding:14px;border-radius:12px}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c8{grid-column:span 8}.c12{grid-column:span 12}
.kpi{font-size:28px;font-weight:800;letter-spacing:-.02em}
.label{font-size:13px;color:var(--muted);font-weight:650}
.pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:var(--soft);color:#3730a3;font-size:12px;margin:2px}
.qmeta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:13px;color:var(--muted)}
.qmetaPrimary{font-weight:700;color:#344054}
.qmetaSecondary{color:var(--muted)}
.scopeList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;margin-bottom:14px}
.scopeLink{display:block;padding:7px 0;border-bottom:1px solid #eef0f4;text-decoration:none;line-height:1.45}
.scopeLink:hover{text-decoration:underline}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls select,.controls input{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 10px;min-height:44px;color:var(--ink)}
.settingsControls{align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;flex:1 1 150px;min-width:0}
.field label{font-size:13px;font-weight:650;color:var(--muted)}
.sessionbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;padding:13px 15px}
.sessionbar .small{line-height:1.5}
.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:650;min-height:44px;transition:background-color .15s ease,border-color .15s ease}
.btn:disabled{cursor:not-allowed;opacity:.45}
.primary{background:var(--brand);color:white}
.primary:hover{background:#4338ca}
.secondary{background:#fff;border:1px solid var(--line);color:#344054}
.secondary:hover{border-color:#cbd5e1;background:#f8fafc}
.danger{background:#fff;color:var(--bad);border:1px solid #fecdca}
.qtext{font-size:20px;font-weight:600;line-height:1.68;margin:10px 0 16px;letter-spacing:.002em}
.option{display:block;width:100%;text-align:left;padding:13px 14px;margin:8px 0;border:1px solid var(--line);background:white;border-radius:10px;cursor:pointer;font-size:16px;line-height:1.62;transition:border-color .14s ease,background-color .14s ease}
.option:hover{border-color:#a5b4fc}
.option.selected{border-color:var(--brand);background:#eef2ff}
.option.correct{border-color:#6ce9a6;background:#ecfdf3}
.option.wrong{border-color:#fda29b;background:#fef3f2}
#pastOpts .option{color:var(--ink);-webkit-text-fill-color:currentColor}
#pastOpts .option:disabled{opacity:1;cursor:default}
#pastOpts .option:disabled:not(.correct):not(.wrong){border-color:var(--line)}
#pastOpts .option.correct{border-color:var(--ok)}
#pastOpts .option.wrong{border-color:var(--bad)}
#pastOpts .pastOptionState{display:block;margin-top:6px;font-size:14px;font-weight:700}
#pastOpts .correct .pastOptionState{color:var(--ok)}
#pastOpts .wrong .pastOptionState{color:var(--bad)}
.explain{margin-top:14px;padding:14px 15px;border-radius:10px;background:#f8fafc;border-left:3px solid #c7d2fe;line-height:1.72;font-size:16px}
.hidden{display:none!important}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
.progress{height:7px;background:#eaecf0;border-radius:999px;overflow:hidden;margin:10px 0 12px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.examtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px}
.timer.low{color:var(--bad)}
.palette{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:14px}
.pnum{border:1px solid var(--line);background:white;border-radius:7px;padding:6px;font-size:12px;cursor:pointer;min-width:44px;min-height:44px}
.pnum.done{background:#e0e7ff;border-color:#a5b4fc}
.pnum.current{outline:2px solid #111827;outline-offset:1px}
.topicbar{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:10px 0}
.competencyRow{display:block;min-width:0}
.competencyHeading{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.competencyHeading h4{margin:0;flex:1 1 240px;overflow-wrap:anywhere}
.competencyResult{display:flex;align-items:center;gap:12px;margin:8px 0;font-variant-numeric:tabular-nums}
.competencyResult .bar{max-width:none}
.competencySources{display:flex;flex-wrap:wrap;gap:4px 16px}
.competencyReview{display:inline-flex;align-items:center;min-height:44px;margin-top:4px}
.reviewItem{border-top:1px solid var(--line);margin:0}
.reviewItem:first-of-type{border-top:0}
.reviewItem summary{cursor:pointer;padding:13px 2px;font-weight:700;background:transparent}
.reviewBody{padding:0 2px 14px;line-height:1.68}
.reviewChoice{padding:9px 10px;border-radius:8px;margin:6px 0;background:#f8fafc}
.reviewChoice.correct{background:#ecfdf3}.reviewChoice.wrong{background:#fef3f2}
.modebadge{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)}
.bar{height:7px;background:#eaecf0;border-radius:999px;overflow:hidden;flex:1;max-width:240px}.bar i{display:block;height:100%;background:var(--brand)}
.small{font-size:13px;color:var(--muted);line-height:1.55}
.feedbackbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0;padding:6px 2px 10px;border-bottom:1px solid var(--line);background:transparent}
.feedbackbar .copy{font-size:13px;color:var(--muted);line-height:1.45}
.feedbackbar .btn{white-space:nowrap;min-height:40px;padding-block:8px}
.questionFeedback{display:flex;justify-content:flex-end;margin-top:10px}
.questionFeedback .btn{font-size:13px}
.pastQuizTop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pastQuizTop .qmeta{flex:1}
.pastExitBtn{white-space:nowrap}
.pastQuizStatus{display:flex;align-items:center;gap:10px;min-height:42px;margin:10px 0 8px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#f8fafc;font-size:14px;font-weight:700}
.pastQuestionStart{scroll-margin-top:72px}
.pastQuestionFacts{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 10px;color:var(--muted);font-size:13px}
.pastQuestionFacts span{white-space:nowrap}
.pastMobileNav{display:none}
.notice{background:#fffaeb;border:1px solid #fedf89;border-radius:10px;padding:12px 13px;line-height:1.6}
.good{color:var(--ok)}.bad{color:var(--bad)}
a{color:var(--brand)}
.footer{color:var(--muted);font-size:12px;margin-top:20px;line-height:1.6}
@media(max-width:720px){
  .c6,.c4,.c8{grid-column:span 12}
  .app{padding:10px 10px 76px}
  .top{align-items:center;margin-bottom:6px}
  .logo{width:34px;height:34px;border-radius:9px}
  h1{font-size:20px}
  .top .sub{max-width:290px;font-size:12px;line-height:1.4}
  .tabs{margin-right:-10px;padding-right:18px;padding-bottom:6px}
  .tab{min-height:44px;padding:8px 10px}
  .panel{padding-top:10px}
  .feedbackbar{align-items:center;padding:5px 0 8px}
  .feedbackbar .copy{font-size:12px}
  .feedbackbar .btn{flex:0 0 auto;font-size:13px;padding-inline:10px}
  .qtext{font-size:18px;line-height:1.68}
  .option{font-size:16px;line-height:1.62}
  .palette{grid-template-columns:repeat(5,minmax(44px,1fr))}
  .sessionbar{align-items:stretch;flex-direction:column}
  .sessionbar .btn{width:100%}
  .settingsControls{align-items:stretch}
  .field{flex-basis:100%}
  .controls{align-items:stretch}
  .controls select,.controls input{font-size:16px}
  .controls select{flex:0 0 auto;min-width:0}
  .controls .btn{flex:1 1 auto}
  .navrow{align-items:stretch;flex-direction:column}
  .pastQuizTop{flex-direction:column}
  .pastExitBtn{width:100%}
  .pastQuizStatus{align-items:flex-start;line-height:1.45}
  .pastQuestionFacts{gap:5px 10px}
  .pastMobileNav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 0 12px;padding:8px 0 10px;border-bottom:1px solid var(--line)}
  .pastMobileNav .controls{flex-wrap:nowrap}
  .pastMobileNav .btn{min-height:42px;padding:8px 10px}
  .navrow>div{display:flex;gap:7px}
  .navrow>div .btn{flex:1}
  .card{padding:15px;border-radius:12px}
  .metricCard{padding:12px}
  .examtop{align-items:flex-start}
  .reviewItem summary{padding:12px 0}
  .scopeList{grid-template-columns:1fr}
  .footer{padding:0 4px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">AI</div><div><h1>iPAS AI 應用規劃師刷題工具</h1></div>
  </div>
  <div class="tabs" role="tablist" aria-label="主要功能">
    <button class="tab active" id="tab-practice" role="tab" aria-selected="true" aria-controls="practice" data-panel="practice">刷題練習</button>
    <button class="tab" id="tab-exam" role="tab" aria-selected="false" aria-controls="exam" data-panel="exam">正式模擬</button>
    <button class="tab" id="tab-past" role="tab" aria-selected="false" aria-controls="past" data-panel="past">考古題</button>
    <button class="tab" id="tab-wrong" role="tab" aria-selected="false" aria-controls="wrong" data-panel="wrong">錯題本</button>
    <button class="tab" id="tab-stats" role="tab" aria-selected="false" aria-controls="stats" data-panel="stats">弱點分析</button>
    <button class="tab" id="tab-scope" role="tab" aria-selected="false" aria-controls="scope" data-panel="scope">官方範圍</button>
  </div>
  <div class="feedbackbar">
    <div class="copy"><b id="appVersionLabel">v0.1-beta</b> · 測試版｜遇到題目或操作問題都可以回報</div>
    <button class="btn secondary" onclick="openOverallFeedback()">提供整體回饋</button>
  </div>

  <section id="practice" class="panel active" role="tabpanel" aria-labelledby="tab-practice"></section>
  <section id="exam" class="panel" role="tabpanel" aria-labelledby="tab-exam" hidden></section>
  <section id="past" class="panel" role="tabpanel" aria-labelledby="tab-past" hidden></section>
  <section id="wrong" class="panel" role="tabpanel" aria-labelledby="tab-wrong" hidden></section>
  <section id="stats" class="panel" role="tabpanel" aria-labelledby="tab-stats" hidden></section>
  <section id="scope" class="panel" role="tabpanel" aria-labelledby="tab-scope" hidden></section>

  <div class="footer">
    v0.1-beta｜「刷題練習／正式模擬」為依 iPAS 官方評鑑範圍自編的練習題；「考古題」分頁則使用 iPAS 官方公告試題來源。進度與考古題快取儲存在你的瀏覽器 localStorage。
  </div>
</div>

<script>
const APP_VERSION='v0.1-beta';
const FEEDBACK_FORM_BASE='https://docs.google.com/forms/d/e/1FAIpQLSce4-nSHK8ZO5eF_jqYUP-zgsvBr327P6ff-TC7IeuU6oEchA/viewform';
const FEEDBACK_ENTRY={
  category:'entry.1775670574',
  description:'entry.1029356723',
  version:'entry.569995882',
  qid:'entry.1596845565',
  level:'entry.1661710360',
  subject:'entry.1508399357',
  topic:'entry.1812402467',
  source:'entry.194620068',
  device:'entry.527150699',
  browser:'entry.1867894494'
};
function detectDevice(){
  const ua=navigator.userAgent||'';
  const isIPad=/iPad/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(isIPad||/Tablet|Android(?!.*Mobile)/i.test(ua))return 'Tablet';
  if(/iPhone|iPod|Mobile|Android/i.test(ua))return 'Mobile';
  return 'Desktop';
}
function detectBrowser(){
  const ua=navigator.userAgent||'';
  if(/EdgiOS|Edg\//i.test(ua))return 'Edge';
  if(/CriOS|Chrome\//i.test(ua))return 'Chrome';
  if(/FxiOS|Firefox\//i.test(ua))return 'Firefox';
  if(/Safari\//i.test(ua)&&!/Chrome|CriOS|Edg|OPR/i.test(ua))return 'Safari';
  return 'Other';
}
function feedbackSubjectLabel(q){
  if(!q||!q.subject)return '';
  const s=DB.subjects?.[q.subject];
  return s?`${q.subject} ${s.name}`:String(q.subject);
}
function feedbackTopicLabel(q,sourceType){
  if(!q)return '';
  if(sourceType==='官方考古題'){
    const paper=q.paperTitle||pastPaperMeta?.title||q.topicName||q.topic||'官方考古題';
    return `${paper}${q.number?`｜第 ${q.number} 題`:''}`;
  }
  return [q.topic,q.topicName].filter(Boolean).join(' ');
}
function buildFeedbackUrl(category,q=null,sourceType='自編練習題'){
  const params=new URLSearchParams();
  params.set('usp','pp_url');
  params.set(FEEDBACK_ENTRY.version,APP_VERSION);
  params.set(FEEDBACK_ENTRY.device,detectDevice());
  params.set(FEEDBACK_ENTRY.browser,detectBrowser());
  if(category)params.set(FEEDBACK_ENTRY.category,category);
  if(q){
    params.set(FEEDBACK_ENTRY.qid,q.id||'');
    params.set(FEEDBACK_ENTRY.level,q.level||'');
    params.set(FEEDBACK_ENTRY.subject,feedbackSubjectLabel(q));
    params.set(FEEDBACK_ENTRY.topic,feedbackTopicLabel(q,sourceType));
    params.set(FEEDBACK_ENTRY.source,sourceType);
  }
  return FEEDBACK_FORM_BASE+'?'+params.toString();
}
function openFeedback(category,q=null,sourceType='自編練習題'){
  window.open(buildFeedbackUrl(category,q,sourceType),'_blank','noopener,noreferrer');
}
function openOverallFeedback(){openFeedback(null,null);}
function reportPracticeQuestion(){if(practiceSet.length)openFeedback('題目、答案或解析有問題',practiceSet[pIndex],'自編練習題');}
function reportExamQuestion(){if(examSet.length)openFeedback('題目、答案或解析有問題',examSet[eIndex],'自編練習題');}
function reportPastQuestion(){if(pastPaperSet.length)openFeedback('題目、答案或解析有問題',pastPaperSet[pastIndex],'官方考古題');}
let DB=null;
const PRACTICE_DB_PATH="data/practice-questions.json";
const officialBrochure = "https://www.ipas.org.tw/api/proxy/uploads/certification/AIAP/115%E5%B9%B4%E5%BA%A6AI%E6%87%89%E7%94%A8%E8%A6%8F%E5%8A%83%E5%B8%AB%E8%83%BD%E5%8A%9B%E9%91%91%E5%AE%9A%E7%B0%A1%E7%AB%A0%28%E5%88%9D%E3%80%81%E4%B8%AD%E7%B4%9A%29_20251225235744.pdf";
const officialSite = "https://www.ipas.org.tw/";
const officialLearningResources = "https://ipd.nat.gov.tw/ipas/certification/AIAP/learning-resources";
const OFFICIAL_PDF_BASE = "https://www.ipas.org.tw/api/proxy/uploads/certification_resource/bf93f438f7be48d295c1b40a34d79f3d/";
const officialPdf = filename => OFFICIAL_PDF_BASE + encodeURIComponent(filename);
const OFFICIAL_PAST_BUNDLE_PATH = "data/official-past-papers.json";
const PAST_MIGRATION_BACKUP_KEY = "ipasAIStateBackupBeforePastCanonicalV2";
const PAST_CANONICAL_MIGRATION_VERSION = 2;
let officialPastBundle=null, officialPastBundlePromise=null;
const officialPastQuestionIndex=new Map();
function bundledAssetUrl(path){
  let relative=String(path||"");
  while(relative.startsWith("/"))relative=relative.slice(1);
  // The deployed main-branch /dev/ loader may not inject a raw base.
  const isPagesPreview=window.location?.hostname==="naiyi-chia.github.io" &&
    /^\/IPAS-AI-trainer\/dev(?:\/|$)/.test(window.location.pathname);
  const devBase=String(window.__IPAS_DEV_RAW_BASE__||(isPagesPreview?
    "https://raw.githubusercontent.com/Naiyi-Chia/IPAS-AI-trainer/dev/":""));
  return devBase ? devBase + relative : relative;
}
const officialLearningGuide={
  L11:officialPdf("AI應用規劃師(初級)-學習指引-科目1_人工智慧基礎概論1141203_20251222172144.pdf"),
  L12:officialPdf("AI應用規劃師(初級)-學習指引-科目2_生成式AI應用與規劃114123_20251222172159.pdf"),
  L21:officialPdf("AI應用規劃師(中級)-學習指引-科目1人工智慧技術應用規劃_20251222101833.pdf"),
  L22:officialPdf("AI應用規劃師(中級)-學習指引-科目2大數據處理分析與應用_20251222101850.pdf"),
  L23:officialPdf("AI應用規劃師(中級)-學習指引-科目3機器學習技術與應用_20251222101907.pdf")
};
const officialScopeSection={
  L11101:{page:6,section:"3.1 人工智慧概念"},L11102:{page:6,section:"3.1 人工智慧概念"},
  L11201:{page:29,section:"3.2 資料處理與分析概念"},L11202:{page:29,section:"3.2 資料處理與分析概念"},L11203:{page:29,section:"3.2 資料處理與分析概念"},
  L11301:{page:38,section:"3.3 機器學習概念"},L11302:{page:38,section:"3.3 機器學習概念"},
  L11401:{page:53,section:"3.4 鑑別式 AI 與生成式 AI 概念"},L11402:{page:53,section:"3.4 鑑別式 AI 與生成式 AI 概念"},
  L12101:{page:6,section:"3.1 No code / Low code 概念"},L12102:{page:6,section:"3.1 No code / Low code 概念"},
  L12201:{page:22,section:"3.2 生成式 AI 應用領域與工具使用"},L12202:{page:22,section:"3.2 生成式 AI 應用領域與工具使用"},
  L12301:{page:36,section:"3.3 生成式 AI 導入評估規劃"},L12302:{page:36,section:"3.3 生成式 AI 導入評估規劃"},L12303:{page:36,section:"3.3 生成式 AI 導入評估規劃"},
  L21101:{page:8,section:"3.1 自然語言處理技術與應用"},
  L21102:{page:45,section:"3.2 電腦視覺技術與應用"},
  L21103:{page:64,section:"3.3 生成式 AI 技術與應用"},
  L21104:{page:78,section:"3.4 多模態人工智慧應用"},
  L21201:{page:96,section:"4.1 AI 導入評估"},

function needsCompetencyMetadata(){

function competencyEvidence(){
  const by=new Map();
  Object.entries(state.attempts).forEach(([id,a])=>{
    const q=getQuestionById(id);
    if(!q||!Object.prototype.hasOwnProperty.call(DB.topics,q.topic))return;
    if(!by.has(q.topic))by.set(q.topic,{topic:q.topic,name:DB.topics[q.topic],subject:q.subject,
      combined:{correct:0,answered:0},official:{correct:0,answered:0},selfAuthored:{correct:0,answered:0}});
    const row=by.get(q.topic),source=id.startsWith('PAST-')?row.official:row.selfAuthored;
    [row.combined,source].forEach(v=>{v.answered++;if(a.correct)v.correct++});
  });
  const rows=[...by.values()];
  rows.forEach(row=>{
    [row.combined,row.official,row.selfAuthored].forEach(v=>v.accuracy=v.answered?v.correct/v.answered:null);
    row.insufficient=row.combined.answered<3;
    row.weak=!row.insufficient&&row.combined.accuracy<.70;
    row.drillAvailable=DB.questions.some(q=>q.topic===row.topic);
  });
  rows.sort((a,b)=>a.combined.accuracy-b.combined.accuracy||a.topic.localeCompare(b.topic));
  const formal=rows.filter(row=>row.weak),fallback=!formal.length;
  const selected=new Set((fallback?rows.slice(0,4):formal).map(row=>row.topic));
  rows.forEach(row=>row.fallback=fallback&&selected.has(row.topic));
  return {rows,selected,fallback};
}

function buildStratifiedExam(pool,n){
  const groups={};
  shuffle(pool).forEach(q=>(groups[q.topic]||(groups[q.topic]=[])).push(q));
  const keys=shuffle(Object.keys(groups)); const out=[];
  let safety=0;
  while(out.length<n && safety++<5000){
    let moved=false;
    for(const k of keys){
      if(groups[k].length && out.length<n){out.push(groups[k].pop());moved=true;}
    }
    if(!moved)break;
  }
  return shuffle(out);
}

function cleanBundledOption(value,letter){
  const raw=String(value||"").trim();
  for(const prefix of [`(${letter})`,`（${letter}）`,`${letter}.`,`${letter}、`]){
    if(raw.startsWith(prefix))return raw.slice(prefix.length).trim();
  }
  return raw;
}
function bundledQuestionToRuntime(paper,q,sharedContexts={}){
  const topic=q.competency_topic;
  if(typeof topic!=="string"||!Object.prototype.hasOwnProperty.call(DB.topics,topic)||!topic.startsWith(paper.subject)||q.competency_mapping_status!=="verified"||typeof q.competency_mapping_note!=="string")throw new Error(`內建題目能力映射無效：${paper.id} Q${q.question_no}`);
  const letters=["A","B","C","D"];
  const sharedContext=q.shared_context_id?sharedContexts[q.shared_context_id]:null;
  if(q.shared_context_id&&(!sharedContext||sharedContext.paper_id!==paper.id))throw new Error(`缺少本題共用情境：${q.shared_context_id}`);
  const sourcePages=q.source_page_start?`PDF P${q.source_page_start}${q.source_page_end&&q.source_page_end!==q.source_page_start?`–${q.source_page_end}`:""}`:"官方 PDF";
  return {
    id:`PAST-${paper.id}-${q.question_no}`,number:q.question_no,level:paper.level,subject:paper.subject,
    topic,topicName:DB.topics[topic],paperTitle:`${paper.year} 年 ${paper.session} ${paper.name}`,
    competency_topic:topic,competency_mapping_status:q.competency_mapping_status,competency_mapping_note:q.competency_mapping_note,
    difficulty:"official",question:q.question_text,
    options:letters.map(letter=>cleanBundledOption(q.options?.[letter],letter)),
    answer:letters.indexOf(q.answer),hasVisual:!!q.has_visual,
    visualAssets:Array.isArray(q.visual_assets)?q.visual_assets:[],
    sharedContextId:q.shared_context_id||null,sharedContext,
    sourcePageStart:q.source_page_start,sourcePageEnd:q.source_page_end,sourceNote:q.notes||"",
    explanation:`官方公告試題正解：${q.answer}`,
    sourceType:`iPAS 官方公告試題（verified canonical bundle；${sourcePages}）`
  };
}
async function loadOfficialPastBundle(){
  if(officialPastBundle)return officialPastBundle;
  if(!officialPastBundlePromise){
    officialPastBundlePromise=fetch(bundledAssetUrl(OFFICIAL_PAST_BUNDLE_PATH),{cache:"no-cache"})
      .then(r=>{if(!r.ok)throw new Error(`內建考古題資料 HTTP ${r.status}`);return r.json()})
      .then(data=>{
        if(data?.schema_version!==4||data?.source?.competency_mapping_status!=="verified"||data?.source?.row_count!==700||!Array.isArray(data?.papers)||data.papers.length!==14||!data.shared_contexts)throw new Error("內建考古題資料版本或筆數不符");
        const nextIndex=new Map();
        data.papers.forEach(bp=>{
          const paper=pastPapers.find(p=>p.id===bp.paper_id);
          if(!paper||bp.subject!==paper.subject||!Array.isArray(bp.questions)||bp.questions.length!==50)throw new Error(`內建考卷不完整：${bp.paper_id||"unknown"}`);
          bp.questions.forEach(q=>{
            if(q.verification_status!=="verified")throw new Error(`內建題目尚未 verified：${bp.paper_id} Q${q.question_no}`);
            const runtime=bundledQuestionToRuntime(paper,q,data.shared_contexts);
            if(runtime.answer<0||runtime.options.length!==4)throw new Error(`內建題目格式錯誤：${runtime.id}`);
            nextIndex.set(runtime.id,runtime);
          });
        });
        if(nextIndex.size!==700)throw new Error(`內建題目索引筆數錯誤：${nextIndex.size}`);
        officialPastQuestionIndex.clear();
        nextIndex.forEach((q,id)=>officialPastQuestionIndex.set(id,q));
        officialPastBundle=data;
        return data;
      }).catch(error=>{officialPastBundlePromise=null;throw error});
  }
  return officialPastBundlePromise;
}
async function getBundledPastPaper(paper){
  const data=await loadOfficialPastBundle();
  const bp=data.papers.find(p=>p.paper_id===paper.id);
  if(!bp)throw new Error(`找不到內建考卷：${paper.id}`);
  const questions=bp.questions.map(q=>officialPastQuestionIndex.get(`PAST-${paper.id}-${q.question_no}`));
  return {meta:{paperId:paper.id,title:`${paper.year} 年 ${paper.session} ${paper.subject} ${paper.name}`,pdf:paper.pdf,source:"canonical-bundle",sourceFile:bp.source_pdf_file,contentVersion:2},questions};
}

async function loadPastPaperById(id){
  const paper=pastPapers.find(p=>p.id===id);
  if(!paper)return;
  const status=qs("#pastLoadStatus");
  try{
    if(status)status.textContent=`正在開啟 ${paper.year} 年 ${paper.session} ${paper.subject}…`;
    const parsed=await getBundledPastPaper(paper);
    pastPaperSet=parsed.questions;pastPaperMeta=parsed.meta;pastAnswered=false;
    const firstUnanswered=pastPaperSet.findIndex(q=>!state.attempts[q.id]);
    pastIndex=firstUnanswered>=0?firstUnanswered:0;
    showPastQuizView();
    focusPastQuestionStart();
  }catch(err){
    console.error(err);
    if(status)status.innerHTML=`<span class="bad">暫時無法開卷：</span>${esc(err.message||String(err))}　<a href="${paper.pdf}" target="_blank" rel="noopener">查看官方 PDF</a>`;
  }
}
function renderPastSharedContext(q){
  const context=q.sharedContext;
  if(!context)return "";
  const pages=`PDF 第 ${context.source_page_start}${context.source_page_end!==context.source_page_start?`–${context.source_page_end}`:""} 頁`;
  return `<details class="pastSharedContext" open style="margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:10px">
    <summary style="cursor:pointer;font-weight:700;padding:8px 0">本題共用情境 <span class="small">（${esc(pages)}）</span></summary>
    <pre class="pastSharedContextText" style="white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;font-size:1rem;line-height:1.7;margin:12px 0">${esc(context.text)}</pre>
    ${renderPastVisuals({number:q.number,visualAssets:context.visual_assets},"題組共用視覺")}
  </details>`;
}
function renderPastVisuals(q,visualLabel="官方原題視覺"){
  const list=Array.isArray(q.visualAssets)?q.visualAssets:[];
  if(list.length){
    return `<div class="pastVisualGrid" style="display:grid;gap:10px;margin:12px 0">${list.map((src,i)=>{
      const optionMatch=String(src).match(/_([a-d])\.png$/i);
      const label=optionMatch?`選項 ${optionMatch[1].toUpperCase()} 官方視覺`:`${visualLabel} ${i+1}/${list.length}`;
      return `<figure style="margin:0"><img src="${esc(bundledAssetUrl(src))}" alt="${esc(label)}，第 ${q.number} 題" loading="lazy" style="display:block;max-width:100%;height:auto;margin:0 auto;border:1px solid var(--line);border-radius:10px"><figcaption class="small" style="margin-top:4px;text-align:center">${esc(label)}</figcaption></figure>`;
    }).join("")}</div>`;
  }
  return q.hasVisual&&!q.sharedContext?.visual_assets?.length?`<div class="notice" style="margin:8px 0"><b>此題包含官方視覺資訊，但內建資產未能顯示。</b> 請用「核對官方原題 PDF」查看來源。</div>`:"";
}

function renderPastQuiz(){
  const area=qs('#pastQuizArea');
  if(!area)return;
  if(!pastPaperSet.length){
    area.innerHTML='';
    return;
  }
  const q=pastPaperSet[pastIndex];
  const prog=currentPastProgress();
  area.innerHTML=`<div class="card questionCard officialQuestion" style="margin-bottom:12px">
    <div class="pastQuizTop pastQuestionStart" id="pastQuestionStart" tabindex="-1" aria-label="第 ${q.number} 題開始">
      <div class="qmeta"><span class="qmetaPrimary">官方考古題 · 第 ${q.number} 題</span><span class="qmetaSecondary">${esc(pastPaperMeta?.title||'')}</span></div>
      <button class="btn secondary pastExitBtn" onclick="exitPastQuiz()">← 返回考卷列表</button>
    </div>
    <div id="pastScoreStatus" class="pastQuizStatus" role="status" aria-live="polite">${pastProgressText()}</div>
    <div class="pastQuestionFacts">
      <span>題目位置：第 ${pastIndex+1}/${pastPaperSet.length} 題</span>
      <span id="pastAnsweredCount">已作答：${prog.answered}/${pastPaperSet.length} 題</span>
      <span id="pastQuestionState" aria-live="polite">${pastQuestionStateText()}</span>
      <span><a href="${pastPaperMeta?.pdf||'#'}" target="_blank" rel="noopener">核對官方原題 PDF</a></span>
    </div>
    <div class="pastMobileNav" aria-label="考古題快速導覽">
      <span class="small"><b>第 ${pastIndex+1}/${pastPaperSet.length} 題</b></span>
      <div class="controls"><button class="btn secondary" onclick="pastPrev()" ${pastIndex===0?"disabled":""}>上一題</button><button class="btn primary" onclick="pastNext()">${pastIndex===pastPaperSet.length-1?"完成":"下一題"}</button></div>
    </div>
    <div class="progress" role="progressbar" aria-label="目前題目位置" aria-valuemin="1" aria-valuemax="${pastPaperSet.length}" aria-valuenow="${pastIndex+1}"><div style="width:${(pastIndex+1)/pastPaperSet.length*100}%"></div></div>
    ${renderPastSharedContext(q)}
    <div class="qtext" tabindex="-1">${esc(q.question)}</div>
    ${renderPastVisuals(q)}
    <div id="pastOpts" role="group" aria-label="作答選項" tabindex="-1">${q.options.map((o,i)=>`<button class="option" data-i="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</button>`).join('')}</div>
    <div class="navrow">
      <div><button class="btn secondary" onclick="pastPrev()" ${pastIndex===0?"disabled":""}>上一題</button> <button class="btn secondary" onclick="reportPastQuestion()">回報此題</button></div>
      <div><button class="btn secondary" onclick="restartPastQuiz()">重新作答本份</button> <button class="btn primary" onclick="pastNext()">${pastIndex===pastPaperSet.length-1?"完成這份":"下一題"}</button></div>
    </div>
  </div>`;
  qsa('#pastOpts .option').forEach(b=>b.onclick=()=>answerPast(+b.dataset.i));
}

function answerPast(i){
  if(pastAnswered) return;
  pastAnswered=true;
  const q=pastPaperSet[pastIndex], ok=i===q.answer;
  state.attempts[q.id]={correct:ok,last:Date.now(),subject:'PAST',topic:pastPaperMeta?.title||'官方考古題'};
  if(ok) delete state.wrong[q.id]; else state.wrong[q.id]=true;
  save();
  updatePastProgressStatus();
  updatePastQuestionState();
  qsa('#pastOpts .option').forEach((b,idx)=>{
    b.disabled=true;
    if(idx===q.answer)b.classList.add('correct');
    if(idx===i && !ok)b.classList.add('wrong');
    if(idx===q.answer || idx===i){
      const label=document.createElement('span');
      label.className='pastOptionState';
      label.textContent=idx===q.answer?(idx===i?'你的答案 · 官方正解':'官方正解'):'你的答案 · 錯誤';
      b.appendChild(label);
    }
  });
  qs('#pastOpts').focus();
}

function pastNext(){
  if(!pastPaperSet.length)return;
  if(pastIndex<pastPaperSet.length-1){
    pastIndex++;pastAnswered=false;renderPastQuiz();focusPastQuestionStart();
  }else{
    const answered=pastPaperSet.filter(q=>state.attempts[q.id]).length;
    const correct=pastPaperSet.filter(q=>state.attempts[q.id]&&state.attempts[q.id].correct).length;
    const score=answered?Math.round(correct/pastPaperSet.length*100):0;
    qs('#pastQuizArea').innerHTML=`<div class="card questionCard" id="pastCompletion" tabindex="-1"><h3>這份官方考古題完成了</h3><div class="kpi ${score>=70?'good':'bad'}">${score} 分</div><p>${correct}/${pastPaperSet.length} 題正確。作答紀錄已保留在此裝置，你可以返回考卷列表選其他考卷，或重新作答本份。</p><div class="controls"><button class="btn secondary" onclick="exitPastQuiz()">返回考卷列表</button><button class="btn primary" onclick="restartPastQuiz()">重新作答這份</button></div></div>`;
    focusPastCompletion();
  }
}
function pastPrev(){
  if(pastIndex>0){pastIndex--;pastAnswered=false;renderPastQuiz();focusPastQuestionStart();}
}
function restartPastQuiz(){
  pastIndex=0;pastAnswered=false;
  if(!qs('#pastQuizArea'))qs('#past').innerHTML='<div id="pastQuizArea"></div>';
  renderPastQuiz();focusPastQuestionStart();
}

function getQuestionById(id){
  return DB.questions.find(x=>x.id===id)||officialPastQuestionIndex.get(id);
}
function renderWrong(){
  const ids=Object.keys(state.wrong);
  if(ids.some(id=>id.startsWith("PAST-"))&&!officialPastBundle){
    qs("#wrong").innerHTML='<div class="card"><h3 style="margin-top:0">錯題本</h3><p class="small">正在載入內建官方錯題資料…</p></div>';
    loadOfficialPastBundle().then(()=>{if(qs("#wrong")?.classList.contains("active"))renderWrong()}).catch(e=>console.warn("官方錯題資料載入失敗",e));
    return;
  }
  const qsx=ids.map(getQuestionById).filter(Boolean);
  qs("#wrong").innerHTML=`<div class="card"><div class="examtop"><h3 style="margin:0">錯題本（${qsx.length}）</h3><button class="btn secondary" onclick="startWrongPractice()">重刷錯題</button></div>
  ${qsx.length?qsx.slice(0,120).map(q=>`<div class="topicbar"><div><b>${esc(q.id)}</b> ${esc(q.question)}<div class="small">${esc(q.subject||'')}｜${esc(q.topic||'')} ${esc(q.topicName||'')}</div></div></div>`).join(""):"目前沒有錯題。"}</div>`;
}
async function startWrongPractice(){
  const ids=Object.keys(state.wrong);
  if(ids.some(id=>id.startsWith("PAST-"))&&!officialPastBundle){
    try{await loadOfficialPastBundle()}catch(e){console.warn("官方錯題資料載入失敗",e)}
  }
  const arr=shuffle(ids.map(getQuestionById).filter(Boolean));
  if(!arr.length)return;
  switchPanel("practice");renderPractice();
  beginPracticeSession(arr,`錯題本｜${arr.length} 題`);
}

let statsRenderRequest=0;
function renderStats(){
  const request=++statsRenderRequest;
  if(needsCompetencyMetadata()){
    qs('#stats').innerHTML='<div class="card" role="status">正在載入官方作答的章節資料，準備合併分析…</div>';
    return loadOfficialPastBundle().then(()=>{if(request===statsRenderRequest&&qs("#stats")?.classList.contains("active"))renderStats()}).catch(()=>{
      if(request!==statsRenderRequest)return;
      qs('#stats').innerHTML='<div class="card" role="alert"><p>官方章節資料載入失敗，暫時無法顯示完整分析。作答紀錄已保留。</p><button class="btn secondary" onclick="renderStats()">重新載入</button></div>';
    });
  }
  const {rows}=competencyEvidence();
  let hist=state.examHistory||[];
  const pastRows=pastPapers.map(p=>{const pr=paperProgress(p);return {...p,...pr,score:pr.answered?Math.round(pr.correct/pr.answered*100):null}}).filter(p=>p.answered);
  qs("#stats").innerHTML=`<div class="grid"><div class="card c8"><h3 style="margin-top:0">能力小章節弱點分析</h3>
  <p class="small">官方考古題與自編題逐題等權合併，每題採最近一次結果，做題順序不限。至少 3 題且正確率低於 70% 為弱項；1–2 題僅供初步參考。沒有正式弱項時，最多選 4 個相對較弱章節作為備援練習。</p>
  ${rows.length?rows.map(v=>{
    const p=Math.round(v.combined.accuracy*100),m=officialScopeMeta(v.subject,v.topic);
    const status=v.weak?'弱項':v.insufficient?'資料不足（初步訊號）':'目前未達弱項門檻';
    return `<div class="topicbar competencyRow" data-topic="${esc(v.topic)}">
      <div class="competencyHeading"><h4>${esc(v.topic)}｜${esc(v.name)}</h4><span class="${v.weak?'bad':'small'}">${status}</span></div>
      <div class="competencyResult"><b>合併 ${v.combined.correct}/${v.combined.answered} 正確 · ${p}%</b><div class="bar" aria-hidden="true"><i style="width:${p}%"></i></div></div>
      <div class="small competencySources"><span>官方考古題 ${v.official.correct}/${v.official.answered} 正確</span><span>自編題 ${v.selfAuthored.correct}/${v.selfAuthored.answered} 正確</span></div>
      ${v.fallback?'<div class="small">相對較弱／備援選題，非確定弱項。</div>':''}
      ${!v.drillAvailable?'<div class="small">此章節目前沒有對應自編題，診斷仍保留，可先複習章節。</div>':''}
      <a class="competencyReview" href="${esc(m.url)}" target="_blank" rel="noopener" aria-label="${esc(`複習 ${v.topic} ${v.name}｜${m.section}`)}">複習此章節 ↗</a>
    </div>`;
  }).join(""):"尚無能力章節作答資料。官方考古題或自編題的作答都可建立弱點分析。"}</div>
  <div class="card c4"><h3 style="margin-top:0">官方考古題進度</h3><p class="small">依考卷顯示的來源進度；章節診斷請看「能力小章節弱點分析」。</p>${pastRows.length?pastRows.slice(0,10).map(h=>`<div class="topicbar"><div><b>${h.year} ${h.session} ${h.subject}</b><div class="small">${h.answered} 題已作答</div></div><b class="${h.score>=70?'good':'bad'}">${h.score}%</b></div>`).join(""):"尚無考古題作答紀錄"}
  <h3>最近模擬</h3>${hist.length?hist.slice(0,6).map(h=>`<div class="topicbar"><div><b>${h.subject}</b><div class="small">${new Date(h.date).toLocaleDateString()}</div></div><b class="${h.score>=70?'good':'bad'}">${h.score}</b></div>`).join(""):"尚無模擬紀錄"}
  <button class="btn danger" style="margin-top:12px" onclick="resetAll()">清除全部進度</button></div></div>`;
}
function resetAll(){
  if(confirm("確定清除所有作答、錯題與模擬紀錄？")){
    localStorage.removeItem("ipasAIState");
    localStorage.removeItem(PAST_MIGRATION_BACKUP_KEY);
    localStorage.removeItem("ipasOfficialPastCacheV2");
    location.reload();
  }
}
function renderScope(){
 const groups={};
 Object.keys(DB.topics).forEach(t=>{let sub=t.slice(0,3).replace(/^L/,"L"); let candidates=Object.keys(DB.subjects).filter(s=>t.startsWith(s)); let s=candidates.sort((a,b)=>b.length-a.length)[0]; if(!groups[s])groups[s]=[];groups[s].push(t)});
 qs("#scope").innerHTML=`<div class="card"><h3 style="margin-top:0">115 年官方評鑑範圍</h3>
 <p class="small">下列代碼與名稱依 iPAS 115 年 AI 應用規劃師能力鑑定簡章整理。</p>
 ${Object.keys(DB.subjects).map(s=>`<h4>${subjectLabel(s)}</h4><div class="scopeList">${(groups[s]||[]).map(t=>{const m=officialScopeMeta(s,t);const label=`開啟 ${s} 官方學習指引｜${m.section}${m.page?`｜PDF 第 ${m.page} 頁`:""}`;return `<a class="scopeLink" href="${m.url}" target="_blank" rel="noopener" title="${esc(label)}" aria-label="${esc(label)}"><b>${t}</b> ${esc(DB.topics[t])} ↗</a>`}).join("")}</div>`).join("")}
 <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
 <p><a href="${officialLearningResources}" target="_blank" rel="noopener">iPAS 官方學習資源</a>　｜　<a href="${officialBrochure}" target="_blank" rel="noopener">115 年官方簡章</a>　｜　<a href="${officialSite}" target="_blank" rel="noopener">iPAS 官方網站</a></p>
 <div class="notice"><b>中級報考結構：</b>L21「人工智慧技術應用與規劃」為共同科目，另由 L22「大數據處理分析與應用」或 L23「機器學習技術與應用」擇一。若你想兩張中級證書方向都準備，本工具也可以三科全部刷。</div>
 </div>`;
}

async function initializeApp(){
  appTabs.forEach(tab=>tab.disabled=true);
  qs("#practice").innerHTML='<div class="card" role="status">正在載入練習題庫…</div>';
  try{
    const response=await fetch(bundledAssetUrl(PRACTICE_DB_PATH),{cache:"no-cache"});
    if(!response.ok)throw new Error(`練習題庫 HTTP ${response.status}`);
    const data=await response.json();
    if(!data||typeof data.subjects!=="object"||!data.subjects||Array.isArray(data.subjects)||
       !Object.keys(data.subjects).length||typeof data.topics!=="object"||!data.topics||
       Array.isArray(data.topics)||!Object.keys(data.topics).length||
       !Array.isArray(data.questions)||!data.questions.length)throw new Error("練習題庫格式無效");
    DB=data;
    renderPractice();renderExam();renderPastPapers();renderScope();
    appTabs.forEach(tab=>tab.disabled=false);
    setTimeout(()=>prewarmOfficialBundle(),0);
  }catch(error){
    DB=null;
    console.warn("練習題庫載入失敗",error);
    qs("#practice").innerHTML='<div class="card" role="alert"><p>練習題庫載入失敗，請確認網路連線後重試。作答紀錄已保留。</p><button class="btn secondary" onclick="initializeApp()">重新載入</button></div>';
  }
}
initializeApp();
</script>
