"answer":3,"explanation":"使用者層級保護須以一位使用者的全部貢獻界定相鄰資料集，並據此限制貢獻、校準機制。只保護一筆紀錄不能直接等同保護有多筆紀錄的個人；更換輸出或欄位也不符合題述保護單位。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編（中級情境強化版）"},{"id":"Q146","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23401","topicName":"數據隱私、安全與合規","concept":"差分隱私","difficulty":"hard","question":"兩個差分隱私方案使用相同的相鄰關係與 δ，甲宣告 ε＝0.5，乙宣告 ε＝2。僅就宣告的隱私損失界限，何者正確？","options":["乙的界限較嚴格，因較大的 ε 代表更多隱私保護","甲的界限較嚴格，但不能據此判定統計誤差較小","兩者的界限相同，因相同的 δ 已決定全部隱私強度","甲的界限較嚴格，因此其輸出會更接近無噪聲統計"],"answer":1,"explanation":"在相同相鄰關係與 δ 下，較小的 ε 表示宣告的隱私損失上界更嚴格，不代表統計誤差更小。δ 相同不能消除 ε 的差異；隱私界限也不是準確度排名。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編（中級情境強化版）"},{"id":"Q147","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23401","topicName":"數據隱私、安全與合規","concept":"差分隱私","difficulty":"hard","question":"同一批個人資料先後發布四份統計，每次機制各滿足 ε＝0.5 的純差分隱私。採基本循序組合界限時，總 ε 的上界如何計算？","options":["取四次的最大值，總 ε 的上界為 0.5","將發布次數當成 ε，總 ε 的上界為 4","取平方和的平方根，總 ε 的上界為 1","將四次的 ε 相加，總 ε 的上界為 2"],"answer":3,"explanation":"對同一批資料多次發布，基本循序組合以各次 ε 相加作為總隱私損失上界，因此為 4×0.5＝2。最大值、發布次數或平方和開根號不是此處指定的計算規則；這個上界也不等於精確實際損失。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編（中級情境強化版）"},{"id":"Q148","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23402","topicName":"演算法偏見與公平性","concept":"公平性","difficulty":"hard","question":"分類器用來找出應轉人工處理的案件。甲群 100 件實際需轉人工案件漏掉 10 件，乙群 50 件中漏掉 10 件。若關注漏接協助的差距，哪個判讀正確？","options":["兩群漏接程度相同，因漏掉的案件數都為 10 件","甲群漏接程度較高，因實際需轉人工的案件較多","乙群漏接率為 20%，高於甲群的 10%，應調查差異","乙群漏接程度較低，因實際需轉人工的案件較少"],"answer":2,"explanation":"假陰性率以實際正例為分母：甲為 10/100＝10%，乙為 10/50＝20%。相同漏接件數不代表相同漏接率；此差距是調查訊號，尚不能單憑它確定偏誤來源。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編（中級情境強化版）"},{"id":"Q149","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23402","topicName":"演算法偏見與公平性","concept":"公平性","difficulty":"hard","question":"團隊移除模型輸入中的群體欄位，但保留可能與群體相關的區域及使用行為特徵。評估公平性時，哪種做法較合理？","options":["以輸入已移除群體欄位為依據，將公平性檢查視為完成","以合宜治理下的群體資料評估結果，檢查代理特徵影響","以整體準確率較改版前提高為依據，判定群體差距已消失","以各特徵與群體的線性相關較低為依據，判定結果公平"],"answer":1,"explanation":"移除群體欄位不會自動消除代理特徵或其他流程造成的差距。仍應在合宜的資料治理下分群評估並調查來源；整體準確率及單一線性相關檢查不能證明結果公平。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q150","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23402","topicName":"演算法偏見與公平性","concept":"公平性","difficulty":"hard","question":"案件篩選系統的公平性目標，是讓各群體中「實際需要協助者」有相近的被選中機會。應優先比較哪個指標？","options":["各群體全體案件被選中的比例，不區分實際需求","各群體已被選中案件中，實際需要協助者的比例","各群體實際需要協助者中，被系統選中的比例","各群體全部案件中，預測類別與實際類別一致的比例"],"answer":2,"explanation":"題述關注實際正例被選中的機會，對應各群體的真陽性率（召回率）。全體選中率、精確率及整體準確率的分母不同，回答的是不同公平性或效能問題；單一指標也不代表所有面向公平。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編（中級情境強化版）"},{"id":"Q151","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"Precision / Recall","difficulty":"medium","question":"若疾病篩檢最怕漏掉真正患者，應優先提高哪個指標？","options":["Precision（精確率）","Recall（召回率）","MAE","R²"],"answer":1,"explanation":"Recall = TP/(TP+FN)。當漏掉正類的代價高時，通常優先關注 Recall。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q152","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"Precision / Recall","difficulty":"medium","question":"當 False Negative 的成本特別高時，通常最關注？","options":["MAE","Precision（精確率）","R²","Recall（召回率）"],"answer":3,"explanation":"Recall = TP/(TP+FN)。當漏掉正類的代價高時，通常優先關注 Recall。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q153","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"Precision / Recall","difficulty":"medium","question":"安全告警寧可多報一些，也不要漏掉真正危險事件，主要應提高？","options":["Recall（召回率）","MAE","R²","Precision（精確率）"],"answer":0,"explanation":"Recall = TP/(TP+FN)。當漏掉正類的代價高時，通常優先關注 Recall。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q154","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"RAG 與向量檢索","difficulty":"medium","question":"RAG 要找出「用字不同但意思接近」的文件片段，哪種檢索方式最直接利用語意向量？","options":["依查詢詞與片段的字面重疊程度評分","依查詢詞在片段中的出現次數評分","將查詢與片段嵌入向量後比較相似度","將查詢視為完整字串尋找相同片段"],"answer":2,"explanation":"語意嵌入將查詢與文件片段表示為可比較的向量，依相似度檢索語意接近的內容。字面重疊、詞頻與完整字串比對主要依賴用字相同，無法直接利用語意向量。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q155","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"RAG 與向量檢索","difficulty":"medium","question":"查詢「汽車故障」時，希望檢索到只寫「車輛異常」的片段。下列哪個設計較能處理這種同義改寫？","options":["提高原查詢詞的比對權重，優先回傳字面命中","用適合該語言的嵌入模型，依向量相似度排序","限定查詢詞須連續且同序，優先回傳完整詞組","提高文件中重複詞的權重，優先回傳高頻用詞"],"answer":1,"explanation":"合適的嵌入模型可讓同義改寫具有接近的向量表示，因此較能找到字面不同但語意相近的片段。加重原詞、要求連續詞組或偏重詞頻都仍依賴字面特徵；向量相近也不保證文件內容正確。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q156","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"RAG 與向量檢索","difficulty":"medium","question":"在典型 RAG 流程中，嵌入模型、向量資料庫與生成模型分工合作。向量資料庫主要負責哪項工作？","options":["索引片段向量，依查詢向量取回近鄰片段","編碼原始文字，依語境產生片段向量表示","整合檢索內容，依提示生成最終回答文字","更新模型權重，將新文件寫入生成模型參數"],"answer":0,"explanation":"嵌入模型負責產生向量；向量資料庫儲存與索引向量，依查詢向量檢索相近片段；生成模型利用取得的內容回答。向量資料庫本身的檢索工作並非微調生成模型權重。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q157","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Function Calling","difficulty":"medium","question":"客服模型要取得訂單的即時狀態，訂單 API 已提供且完成授權。哪種整合方式最直接？","options":["檢索昨日批次匯出的訂單文件，再依文件內容回覆","讓模型產生查詢參數，由程式呼叫 API 回傳結果","微調歷史客服對話，再依模型記憶回覆訂單狀態","提供訂單狀態文字範例，再讓模型生成類似回覆"],"answer":1,"explanation":"Function Calling 可讓模型提出結構化的工具名稱與參數，由應用程式驗證並執行 API，再將結果交回模型。昨日文件、歷史微調與文字範例無法保證即時狀態。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q158","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Function Calling","difficulty":"medium","question":"模型已輸出計算器的函式名稱與參數，但尚未執行。一般 Function Calling 流程下一步應為何？","options":["將函式名稱當成計算答案，直接交給使用者","由應用程式驗證參數並執行，再回傳工具結果","將函式參數加入訓練資料，等模型重新學習","由模型再生成另一組參數，作為第一次的結果"],"answer":1,"explanation":"模型輸出的工具呼叫是執行請求，應用程式需驗證、執行並回傳結果。請求本身不是計算結果，也不需先重新訓練模型；再次生成參數不能替代執行。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q159","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Function Calling","difficulty":"medium","question":"工具流程已完成「查庫存→下單」。下單 API 回傳失敗。要讓最終回覆與實際執行一致，哪種處理最適當？","options":["依工具失敗結果回覆，說明訂單未成立","依使用者原始意圖回覆，說明訂單已成立","依先前庫存查詢回覆，說明訂單已成立","依模型生成的訂單號回覆，請使用者等待配送"],"answer":0,"explanation":"下單是否成功應依下單工具結果判斷。庫存充足或使用者有下單意圖均不代表訂單成立，模型生成的訂單號也不能取代系統紀錄。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q160","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"Attention","difficulty":"medium","question":"Transformer 中用來計算序列不同位置彼此關聯的重要機制是？","options":["Attention","Apriori","K-means","Random Forest"],"answer":0,"explanation":"Attention 透過 Query、Key、Value 計算 token 間關聯，是 Transformer 的核心機制。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q161","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"Attention","difficulty":"medium","question":"Query、Key、Value 是哪種機制的重要元件？","options":["Apriori","K-means","Attention","Random Forest"],"answer":2,"explanation":"Attention 透過 Query、Key、Value 計算 token 間關聯，是 Transformer 的核心機制。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q162","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"Attention","difficulty":"medium","question":"模型要動態決定哪些 token 對目前輸出更重要，主要依靠？","options":["Random Forest","Apriori","Attention","K-means"],"answer":2,"explanation":"Attention 透過 Query、Key、Value 計算 token 間關聯，是 Transformer 的核心機制。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q163","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22101","topicName":"敘述性統計與資料摘要技術","concept":"標準差","difficulty":"easy","question":"製造團隊用標準差摘要感測器讀值。這個統計量主要描述哪種特性？","options":["讀值分布中心的位置","讀值相對平均值的離散程度","讀值分布左右的不對稱程度","讀值隨時間增加的變化方向"],"answer":1,"explanation":"標準差描述讀值相對平均值的離散程度，單位與原資料相同。分布中心可用平均數或中位數描述，不對稱程度可用偏態描述，時間變化方向則需要趨勢分析。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編（中級情境強化版）"},{"id":"Q164","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22101","topicName":"敘述性統計與資料摘要技術","concept":"標準差","difficulty":"easy","question":"兩台設備各量測五次，讀值分別為甲組 9、10、10、10、11，乙組 6、8、10、12、14。兩組平均數皆為 10；哪個統計量在乙組較大？","options":["算術平均數","資料中位數","資料標準差","觀測樣本數"],"answer":2,"explanation":"兩組樣本數都是 5，平均數與中位數都是 10。乙組相對平均值的偏差平方和為 40，甲組為 2；無論一致採用母體或樣本標準差公式，乙組標準差都較大。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編（中級情境強化版）"},{"id":"Q165","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22101","topicName":"敘述性統計與資料摘要技術","concept":"標準差","difficulty":"easy","question":"一組溫度讀值原本的標準差為 2。若每筆讀值都加上 5，其標準差會如何變化？","options":["比原本增加 5","變成原本的 5 倍","變成原本的平方","維持原本的數值"],"answer":3,"explanation":"每筆讀值都加上同一常數時，平均值也增加相同常數，各筆相對平均值的偏差不變，因此標準差不變。若每筆乘以常數，標準差才會乘以該常數的絕對值；平方則與變異數的關係有關。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q166","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22203","topicName":"數據處理技術與工具","concept":"MapReduce","difficulty":"medium","question":"用 MapReduce 計算每個單字出現次數時，Map 對每次單字出現應輸出什麼，供後續加總？","options":["以文件名稱為鍵，以全文字串為值","以單字本身為鍵，以數值 1 為值","以出現位置為鍵，以單字字串為值","以數值 1 為鍵，以文件名稱為值"],"answer":1,"explanation":"字數統計的 Map 對每次出現輸出 (單字, 1)，之後按單字分組，由 Reduce 加總。以文件或位置為鍵不能直接把相同單字的計數送到同一組。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編（中級情境強化版）"},{"id":"Q167","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22203","topicName":"數據處理技術與工具","concept":"MapReduce","difficulty":"medium","question":"多個 Map 工作都輸出同一商品編號的銷售金額。要讓 Reduce 計算商品總額，Shuffle 最需要完成什麼？","options":["依金額大小分組，將不同商品的相同金額放在一起","依商品鍵分組，將各 Map 的同商品資料放在一起","依原檔名分組，讓每個 Reduce 保留完整來源檔案","依完成時間分組，讓每個 Reduce 處理一批 Map 結果"],"answer":1,"explanation":"Shuffle 將相同鍵的中間資料分組並送往對應 Reduce，才可計算每個商品的總額。金額、檔名或完成時間不是題述要聚合的鍵。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q168","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22203","topicName":"數據處理技術與工具","concept":"MapReduce","difficulty":"medium","question":"Map 已輸出 (部門, 金額)，Shuffle 已按部門分組。Reduce 要計算各部門總支出，應執行哪種操作？","options":["對同部門金額加總，輸出部門與總額","對同部門資料計數，輸出部門與筆數","對同部門金額取最大，輸出部門與最高額","對同部門金額取平均，輸出部門與平均額"],"answer":0,"explanation":"總支出需要加總該部門的所有金額。計數、最大值與平均值也是合理的聚合操作，但回答的是其他問題，不能代替總額。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q169","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"分類評估","difficulty":"medium","question":"二元分類以正類為關注對象，Precision 為 0.75、Recall 為 0.50。兩者等權的 F1-score 為何？","options":["0.600，依兩者的調和平均計算","0.625，依兩者的算術平均計算","0.375，依兩者直接相乘來計算","0.750，依兩者較大的數值計算"],"answer":0,"explanation":"F1 = 2PR / (P + R) = 2 × 0.75 × 0.50 / 1.25 = 0.60。算術平均、直接相乘與取最大值都不是 F1；調和平均會對較低的那一項較敏感。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q170","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"分類評估","difficulty":"medium","question":"正類占 1% 的二元分類任務中，模型全部預測為負類，Accuracy 仍為 99%。團隊要以單一指標同時反映正類的漏報與誤報，並對 Precision、Recall 等權衡量，應補充哪項指標？","options":["負類的召回率，用負類辨識能力評估模型","正類的 F1 分數，用精確率與召回率評估模型","正類的召回率，用找回正類的比例評估模型","整體的正確率，用全部預測正確比例評估模型"],"answer":1,"explanation":"正類 F1 同時反映 Precision 與 Recall，符合題目等權兼顧漏報與誤報的要求。只看正類召回率不反映誤報，只看負類召回率或整體正確率會掩蓋此例的漏報。全猜負類時 TP 為 0，依 F1 = 2TP / (2TP + FP + FN) 得 0。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q171","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"分類評估","difficulty":"medium","question":"金融機構評估二元分類模型，令 P 為正類 Precision、R 為正類 Recall，且兩者皆大於 0。哪個式子是 F1-score？","options":["(P + R) / 2，即兩者的算術平均","2 × P × R，即兩者乘積的兩倍","2 × P × R / (P + R)，即兩者的調和平均","P × R / (P + R)，即乘積除以兩者總和"],"answer":2,"explanation":"F1 是 Precision 與 Recall 的調和平均，公式為 2PR / (P + R)。算術平均不是 F1，2PR 少了分母，PR / (P + R) 則少了係數 2；F1 不納入真負類數量，使用時仍應依任務搭配其他指標。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編（中級情境強化版）"},{"id":"Q172","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11201","topicName":"資料基本概念與來源","concept":"大數據 4V","difficulty":"medium","question":"某製造商每天新增數十 TB 感測資料。就大數據 4V 而言，這項描述主要對應哪個面向？","options":["Volume：資料累積的規模","Velocity：資料產生的速度","Variety：資料來源的型態","Veracity：資料內容的可信度"],"answer":0,"explanation":"每天新增數十 TB 強調資料量的規模，對應 Volume。速度著重到達或處理速率，多樣性著重型態，可信度著重資料品質。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q173","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11201","topicName":"資料基本概念與來源","concept":"大數據 4V","difficulty":"medium","question":"零售平台整合交易表格、影音檔案與客服文字。就大數據 4V 而言，多種資料型態主要對應哪個面向？","options":["Volume：評估各類資料的總容量","Variety：評估各類資料的多樣性","Velocity：評估各類資料的更新率","Veracity：評估各類資料的可靠性"],"answer":1,"explanation":"表格、影音與文字的型態差異對應 Variety。總容量、更新率與可靠性分別屬於其他 4V 面向。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q174","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11201","topicName":"資料基本概念與來源","concept":"大數據 4V","difficulty":"medium","question":"智慧城市感測資料每秒持續到達，平台需及時處理。就大數據 4V 而言，這主要對應哪個面向？","options":["Volume：著重長期儲存的總量","Veracity：著重量測內容的品質","Variety：著重接收格式的差異","Velocity：著重資料流入的速率"],"answer":3,"explanation":"每秒持續到達與及時處理的需求對應 Velocity。即使資料總量尚小，也可能面臨高速資料流的處理需求。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q175","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11201","topicName":"資料基本概念與來源","concept":"大數據 4V","difficulty":"medium","question":"企業發現感測資料存在缺值、誤差與來源可信度問題。若用大數據 4V 分析，應優先檢查哪個面向？","options":["Velocity：檢查資料傳入的頻率","Variety：檢查資料格式的種類","Volume：檢查資料儲存的容量","Veracity：檢查資料內容的品質"],"answer":3,"explanation":"缺值、誤差及來源可信度主要屬於 Veracity，不能僅以傳入頻率、格式種類或儲存容量衡量。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q176","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11201","topicName":"資料基本概念與來源","concept":"大數據 4V","difficulty":"medium","question":"IoT 平台同時處理巨量儲存、高頻串流、多種格式與資料品質問題。在本題採用的 4V 中，哪組配對正確？","options":["Volume—速率；Velocity—規模；Variety—型態；Veracity—可信度","Volume—規模；Velocity—速率；Variety—可信度；Veracity—型態","Volume—規模；Velocity—速率；Variety—型態；Veracity—可信度","Volume—型態；Velocity—可信度；Variety—規模；Veracity—速率"],"answer":2,"explanation":"本題採 Volume、Velocity、Variety、Veracity 的 4V 定義，分別對應規模、速率、型態與可信度。其他選項交換了面向與意義。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q177","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11201","topicName":"資料基本概念與來源","concept":"大數據 4V","difficulty":"medium","question":"本題採 Volume、Velocity、Variety、Veracity 的大數據 4V 定義。哪項觀察最直接反映 Veracity？","options":["資料格式增加，整合時需支援影像與文字","資料量持續累積，儲存時需擴充磁碟空間","資料更新更頻繁，處理時需縮短等待時間","資料來源有誤差，使用前需確認量測品質"],"answer":3,"explanation":"Veracity 著重資料的真實性與可信度，量測誤差需透過品質檢查處理。格式、總量及更新頻率分別對應 Variety、Volume 與 Velocity。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q178","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"Train/Validation/Test","difficulty":"medium","question":"團隊已切分訓練、驗證與測試資料。要以梯度下降更新模型權重時，標準開發流程應使用哪份資料計算訓練損失？","options":["驗證集，以候選模型比較用的樣本更新權重","訓練集，以供模型學習的樣本計算損失並更新","測試集，以最終評估用的樣本持續修正權重","三者合併，以增加每次更新可使用的樣本數"],"answer":1,"explanation":"模型權重由訓練資料的損失來學習；驗證資料用於選型與調參，保留測試資料用於最終評估。用後兩者更新權重或直接合併，會破壞原先的獨立評估分工。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q179","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"Train/Validation/Test","difficulty":"medium","question":"開發者已反覆查看測試集分數來挑學習率。若仍要估計選定模型對未見資料的表現，下一步較合理的是？","options":["另保留未參與選型的代表性資料，待方案固定後評估","把原測試集重新命名為驗證集，再以同一分數作最終成績","把原測試集的資料列重新排序，再評估一次作最終成績","把歷次測試分數取平均值，用平均成績消除選型的影響"],"answer":0,"explanation":"已參與選型的測試集不再提供獨立的最終評估，應以未參與選型且具代表性的資料確認表現。重新命名、排序或平均歷次分數都不能消除反覆選型造成的偏誤。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q180","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"Train/Validation/Test","difficulty":"medium","question":"團隊用歷年銷售紀錄預測未來月份，部署時無法取得未來資訊。哪種資料切分較貼近實際使用情境？","options":["以月份隨機分配資料，讓各集合都混合早期與晚期紀錄","以最近月份訓練模型，再用較早的月份評估預測能力","以早期月份訓練、後續月份驗證，保留更晚月份測試","以銷售額排序後切分，讓低額資料訓練而高額資料測試"],"answer":2,"explanation":"時間預測應模擬用過去預測未來，按時間先後安排訓練、驗證與測試，並避免特徵使用未來資訊。隨機混合、逆向時間及依金額切分都不如題述方式貼近部署情境。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q181","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"Train/Validation/Test","difficulty":"medium","question":"設備資料中，同一台機器有多筆高度相似的紀錄。若要評估模型對全新機器的表現，應採哪種切分？","options":["逐筆隨機切分，讓每台機器的紀錄分散到各資料集","依檔案筆數切分，使每個資料集包含相近的紀錄量","依機器識別分組，使同台機器不跨訓練與測試資料","依量測數值排序，使不同資料集分別涵蓋高值與低值"],"answer":2,"explanation":"目標是全新機器，須在機器層級隔離資料，避免同機近似紀錄跨集合而高估表現。逐筆隨機與按檔案筆數切分未保證隔離；依量測數值切分也不對應評估目標。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q182","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"Train/Validation/Test","difficulty":"medium","question":"團隊已保留最終測試集，現在用五折交叉驗證挑模型。每一折含需由資料估計的補值步驟，應如何執行？","options":["以該折訓練部分估計補值參數，再轉換該折驗證部分","以五折全部資料估計補值參數，再固定參數評估各折","以保留測試集估計補值參數，再套用到各折驗證部分","以該折驗證部分估計補值參數，再反向轉換訓練部分"],"answer":0,"explanation":"每折的驗證部分應模擬未見資料，因此補值參數只能由該折訓練部分估計。使用全部資料、最終測試集或該折驗證資料估計，都將評估資料資訊帶入開發流程。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q183","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"Train/Validation/Test","difficulty":"medium","question":"訓練損失持續下降，但驗證損失開始上升。團隊使用早停法選擇訓練輪次，並保留最終測試集。何者較合適？","options":["選訓練損失最低的輪次，以擬合訓練資料的程度為依據","依預定早停規則選驗證表現較佳的輪次，再做最終測試","逐輪查看測試集的損失，以測試表現最佳的輪次作選擇","先合併驗證資料再繼續訓練，以合併後的損失決定輪次"],"answer":1,"explanation":"早停通常以驗證表現及事先設定的規則選擇輪次，模型選定後才做最終測試。訓練損失較低不代表泛化較好；逐輪看測試集或先合併驗證資料會破壞這項分工。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q184","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"缺失值處理","difficulty":"medium","question":"工廠某感測欄位有 18% 缺值，尚不清楚是設備停機、傳輸失敗或匯入錯誤。決定刪除或插補前，應先做什麼？","options":["依其他工廠慣用的補值方式，先產生完整資料表","依缺值比例套用固定刪欄門檻，先縮減資料欄位","依模型能否接受空值，先選定模型再解讀缺值原因","核對缺值發生條件與來源紀錄，釐清欄位及缺失意義"],"answer":3,"explanation":"不同原因的缺失可能有不同業務意義，應先核對來源與發生條件。套用他廠方法、固定比例門檻或只看模型是否支援空值，都不足以判斷這些資料應如何處理。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q185","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"缺失值處理","difficulty":"medium","question":"某數值欄位少量缺值，團隊要先做單一常數插補基準。已知有效值明顯右偏且有極端高值，希望補值較不受極端值影響，應優先試哪個統計量？","options":["訓練資料的平均數，利用所有數值的總和計算","訓練資料的最大值，保留觀察到的最高數值","訓練資料的全距，以最大值減最小值計算","訓練資料的中位數，以排序後的中央位置代表"],"answer":3,"explanation":"中位數較不易受少數極端值影響，適合作為此條件下的簡單插補基準。平均數容易受極端高值拉動；最大值及全距不是典型中央值。此選擇仍須經驗證，並非所有缺值的最佳解。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q186","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"缺失值處理","difficulty":"medium","question":"訓練資料某欄位的已知值為 10、20、30，驗證資料的已知值為 100。若以訓練集平均數插補，驗證資料的缺值應補多少？","options":["補 20，沿用訓練集已知值所算出的平均數","補 40，使用訓練與驗證全部已知值的平均數","補 100，使用驗證集本身已知值所算的平均數","補 30，使用訓練集最後一筆已知值作為補值"],"answer":0,"explanation":"訓練集已知值平均為（10＋20＋30）/3＝20，應將這個已估計的參數套用到驗證集。合併後平均為 40，使用它或驗證集的 100 都會使用評估資料估參數；30 則不是訓練平均。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q187","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"缺失值處理","difficulty":"medium","question":"客戶表的「公司名稱」在個人客戶列為空白，查證後確認這表示不適用，並非漏填。較合理的處理方式是？","options":["以最常見公司名稱插補，讓所有客戶都對應一家公司","將空白列移出客戶表，讓公司名稱欄位沒有缺值","標示為不適用並保留客戶型態，與真正漏填情況區分","以相鄰資料列的公司名稱插補，維持原始資料排列"],"answer":2,"explanation":"這是結構性的「不適用」，應保留其語意，並與未知或漏填區別。填入其他公司名稱會創造不實資訊；刪除個人客戶則會改變資料涵蓋的客群。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q188","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"缺失值處理","difficulty":"medium","question":"客戶收入欄位的缺值多集中於某職業類型。若直接刪除所有缺收入的資料列，最需要檢查哪項影響？","options":["剩餘資料的檔案大小是否降低，作為資料更可靠的依據","該職業類型是否被過度排除，改變樣本的代表性","欄位名稱是否維持一致，作為不同客群仍可比較的依據","剩餘資料是否已沒有空值，作為原有偏誤消失的依據"],"answer":1,"explanation":"當缺失集中於特定群體，刪列可能使該群體被過度排除，導致代表性改變。檔案變小、欄名相同或沒有空值，都不能證明資料仍具代表性或偏誤已消失。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q189","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"缺失值處理","difficulty":"medium","question":"某欄位的缺失狀態在預測當下即可得，可能帶有訊息。團隊要插補數值，同時讓模型區分「原值」與「補值」，應採哪種方式？","options":["插補後將整欄標準化，以縮放結果表示哪些值原本缺失","插補時另加缺失旗標，以二元欄位保留原本缺失狀態","插補後重新排列資料列，以列的位置表示哪些值原本缺失","插補時統一增加小數位，以數值精度表示哪些值原本缺失"],"answer":1,"explanation":"另加缺失旗標可明確保留原始缺失狀態，再由驗證結果判斷是否有用。標準化、排序或統一增加小數位都不能可靠區分原值與補值；也應確認旗標在實際預測時可取得。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q190","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"分類與迴歸","difficulty":"medium","question":"公司要分別預測「明日用電量的連續數值」與「客戶是否流失的類別」。這兩項監督式學習任務分別屬於？","options":["前者為分類，後者為分類","前者為分類，後者為迴歸","前者為迴歸，後者為迴歸","前者為迴歸，後者為分類"],"answer":3,"explanation":"用電量的連續數值屬於迴歸目標；是否流失是離散類別，屬於分類。任務由目標的意義決定。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q191","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"分類與迴歸","difficulty":"medium","question":"模型要預測房屋成交價格的連續數值。若改為預測「低價／中價／高價」三個價格帶，任務類型如何改變？","options":["原為分類，改為三類迴歸","原為迴歸，改為三群分群","原為分類，改為三群分群","原為迴歸，改為三類分類"],"answer":3,"explanation":"價格數值預測為迴歸；預先定義價格帶並以其標籤訓練則為分類。三個類別不代表分群或迴歸。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q192","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"分類與迴歸","difficulty":"medium","question":"模型 A 預測商品售價為 325.7 元；模型 B 預測「高風險／低風險」，並以 1／0 編碼。任務類型如何判斷？","options":["A 與 B 都是迴歸，因為輸出以數字表示","A 與 B 都是分類，因為輸出是單一結果","A 是分類，B 是迴歸，依輸出大小判斷","A 是迴歸，B 是分類，依目標意義判斷"],"answer":3,"explanation":"售價是連續數值目標，風險標籤是離散類別；用 1／0 編碼不會把分類變成迴歸。應看目標意義而非呈現格式。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q193","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"分類與迴歸","difficulty":"medium","question":"客服團隊預測處理分鐘數的連續數值；風控團隊預測違約／不違約。哪組「任務與評估指標」配對最適當？","options":["客服：分類搭配準確率；風控：迴歸搭配均方誤差","客服：迴歸搭配平均絕對誤差；風控：分類搭配召回率","客服：迴歸搭配平均絕對誤差；風控：迴歸搭配均方誤差","客服：分類搭配準確率；風控：分類搭配召回率"],"answer":1,"explanation":"分鐘數是連續目標，可用平均絕對誤差衡量迴歸誤差；違約是類別，可用召回率衡量違約類別的辨識情況。實際評估還需依業務目標選擇多種指標。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q194","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"分類與迴歸","difficulty":"medium","question":"下列對監督式學習中 Classification 與 Regression 的區分，哪一項正確？","options":["分類依輸入欄位是否為文字；迴歸依輸入欄位是否為數字","分類依模型是否使用樹狀結構；迴歸依模型是否使用直線","分類依目標是否為離散類別；迴歸依目標是否為連續數值","分類依資料是否含有兩個欄位；迴歸依資料是否含多個欄位"],"answer":2,"explanation":"分類與迴歸主要依預測目標區分，不由輸入型態、欄位數或模型架構決定。樹模型與神經網路都可用於分類或迴歸。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q195","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"分類與迴歸","difficulty":"medium","question":"設備狀態標籤為「正常／過熱／故障」，以 0／1／2 編碼。模型要預測這些標籤，應選哪種任務與輸出解讀？","options":["迴歸：把編碼值當成連續溫度預測","分類：把編碼值當成三種類別標籤","分群：把編碼值當成待發現的群集","迴歸：把編碼值當成等距嚴重程度"],"answer":1,"explanation":"0／1／2 在題中只是三種設備狀態的編碼，目標仍是離散類別，因此是分類。數字編碼不表示溫度或等距量尺，也不是無標籤分群。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q196","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"Precision 與 Recall 取捨","difficulty":"medium","question":"瑕疵檢測將「有瑕疵」視為陽性。驗證資料有 100 件真正瑕疵，系統找出其中 90 件，並將 30 件良品誤報為瑕疵。Precision 與 Recall 分別為何？","options":["Precision 為 90%，Recall 為 75%","Precision 為 75%，Recall 為 90%","Precision 為 75%，Recall 為 30%","Precision 為 90%，Recall 為 30%"],"answer":1,"explanation":"Precision＝真正陽性／預測陽性＝90／（90＋30）＝75%；Recall＝真正陽性／實際陽性＝90／100＝90%。兩者分母不同，不能把找到瑕疵的比例當成預測陽性的可信度。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q197","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"Precision 與 Recall 取捨","difficulty":"medium","question":"告警系統要盡量找出真正故障，人工複核量仍有餘裕。同一模型與同一批資料中，故障分數越高越可能為陽性。降低判陽性門檻時，哪項敘述成立？","options":["預測陽性不會增加，Recall 可能降低","預測陽性不會減少，但 Precision 未必提升","漏報件數不會增加，Precision 必定提升","誤報件數不會增加，Recall 不會降低"],"answer":1,"explanation":"在分數固定的同一批資料上降低門檻，原有陽性預測仍被保留，並可能納入更多樣本。漏報不會增加、Recall 不會降低，但新納入樣本也可能是誤報，因此不能保證誤報不增加或 Precision 提升。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q198","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"Precision 與 Recall 取捨","difficulty":"medium","question":"郵件系統把「垃圾信」視為陽性。團隊要知道被攔截信件中，有多少比例確實是垃圾信，以評估攔截結果的可靠性。應查看哪個指標？","options":["Recall：所有垃圾信中被攔截的比例","Accuracy：全部信件中分類正確的比例","Precision：被攔截信件中真正垃圾信的比例","Specificity：正常信件中未被攔截的比例"],"answer":2,"explanation":"問題以被攔截的預測陽性為分母，對應 Precision。Recall 以實際垃圾信為分母，Accuracy 看所有信件，Specificity 看實際正常信件，衡量的面向不同。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q199","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"Precision 與 Recall 取捨","difficulty":"medium","question":"兩個門檻在同一驗證集的結果為：甲漏報 5 件、誤報 30 件；乙漏報 15 件、誤報 10 件。若每件漏報成本為 10 單位、誤報為 1 單位，僅按總錯誤成本應選哪個？","options":["選乙，因總錯誤件數較少，成本為 25 單位","選甲，因加權錯誤成本較低，成本為 80 單位","選乙，因誤報件數較少，成本為 10 單位","選甲，因漏報件數較少，成本為 5 單位"],"answer":1,"explanation":"甲的成本為 5×10＋30×1＝80；乙為 15×10＋10×1＝160。當漏報與誤報代價不同，應比較加權成本，而不是只數總錯誤或只看其中一類錯誤。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q200","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"Precision 與 Recall 取捨","difficulty":"medium","question":"團隊要求 Recall 至少 90%，達標後再選 Precision 較高的門檻。候選結果為甲 P＝85%／R＝88%、乙 P＝78%／R＝93%、丙 P＝70%／R＝97%、丁 P＝92%／R＝80%。應選何者？","options":["選甲，其 Precision 為 85%、Recall 為 88%","選乙，其 Precision 為 78%、Recall 為 93%","選丙，其 Precision 為 70%、Recall 為 97%","選丁，其 Precision 為 92%、Recall 為 80%"],"answer":1,"explanation":"先依 Recall≥90% 排除甲與丁，再比較乙和丙的 Precision，乙的 78% 較高。不能因丁的 Precision 最高就忽略必要門檻，也不必在達標後仍一律選 Recall 最高者。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q201","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"Precision 與 Recall 取捨","difficulty":"medium","question":"分類器甲的 Precision／Recall 為 95%／40%，乙為 80%／80%。團隊決定以 F1 同等兼顧兩者，應如何選擇？","options":["選甲，因 Precision 較高，F1 就會較高","選甲，因兩指標差距較大，F1 就會較高","選乙，其 F1 為 80%，高於甲的約 56%","選乙，其 F1 為 160%，高於甲的 135%"],"answer":2,"explanation":"F1 是 Precision 與 Recall 的調和平均：2PR／（P＋R）。甲約為 56%，乙為 80%。F1 不是只看 Precision，也不是兩者直接相加；題目已指定以 F1 作選擇標準。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q202","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11401","topicName":"鑑別式 AI 與生成式 AI 的基本原理","concept":"生成模型類型","difficulty":"medium","question":"某影像生成方法在訓練時對影像逐步加噪，讓模型學習去噪；生成時再從雜訊逐步得到影像。這個核心機制對應哪類模型？","options":["生成對抗模型，以生成器與鑑別器的競爭為核心","變分自編碼器，以潛在分布與重建學習為核心","擴散生成模型，以加噪過程的反向去噪為核心","自回歸生成模型，以已生成內容預測下一單位為核心"],"answer":2,"explanation":"題述是典型擴散模型的加噪與反向去噪流程。GAN 以對抗學習為核心，VAE 學習潛在分布與解碼，典型自回歸模型則逐單位條件生成，與題述機制不同。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q203","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11401","topicName":"鑑別式 AI 與生成式 AI 的基本原理","concept":"生成模型類型","difficulty":"medium","question":"在標準 GAN 訓練中，鑑別器接收真實資料與生成器產生的樣本。鑑別器主要學習哪項任務？","options":["從隨機潛在向量產生樣本，改善生成影像內容","將每張影像編碼為潛在分布，改善重建影像內容","估計每個去噪步驟的雜訊，改善反向採樣流程","判斷樣本來自真實資料或生成器，提供對抗訊號"],"answer":3,"explanation":"GAN 的鑑別器學習區分真實與生成樣本，形成生成器可利用的對抗訓練訊號。從潛在向量生成樣本是生成器的工作；潛在分布編碼與去噪估計則屬其他模型的典型機制。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q204","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11401","topicName":"鑑別式 AI 與生成式 AI 的基本原理","concept":"生成模型類型","difficulty":"medium","question":"某生成模型用編碼器估計輸入的潛在分布，再透過解碼器重建資料，訓練時同時考量重建與潛在分布正則化。最符合哪一類？","options":["變分自編碼器，結合潛在變數推論與解碼","生成對抗網路，結合生成器與真假鑑別器","擴散生成模型，結合逐步加噪與反向去噪","自回歸語言模型，依前文逐一預測後續詞元"],"answer":0,"explanation":"VAE 透過編碼器近似潛在分布、解碼器重建資料，並以分布正則化約束潛在空間。對抗真假判別、擴散去噪及逐詞元預測不是題述的核心訓練安排。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q205","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11401","topicName":"鑑別式 AI 與生成式 AI 的基本原理","concept":"生成模型類型","difficulty":"medium","question":"某文字生成器先讀取前文，預測下一個詞元，將產生的詞元接回前文後重複此步驟。這是哪種生成方式？","options":["自回歸生成，讓下一步依賴前面已產生的內容","擴散式生成，讓整段內容經由多步去噪逐漸成形","對抗式訓練，讓真假判別結果引導生成器更新","變分式重建，讓潛在分布的樣本經解碼器還原"],"answer":0,"explanation":"依先前內容逐次預測下一詞元，是典型自回歸生成。其他選項分別描述擴散、GAN 訓練與 VAE 的機制，並非題述逐詞元條件生成流程。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q206","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11401","topicName":"鑑別式 AI 與生成式 AI 的基本原理","concept":"生成模型類型","difficulty":"medium","question":"標準 GAN 已完成訓練，現在只需從隨機潛在向量生成新影像，不做額外品質篩選。推論時主要需要哪個元件？","options":["鑑別器，將潛在向量轉換成完整影像內容","編碼器，將潛在向量轉換成真實影像標籤","生成器，將潛在向量映射為新的影像樣本","去噪器，按固定反向擴散步驟還原影像內容"],"answer":2,"explanation":"標準 GAN 的生成器在訓練後可直接把潛在向量映射為樣本。鑑別器主要用於訓練中的真假判別，並非生成影像所必需；標準 GAN 也不要求編碼器或反向擴散流程。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q207","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11401","topicName":"鑑別式 AI 與生成式 AI 的基本原理","concept":"生成模型類型","difficulty":"medium","question":"產品團隊已有 GAN 與擴散模型兩個原型，需兼顧影像品質與回應時間。選型時，哪種比較方式較能支持部署決策？","options":["比較兩模型的參數數量，以參數較多者代表品質較佳","比較兩模型的訓練輪次，以輪次較多者代表生成較快","比較兩模型的展示圖片，以最好的一張代表日常品質","在目標環境測代表性案例，同時量測品質與回應時間"],"answer":3,"explanation":"GAN 與擴散模型的機制不同，但產品表現仍取決於具體模型、資料與執行設定。應在目標環境以代表性案例比較品質及時間；參數量、訓練輪次或單張最佳展示不足以支持部署決策。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q208","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11102","topicName":"AI 治理概念","concept":"可解釋性與責任","difficulty":"hard","question":"銀行以 AI 輔助拒絕貸款申請，申請人對結果提出異議。哪種設計最能支援決策的可解釋性與責任追蹤？","options":["保留模型的整體準確率，讓客服以此回覆個別異議","保留供應商的效能報告，讓供應商處理所有個別異議","保留申請人的風險分數，讓系統以原分數回覆異議","保留個案理由與決策紀錄，由指定人員覆核個別異議"],"answer":3,"explanation":"個案理由、決策紀錄與指定覆核人員能支援解釋及責任追蹤。整體效能、供應商報告或重述分數均不足以處理個案異議。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q209","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11102","topicName":"AI 治理概念","concept":"可解釋性與責任","difficulty":"hard","question":"保險理賠模型直接影響客戶權益。哪種安排最能讓組織在模型建議出錯時追查並修正決策？","options":["記錄模型版本與個案依據，指定有權修正決策的覆核人員","記錄模型平均效能與排名，指定負責彙整月報的行政人員","記錄系統運算時間與成本，指定負責維護伺服器的技術人員","記錄客戶回覆速度與滿意度，指定負責寄送通知的客服人員"],"answer":0,"explanation":"版本、個案依據與有權修正決策的人員使錯誤可追查並可補救。效能月報、系統維護及通知服務各有用途，但不能替代決策覆核責任。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q210","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11102","topicName":"AI 治理概念","concept":"可解釋性與責任","difficulty":"hard","question":"高風險 AI 系統已保存拒絕理由與模型版本，但受理異議的人員無權改變決策。最需要補強哪種機制？","options":["增加模型效能報表，讓人員比較歷月準確率","增加運算資源監測，讓人員檢查服務回應時間","建立有權覆核的流程，讓人員更正不當決策","建立版本更新排程，讓人員追蹤模型上線時間"],"answer":2,"explanation":"可解釋的紀錄仍需搭配有效人工監督。覆核人員應有適當權限與流程修正不當決策；效能、資源或排程資訊不能補上這項權限。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q211","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11102","topicName":"AI 治理概念","concept":"可解釋性與責任","difficulty":"hard","question":"企業導入影響升遷的 AI。主管會覆核結果，但尚未定義各單位的決策責任。哪種安排較適當？","options":["明定使用單位的決策責任、覆核權限與異議處理窗口","以模型開發單位的測試成績作為使用單位免責的依據","以系統供應商的服務承諾替代使用單位的覆核責任","讓各使用單位自行判斷，由員工尋找能處理異議的人"],"answer":0,"explanation":"AI 輔助決策仍需明確的組織責任、覆核權限與異議窗口。測試成績或供應商承諾不能替代使用組織的治理安排。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q212","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11102","topicName":"AI 治理概念","concept":"可解釋性與責任","difficulty":"hard","question":"貸款模型整體準確率為 95%。團隊據此提議取消個案解釋與人工覆核。哪項評估最合理？","options":["可依整體準確率取消覆核，將剩餘錯誤納入下一輪訓練","仍應依決策風險保留解釋與覆核，整體指標不足以替代","可依供應商測試取消覆核，將個案異議轉交供應商處理","仍應保留效能月報即可，個案錯誤可由整體平均值反映"],"answer":1,"explanation":"高整體準確率不代表每個個案正確，也不說明錯誤對權益的影響。高影響決策仍需依風險安排解釋、覆核與責任機制。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q213","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11102","topicName":"AI 治理概念","concept":"可解釋性與責任","difficulty":"hard","question":"AI 已提供每次決策的主要影響因素。關於可解釋性與責任機制的關係，哪項敘述較正確？","options":["有影響因素說明即可取代覆核，因為使用者已知道模型理由","有影響因素說明即可確認公平，因為模型已揭露判斷依據","有影響因素說明即可移轉責任，因為開發者已交付說明功能","有影響因素說明仍需明定責任，並提供適當覆核與補救管道"],"answer":3,"explanation":"解釋有助理解及檢查決策，但本身不保證公平或正確，也不會自動移轉責任。組織仍需明定責任並安排適當覆核與補救。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q214","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Zero-shot / Few-shot","difficulty":"medium","question":"提示甲只有任務指令與待分類文字；提示乙另外提供三組已完成的輸入／類別示例。兩者都不更新模型權重，分別屬於哪種提示方式？","options":["甲為 Few-shot，乙為 Zero-shot","甲為模型微調，乙為 Few-shot","甲為 Zero-shot，乙為 Few-shot","甲為 Zero-shot，乙為模型微調"],"answer":2,"explanation":"Zero-shot 不提供任務示例；Few-shot 在提示上下文中放少量示例。這兩種用法都可不更新模型權重，不能把提示中加入示例直接視為微調。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q215","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Zero-shot / Few-shot","difficulty":"medium","question":"資訊擷取提示已列出 JSON 欄位，但輸出格式仍不穩定。團隊想用 Few-shot 引導格式，應加入哪種內容？","options":["加入更多欄位名稱說明，但不呈現完整輸出樣本","加入數組原始文字及對應的正確 JSON 輸出範例","加入較長的領域背景介紹，但不呈現輸入輸出配對","加入幾段原始文字片段，讓模型自行猜測輸出形式"],"answer":1,"explanation":"Few-shot 需要示範任務如何由輸入得到理想輸出，完整且正確的文字／JSON 配對可展示格式。欄位說明、背景文字或只有輸入的片段不等同這類任務示例；格式仍需驗證。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q216","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Zero-shot / Few-shot","difficulty":"medium","question":"團隊只把三個示例放入一次請求的上下文，沒有訓練程序，也未啟用跨請求記憶。對這次 Few-shot 的理解何者正確？","options":["示例會更新模型權重，後續請求可直接沿用新權重","示例僅影響與範例相同的輸入，無法引導其他案例","示例在當次上下文引導回應，不代表模型權重更新","示例會留在後續請求的上下文，省略示例仍可沿用"],"answer":2,"explanation":"Few-shot 在當次上下文中示範任務，能引導模型處理類似但未出現的輸入，並非只複製範例。這不等於微調或權重更新；未啟用記憶時，後續請求若未再提供示例，不能假設上下文會自動沿用。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q217","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Zero-shot / Few-shot","difficulty":"medium","question":"情緒分類指令規定「抱怨且未解決」標為負面，但某個 Few-shot 示例卻把同類文字標為正面。改善提示時應優先做什麼？","options":["核對標註並修正矛盾示例，使規則與示範保持一致","複製該矛盾示例多次，讓模型更熟悉這個標註結果","把矛盾示例移到最後，以位置決定應遵循哪個標準","為矛盾示例增加篇幅，以更長文字提高示範的權重"],"answer":0,"explanation":"指令與示例互相矛盾會造成判斷標準不清，應先對齊規則與標註。重複、換位置或增加長度都不能解決標準衝突，甚至可能強化錯誤訊號。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q218","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Zero-shot / Few-shot","difficulty":"medium","question":"團隊要比較 Zero-shot 與加入三個示例的 Few-shot，判斷是否改善客服分類。模型設定相同時，哪種評估較可靠？","options":["以提示中的三個示例測試，選能完整重現示例的方案","由各方案各挑容易的案件，以各自最佳成績作比較","以同一份未作示例的代表性題集，依相同指標比較","以各方案輸出的文字長度，推估分類判斷是否更完整"],"answer":2,"explanation":"應以未用作示例的共同代表性資料與相同指標比較，避免記住示例或挑選樣本造成偏誤。Few-shot 不保證比 Zero-shot 好；能重現示例或輸出較長也不能證明分類品質改善。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q219","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Zero-shot / Few-shot","difficulty":"medium","question":"系統甲在提示中附上三組客服分類示例；系統乙依提問檢索最新手冊段落，供模型回答引用。兩者的主要作用分別為何？","options":["甲提供最新事實依據；乙用輸入輸出配對示範分類","甲示範任務的判斷方式；乙補入與提問相關的資料","甲以示例更新模型權重；乙以文件更新模型的詞表","甲以示例建立永久記憶；乙將檢索結果存入模型權重"],"answer":1,"explanation":"Few-shot 示例主要示範任務格式或判斷模式；RAG 檢索內容主要補充相關資料。兩者可以併用，但不因此等同，也都不代表自動更新權重、詞表或永久記憶。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q220","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Temperature","difficulty":"medium","question":"在模型、Prompt 與其他採樣參數相同時，法規摘要希望措辭較穩定，創意標語希望更多變化。Temperature 通常如何設定？","options":["摘要設較高值；標語設較低值","摘要與標語皆設較高值以減少變化","摘要設較低值；標語設較高值","摘要與標語皆設較低值以增加變化"],"answer":2,"explanation":"較低 Temperature 通常使採樣更集中，較高值通常增加多樣性。穩定措辭不等於事實正確，法規摘要仍需核對來源。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q221","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Temperature","difficulty":"medium","question":"同一 Prompt 回覆過於發散，希望降低採樣隨機性。其他條件不變，哪種 Temperature 調整最直接符合需求？","options":["降低 Temperature，使採樣偏向高機率候選","提高 Temperature，使採樣納入更多低機率候選","維持 Temperature，讓既有採樣分布保持不變","交替高低 Temperature，使不同回覆變化更大"],"answer":0,"explanation":"降低 Temperature 通常讓高機率候選更集中，減少採樣隨機性。提高或交替高低值不符合降低發散的目標；低溫仍不保證完全一致。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q222","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Temperature","difficulty":"medium","question":"對支援 Temperature 的語言模型採樣而言，下列哪項描述較正確？","options":["較高值使高機率候選更集中，通常減少輸出多樣性","較低值使低機率候選更常出現，通常增加輸出多樣性","較高值使候選機率分布較平坦，通常增加輸出多樣性","較低值使模型讀取更多來源，通常提高事實查證能力"],"answer":2,"explanation":"Temperature 調整採樣機率分布；較高值使分布較平坦，較低值使分布較集中。它不控制來源檢索或事實查證能力。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q223","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Temperature","difficulty":"medium","question":"團隊比較創意腦暴與固定格式資訊抽取。若先只考慮輸出多樣性的需求，哪項任務較適合嘗試較高 Temperature？","options":["腦暴多種活動標語，探索不同表達方向","抽取發票統一編號，保持欄位內容一致","擷取合約到期日期，保持原文數值一致","轉寫產品型號清單，保持字元順序一致"],"answer":0,"explanation":"活動標語腦暴可接受多種表達，較適合嘗試較高 Temperature。抽取或轉寫通常較重視穩定及忠實；格式與事實仍需另外驗證。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q224","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Temperature","difficulty":"medium","question":"模型、Prompt 與其他採樣參數不變，把 Temperature 從 0.2 提高到 1.0，通常最可能看到哪種變化？","options":["回覆的候選詞更集中，措辭變化較少","回覆會使用更多來源，事實查證更完整","回覆會保留更長歷史，可讀取的上下文增加","回覆的候選詞較分散，措辭變化較多"],"answer":3,"explanation":"提高 Temperature 通常增加採樣多樣性，可能出現更多措辭變化。它不直接擴充來源或上下文，也不保證事實正確。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q225","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Temperature","difficulty":"medium","question":"生成參數 Temperature 最直接調整語言模型產生下一個 token 時的哪項機制？","options":["檢索來源的排序分數與引用優先順序","上下文的容量上限與歷史保留範圍","輸出長度的終止上限與字數限制","候選詞元的機率分布與採樣隨機性"],"answer":3,"explanation":"Temperature 調整候選 token 的採樣機率分布，影響隨機性與多樣性。檢索排序、上下文容量及輸出長度屬於其他機制或設定。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q226","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"RAG Chunking","difficulty":"medium","question":"手冊的一條規則與其例外條件經常被固定字數切到不同區塊，檢索只取到規則而漏掉例外。優先調整哪個切塊策略較直接？","options":["依規則段落保留語意邊界，必要時帶入相鄰例外條件","將每個段落平均切成更短字串，維持完全相同的長度","依頁碼將不同章節交錯合併，讓每塊包含更多主題","將每個段落改按關鍵字排序，讓相同詞彙集中保存"],"answer":0,"explanation":"此問題出在規則與例外的語意關係被切斷，應調整邊界或適度保留相鄰上下文。更短的固定切割、跨章混合或重排文字，都不能直接維持原規則及例外的關係。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q227","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"RAG Chunking","difficulty":"medium","question":"RAG 增加相鄰區塊的重疊後，邊界資訊較完整，但檢索結果出現大量重複文字。下一步較合理的是？","options":["持續提高重疊比例，以更多重複內容推估更高的涵蓋率","把重疊部分當成獨立證據，以重複次數提高答案信心","維持切塊但提高輸出長度，讓模型把重複文字一併呈現","比較不同重疊量與去重效果，兼顧內容完整及上下文成本"],"answer":3,"explanation":"重疊可補足邊界資訊，也會增加索引及上下文中的重複。應以代表性問題比較重疊量與去重策略，不能把相同來源的重複文字視為更多獨立證據，或假設重疊越多越好。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q228","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"RAG Chunking","difficulty":"medium","question":"某切塊方案產生超過 embedding 模型輸入上限的區塊，送入時尾段被截斷。若要讓尾段內容也能被檢索，應優先如何處理？","options":["依 token 上限再切分，保留各子塊必要的上下文","保留原區塊並增加向量維度，讓向量記住被截斷尾段","保留原區塊並延長回答上限，讓生成器補回未索引內容","保留原區塊並增加檢索筆數，重複取回相同截斷向量"],"answer":0,"explanation":"未送入 embedding 模型的尾段不會因向量維度、回答長度或取回次數而自動補入。應先依輸入 token 上限重新切分，避免截斷，再評估上下文與檢索品質。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q229","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"RAG Chunking","difficulty":"medium","question":"客服知識庫需要在回答旁顯示可核對的文件版本及章節。每個區塊應保留哪組中繼資料，才能直接支援來源追溯？","options":["向量維度、相似度分數及查詢耗時，作為內容來源標記","區塊字數、平均句長及詞頻分布，作為內容來源標記","檢索名次、回傳筆數及回答長度，作為內容來源標記","文件識別、版本及章節位置，建立區塊與原文的對應"],"answer":3,"explanation":"文件識別、版本和章節位置可將區塊連回確切原文，支援引用核對。相似度、字數或排名屬計算與檢索資訊，不能單獨指出內容來自哪個版本的哪個章節。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q230","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"RAG Chunking","difficulty":"medium","question":"兩套 chunking 方案在相同文件與檢索模型下產生不同數量的區塊。若要選出較能支援問答的方案，應優先比較什麼？","options":["代表性問題的證據檢索與回答品質，以及上下文用量","全部區塊的總數量，以產生較多區塊者判定效果較佳","區塊長度的整齊程度，以每塊等長者判定效果較佳","建庫後的索引檔大小，以檔案較大者判定涵蓋較完整"],"answer":0,"explanation":"切塊目的是支援檢索與回答，應在一致條件下比較相關證據是否取得、回答品質及上下文成本。區塊數、長度一致性或索引大小只是結構特徵，不能取代實際任務評估。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q231","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"RAG Chunking","difficulty":"medium","question":"費率表切成數個區塊後，某塊只剩數值列，沒有欄名與適用方案；模型因此把數值套到錯誤方案。切塊時應如何改善？","options":["依數值大小重新排列各列，讓同一數值範圍集中在同塊","將每個儲存格獨立切塊，讓檢索直接比對最短的內容","保留數值列對應的欄名與方案標題，使區塊可被理解","把表格數值轉成未附欄名的字串，讓區塊格式更一致"],"answer":2,"explanation":"表格數值須搭配欄名與方案等結構脈絡才能正確解讀，切塊應保留或附上這些資訊。按數值重排、逐格切碎或移除標頭，容易繼續丟失數值與語意的對應。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q232","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"向量相似度","difficulty":"medium","question":"查詢寫「車子發不動」，文件寫「引擎無法啟動」。團隊希望補強不同用詞但意思相近的搜尋，哪種方法最直接？","options":["以語意 embedding 表示查詢與文件，再比較向量相似度","以原始關鍵字統計查詢與文件，再依相同詞彙數量排序","以完整查詢字串比對各份文件，再依連續字串命中排序","以文件標題比對查詢的字詞，再依標題命中字數排序"],"answer":0,"explanation":"語意 embedding 可把相關語意映射到可比較的向量表示，補強不同用詞的檢索。其他方法仍以字面命中為主要依據；實際效果仍需用代表性查詢驗證，不能保證每個同義表達都能找到。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q233","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"向量相似度","difficulty":"medium","question":"非零向量甲＝(1, 2)，乙＝(2, 4)。使用 cosine similarity 比較兩者時，結果為何？","options":["相似度為 0，因兩向量的各維數值不同","相似度為 0.5，因甲的長度為乙的一半","相似度為 1，因兩向量具有相同的方向","相似度為 2，因乙的長度為甲的兩倍"],"answer":2,"explanation":"Cosine similarity 是內積除以兩向量長度的乘積。乙是甲的正倍數，方向相同，結果為 1；它不把長度倍數直接當作相似度，也不是逐維相等比對。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q234","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"向量相似度","difficulty":"medium","question":"同一 embedding 模型對查詢與四段文件計算 cosine similarity，甲 0.82、乙 0.75、丙 0.91、丁 0.68。未套其他規則且採精確排序，Top-1 應取哪段？","options":["取甲，因相似度為 0.82","取乙，因相似度為 0.75","取丙，因相似度為 0.91","取丁，因相似度為 0.68"],"answer":2,"explanation":"以 cosine similarity 由高到低排序時，0.91 的丙為 Top-1。若使用距離則可能是由小到大，不能混用排序方向；最高相似度也不等於內容必定正確。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q235","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"向量相似度","difficulty":"medium","question":"某段文件與查詢的 cosine similarity 為 0.88，系統未做機率校準。對這個數值的解讀何者合理？","options":["代表該段文件有 88% 機率能正確回答查詢","代表該段文件與查詢有 88% 的字詞相同","代表兩者向量方向接近，仍需核對內容相關性","代表本次搜尋已找回全部相關文件中的 88%"],"answer":2,"explanation":"0.88 是向量方向相近程度的分數，不是未經校準即可使用的正確率、字詞重疊率或檢索召回率。語意相近的內容仍可能過時、條件不符或不含答案。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q236","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"向量相似度","difficulty":"medium","question":"文件以模型甲建立向量，查詢改用獨立訓練的模型乙；兩者維度相同，但未訓練跨模型映射。檢索品質下降時，應優先修正什麼？","options":["改用相容的查詢與文件編碼器，必要時重建文件向量","保留兩個編碼器，將所有向量補零成相同的更高維度","保留兩個編碼器，把 cosine 分數乘上相同的常數","保留兩個編碼器，將檢索結果改依文件建立時間排序"],"answer":0,"explanation":"維度相同不代表向量座標的語意一致。應使用同一模型或經共同訓練、明確相容的查詢／文件編碼器；更換模型可能需重建索引。補零、共同縮放分數或改按日期排序不會建立跨模型語意對應。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q237","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"向量相似度","difficulty":"medium","question":"產品搜尋同時需要找「省電的筆電」等語意描述，並精確命中「ZX-410」等料號。單純向量搜尋常把相似料號混在一起，較合適的改善是？","options":["增加語意檢索的回傳筆數，直接依原向量分數排序","將查詢中的料號改成產品類別，再送入原向量檢索","降低語意檢索的相似度門檻，納入更多相近產品","結合詞彙與向量檢索，依驗證集調整結果合併方式"],"answer":3,"explanation":"詞彙檢索可補強精確料號，向量檢索可補強語意描述；混合檢索需評估合併策略。增加回傳數或降低門檻不會直接優先命中精確料號；將料號改成類別還可能丟失必要識別資訊。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q238","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12201","topicName":"生成式 AI 應用領域與常見工具","concept":"Tool Calling / MCP","difficulty":"medium","question":"AI 助理要查 ERP 即時庫存再建立補貨單。ERP 已提供授權 API，哪種架構最直接符合需求？","options":["檢索昨日庫存報表，依報表內容產生補貨單文字","微調歷史補貨紀錄，依模型記憶產生補貨單文字","呼叫庫存與建單工具，依實際回傳結果回覆任務","提供庫存與建單範例，依範例格式模擬操作結果"],"answer":2,"explanation":"即時庫存與實際建單需要執行已授權的外部工具。昨日報表、歷史微調或文字範例無法替代 API 的即時讀取與寫入。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q239","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12201","topicName":"生成式 AI 應用領域與常見工具","concept":"Tool Calling / MCP","difficulty":"medium","question":"模型已提出日曆工具名稱與查詢參數，但尚未執行。一般工具呼叫流程下一步應為何？","options":["把工具名稱與參數當成結果，直接回覆使用者","把查詢參數加入訓練資料，等模型學習後回覆","由應用程式檢查並執行工具，將結果交回模型","由模型再產生一組查詢參數，當作查詢結果"],"answer":2,"explanation":"模型提出的工具呼叫是請求，不是執行結果。應用程式需依權限與參數檢查後執行，再把工具結果交回模型。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q240","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12201","topicName":"生成式 AI 應用領域與常見工具","concept":"Tool Calling / MCP","difficulty":"medium","question":"AI 已透過工具完成查詢與計算，更新系統的工具卻回傳失敗。最終回覆應如何處理？","options":["依原始任務目標回覆，宣告系統已完成更新","依先前查詢成功回覆，宣告系統已完成更新","依模型預測結果回覆，宣告系統已完成更新","依更新結果回覆，說明系統尚未更新成功"],"answer":3,"explanation":"查詢或計算成功不代表更新成功。回覆應以更新工具的實際結果為依據；不能以使用者意圖或模型生成內容代替執行狀態。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q241","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12201","topicName":"生成式 AI 應用領域與常見工具","concept":"Tool Calling / MCP","difficulty":"medium","question":"公司以 MCP 串接多種內部工具。MCP 在這種整合中的主要作用為何？","options":["提供用戶端與伺服器互通的工具探索及呼叫介面","提供模型重新訓練的資料流程及權重更新介面","提供企業交易資料的儲存結構及資料修復介面","提供使用者身分審核的業務流程及授權決策介面"],"answer":0,"explanation":"MCP 定義 AI 應用與伺服器交換工具等能力的協定介面，支援工具探索與呼叫。模型訓練、交易儲存及企業授權政策需由其他機制處理。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q242","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12201","topicName":"生成式 AI 應用領域與常見工具","concept":"Tool Calling / MCP","difficulty":"medium","question":"客服工具查到訂單狀態為「待出貨」，模型文字卻寫成「已送達」。應優先檢查哪個環節？","options":["微調資料是否包含更多已送達的客服對話","提示範例是否包含更多禮貌且完整的回覆","最終回覆是否忠實採用本次工具查詢結果","採樣設定是否能生成更多不同風格的措辭"],"answer":2,"explanation":"工具已回傳本次真實狀態，需檢查模型是否以該結果作答。增加對話、禮貌範例或措辭變化不能直接修正結果與回覆不一致。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q243","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12201","topicName":"生成式 AI 應用領域與常見工具","concept":"Tool Calling / MCP","difficulty":"medium","question":"客服模型可呼叫訂單查詢工具。使用者請求讀取另一位客戶的訂單，工具層應如何處理？","options":["依模型對需求的理解執行，再把操作寫入日誌","依登入者的存取權限檢查，不符權限便拒絕","依參數是否符合資料型別執行，再遮蔽部分文字","依工具是否列在可用清單執行，再限制回傳長度"],"answer":1,"explanation":"可用工具、正確型別或操作日誌不能替代資料存取授權。工具層應驗證登入者對該筆訂單的權限，避免模型請求越權讀取。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q244","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12301","topicName":"生成式 AI 導入評估","concept":"Agent 記憶與狀態","difficulty":"hard","question":"長任務中使用者已確認交付期限，但後續對話把這項需求擠出上下文。哪種記憶設計最能減少需求遺失？","options":["保留最近幾輪對話，以對話順序推測已確認的期限","保存已確認需求的狀態，每次規劃時載入必要欄位","保留模型最近的草稿，以草稿措辭推測已確認期限","保存常見專案的範例，每次規劃時套用範例期限"],"answer":1,"explanation":"已確認的需求應作為明確任務狀態保存，並在需要時載入。近期對話、模型草稿或專案範例不能可靠地代表使用者已確認的期限。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q245","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12301","topicName":"生成式 AI 導入評估","concept":"Agent 記憶與狀態","difficulty":"hard","question":"Agent A 已將客戶地址更新為版本 8，Agent B 仍使用版本 7。B 寫入前最應增加哪種機制？","options":["比較兩個地址的字數，選擇資訊較完整的一份","核對共享狀態的版本，發現過期時重新讀取","比較兩次回覆的語氣，選擇措辭較肯定的一份","核對模型輸出的時間，直接採用較晚生成的內容"],"answer":1,"explanation":"共享狀態版本可辨識過期資料，寫入前應重新讀取或處理版本衝突。字數、語氣及模型輸出時間不等同於權威資料的更新版本。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q246","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12301","topicName":"生成式 AI 導入評估","concept":"Agent 記憶與狀態","difficulty":"hard","question":"長期助理要記住使用者偏好，產品已定義只保存必要偏好的政策。哪種儲存設計最符合這項政策？","options":["保存完整聊天紀錄，依回覆需要逐次抽取偏好","保存所有個人欄位，依欄位數量決定存取順序","保存每次模型草稿，依生成時間覆寫舊有偏好","保存必要偏好，依使用者範圍控制讀寫權限"],"answer":3,"explanation":"明確保存必要偏好並按使用者範圍控制存取，符合題述資料最小化政策。完整紀錄、所有個人欄位或模型草稿包含不必要資訊或不可靠狀態。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q247","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12301","topicName":"生成式 AI 導入評估","concept":"Agent 記憶與狀態","difficulty":"hard","question":"Agent 流程在「已確認訂單、尚未付款」時中斷。恢復時應如何避免把模型草稿誤當成已完成付款？","options":["讀取持久化步驟狀態，再核對付款工具的結果","讀取最近一次生成草稿，依草稿中的語句續接","讀取原始使用者需求，依預期完成流程續接","讀取相似任務的紀錄，依過往成功案例續接"],"answer":0,"explanation":"恢復執行應依已保存的步驟狀態與工具結果判斷完成情況。草稿、需求及相似案例都不能證明本次付款已完成。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q248","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12301","topicName":"生成式 AI 導入評估","concept":"Agent 記憶與狀態","difficulty":"hard","question":"使用者將偏好從「紙本通知」改為「電子通知」。長期記憶仍檢索到舊偏好，哪種維護方式最適當？","options":["更新有效偏好並標記舊版失效，檢索時優先使用有效版本","把兩種偏好合併為並列選項，回覆時依模型措辭自行挑選","保留原偏好作為主要設定，回覆時以新對話補充模型提示","按偏好文字長度決定優先序，檢索時優先使用較完整版本"],"answer":0,"explanation":"偏好變更需要管理有效版本及舊版失效狀態，避免過期記憶持續影響行為。並列、保留原設定或依字數排序都無法可靠辨識目前偏好。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q249","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12301","topicName":"生成式 AI 導入評估","concept":"Agent 記憶與狀態","difficulty":"hard","question":"上下文有限，Agent 長任務還要保留已確認需求、未完成步驟及可追查依據。哪種記憶安排較合理？","options":["只保留最後一輪對話，將先前需求交由模型推測","只保留整段對話摘要，移除任務步驟與來源紀錄","只保留最近模型草稿，將其中描述當成目前狀態","維護精簡任務狀態，另存來源紀錄供需要時檢索"],"answer":3,"explanation":"精簡狀態保留需求與進度，外部來源紀錄保留追查能力，可降低每次上下文負擔。最後對話或草稿可能遺失已確認事項，只有摘要則可能缺少細節依據。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q250","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12302","topicName":"生成式 AI 導入規劃","concept":"結構化輸出與驗證","difficulty":"medium","question":"AI 產出採購單 JSON 後將呼叫下單 API。哪種檢查最能區分「可解析」與「可執行的有效訂單」？","options":["確認 JSON 可解析，再檢查必填欄位是否都已出現","確認 JSON 可解析，再檢查各個欄位的型別是否符合","確認 JSON 可解析，再檢查欄位型別與下單業務規則","確認 JSON 可解析，再檢查訂單金額是否為非負值"],"answer":2,"explanation":"JSON 可解析只表示語法成立；有效訂單還需符合 schema 的欄位型別與必填要求，以及商品、金額或權限等業務規則。僅檢查必填、型別或單一金額範圍都不能涵蓋完整下單條件。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q251","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12302","topicName":"生成式 AI 導入規劃","concept":"結構化輸出與驗證","difficulty":"medium","question":"amount 欄位要求數值且不得為負。模型回傳字串 \"100\" 或數值 -5，驗證層應如何判定？","options":["兩者都通過，因為都能在畫面上顯示為金額","字串通過、負數不通過，因為字串看起來是數字","字串不通過、負數通過，因為負數仍是數值型別","兩者都不通過，因為分別違反型別及數值範圍"],"answer":3,"explanation":"字串 \"100\" 不符合數值型別，-5 不符合非負範圍。若系統需要轉型，應有明確轉換流程，不能將原始資料直接視為通過驗證。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q252","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12302","topicName":"生成式 AI 導入規劃","concept":"結構化輸出與驗證","difficulty":"medium","question":"JSON Schema 定義 customerId 的型別為字串，並將它列為 required。模型輸出 {}，應如何判定？","options":["通過，因為空物件仍是合法的 JSON 語法","通過，因為型別檢查只需處理已出現欄位","不通過，因為物件中的欄位未依字母排序","不通過，因為缺少指定的必填欄位"],"answer":3,"explanation":"required 要求指定欄位實際存在。空物件雖可解析成 JSON，仍缺少 customerId 而不符合此 schema；欄位排序並非此處的限制。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q253","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12302","topicName":"生成式 AI 導入規劃","concept":"結構化輸出與驗證","difficulty":"medium","question":"要求模型輸出固定 schema，對下一個自動化節點最直接的價值為何？","options":["將每筆資料的內容固定，讓所有訂單金額保持相同","將欄位與型別要求明確化，讓程式可依規格驗證資料","將每次生成的措辭固定，讓所有說明文字保持相同","將外部系統的狀態固定，讓所有 API 呼叫結果相同"],"answer":1,"explanation":"Schema 明確定義結構、欄位及型別等約束，方便程式驗證與串接。它不固定每筆資料內容、自然語言措辭或外部系統狀態。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q254","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12302","topicName":"生成式 AI 導入規劃","concept":"結構化輸出與驗證","difficulty":"medium","question":"訂單 JSON 符合 schema，但商品編號不存在於目前商品目錄。下一個節點在下單前應如何處理？","options":["依 schema 通過結果直接下單，讓模型稍後補充商品說明","依商品目錄驗證編號，無有效商品時停止並回報修正需求","依模型說明的完整程度下單，讓商品名稱代替編號使用","依 JSON 欄位的排列順序下單，讓第一個欄位作為商品鍵"],"answer":1,"explanation":"符合結構不代表業務資料正確。商品存在性需查對權威目錄，查無商品時應停止下單並要求修正，不能靠文字說明或欄位排序代替。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q255","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12302","topicName":"生成式 AI 導入規劃","concept":"結構化輸出與驗證","difficulty":"medium","question":"交易前驗證發現模型輸出的數量欄位缺失。哪種錯誤處理最能避免格式問題直接進入交易系統？","options":["阻擋此次交易並回傳欄位錯誤，修正後重新驗證","套用上一筆交易的數量欄位，完成後再記錄差異","以模型生成的摘要推測數量，完成後再通知使用者","省略此筆數量欄位提交交易，完成後再補上欄位"],"answer":0,"explanation":"缺少必要欄位應阻擋交易、回報可修正的錯誤並重新驗證。沿用前筆、推測或事後補欄位可能造成錯誤交易。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q256","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12301","topicName":"生成式 AI 導入評估","concept":"ROI / TCO","difficulty":"hard","question":"兩個方案服務品質與用量相同。甲導入費 120 萬、每年維運 10 萬；乙導入費 30 萬、每年維運 50 萬。使用三年，忽略折現且無其他成本，哪個 TCO 較低？","options":["乙較低：甲 130 萬，乙 80 萬","甲較低：甲 150 萬，乙 180 萬","乙較低：甲 390 萬，乙 240 萬","甲較低：甲 30 萬，乙 150 萬"],"answer":1,"explanation":"三年 TCO＝一次性導入費＋三年維運費。甲為 120＋3×10＝150 萬，乙為 30＋3×50＝180 萬。只算一年、重複計入導入費或漏掉導入費都會偏離題目期間。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q257","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12301","topicName":"生成式 AI 導入評估","concept":"ROI / TCO","difficulty":"hard","question":"AI 專案第一年的可量化效益為 100 萬，含導入及營運的總成本為 80 萬。依 ROI＝（效益－成本）／成本計算，不折現且無其他項目，ROI 為何？","options":["ROI 為 20%，以效益作分母","ROI 為 25%，以成本作分母","ROI 為 80%，以成本除以效益","ROI 為 125%，以效益除以成本"],"answer":1,"explanation":"依題目定義，淨效益為 100－80＝20 萬，ROI＝20／80＝25%。20% 的分母錯置；80% 是成本效益比，125% 是未扣成本的效益成本比。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q258","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12301","topicName":"生成式 AI 導入評估","concept":"ROI / TCO","difficulty":"hard","question":"摘要工具每月省下原作業 500 小時，但新增覆核 100 小時。以每小時 300 元估算人力時間價值，另付 API 及維運 4 萬元。無其他成本，每月淨效益估值為何？","options":["8 萬元：先扣覆核時間，再扣營運費用","11 萬元：採原節省時間，再扣營運費用","12 萬元：先扣覆核時間，不扣營運費用","14 萬元：加上覆核時間，再扣營運費用"],"answer":0,"explanation":"淨時間價值＝（500－100）×300＝12 萬元，再扣 4 萬元為 8 萬元。這是時間價值估算；若薪資支出未減少，不應直接宣稱已有同額現金節省。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q259","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12301","topicName":"生成式 AI 導入評估","concept":"ROI / TCO","difficulty":"hard","question":"某方案一次性整合費 20 萬、每月 API 與監控費 3 萬，24 個月後結束服務另付資料移轉費 8 萬。合約無其他費用且不折現，完整期間 TCO 為何？","options":["92 萬元：整合費加上 24 個月營運費","100 萬元：整合、營運與結束移轉費合計","72 萬元：24 個月 API 與監控費的合計","28 萬元：初始整合費加上結束移轉費"],"answer":1,"explanation":"TCO 應包含指定生命週期內的必要成本：20＋24×3＋8＝100 萬元。終止與移轉費也是成本，不能只算購置或使用期間的其中一部分。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q260","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12301","topicName":"生成式 AI 導入評估","concept":"ROI / TCO","difficulty":"hard","question":"兩模型經覆核後皆達品質門檻。每件甲 API 費 0.2 元、10% 需覆核；乙 API 費 0.5 元、2% 需覆核。每次覆核 5 元，無其他成本，何者每件期望成本較低？","options":["乙較低：甲 0.7 元，乙 0.6 元","甲較低：甲 0.2 元，乙 0.5 元","甲較低：甲 5.2 元，乙 5.5 元","乙較低：甲 0.5 元，乙 0.1 元"],"answer":0,"explanation":"期望成本＝每件 API 費＋覆核率×每次覆核費。甲 0.2＋0.10×5＝0.7 元，乙 0.5＋0.02×5＝0.6 元。另三項分別漏算覆核、假設每件均覆核或漏算 API。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q261","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12301","topicName":"生成式 AI 導入評估","concept":"ROI / TCO","difficulty":"hard","question":"某 AI 流程每年固定成本 12 萬元，每件變動成本 2 元，可取代每件成本 5 元的原流程。兩者品質相同且無其他成本或效益，一年處理多少件達到成本損益兩平？","options":["40,000 件，以固定成本除以每件淨節省","60,000 件，以固定成本除以每件變動成本","24,000 件，以固定成本除以原流程單件成本","約 17,143 件，以固定成本除以兩單件成本之和"],"answer":0,"explanation":"每件淨節省為 5－2＝3 元，令 120,000＋2N＝5N，可得 N＝40,000。不能用變動成本本身、原單價或兩者之和作為每件可回收的金額。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q262","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21101","topicName":"自然語言處理技術與應用","concept":"NER 與文本抽取","difficulty":"medium","question":"合約抽取服務要在原文標出公司名稱、日期及金額的起訖位置與類型，暫不產生摘要或判斷合約種類。哪種輸出最符合此 NER 任務？","options":["每份合約的主題類別，以及各類別的信心分數","每份合約的重點句子，以及各句子的排序分數","每個實體的原文範圍，以及對應的實體類型","每段文字的情緒標籤，以及對應的情緒強度"],"answer":2,"explanation":"NER 辨識文字中的實體範圍並給予類型標籤，例如組織、日期或金額。文件分類、摘要句排序與情緒分析的輸出單位及目標都不同。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q263","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21101","topicName":"自然語言處理技術與應用","concept":"NER 與文本抽取","difficulty":"medium","question":"新聞句子為「蘋果公司宣布在台北設立研發中心」。標註規範含組織、地點、人名與產品，要求依語境標完整實體。何者符合規範？","options":["蘋果＝組織；台北＝地點","蘋果公司＝產品；台北＝地點","蘋果公司＝組織；台北＝地點","蘋果公司＝組織；台北＝組織"],"answer":2,"explanation":"此句的蘋果公司是宣布設立中心的組織，台北是設立地點。NER 應依上下文及標註規範判斷，不能只因名稱中出現某個詞就套用固定類型。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q264","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21101","topicName":"自然語言處理技術與應用","concept":"NER 與文本抽取","difficulty":"medium","question":"NER 評估採「範圍與類型皆完全相符」才算正確。某句唯一標準實體為「台灣數據科技股份有限公司／組織」，模型只標「數據科技／組織」。此句應如何計數？","options":["TP＝0、FP＝1、FN＝1","TP＝1、FP＝0、FN＝0","TP＝0、FP＝0、FN＝1","TP＝0、FP＝1、FN＝0"],"answer":0,"explanation":"嚴格實體層級比對要求邊界和類型都正確。預測的短範圍不是標準實體，記一個 FP；完整標準實體沒有被正確找到，另記一個 FN。不能當成完整命中或只記其中一項。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q265","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21101","topicName":"自然語言處理技術與應用","concept":"NER 與文本抽取","difficulty":"medium","question":"NER 已標出交易文件中的公司名稱，但「甲向乙採購」與「乙供貨給甲」兩種句型並存。若要填入採購方與供應方欄位，接下來最直接需要哪一步？","options":["分析實體間的語意關係，判定各自交易角色","固定把句中最先提到的公司，設為交易的採購方","固定把句中最後提到的公司，設為交易的採購方","比較組織實體的信心分數，較高者設為採購方"],"answer":0,"explanation":"NER 找出組織不等於已判定買賣關係，還需關係抽取或依句意解析角色。兩種句型的採購方都是甲，但提及順序不同；實體辨識信心也不是交易角色的判斷依據。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q266","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21101","topicName":"自然語言處理技術與應用","concept":"NER 與文本抽取","difficulty":"medium","question":"通用 NER 模型能辨識人名與地點，卻常漏掉企業自訂產品代號。團隊要提升 PRODUCT 類型的抽取品質，何者最直接？","options":["增加產品文章的摘要長度，再從摘要重做相同辨識","降低所有實體的信心門檻，將新增結果一律標為產品","制定產品邊界與類型規則，以領域標註資料訓練驗證","沿用人名地點的標註資料，把輸出類型名稱改成產品"],"answer":2,"explanation":"新增領域實體類型需要一致的標註規範與代表性資料，才能訓練並驗證邊界及類型。拉長摘要、任意降低門檻或重新命名既有標籤，都不能提供正確的產品判斷依據。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q267","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21101","topicName":"自然語言處理技術與應用","concept":"NER 與文本抽取","difficulty":"medium","question":"NER 已找出「台積電」與「台灣積體電路製造公司」兩個組織提及。下游需要把它們連到同一公司主檔 ID，最適合補上哪項處理？","options":["再做文件主題分類，將兩段文字歸入同一主題","進行實體連結與別名解析，對應共同的主檔識別","再做詞性標註，將兩個名稱都歸入同一詞性","進行情緒分類，將兩個名稱都歸入同一情緒"],"answer":1,"explanation":"NER 辨識文字提及與類型；實體連結則利用別名及語境，對應知識庫或主檔的唯一識別。相同主題、詞性或情緒不代表同一現實實體。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q268","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21101","topicName":"自然語言處理技術與應用","concept":"上下文長度與摘要","difficulty":"medium","question":"數百頁報告超過模型上下文，團隊要摘要涵蓋全書各章。哪種方式最符合這項覆蓋需求？","options":["逐章摘要並保留來源，再合併摘要檢查各章覆蓋","選取開頭數頁作摘要，再以開頭內容代表全書","檢索少量相似段落作摘要，再以檢索結果代表全書","選取最後一章作摘要，再以最後內容代表全書"],"answer":0,"explanation":"全書摘要可先切分逐章處理，再合併並檢查覆蓋，保留來源以核對細節。只取開頭、少量檢索片段或末章不能確保涵蓋全部章節。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q269","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21101","topicName":"自然語言處理技術與應用","concept":"上下文長度與摘要","difficulty":"medium","question":"長篇會議紀錄不能一次放入上下文。任務是整理所有決議與待辦，哪種分段摘要設計較適當？","options":["各段只保留情緒摘要，合併時再推測決議與待辦","各段只保留發言長度，合併時以字數決定重要性","各段保留決議、負責人及期限，合併時核對遺漏","各段只保留最後一句，合併時以發言順序補全"],"answer":2,"explanation":"摘要欄位應配合任務，保存決議、負責人與期限，並在合併時核對遺漏或衝突。情緒、字數或最後一句不能可靠涵蓋全部決議。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q270","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21101","topicName":"自然語言處理技術與應用","concept":"上下文長度與摘要","difficulty":"medium","question":"上下文總預算為 8,000 tokens，其中指令與問題占 1,000，另預留輸出 1,500。忽略其他開銷，文件最多可占多少？","options":["6,500 tokens，僅扣除預留輸出的額度","5,500 tokens，扣除指令問題與輸出額度","7,000 tokens，僅扣除指令問題的額度","8,000 tokens，文件另有獨立的輸入額度"],"answer":1,"explanation":"依題設總預算計算：8,000−1,000−1,500=5,500 tokens。實際系統還需考量訊息等開銷與模型限制；本題已明確忽略其他開銷。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q271","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21101","topicName":"自然語言處理技術與應用","concept":"上下文長度與摘要","difficulty":"medium","question":"企業知識庫很大，但每次問答只需要少數相關條款。哪種安排最能減少每次送入模型的文件量？","options":["固定載入字數最多的文件，依文件長度推測相關性","先依問題檢索相關片段，再將片段放入模型上下文","固定載入最早建立的文件，依建立時間推測相關性","先將所有文件接成長字串，再截取字串開頭的片段"],"answer":1,"explanation":"問題導向檢索能在有限上下文中提供相關內容。文件長度、建立時間或固定截取開頭不能可靠代表與本次問題相關；檢索品質仍需驗證。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q272","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21101","topicName":"自然語言處理技術與應用","concept":"上下文長度與摘要","difficulty":"medium","question":"長文先產生分段摘要，再將摘要合併成總摘要。這種分層摘要方式主要有何取捨？","options":["減少模型輸入負擔，但每層摘要都會增加原文細節","降低單次上下文負擔，但需檢查資訊遺失或扭曲","保留完整原文內容，但每次合併都需再次載入全書","縮短每次輸出長度，但無法減少每次載入的原文量"],"answer":1,"explanation":"分層摘要降低單次處理的上下文需求，但摘要是有損壓縮，合併時可能遺漏或扭曲重要資訊，應保留來源並核對。它不保證完整保留原文。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q273","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21101","topicName":"自然語言處理技術與應用","concept":"上下文長度與摘要","difficulty":"medium","question":"客服問題只涉及某份文件中的退款期限，不需全文摘要。應如何使用有限上下文較適當？","options":["放入該文件的封面與目錄，依標題推測退款期限","檢索退款條款與相鄰內容，連同來源提供模型","放入該文件的首段與末段，依文件位置推測期限","檢索客服寒暄與回覆範例，依常見措辭推測期限"],"answer":1,"explanation":"檢索退款條款及必要相鄰內容可提供期限與適用條件，來源便於核對。封面、固定首末段或回覆範例不足以提供本次問題所需的事實依據。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q274","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"LoRA / PEFT","difficulty":"hard","question":"公司已有預訓練模型，要以 LoRA 適配寫作風格。相較全量微調，標準 LoRA 主要更新哪些參數？","options":["更新全部原始權重，並保存完整的模型副本","更新新增低秩矩陣，並凍結原始模型權重","更新原始權重數值，並移除新增的適配矩陣","更新每層完整矩陣，並重新初始化原始權重"],"answer":1,"explanation":"標準 LoRA 凍結預訓練權重，訓練新增的低秩更新矩陣，減少可訓練參數。全量更新或重新初始化並非此處的 LoRA 設計。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q275","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"LoRA / PEFT","difficulty":"hard","question":"比較相同基礎模型的 LoRA 與全量微調。LoRA 減少可訓練參數後，哪項資源需求通常最直接下降？","options":["載入基礎模型原始權重所需的參數數量","儲存訓練梯度與最佳化器狀態的記憶體","保存訓練資料原始文字所需的磁碟空間","處理輸入序列所需的上下文長度上限"],"answer":1,"explanation":"只更新少量參數可降低梯度及最佳化器狀態的記憶體需求。仍需載入基礎模型，也仍有活化值等記憶體成本；LoRA 本身不縮減原始模型參數量、資料量或上下文上限。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q276","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"LoRA / PEFT","difficulty":"hard","question":"多個客戶共用相同基礎模型，各自訓練 LoRA 版本。若要減少每個客戶版本的儲存量，應如何保存？","options":["每個客戶保存完整權重，不再記錄基礎模型版本","每個客戶保存完整對話，不再記錄適配器權重","每個客戶保存生成範例，不再記錄訓練產物版本","共用基礎模型，另存各客戶適配器及相容版本"],"answer":3,"explanation":"LoRA 的少量適配器權重可與共用基礎模型分開保存，並需記錄相容的基礎模型版本。完整模型副本儲存較大，對話或範例則不能替代已訓練的適配器。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q277","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"LoRA / PEFT","difficulty":"hard","question":"企業要用帶標籤資料適配模型，又希望只訓練少量參數。哪種做法最符合參數高效微調（PEFT）？","options":["凍結大部分基礎權重，訓練少量任務適配參數","凍結全部模型權重，檢索文件後加入輸入提示","重新初始化全部權重，利用語料重新訓練模型","解凍全部模型權重，利用任務資料全量微調"],"answer":0,"explanation":"PEFT 透過只訓練少量參數降低適配成本，例如 LoRA。檢索增強屬於提供外部上下文，未訓練參數；從零訓練與全量微調則不是題述的參數高效做法。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q278","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"LoRA / PEFT","difficulty":"hard","question":"LoRA 用 ΔW = BA 表示權重更新。若 W 為 1000×1000，B 為 1000×8，A 為 8×1000，A 與 B 合計有多少參數？","options":["16,000 個，將兩個低秩矩陣的元素數加總","1,000,000 個，沿用原始權重矩陣的元素數","8,000 個，僅計算其中一個低秩矩陣元素數","64 個，僅計算兩個低秩維度相乘的元素數"],"answer":0,"explanation":"B 與 A 各有 8,000 個元素，合計 16,000。BA 的乘積形狀與 W 相同，但 LoRA 訓練的是 A 與 B 的參數，不是另存全部 1,000,000 個更新元素。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q279","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"LoRA / PEFT","difficulty":"hard","question":"團隊提高 LoRA 的秩 r，基礎模型、適配層數與矩陣形狀皆不變。最直接的取捨是什麼？","options":["適配器參數減少，但可表示的更新空間增加","適配器參數減少，但基礎模型的層數增加","適配器參數增加，可表示的更新空間擴大","適配器參數增加，基礎模型的詞彙表擴大"],"answer":2,"explanation":"固定矩陣形狀時，A 與 B 的參數量隨 r 增加，可表示的低秩更新空間也擴大。這不會增加基礎模型層數或詞彙表，也不保證任務表現一定改善。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q280","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21102","topicName":"電腦視覺技術與應用","concept":"Segmentation","difficulty":"medium","question":"影像應用要輸出腫瘤區域的像素遮罩，而非整張影像的有／無標籤。應優先評估哪種輸出設計？","options":["整張影像的類別分數，描述是否存在腫瘤","各個候選區域的矩形框，描述腫瘤大致位置","每個像素的分割標籤，描述腫瘤區域輪廓","影像中關鍵點的座標，描述少數代表位置"],"answer":2,"explanation":"像素遮罩需要影像分割的像素層級輸出。分類分數、矩形框及關鍵點可提供其他資訊，但不直接提供整個區域的輪廓；實際精度仍需驗證。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q281","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21102","topicName":"電腦視覺技術與應用","concept":"Segmentation","difficulty":"medium","question":"自駕影像要對每個像素標記道路、行人或天空，不要求區分同類行人的個別身分。哪種任務最符合？","options":["實例分割，為每位行人建立各自的物件遮罩","語意分割，為每個像素指定所屬的語意類別","物件偵測，為每個行人建立各自的矩形外框","影像分類，為整張影像指定主要的場景類別"],"answer":1,"explanation":"語意分割標記像素類別，不要求分開同類物件實例。實例分割著重個別物件，偵測通常輸出框，整圖分類則不產生逐像素類別圖。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q282","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21102","topicName":"電腦視覺技術與應用","concept":"Segmentation","difficulty":"medium","question":"裂痕已被矩形框圈住，但產品要估計裂痕在影像中占用的像素面積。哪種新增輸出最適合？","options":["裂痕外框的寬與高，將框內全部像素視為裂痕","整張影像的裂痕分數，將分數當成面積比例","裂痕分割的像素遮罩，計算被標為裂痕的像素","裂痕中心點的座標，將座標值相乘當成面積"],"answer":2,"explanation":"分割遮罩可計數裂痕像素，矩形框包含背景而可能高估面積。分類分數或中心座標不能替代面積；若需實際物理面積，還要校正像素尺度。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q283","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21102","topicName":"電腦視覺技術與應用","concept":"Segmentation","difficulty":"medium","question":"比較典型影像分類、物件偵測與語意分割的輸出，哪組配對正確？","options":["分類—整圖標籤；偵測—物件外框；分割—像素類別","分類—像素類別；偵測—物件外框；分割—整圖標籤","分類—物件外框；偵測—整圖標籤；分割—像素類別","分類—整圖標籤；偵測—像素類別；分割—物件外框"],"answer":0,"explanation":"典型分類提供整圖標籤，偵測提供物件框與類別，語意分割提供逐像素類別。其餘選項交換了任務與輸出層級。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q284","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21102","topicName":"電腦視覺技術與應用","concept":"Segmentation","difficulty":"medium","question":"影像中有兩個相鄰且同類的零件，產品需要各自的輪廓與面積。哪種輸出最能直接區分兩個零件？","options":["兩個個別實例的遮罩，各自保留物件識別","一張同類零件的遮罩，將同類像素合為一類","兩個個別物件的外框，各自保留矩形邊界","一個整張影像的標籤，保留主要零件類別"],"answer":0,"explanation":"實例分割為各物件提供獨立遮罩，可分開同類且相鄰的零件。語意遮罩不保留個別身分，外框不提供精細輪廓，整圖標籤則不定位個別物件。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q285","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21102","topicName":"電腦視覺技術與應用","concept":"Segmentation","difficulty":"medium","question":"語意分割模型處理一張 H×W 的影像，輸出每個位置最可能的類別。典型最終類別圖的結構為何？","options":["每張影像一個類別，形成整圖分類的標籤","每個物件一組座標，形成矩形外框的清單","每個像素一個類別，形成 H×W 的標籤圖","每個關鍵點一組座標，形成代表位置的清單"],"answer":2,"explanation":"語意分割的最終類別圖為逐像素標籤。模型中間可能產生多通道分數圖並需上採樣，但題述的最終輸出應對應各像素類別。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q286","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21104","topicName":"多模態人工智慧應用","concept":"多模態對齊","difficulty":"hard","question":"影音事件系統發現聲音事件的時間戳一律比對應畫面晚 2 秒，兩串流採樣率也不同。若要配對同一事件的片段，應先做什麼？","options":["依各自的採樣序號直接配對，維持原始串流順序","校正時間偏移並映射共同時間軸，再配對對應片段","分別挑出聲音最強與畫面最亮的片段，再視為同一事件","將整段聲音與畫面各取平均特徵，再分配到所有片段"],"answer":1,"explanation":"時間戳存在固定偏移，且採樣序號不等於共同時間，因此要先校正並按共同時間範圍配對。各自極值或整段平均會丟失事件的時間對應，不能解決同一事件的片段對齊。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q287","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21104","topicName":"多模態人工智慧應用","concept":"多模態對齊","difficulty":"hard","question":"圖文檢索以成對圖片與描述訓練共同嵌入空間。採對比式目標時，哪種安排最能學到跨模態對應？","options":["拉近同批所有圖片與文字，讓整批樣本共用相近表示","拉近語意匹配的圖文配對，區分經確認不匹配的配對","分別拉近圖片及文字各自的近鄰，不使用圖文配對資訊","依各模態的類別頻率排序，再按名次建立圖文配對"],"answer":1,"explanation":"對比式學習利用正配對與負配對建立跨模態語意對應。不能把整批樣本都拉近，或只做各模態內的相似性；負配對也需注意同義描述及多張相符圖片造成的假負例。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q288","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21104","topicName":"多模態人工智慧應用","concept":"多模態對齊","difficulty":"hard","question":"影音模型原本使用同步的聲音與畫面。部署時攝影機偶爾斷訊，團隊仍要提供可標示不確定性的事件判斷。哪個方案較能處理缺失模態？","options":["把缺失畫面填成全零並視為有效影像，維持原信心分數","重複使用最近一張畫面並視為即時影像，維持原融合權重","以聲音的預測複製成影像預測，再將兩份結果平均","標記畫面缺失並驗證聲音備援，調整融合及信心呈現"],"answer":3,"explanation":"缺失模態應被明確標記，並驗證模型或備援流程在此條件下的表現與不確定性。零值或過期畫面不能直接視為有效同步觀測；複製聲音結果也不會增加獨立的影像證據。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q289","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21104","topicName":"多模態人工智慧應用","concept":"多模態對齊","difficulty":"hard","question":"文件問答先在原圖取得 OCR 文字框座標，之後把影像旋轉並裁切才送入視覺編碼器。若要讓文字框對應正確影像區域，應如何處理？","options":["保留原圖文字框座標，直接套用到處理後的影像","依 OCR 文字的字數重排座標，配合文字內容長度","只按新圖寬高縮放座標，忽略旋轉角度與裁切位移","套用相同幾何轉換更新座標，處理落在裁切外的文字框"],"answer":3,"explanation":"空間對齊需讓文字框與影像使用一致的座標系，包含旋轉及裁切的轉換，並處理已不在影像內的框。僅保留舊座標、按字數重排或只縮放寬高都不足以維持區域對應。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q290","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21104","topicName":"多模態人工智慧應用","concept":"多模態對齊","difficulty":"hard","question":"圖像與文字編碼器各自訓練、輸出皆為 512 維；團隊直接計算跨模態 cosine similarity，結果接近隨機。若兩者未做任何跨模態訓練，最主要缺口是？","options":["兩者向量維度不足，將維度同時加倍即可建立對應","兩者向量長度不同，各自正規化即可建立語意對應","兩者座標語意未對齊，需要配對資料或學得的映射","兩者分數範圍不同，將分數平移到正值即可建立對應"],"answer":2,"explanation":"相同維度只代表可以進行數值運算，不保證不同編碼器的座標具有共同語意。跨模態配對訓練或適當映射才能學習對應；增加維度、長度正規化或分數平移不會自行完成語意對齊。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q291","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21104","topicName":"多模態人工智慧應用","concept":"多模態對齊","difficulty":"hard","question":"圖文問答模型在測試集表現良好，但團隊懷疑它只靠文字線索猜答案。要檢查是否利用圖文對應關係，哪種驗證最有辨識力？","options":["在相同配對上增加輸出字數，觀察回答是否更詳細","重測訓練時看過的圖文配對，觀察答案是否更穩定","固定問題換入會改變答案的圖片，檢查答案是否隨之改變","只測文字就能作答的題目，檢查語言模型的答題能力"],"answer":2,"explanation":"固定文字但替換會改變正解的影像，可檢查模型是否依視覺證據調整答案，並需預先確認新配對的標準答案。回答長度、訓練集重現或純文字可解題目，無法有效區分是否使用跨模態對應。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q292","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21201","topicName":"AI 導入評估","concept":"技術與商業可行性","difficulty":"hard","question":"AI PoC 在離線資料上準確率高，但正式場域介接不穩，回應延遲超出需求。下一個 Pilot 應優先驗證什麼？","options":["增加離線資料上的準確率，沿用既有測試環境","增加公開資料上的模型排名，沿用既有評分方式","驗證真實介接與端到端延遲，使用目標場域負載","驗證簡報中的使用流程，使用預先整理的示範資料"],"answer":2,"explanation":"問題在實際整合與營運負載，Pilot 應驗證資料介接及端到端延遲。離線分數、公開排名或整理過的示範都不足以證明場域可運作。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q293","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21201","topicName":"AI 導入評估","concept":"技術與商業可行性","difficulty":"hard","question":"AI 構想已能展示模型能力，但缺少明確痛點與 KPI。專案啟動前最應補強哪項證據？","options":["確認使用者問題及現行基準，定義可衡量的改善目標","確認模型參數及公開排名，定義下一次模型升級時程","確認簡報版型及展示畫面，定義下一次展示會議日期","確認供應商名單及品牌聲量，定義下一次採購詢價順序"],"answer":0,"explanation":"商業可行性需確認值得解決的使用者問題與可衡量成效，並以現行流程作為比較基準。模型規格、展示排程或品牌聲量不能代替價值證據。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q294","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21201","topicName":"AI 導入評估","concept":"技術與商業可行性","difficulty":"hard","question":"模型表現達標，使用者痛點也已確認，但尚未估算人工覆核與正式維運成本。進入 Pilot 前應如何補強可行性評估？","options":["只估算模型推論費用，再以準確率推估整體效益","納入覆核與維運成本，再與預期業務效益比較","只估算初期訓練費用，再以完成訓練視為回收","納入展示與宣傳費用，再以關注人數視為收益"],"answer":1,"explanation":"可行性評估應涵蓋持續營運、人工覆核等成本，再與業務效益比較。只看推論或訓練費用可能低估總成本，展示關注也不等於業務收益。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q295","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21201","topicName":"AI 導入評估","concept":"技術與商業可行性","difficulty":"hard","question":"實驗室模型有效，但尚未測試正式資料分布、尖峰負載及異常處理。哪種下一步最能降低全面上線的不確定性？","options":["沿用實驗室結果全面上線，以使用者回饋補充測試","換用公開排名更高的模型，以模型排名補充場域證據","在限定場域進行 Pilot，以資料與負載驗證流程","擴充離線測試的重複次數，以同一批資料補充證據"],"answer":2,"explanation":"限定場域的 Pilot 可檢查實際資料、負載與異常處理，再依結果決定擴大。實驗室重複測試或公開排名不能涵蓋正式場域風險。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q296","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21201","topicName":"AI 導入評估","concept":"技術與商業可行性","difficulty":"hard","question":"AI 方案可達到準確率目標，但需新增人工覆核。要判斷它是否比現行流程值得導入，應比較什麼？","options":["模型參數量與競品模型參數量，判斷技術規模差距","展示畫面數與現行系統畫面數，判斷功能呈現差距","模型訓練次數與歷史訓練次數，判斷開發投入差距","含覆核成本的效益與現行流程，判斷業務改善幅度"],"answer":3,"explanation":"導入價值應與現行流程比較，納入覆核成本、時間、品質與錯誤影響等。技術規模、畫面數及訓練次數不是直接的業務效益。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q297","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21201","topicName":"AI 導入評估","concept":"技術與商業可行性","difficulty":"hard","question":"專案已有正向業務效益估算，但所需資料尚未取得授權，也未確認正式系統的介接方式。較合理的評估結論是？","options":["效益估算支持商業價值，可據此認定資料與整合已可行","示範結果支持模型能力，可據此認定授權與介接已可行","效益估算支持進一步評估，仍需確認資料授權與整合","供應商支援模型部署，可據此認定內部資料使用已可行"],"answer":2,"explanation":"商業效益只是可行性的一部分。資料授權與系統整合仍是未驗證條件，不能由效益、示範或供應商部署能力推定已成立。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q298","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21202","topicName":"AI 導入規劃","concept":"MLOps 生命週期","difficulty":"hard","question":"模型每月更新，事故調查需要確認目前線上模型究竟由哪份資料及哪版程式產生。哪種紀錄最能直接建立這條追溯鏈？","options":["保存部署日期與負責人，依時間接近程度推定訓練來源","保存模型檔名與測試分數，依分數相同與否推定來源","保存資料筆數與模型大小，依檔案規模推定訓練來源","把模型版本連到訓練執行紀錄，記錄資料快照與程式版本"],"answer":3,"explanation":"追溯需要模型、訓練執行、資料快照與程式版本的明確關聯。日期、分數或檔案大小可能相同，無法唯一識別來源；這些輔助資訊不能取代版本關聯。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q299","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21202","topicName":"AI 導入規劃","concept":"MLOps 生命週期","difficulty":"hard","question":"候選模型訓練成功、容器也能啟動，但尚未驗證重要客群品質與推論介面。自動部署流程此時應採哪種晉級條件？","options":["以訓練作業成功作為條件，直接晉級至正式服務","以分群品質及介面測試達標為條件，再晉級部署","以容器映像建置成功為條件，直接晉級正式服務","以本次訓練損失低於前版為條件，再晉級部署"],"answer":1,"explanation":"訓練或建置成功只表示流程的一部分可執行。晉級前仍需驗證代表性資料及重要分群的品質、輸入輸出契約與推論整合；訓練損失不能取代部署驗證。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q300","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21202","topicName":"AI 導入規劃","concept":"MLOps 生命週期","difficulty":"hard","question":"新版模型同時改了特徵前處理。上線後品質下降，團隊要快速回到已驗證的前版行為，且資料介面仍相容。部署前應準備哪種回滾單位？","options":["保存前版模型權重，回滾時繼續搭配新版前處理","保存前版評估分數，回滾時重新調整新版的門檻","保存前版訓練資料，回滾時重新訓練相似的權重","保存已驗證的模型與前處理套件，連同相容環境切回"],"answer":3,"explanation":"模型行為依賴權重、前處理及執行環境；回滾應恢復相容且已驗證的組合，並演練切換。只還原權重可能造成特徵不一致，臨時改門檻或重訓也不等同恢復前版。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q301","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21202","topicName":"AI 導入規劃","concept":"MLOps 生命週期","difficulty":"hard","question":"同一筆原始資料在離線訓練與線上推論產生不同標準化特徵。權重版本相同，差異來自兩套前處理實作。哪項 MLOps 改善最直接？","options":["增加訓練輪次，使模型適應兩套前處理的差異","增加推論副本，使更多請求可同時完成運算","共用版本化前處理並加入一致性測試，核對特徵","增加模型登錄欄位，僅記錄每次推論的回應時間"],"answer":2,"explanation":"這是訓練與服務前處理不一致的問題。應對齊轉換實作及參數，並用相同輸入驗證特徵一致性；增加訓練、服務容量或只記延遲不會直接修正特徵差異。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q302","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21202","topicName":"AI 導入規劃","concept":"MLOps 生命週期","difficulty":"hard","question":"團隊希望日後能重跑某次實驗，並說明模型表現差異來自哪些設定。下列哪組紀錄最能支援這項工作？","options":["實驗名稱、執行日期、訓練耗時與最後的模型分數","資料與程式版本、參數及環境，並關聯產物與評估結果","模型檔案大小、訓練設備型號與當次的資源使用率","專案負責人、部署網址、服務流量與每月營運費用"],"answer":1,"explanation":"重跑及比較實驗需要可取得的資料版本、程式、訓練參數與環境，並將產物及評估連到該次執行。隨機種子等設定也應記錄；硬體及非確定性運算仍可能造成差異，紀錄完整不保證逐位元相同。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q303","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21202","topicName":"AI 導入規劃","concept":"MLOps 生命週期","difficulty":"hard","question":"漂移告警觸發再訓練，產生了新模型，但新版尚未通過品質檢查。哪個流程較符合有驗證關卡的 MLOps 生命週期？","options":["訓練完成後直接取代線上模型，再等下一次監控告警","先比較候選模型與部署門檻，通過後再受控發布","先以原訓練集確認新版準確率，再直接替換正式版","以訓練使用的資料量較多為依據，將新版設為正式版"],"answer":1,"explanation":"再訓練產物仍是候選模型，需通過品質、相容性及其他部署門檻，再進入受控發布流程。告警、資料量增加或訓練完成不代表新版較好；只在訓練集評估也不能確認泛化品質。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q304","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"線上／批次部署","difficulty":"medium","question":"推薦名單每天凌晨計算，隔天使用即可；交易攔截則需在當次請求 200ms 內回覆。兩者的主要推論部署型態應如何選？","options":["推薦採排程批次，交易攔截採低延遲線上服務","推薦採低延遲線上服務，交易攔截採每日批次","兩者皆採每日排程批次，統一等待整批完成","兩者皆先累積一小時資料，再提交非同步作業"],"answer":0,"explanation":"隔日名單可容忍等待整批計算，適合批次；當次交易需要低延遲回應，應使用能符合 SLA 的線上推論。部署方式由時效和工作量決定，不是由資料型態決定。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q305","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"線上／批次部署","difficulty":"medium","question":"夜間批次需在 4 小時內處理 100 萬筆資料。假設吞吐率穩定、無啟動或重試開銷，下列哪個實測方案符合期限？","options":["每小時 30 萬筆，約需 3.33 小時","每小時 20 萬筆，約需 5 小時","每小時 24 萬筆，約需 4.17 小時","每小時 10 萬筆，約需 10 小時"],"answer":0,"explanation":"至少需要 100 萬／4＝25 萬筆每小時，只有每小時 30 萬筆能在期限內完成。批次 SLA 要看總工作量與完成時間；實務上還需預留啟動、失敗重試和負載波動空間。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q306","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"線上／批次部署","difficulty":"medium","question":"線上客服要求 P95 端到端延遲小於 800ms。某次壓測平均延遲 300ms、P95 為 1,200ms，成功率達標。依這項延遲要求，該如何判定？","options":["已達標，因平均延遲 300ms 低於 800ms","未達標，因 P95 延遲 1,200ms 高於上限","已達標，因成功率達標可抵銷較慢的請求","資料不足，必須取得每筆延遲才能判定是否達標"],"answer":1,"explanation":"規格指定的是 P95，而非平均值；即使平均延遲很低，尾端延遲仍可能超標。成功率與延遲是不同要求；題目已提供 P95，可直接與門檻比較，不必等到取得每筆延遲才能判定。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q307","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"線上／批次部署","difficulty":"medium","question":"文件推論通常需 2 分鐘，使用者可接受 5 分鐘內取回結果，但網站 HTTP 請求逾時為 30 秒。哪種介面設計較符合需求？","options":["維持同步回應，讓使用者每次逾時後重新送出整份文件","將 HTTP 成功碼提早回傳，並把尚未完成的結果當作完成","縮短模型運算至 30 秒時強制停止，直接採用部分結果","先回傳作業 ID，以佇列執行並提供狀態與結果查詢"],"answer":3,"explanation":"可容忍分鐘級等待的長作業可採非同步處理，將請求接收與作業完成分開，以 ID 查詢狀態和結果。反覆重送、提早假稱完成或截斷計算，不能提供可靠的完整結果。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q308","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"線上／批次部署","difficulty":"medium","question":"夜間批次部分分區失敗，成功分區已寫入結果。系統採至少一次重試，要求每筆資料只保留一份最終預測。哪種寫入設計較合適？","options":["每次重試均附加全部結果，事後以總列數判斷是否完成","任一分區失敗就略過整批，沿用前一天結果並標為成功","以資料及模型版本作唯一鍵，重試時使用冪等寫入","每次重試都產生新的隨機鍵，讓每次結果保留獨立紀錄"],"answer":2,"explanation":"重試可能重複處理同一輸入，使用資料識別與模型版本等穩定鍵進行冪等寫入，可避免同一預測重複累積。隨機新鍵或直接附加不會去重；略過失敗資料則無法完成本批需求。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q309","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"線上／批次部署","difficulty":"medium","question":"每晚預先計算的推薦能快速回傳，但新需求要求反映使用者剛完成的操作，不能等到隔天。評估部署調整時應優先確認什麼？","options":["夜間作業的平均吞吐量，是否高於前一晚的處理量","預先計算結果的檔案大小，是否小於服務的記憶體","批次輸出資料的欄位名稱，是否與線上 API 相同","特徵與預測的更新時效，是否能在所需時間內反映操作"],"answer":3,"explanation":"查詢已算好的結果很快，不代表結果包含最新資訊。需確認特徵及預測更新時效，再評估線上推論、增量更新或其他方案；吞吐量、檔案大小及欄位名稱本身不能證明時效達標。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q310","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Data / Concept Drift","difficulty":"hard","question":"新客戶來源改變後，輸入年齡分布與訓練期不同，但尚未取得新一批真實標籤。僅根據這項觀察，哪個判斷有直接證據？","options":["已證實 Concept Drift，因年齡與結果的關係必定改變","已證實模型準確率下降，因輸入分布和以前不同","已證實標籤品質下降，因新客戶來自不同的管道","已觀察到 Data Drift，但尚不能判定品質或條件關係變化"],"answer":3,"explanation":"輸入分布 P(X) 改變支持 Data Drift 的判斷。這不直接證明 P(Y|X) 改變或模型品質下降；仍需取得標籤、評估切片及調查資料品質，不能把漂移指標當成正確率。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q311","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Data / Concept Drift","difficulty":"hard","question":"在標籤定義與蒐集方式不變的前提下，可靠追蹤資料顯示：相同交易特徵下，詐欺機率由 5% 變為 30%，而特徵分布保持相近。這最直接支持哪種變化？","options":["Data Drift：輸入特徵的邊際分布已明顯改變","Schema Drift：輸入欄位的資料型別已明顯改變","服務效能退化：推論請求的回應時間已明顯增加","Concept Drift：給定特徵時目標的條件分布改變"],"answer":3,"explanation":"題目描述相同 X 對應的 Y 機率改變，即 P(Y|X) 改變，符合 Concept Drift。特徵邊際分布可以維持相近；資料型別與延遲則沒有題目提供的變化證據。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q312","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Data / Concept Drift","difficulty":"hard","question":"模型每筆預測的真實結果要 30 天後才能確認。團隊已能監控輸入與預測分布，若要檢查 Concept Drift 及實際品質，還應建立什麼？","options":["把當天模型預測當作標準答案，立即計算每日準確率","待標籤成熟後回連原始預測，依時間窗與客群評估","以當天輸入漂移分數代替準確率，使用相同百分比報表","只比較每日預測的平均信心，視為真實結果的替代值"],"answer":1,"explanation":"有延遲的真實標籤應回連當時輸入與預測，依成熟的時間窗評估品質及關係變化，避免未成熟標籤偏差。預測、自信程度或輸入漂移指標都不是可靠的真實答案替代品。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q313","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Data / Concept Drift","difficulty":"hard","question":"零售模型每到週末都出現輸入分布告警；目前監控將週末資料與平日基準比較。模型品質尚未確認，下一步較合理的是？","options":["檢查週期性與可比較基準，再用成熟標籤評估影響","將所有週末告警直接關閉，視為已排除品質風險","每次告警即以當天
