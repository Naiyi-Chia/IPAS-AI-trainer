<style>

async function ensurePdfJs(){
  if(window.pdfjsLib) return window.pdfjsLib;
  if(pdfJsLoading) return pdfJsLoading;
  pdfJsLoading = new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{
      if(window.pdfjsLib){
        window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        resolve(window.pdfjsLib);
      }else reject(new Error('PDF.js 載入失敗'));
    };
    s.onerror=()=>reject(new Error('無法載入 PDF.js，請確認網路連線'));
    document.head.appendChild(s);
  });
  return pdfJsLoading;
}

async function extractPdfTextFromBuffer(buf){
  await ensurePdfJs();
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  let fullText='';
  for(let pn=1;pn<=pdf.numPages;pn++){
    const page=await pdf.getPage(pn);
    const tc=await page.getTextContent();
    let pageText='',lastY=null;
    for(const item of tc.items){
      const y=item.transform?item.transform[5]:null;
      if(lastY!==null && y!==null && Math.abs(y-lastY)>3) pageText+='\n';
      else if(pageText) pageText+=' ';
      pageText+=item.str||'';
      lastY=y;
    }
    fullText+='\n'+pageText+'\n';
  }
  return fullText;
}

async function fetchArrayBufferWithFallback(url){
  const attempts=[
    url,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    `https://corsproxy.io/?${encodeURIComponent(url)}`
  ];
  let lastErr=null;
  for(const u of attempts){
    try{
      const r=await fetch(u,{cache:'no-store'});
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      const b=await r.arrayBuffer();
      if(b.byteLength<5000) throw new Error('回傳內容過小，可能不是 PDF');
      return b;
    }catch(e){lastErr=e;}
  }
  throw lastErr||new Error('無法取得官方 PDF');
}

async function fetchPaperText(paper){
  try{
    const buf=await fetchArrayBufferWithFallback(paper.pdf);
    return await extractPdfTextFromBuffer(buf);
  }catch(pdfErr){
    console.warn('PDF 直接載入失敗，改用文字備援',pdfErr);
    try{
      const jina=`https://r.jina.ai/${paper.pdf}`;
      const r=await fetch(jina,{cache:'no-store'});
      if(!r.ok) throw new Error(`文字備援 HTTP ${r.status}`);
      const t=await r.text();
      if(t.length<1000) throw new Error('文字備援內容不足');
      return t;
    }catch(textErr){
      const e=new Error('目前瀏覽器無法自動讀取這份官方考卷。可先點「查看官方 PDF」；換到 GitHub Pages / Safari / Chrome 後再試。');
      e.cause={pdfErr,textErr};
      throw e;
    }
  }
}

async function loadPastPaperById(id){
  const paper=pastPapers.find(p=>p.id===id);
  if(!paper)return;
  const status=qs('#pastLoadStatus');
  const cache=getPastCache();
  try{
    let parsed=cache[id];
    if(parsed && parsed.questions && parsed.questions.length){
      status.innerHTML=`<span class="good">已從本機快取載入：</span>${esc(paper.year+' 年 '+paper.session+' '+paper.subject)}，${parsed.questions.length} 題。`;
    }else{
      status.textContent=`正在自動載入 ${paper.year} 年 ${paper.session} ${paper.subject} 官方考古題…`;
      const raw=await fetchPaperText(paper);
      parsed=parseOfficialPastPaper(raw,paper.file);
      if(!parsed.questions.length) throw new Error('已取得官方內容，但沒有成功解析出題目。');
      parsed.meta={...parsed.meta,paperId:paper.id,title:`${paper.year} 年 ${paper.session} ${paper.subject} ${paper.name}`,pdf:paper.pdf};
      parsed.questions=parsed.questions.map(q=>({...q,
        id:`PAST-${paper.id}-${q.number}`,
        level:paper.level,
        subject:paper.subject,
        topic:`PAST-${paper.year}-${paper.session}`,
        topicName:`${paper.year} 年 ${paper.session} ${paper.name}`,
        sourceType:'iPAS 官方公告試題'
      }));
      cache[id]=parsed; savePastCache(cache);
      status.innerHTML=`<span class="good">官方考古題載入成功：</span>${esc(parsed.meta.title)}，共 ${parsed.questions.length} 題。`;
    }
    pastPaperSet=parsed.questions; pastPaperMeta=parsed.meta; pastAnswered=false;
    const firstUnanswered=pastPaperSet.findIndex(q=>!state.attempts[q.id]);
    pastIndex=firstUnanswered>=0?firstUnanswered:0;
    renderPastQuiz();
    qs('#pastQuizArea')?.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(err){
    console.error(err);
    status.innerHTML=`<span class="bad">自動載入失敗：</span>${esc(err.message||String(err))}`;
    qs('#pastQuizArea').innerHTML=`<div class="card"><h3>暫時無法自動開卷</h3><p class="small">這通常是瀏覽器跨站存取限制，不代表官方檔案不存在。你可以先開官方 PDF 核對；若是部署在 GitHub Pages 後再使用，成功率通常會比直接用 file:// 開啟更高。</p><a class="btn primary" style="display:inline-block;text-decoration:none" href="${paper.pdf}" target="_blank" rel="noopener">查看官方 PDF</a></div>`;
  }
}

function allCachedOfficialQuestions(){
  const cache=getPastCache();
  return Object.values(cache).flatMap(x=>x?.questions||[]);
}

function parseOfficialPastPaper(rawText,fileName){
  let text=String(rawText||'').replace(/\r/g,'\n');
  text=text.replace(/<br\s*\/?\s*>/gi,'\n').replace(/\|/g,' ').replace(/^#{1,6}\s*/gm,'');
  const meta={title:fileName.replace(/\.pdf$/i,''), fileName};

  // remove common headers / footers repeatedly seen in official PDFs
  text=text.replace(/\s*第\s*\d+\s*頁\s*，?共\s*\d+\s*頁\s*/g,' ');
  text=text.replace(/考試日期：[^\n]+/g,' ');
  text=text.replace(/答案\s*題目/g,' ');
  text=text.replace(/一、\s*選擇題/g,' ');
  text=text.replace(/115\s*年[^\n]*?公告試題/g,' ');
  text=text.replace(/114\s*年[^\n]*?公告試題/g,' ');
  text=text.replace(/第[一二三]科：[^\n]+/g,' ');
  text=text.replace(/AI\s*應用規劃師[^\n]*/g, m => (/\([初中]級\)/.test(m) ? m : ' '));
  text=text.replace(/\n{2,}/g,'\n');
  text=text.replace(/[ \t]{2,}/g,' ');

  const qRe=/(?:^|\n)\s*([ABCD])\s*(?:\n|\s)*([0-9]{1,3})\.\s*/g;
  const matches=[...text.matchAll(qRe)];
  const questions=[];
  for(let i=0;i<matches.length;i++){
    const m=matches[i];
    const start=m.index + m[0].length;
    const end=i+1<matches.length ? matches[i+1].index : text.length;
    let block=text.slice(start,end).trim();
    if(!block) continue;
    block=block.replace(/\n+/g,'\n').replace(/[ \t]+/g,' ').trim();
    const optPattern=/\(([ABCD])\)\s*([\s\S]*?)(?=\s*\([ABCD]\)\s*|$)/g;
    const optMatches=[...block.matchAll(optPattern)];
    if(optMatches.length<4) continue;
    const firstOptIndex=block.search(/\(A\)/);
    if(firstOptIndex<0) continue;
    let qText=block.slice(0,firstOptIndex).replace(/\n/g,' ').trim();
    const options=[];
    optMatches.slice(0,4).forEach(om=> options.push(om[2].replace(/\n/g,' ').replace(/[ \t]{2,}/g,' ').trim()));
    if(options.length!==4) continue;
    const answerLetter=m[1];
    const number=parseInt(m[2],10);
    questions.push({
      id:`PAST-${meta.title}-${number}`,
      number,
      level:'官方考古題',
      subject:'官方',
      topic:'考古題',
      topicName:meta.title,
      difficulty:'official',
      question:qText,
      options,
      answer:'ABCD'.indexOf(answerLetter),
      explanation:`官方公告試題正解：${answerLetter}`,
      sourceType:'iPAS 官方公告試題 PDF'
    });
  }
  questions.sort((a,b)=>a.number-b.number);
  meta.title = inferPastTitle(text, fileName, questions.length);
  return {meta, questions};
}

function inferPastTitle(text,fileName,count){
  const name=(fileName||'').replace(/\.pdf$/i,'');
  const m1=name.match(/(1\d{2}年[^\n]{0,80}?第[一二三四]次[^\n]{0,80}?第[一二三四]科[^\n]{0,80})/);
  if(m1) return m1[1];
  const m2=name.match(/(1\d{2}年[^\n]{0,80})/);
  if(m2) return m2[1];
  return `${name}（${count} 題）`;
}

function renderPastQuiz(){
  const area=qs('#pastQuizArea');
  if(!pastPaperSet.length){
    area.innerHTML='';
    return;
  }
  const q=pastPaperSet[pastIndex];
  const key=q.id;
  const past=state.attempts[key];
  area.innerHTML=`<div class="card" style="margin-bottom:12px">
    <div class="qmeta"><span class="pill">官方考古題</span><span class="pill">${esc(pastPaperMeta?.title||'')}</span><span class="pill">第 ${q.number} 題</span></div>
    <div class="small">${past?`曾作答：${past.correct?'✓ 正確':'✕ 錯誤'}`:'尚未作答'}　｜　第 ${pastIndex+1}/${pastPaperSet.length} 題　｜　<a href="${pastPaperMeta?.pdf||'#'}" target="_blank" rel="noopener">核對官方原題 PDF</a></div>
    <div class="progress"><div style="width:${(pastIndex+1)/pastPaperSet.length*100}%"></div></div>
    <div class="qtext">${esc(q.question)}</div>
    <div id="pastOpts">${q.options.map((o,i)=>`<button class="option" data-i="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</button>`).join('')}</div>
    <div id="pastExplain" class="explain hidden"></div>
    <div class="navrow">
      <button class="btn secondary" onclick="pastPrev()">上一題</button>
      <div><button class="btn secondary" onclick="restartPastQuiz()">重新作答本份</button> <button class="btn primary" onclick="pastNext()">下一題</button></div>
    </div>
  </div>`;
  qsa('#pastOpts .option').forEach(b=>b.onclick=()=>answerPast(+b.dataset.i));
}

function answerPast(i){
  if(pastAnswered) return;
  pastAnswered=true;
  const q=pastPaperSet[pastIndex], ok=i===q.answer;
  state.attempts[q.id]={correct:ok,last:Date.now(),subject:'PAST',topic:pastPaperMeta?.title||'官方考古題'};
  if(ok) delete state.wrong[q.id]; else state.wrong[q.id]=true;
  save();
  qsa('#pastOpts .option').forEach((b,idx)=>{b.disabled=true;if(idx===q.answer)b.classList.add('correct');if(idx===i && !ok)b.classList.add('wrong')});
  const ex=qs('#pastExplain');
  ex.classList.remove('hidden');
  ex.innerHTML=`<b class="${ok?'good':'bad'}">${ok?'答對了':'答錯了'}｜正解 ${String.fromCharCode(65+q.answer)}</b><br>${esc(q.explanation)}<div class="small" style="margin-top:6px">${esc(q.sourceType)}</div>`;
}

function pastNext(){
  if(!pastPaperSet.length) return;
  if(pastIndex<pastPaperSet.length-1){ pastIndex++; pastAnswered=false; renderPastQuiz(); }
  else{
    const answered=pastPaperSet.filter(q=>state.attempts[q.id]).length;
    const correct=pastPaperSet.filter(q=>state.attempts[q.id] && state.attempts[q.id].correct).length;
    const score=answered ? Math.round(correct/pastPaperSet.length*100) : 0;
    qs('#pastQuizArea').innerHTML=`<div class="card"><h3>這份官方考古題完成了</h3><div class="kpi ${score>=70?'good':'bad'}">${score} 分</div><p>${correct}/${pastPaperSet.length} 題正確。你可以回到上方直接選另一份官方考卷，或到錯題本加強複習。</p><button class="btn primary" onclick="restartPastQuiz()">重新作答這份</button></div>`;
  }
}
function pastPrev(){ if(pastIndex>0){ pastIndex--; pastAnswered=false; renderPastQuiz(); } }
function restartPastQuiz(){ pastIndex=0; pastAnswered=false; renderPastQuiz(); }

function getQuestionById(id){
  return DB.questions.find(x=>x.id===id) || allCachedOfficialQuestions().find(x=>x.id===id);
}
function renderWrong(){
  const ids=Object.keys(state.wrong), qsx=ids.map(getQuestionById).filter(Boolean);
  qs("#wrong").innerHTML=`<div class="card"><div class="examtop"><h3 style="margin:0">錯題本（${qsx.length}）</h3><button class="btn secondary" onclick="startWrongPractice()">重刷錯題</button></div>
  ${qsx.length?qsx.slice(0,120).map(q=>`<div class="topicbar"><div><b>${esc(q.id)}</b> ${esc(q.question)}<div class="small">${esc(q.subject||'')}｜${esc(q.topic||'')} ${esc(q.topicName||'')}</div></div></div>`).join(""):"目前沒有錯題。"}</div>`;
}
function startWrongPractice(){
  const ids=Object.keys(state.wrong);
  practiceSet=shuffle(ids.map(getQuestionById).filter(Boolean));
  if(!practiceSet.length)return;
  switchPanel("practice");pIndex=0;practiceAnswered=false;renderPracticeQ();
}

function renderStats(){
  let by={};
  Object.entries(state.attempts).forEach(([id,a])=>{
    let q=getQuestionById(id);if(!q)return;
    let k=q.topic||q.subject||'其他';
    if(!by[k])by[k]={n:0,c:0,subject:q.subject,name:q.topicName||q.subjectName||k};
    by[k].n++;if(a.correct)by[k].c++;
  });
  let rows=Object.entries(by).sort((a,b)=>(a[1].c/a[1].n)-(b[1].c/b[1].n));
  let hist=state.examHistory||[];
  const pastRows=pastPapers.map(p=>{const pr=paperProgress(p);return {...p,...pr,score:pr.answered?Math.round(pr.correct/pr.answered*100):null}}).filter(p=>p.answered);
  qs("#stats").innerHTML=`<div class="grid"><div class="card c8"><h3 style="margin-top:0">能力指標表現</h3>
  ${rows.length?rows.map(([k,v])=>{let p=Math.round(v.c/v.n*100);return `<div class="topicbar"><div style="min-width:180px"><b>${esc(k)}</b> ${esc(v.name)}<div class="small">${v.c}/${v.n} 正確</div></div><div class="bar"><i style="width:${p}%"></i></div><b class="${p<70?'bad':'good'}">${p}%</b></div>`}).join(""):"先做一些題目後，這裡會顯示弱點分析。"}</div>
  <div class="card c4"><h3 style="margin-top:0">官方考古題進度</h3>${pastRows.length?pastRows.slice(0,10).map(h=>`<div class="topicbar"><div><b>${h.year} ${h.session} ${h.subject}</b><div class="small">${h.answered} 題已作答</div></div><b class="${h.score>=70?'good':'bad'}">${h.score}%</b></div>`).join(""):"尚無考古題作答紀錄"}
  <h3>最近模擬</h3>${hist.length?hist.slice(0,6).map(h=>`<div class="topicbar"><div><b>${h.subject}</b><div class="small">${new Date(h.date).toLocaleDateString()}</div></div><b class="${h.score>=70?'good':'bad'}">${h.score}</b></div>`).join(""):"尚無模擬紀錄"}
  <button class="btn danger" style="margin-top:12px" onclick="resetAll()">清除全部進度</button></div></div>`;
}
function resetAll(){if(confirm("確定清除所有作答、錯題與模擬紀錄？")){localStorage.removeItem("ipasAIState");location.reload()}}

function renderScope(){
 const groups={};
 Object.keys(DB.topics).forEach(t=>{let sub=t.slice(0,3).replace(/^L/,"L"); let candidates=Object.keys(DB.subjects).filter(s=>t.startsWith(s)); let s=candidates.sort((a,b)=>b.length-a.length)[0]; if(!groups[s])groups[s]=[];groups[s].push(t)});
 qs("#scope").innerHTML=`<div class="card"><h3 style="margin-top:0">115 年官方評鑑範圍</h3>
 <p class="small">下列代碼與名稱依 iPAS 115 年 AI 應用規劃師能力鑑定簡章整理。</p>
 ${Object.keys(DB.subjects).map(s=>`<h4>${subjectLabel(s)}</h4><div>${(groups[s]||[]).map(t=>`<span class="pill">${t} ${esc(DB.topics[t])}</span>`).join("")}</div>`).join("")}
 <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
 <p><a href="${officialBrochure}" target="_blank" rel="noopener">開啟 115 年官方簡章</a>　｜　<a href="${officialSite}" target="_blank" rel="noopener">iPAS 官方網站</a></p>
 <div class="notice"><b>中級報考結構：</b>L21「人工智慧技術應用與規劃」為共同科目，另由 L22「大數據處理分析與應用」或 L23「機器學習技術與應用」擇一。若你想兩張中級證書方向都準備，本工具也可以三科全部刷。</div>
 </div>`;
}

renderHome();renderPractice();renderExam();renderPastPapers();renderScope();
</script>
