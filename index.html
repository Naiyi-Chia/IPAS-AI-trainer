資料重訓，省略基準與品質比較","把週末輸入分布複製成平日比例，直接送入原模型"],"answer":0,"explanation":"告警可能反映正常週期，也可能伴隨真正品質變化，應採可比較的季節／週期基準並評估結果。僅關閉告警或自動重訓沒有確認原因；強行改比例也可能扭曲實際輸入。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q314","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Data / Concept Drift","difficulty":"hard","question":"感測器欄位仍叫 temperature，但上游更新後由攝氏改成華氏，模型輸入分布與錯誤率同時異常。已確認模型訓練時使用攝氏，應優先怎麼處理？","options":["直接用華氏資料重訓模型，不再核對原資料契約","修正單位轉換與資料契約，再重評品質及是否需重訓","提高漂移告警門檻，讓新溫度範圍回到可接受區間","只把模型輸出重新縮放，讓預測平均值回到原先水準"],"answer":1,"explanation":"已知根因是資料管線違反單位契約，應先修正轉換並驗證輸入及品質。不能把所有分布異常都當成必須重訓的自然概念變化；調整告警或輸出均未修正根因。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q315","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Data / Concept Drift","difficulty":"hard","question":"各輸入特徵的單變量分布檢查皆未告警，但成熟標籤顯示模型錯誤率升高。哪項解讀較正確？","options":["輸入檢查未告警，已足以排除輸入與目標關係改變","單變量檢查未涵蓋所有變化，仍須檢查聯合分布與目標關係","錯誤率升高，已足以證明所有特徵的邊際分布改變","模型程式未修改，已足以把異常歸因於標籤蒐集故障"],"answer":1,"explanation":"各特徵邊際分布相近，不表示特徵間聯合關係或 P(Y|X) 相同。應進一步檢查資料品質、聯合分布及目標關係；不能由沒有輸入告警排除 Concept Drift，也不能僅憑錯誤率指定根因。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q316","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"A/B 與 Shadow Deployment","difficulty":"hard","question":"新模型需接收當下的真實請求以量測延遲及預測差異，但對外回應仍須完全由舊模型決定。哪種流量安排符合要求？","options":["複製請求給新版作影子推論，對外仍採用舊版結果","將 10% 請求交給新版回應，其餘請求採用舊版","將新舊結果加權平均，對所有請求回傳混合結果","每天更換對外使用的版本，交替比較兩版的表現"],"answer":0,"explanation":"Shadow 複製線上請求給候選模型，但不讓其結果成為對外決策。少量真實回應、混合結果或交替上線都會改變部分使用者結果，不符合這裡的限制。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q317","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"A/B 與 Shadow Deployment","difficulty":"hard","question":"推薦 A/B 實驗要讓 10% 使用者看到新版、90% 看到舊版，比較轉換率；同一使用者反覆造訪不應換組。哪種分派方式較合適？","options":["由使用者自行選新舊版，再直接比較兩組轉換率","以使用者為單位隨機且固定分組，同期觀察結果","每次請求重新抽籤分組，使同一人可交替看到兩版","白天全部使用新版、晚上使用舊版，再比較結果"],"answer":1,"explanation":"以使用者為單位的穩定隨機分派可避免反覆造訪時換組，並減少自選或時段差異的混淆。仍需檢查分派與樣本品質，以及適當的不確定性分析，不能僅憑隨機化就忽略實驗設計。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q318","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"A/B 與 Shadow Deployment","difficulty":"hard","question":"Shadow 測試記錄了新版每筆鏡像請求的延遲、錯誤與新舊推薦結果；使用者實際只看舊版。這些紀錄仍不能直接回答哪個問題？","options":["新版處理鏡像請求時，量測到的延遲分布為何","新舊模型收到同一請求時，推薦清單的差異為何","新版處理鏡像請求時，出現推論錯誤的比例為何","使用者看到新版推薦後，轉換率相對舊版會增加多少"],"answer":3,"explanation":"使用者未接觸新版推薦，因此 Shadow 不能直接觀察其行為反應或估計實際轉換提升。它可以量測鏡像路徑的延遲、錯誤與輸出差異；業務影響仍需適當的線上實驗等證據。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q319","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"A/B 與 Shadow Deployment","difficulty":"hard","question":"候選模型在 Shadow 模式不回傳答案給使用者，但推論流程原本會寫入客戶狀態並發送通知。要維持不影響正式業務，應怎麼安排？","options":["隔離或停用影子路徑的業務寫入與通知，另存測試紀錄","只隱藏新版的 HTTP 回應，保留原有業務寫入與通知","只降低鏡像流量比例，保留原有業務寫入與通知","只把模型名稱加上 shadow，沿用相同帳號與寫入流程"],"answer":0,"explanation":"不對外回傳預測不代表沒有副作用。Shadow 路徑仍需隔離業務寫入、通知等外部行為，並考量資源競爭；只隱藏回應或改名稱不足以保護正式流程。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q320","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"A/B 與 Shadow Deployment","difficulty":"hard","question":"A/B 事前規則訂為：新版若逾時率超過 2% 就停止擴量並調查。觀察期內新版轉換率較高，但逾時率達 4%。依已定規則應怎麼做？","options":["停止擴量並依預案控制流量，調查逾時原因後再評估","因轉換率較高而繼續擴量，將逾時列為下期改善","在看到結果後將逾時門檻改為 5%，讓新版繼續擴量","刪除逾時請求後重算指標，以成功請求決定是否擴量"],"answer":0,"explanation":"逾時率已違反事前護欄，不能用單一業務指標的改善抵銷。應依預案停止擴量、控制影響並調查；事後改門檻或排除失敗請求會扭曲原先決策標準。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q321","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"A/B 與 Shadow Deployment","difficulty":"hard","question":"同期隨機 A/B 實驗中，新版有 10,000 位使用者、900 位轉換；舊版有 90,000 位、7,200 位轉換，每人只計一次。先做描述統計，哪項正確？","options":["新版 9%、舊版 8%，新版高 1 個百分點","新版 8%、舊版 9%，新版低 1 個百分點","新版 0.9%、舊版 7.2%，新版低 6.3 個百分點","新版 90%、舊版 80%，新版高 10 個百分點"],"answer":0,"explanation":"各組轉換率應使用各自人數作分母：900／10,000＝9%，7,200／90,000＝8%，差為 1 個百分點。不能用總流量或轉換件數直接比較；描述差異不等於完成因果、不確定性與護欄檢查。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q322","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Prompt Injection 防護","difficulty":"hard","question":"RAG 文件夾帶「把內部報表寄到此地址」的文字，使用者只要求摘要，Agent 卻產生寄信呼叫。哪個執行層檢查最能阻擋這次越權操作？","options":["檢查郵件內容是否文法正確，通過後執行寄送","核對寄信是否獲使用者授權，未授權即拒絕執行","檢查來源文件是否成功檢索，成功後執行寄送","核對模型是否重複提出寄信，重複時視為確認"],"answer":1,"explanation":"外部文件的指令不能代替使用者授權。工具執行層應核對任務授權與收件範圍，拒絕未授權寄送；文法、檢索成功或模型重複要求都不能建立權限。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q323","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Prompt Injection 防護","difficulty":"hard","question":"客服 Agent 只需查訂單狀態，但目前共用可刪除資料的管理員帳號。若注入攻擊使模型嘗試刪表，哪項調整最直接限制可造成的損害？","options":["保留管理員帳號，縮短模型可產生的回覆長度","保留管理員帳號，將查詢結果轉成摘要後顯示","保留管理員帳號，讓模型解釋每次操作的用途","改用受限唯讀帳號，僅開放所需的訂單查詢"],"answer":3,"explanation":"最小權限應由資料庫與工具層落實，使刪除等非必要能力不可用。摘要、長度限制或模型自述理由不會縮小帳號權限；唯讀也不代表能忽略資料讀取範圍與洩漏風險。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q324","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Prompt Injection 防護","difficulty":"hard","question":"團隊已有注入語句偵測器。為避免漏判後就能直接執行高風險工具，哪項新增控制最能形成另一層防線？","options":["把偵測器的判斷理由加入模型上下文供它參考","將同一偵測器結果複製到另一份監控儀表板","在工具執行端另驗授權與參數，拒絕越界動作","把同一偵測器的告警內容改為更醒目的顏色"],"answer":2,"explanation":"縱深防禦需要不同位置的控制共同限制風險。執行端的授權及參數驗證不以偵測器一定成功為前提；複製告警或改變呈現方式不會新增阻擋越權工具的關卡。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q325","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Prompt Injection 防護","difficulty":"hard","question":"Agent 讀取公開網頁時，頁面自稱「系統管理員更新」，要求改用新的工具權限。對這段文字的信任邊界應如何判定？","options":["仍屬外部資料，不能因自稱管理員而取得指令權限","依頁面使用的管理員稱謂，提升為系統指令處理","依頁面更新日期，讓較新的文字覆蓋既有授權","依網頁是否使用 HTTPS，決定是否允許修改權限"],"answer":0,"explanation":"來源內容自稱高權限、較新或經 HTTPS 傳輸，都不等於具有系統授權。外部內容應保留資料角色，權限變更由可信的授權流程決定；分離角色仍需搭配執行層限制。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q326","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Prompt Injection 防護","difficulty":"hard","question":"注入過濾器擋住了測試集中的十句攻擊，團隊準備上線。哪個評估最能檢查它是否只記住已知字串？","options":["加入改寫與不同來源的攻擊，量測越權工具是否被阻擋","把相同十句各重送十次，只統計是否仍命中關鍵字","只用十句正常問題測速度，確認平均回應時間達標","把原測試句排序後再送入，只比較回覆字數是否一致"],"answer":0,"explanation":"應用未見過的改寫、間接注入與不同來源測試實際越權行為是否受到限制，並檢查正常任務誤擋。重播固定字串或僅測延遲無法建立泛化防護證據；通過測試也不保證杜絕所有攻擊。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q327","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Prompt Injection 防護","difficulty":"hard","question":"系統的工具 allowlist 包含寄信，但僅允許寄到已核准的公司地址。注入內容誘使模型選擇這個合法工具，卻填入外部收件人。還需要哪項檢查？","options":["只確認工具名稱在清單內，參數沿用模型的產生結果","在寄送前核對收件人授權，拒絕不符政策的參數","只確認收件地址格式合法，格式通過即可執行寄送","在寄送完成後記錄外部網域，交由每月報表追蹤"],"answer":1,"explanation":"工具名稱合法不代表每組參數都獲授權。需在執行前依政策核對收件人及內容範圍；格式驗證不能取代授權，事後日誌也不能阻止當次外洩。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q328","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Human-in-the-loop 風險分級","difficulty":"hard","question":"Agent 可回覆公開 FAQ，也可提交高額且難撤回的付款。目標是讓低風險流程有效率，高風險行動在執行前受控，應如何安排？","options":["FAQ 與付款皆採事後抽查，依每日處理量調整抽樣","FAQ 與付款皆按回覆字數，超過門檻才交人工覆核","FAQ 採監控與例外升級，高額付款採事前授權覆核","FAQ 採事前主管簽核，高額付款採模型信心門檻"],"answer":2,"explanation":"覆核強度應對應行動影響與可逆性。公開 FAQ 可配合監控和例外升級，高額難撤回付款則需在執行前取得授權；字數、處理量或模型信心都不能單獨取代風險分級。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q329","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Human-in-the-loop 風險分級","difficulty":"hard","question":"高風險案件規定要先經人工核准。審查佇列壅塞且已逾服務時限，但尚無核准紀錄，系統應採哪種例外流程？","options":["暫停執行並升級至備援審查，保留待核准狀態","將逾時視為默認核准，先執行再補上審查紀錄","改由模型自評信心決定，超過門檻即可代為核准","隨機抽出部分逾時案件執行，以降低佇列長度"],"answer":0,"explanation":"人工核准是執行條件，佇列逾時不能自動轉成授權。應有備援審查與升級路徑，在取得核准前維持不執行；否則壅塞就會成為繞過高風險控制的途徑。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q330","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Human-in-the-loop 風險分級","difficulty":"hard","question":"審查者幾乎每次都直接接受模型建議，訪談發現介面只顯示分數，沒有依據或更改入口。哪項改善最能讓人工覆核發揮作用？","options":["提供依據及不確定性，讓審查者能更正、拒絕或升級","把分數顯示得更醒目，並預先勾選接受模型的建議","縮短每案閱讀時間，讓審查者能處理更多待審案件","把審查者姓名列入紀錄，但保留只能確認的操作"],"answer":0,"explanation":"有效人工覆核需要可理解的證據、適當時間與實際介入權限，不能只設置形式上的確認步驟。只強化分數、縮短時間或登記姓名，不會補足判斷與否決能力。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q331","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Human-in-the-loop 風險分級","difficulty":"hard","question":"模型對一項高影響且難撤回的外部決策回報 99% 信心。現行政策要求人工事前覆核，僅憑這個數字應如何處理？","options":["信心高於 95% 即可跳過覆核，事後再抽查結果","信心高於 99% 才需人工覆核，其餘案件先執行","維持事前覆核，另檢查信心校準及失誤影響","以信心百分比決定執行金額，免去個別覆核"],"answer":2,"explanation":"模型信心可能未校準，也不能消除錯誤的嚴重後果。已定義的高風險人工關卡不應僅憑自報信心繞過；風險評估還要考慮影響、可逆性及實際驗證證據。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q332","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Human-in-the-loop 風險分級","difficulty":"hard","question":"人工已核准一筆付款的收款人與金額，但 Agent 在執行前又修改收款人。哪種控制能確保實際行動仍符合人工核准？","options":["將核准綁定具體操作參數，參數改變時重新送審","將核准綁定整段對話，對話內後續修改皆可執行","將核准綁定當日時間，當天產生的付款皆可執行","將核准綁定模型版本，相同版本可自行調整參數"],"answer":0,"explanation":"核准需對應具體行動及其關鍵參數；收款人或金額改變後，原核准不再覆蓋新操作。若只綁定對話、日期或模型版本，人工看到的內容可能與最後執行的內容不同。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q333","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Human-in-the-loop 風險分級","difficulty":"hard","question":"低風險自動分類原採事後抽查，近期發現某客群的錯分代價遠高於原先估計。調整人工介入門檻時，應優先依據哪項資料？","options":["模型回覆的平均字數，並將較長回覆送人工檢查","服務累積的使用次數，並讓常用功能減少覆核","模型版本的發布日期，並讓較新版本減少覆核","各客群的錯誤影響與發生證據，重新評估分流"],"answer":3,"explanation":"風險分級應隨實際影響與監控證據調整，必要時提高特定客群的人工覆核或暫停自動化。使用量、字數及版本新舊不能替代對錯誤代價與受影響群體的評估。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q334","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"LLM 評測資料集","difficulty":"hard","question":"客服團隊要比較三個 LLM。正式流量包含常見查詢、少見但高風險的權限要求，以及無法回答的問題。哪個評測資料集設計最能支援選型？","options":["依實際流量抽樣並補入風險案例，分別報告任務與安全表現","依實際流量抽樣後排除少見類型，以常見問題平均分選型","依各模型擅長的客服類型分配題目，以各自平均分作比較","依公開排行榜的題型配置客服題目，以相同題數維持公平"],"answer":0,"explanation":"應涵蓋真實任務與重要風險，並分別呈現任務品質和安全表現。少見但高風險的案例不能因頻率低而忽略；各模型使用不同題目會混入難度差異；公開題型比例也未必符合內部流量。額外補入的風險案例應另列結果，避免誤稱為實際流量的平均表現。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q335","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"LLM 評測資料集","difficulty":"hard","question":"同一客服模型的兩次評測結果差很多。團隊發現測試題、提示模板與生成設定都曾變動。要釐清模型版本本身的差異，最適合怎麼做？","options":["每版重新抽取一組客服問題，以增加測試情境的涵蓋率","沿用測試題但各自調整提示，以比較每版可達到的最高分","固定測試題並只執行一次，以排除重複生成造成的成本","固定並記錄資料與設定版本，以重複試跑比較分數分布"],"answer":3,"explanation":"比較模型版本的效果時，應控制測試資料、提示、生成設定及評分規則，並記錄版本。重複試跑可觀察生成隨機性造成的波動，並不保證輸出完全相同。改題或改提示會混入其他因素，單次執行則不足以估計波動。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q336","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"LLM 評測資料集","difficulty":"hard","question":"團隊反覆看同一組內部評測題的錯誤，據此調整提示。現在要估計提示定稿後面對新客服問題的品質，哪個資料安排較可靠？","options":["保留未參與調整的代表性測試集，定稿後再做最終評估","將已修正的評測題複製成新檔案，定稿後再做最終評估","從調整提示時看過的題目重抽樣，定稿後再做最終評估","將歷次模型答對的題目合成題庫，定稿後再做最終評估"],"answer":0,"explanation":"反覆依同一評測集調整提示，可能對該資料集過度適配。保留未參與開發且具代表性的測試集，才能較可靠地估計新案例品質。複製或重抽已看過的題目未消除資訊使用；只保留答對案例則有選擇偏差。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q337","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"LLM 評測資料集","difficulty":"hard","question":"摘要任務要求事實正確、重要資訊完整且符合指定格式。評測者對同一份摘要的分數分歧很大。哪項改善最能讓這三項要求被一致評分？","options":["用摘要與參考答案的字詞重疊率，取代三項要求的分項評分","以摘要長度是否接近參考答案，作為三項要求的共同代理","為三項要求訂定分項規準與範例，再以共同樣本校準評分","讓每位評測者自行設定三項權重，再將個別總分直接平均"],"answer":2,"explanation":"分項規準、正反例與共同樣本校準，可協助評測者對事實、完整性及格式採取一致判準。字詞重疊或長度不足以涵蓋三項品質；各自使用不同權重則難以解釋總分差異。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q338","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"LLM 評測資料集","difficulty":"hard","question":"客服模型改版後，平均分上升，但過去曾修好的權限洩漏案例再次失敗。要及早發現這類品質退步，最應維護哪種評測資產？","options":["版本化的歷史失敗案例集，搭配預期行為與分項通過門檻","定期替換的熱門問題樣本，搭配當期流量與總體平均分數","各版最高分的成功回覆集，搭配示範提示與輸出格式紀錄","供應商發布的標準測試集，搭配公開分數與模型版本資訊"],"answer":0,"explanation":"將已知失敗案例與預期安全行為納入可重跑的回歸評測，可檢查舊問題是否復發。熱門樣本、成功展示及公開測試各有用途，但不能代替這些案例。安全門檻宜獨立檢查，避免被總體平均分掩蓋。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q339","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"LLM 評測資料集","difficulty":"hard","question":"團隊以 LLM 裁判評分客服回答，發現交換兩個候選回答的展示順序後，勝負常隨之改變。哪項評測流程調整最直接處理這個問題？","options":["固定較新模型的回答在前，讓每次比較採用一致順序","延長所有候選回答的篇幅，讓裁判取得更多文字線索","平衡候選回答的展示順序，並抽樣以人工判斷校準裁判","增加相同展示順序的題數，讓整體平均分更快趨於穩定"],"answer":2,"explanation":"展示順序影響判斷屬於位置偏差。平衡順序並以人工抽查校準，可檢查和降低此偏差。固定新模型在前或擴增同順序題數仍可能保留系統性偏差；延長回答則改變被評內容，未直接解決順序問題。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q340","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22101","topicName":"敘述性統計與資料摘要技術","concept":"Percentile / IQR","difficulty":"medium","question":"薪資資料呈右偏，且含少數極高薪資。若要描述中間 50% 資料的分散程度，應選哪個統計量？","options":["全距：最大薪資減最小薪資","標準差：薪資對平均值的離散程度","中位數：排序後位居中央的薪資","四分位距：第三四分位數減第一四分位數"],"answer":3,"explanation":"四分位距 IQR = Q3 − Q1，描述中央一半資料的跨度。全距依賴兩端極值，標準差反映全體相對平均值的離散，中位數則描述位置而非分散程度。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q341","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22101","topicName":"敘述性統計與資料摘要技術","concept":"Percentile / IQR","difficulty":"medium","question":"某人成績位於參照群體的第 90 百分位。忽略同分與百分位計算慣例的細微差異，最合理的解讀為何？","options":["其答對題數約占全部題目的九成","參照群體約九成的成績不高於他","其成績約為群體最高分數的九成","參照群體約九成的成績不低於他"],"answer":1,"explanation":"百分位描述在參照群體中的相對位置，而非答題正確率或相對最高分的比例。第 90 百分位約表示九成成績不高於該值；同分與計算慣例可能使精確比例略有不同。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q342","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22101","topicName":"敘述性統計與資料摘要技術","concept":"Percentile / IQR","difficulty":"medium","question":"某資料集已算得 Q1 = 20、Q3 = 50。其四分位距 IQR 與意義為何？","options":["30，表示中央一半資料的跨度","70，表示中央一半資料的總和","35，表示全體資料的中位位置","2.5，表示全體資料的離散倍數"],"answer":0,"explanation":"IQR = Q3 − Q1 = 50 − 20 = 30。Q1 與 Q3 的和、平均或比值均不是 IQR；尤其 (Q1 + Q3)/2 不一定等於中位數。題目已給定四分位數，無須另選樣本分位數算法。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q343","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22101","topicName":"敘述性統計與資料摘要技術","concept":"Percentile / IQR","difficulty":"medium","question":"一組大型資料中，最大值再增加 100，其餘值與排序不變，且計算 Q1、Q3 所用的位置及數值均未改變。全距與 IQR 如何變化？","options":["全距維持不變，IQR 增加 100","全距增加 100，IQR 維持不變","全距增加 100，IQR 也增加 100","全距維持不變，IQR 也維持不變"],"answer":1,"explanation":"最大值增加 100、最小值未變，因此全距增加 100。題目明訂 Q1、Q3 均未變，故 IQR 不變。這說明 IQR 不直接依賴最極端值，但不代表任何資料改動都不影響四分位數。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q344","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22101","topicName":"敘述性統計與資料摘要技術","concept":"Percentile / IQR","difficulty":"medium","question":"以同一套分位數定義整理連續數值資料時，Q1、Q2、Q3 分別對應哪些百分位？","options":["第 10、第 50、第 90 百分位","第 25、第 50、第 75 百分位","第 20、第 40、第 60 百分位","第 33、第 50、第 67 百分位"],"answer":1,"explanation":"三個四分位數分別對應第 25、50、75 百分位，將排序資料分成四個部分；Q2 即中位數。不同樣本分位數算法可能給出不同數值，但不改變這些百分位的對應關係。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q345","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22101","topicName":"敘述性統計與資料摘要技術","concept":"Percentile / IQR","difficulty":"medium","question":"箱型圖以 Q1 − 1.5×IQR、Q3 + 1.5×IQR 作為潛在離群值的下、上界。若 Q1 = 20、Q3 = 40，哪一組界線正確？","options":["下界 0、上界 60","下界 10、上界 50","下界 −30、上界 70","下界 −10、上界 70"],"answer":3,"explanation":"IQR = 40 − 20 = 20，1.5×IQR = 30，因此下界 20 − 30 = −10，上界 40 + 30 = 70。超出界線的值只是待查核的潛在離群值，不能據此直接判定資料錯誤。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q346","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22102","topicName":"機率分佈與資料分佈模型","concept":"Binomial / Poisson","difficulty":"medium","question":"獨立抽查 20 件產品，每件瑕疵機率同為 p；另假設客服來電近似獨立發生且平均速率穩定。瑕疵品數與一小時來電數的典型分布模型分別為何？","options":["前者為卜瓦松分布，後者為二項分布","前者為二項分布，後者為卜瓦松分布","前者為幾何分布，後者為二項分布","前者為二項分布，後者為指數分布"],"answer":1,"explanation":"固定 20 次獨立、同成功機率的二元試驗，其成功次數服從二項分布。卜瓦松過程在固定時間內的事件數服從卜瓦松分布；幾何分布描述等待首次成功的試驗次數，指數分布則可描述該過程的事件間隔。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q347","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22102","topicName":"機率分佈與資料分佈模型","concept":"Binomial / Poisson","difficulty":"medium","question":"廣告共曝光 100 次，每次是否點擊視為獨立事件，點擊機率固定為 0.05。以二項分布建模時，點擊次數的期望值為何？","options":["5 次，由 100 × 0.05 計算","0.05 次，由單次點擊機率計算","95 次，由 100 × 0.95 計算","20 次，由 1 ÷ 0.05 計算"],"answer":0,"explanation":"二項分布的期望值為 np，故為 100×0.05 = 5 次。0.05 是單次成功機率，95 是未點擊次數的期望，20 則是相同條件下等待首次點擊所需試驗次數的期望。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q348","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22102","topicName":"機率分佈與資料分佈模型","concept":"Binomial / Poisson","difficulty":"medium","question":"伺服器錯誤近似服從每小時平均 4 次的齊次卜瓦松過程。要建立任意連續半小時內錯誤次數的分布，其參數 λ 應設為多少？","options":["λ = 4，沿用每小時的事件平均數","λ = 2，使用半小時的事件平均數","λ = 8，依時間縮短而加倍參數值","λ = 0.5，直接使用半小時的長度"],"answer":1,"explanation":"卜瓦松計數的 λ 是所選區間內的期望事件數，應將速率乘以區間長度。每小時 4 次乘以 0.5 小時，得到 λ = 2；λ 不是時間長度本身。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q349","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22102","topicName":"機率分佈與資料分佈模型","concept":"Binomial / Poisson","difficulty":"medium","question":"令 X 服從 Binomial(n=10, p=0.2)，Y 服從 Poisson(λ=2)。兩者期望值相同，下列哪項正確比較其可能取值？","options":["X 與 Y 的取值上限都等於各自期望值 2","X 可取任意非負整數，Y 的最大取值為 2","X 的最大取值為 10，Y 沒有有限的取值上限","X 與 Y 的最大取值都等於固定試驗次數 10"],"answer":2,"explanation":"二項分布的成功次數介於 0 與 n，故 X 最大為 10。卜瓦松分布可取任意非負整數，λ 是期望值而非上限；這是模型的數學支持範圍，不表示極大計數很常見。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q350","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22102","topicName":"機率分佈與資料分佈模型","concept":"Binomial / Poisson","difficulty":"medium","question":"某路口的通報數原擬採用單一固定 λ 的卜瓦松分布。資料顯示事件常成群出現，且尖峰與離峰速率差異很大。最合理的下一步是？","options":["將整日計數合併求平均，再以單一 λ 取代分時差異","先把每次成群事件合成一次，再沿用原本的計數定義","檢查群聚與速率變化，再評估分時模型或其他計數分布","改以固定樣本數的二項分布，並略過事件相依性的檢查"],"answer":2,"explanation":"事件群聚與明顯時變速率，提示簡單齊次卜瓦松模型的假設可能不適合。應檢查原因，考慮分時速率或能處理額外變異的計數模型。合併平均、改變事件定義或直接換分布，都不能取代假設檢查。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q351","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22102","topicName":"機率分佈與資料分佈模型","concept":"Binomial / Poisson","difficulty":"medium","question":"抽驗 10 件產品，假設各件是否瑕疵相互獨立且瑕疵機率固定為 0.1。以二項分布計算「恰有 1 件瑕疵」的機率，哪個式子正確？","options":["0.1 × 0.9⁹，只計一個固定位置出現瑕疵","1 − 0.9¹⁰，計算至少出現一件瑕疵","10 × 0.1 × 0.9⁹，加總十種瑕疵位置","10 × 0.9 × 0.1⁹，加總十種良品位置"],"answer":2,"explanation":"恰有一件瑕疵包含十個互斥的位置安排，每種機率為 0.1×0.9⁹，故總機率為 10×0.1×0.9⁹，約 0.3874。未乘 10 只算單一位置；1−0.9¹⁰ 是至少一件；最後一式是恰有九件瑕疵。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q352","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22103","topicName":"假設檢定與統計推論","concept":"信賴區間","difficulty":"hard","question":"以獨立隨機樣本估計母體平均值，已知母體標準差不變，使用相同的 95% z 信賴區間公式。樣本数從 100 增為 1000，區間寬度如何變化？","options":["通常變寬，因為樣本數增加會擴大估計的標準誤","維持不變，因為信賴水準仍設定為相同的 95%","通常變寬，因為更多樣本需涵蓋更多個別觀察值","通常變窄，因為標準誤隨樣本數增加而降低"],"answer":3,"explanation":"已知標準差的平均值 z 區間半寬為臨界值乘以 σ/√n。其他條件相同時，樣本數增加降低標準誤，縮窄的是平均值估計區間，不是個別觀察值範圍。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q353","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22103","topicName":"假設檢定與統計推論","concept":"信賴區間","difficulty":"hard","question":"在頻率學派中，以同樣方法反覆抽樣並計算 95% 信賴區間，95% 最精確的意義為何？","options":["長期約 95% 的這些區間會涵蓋固定的真實參數","每個已算出的固定區間都有 95% 機率涵蓋參數","約 95% 的個別觀察值會位於每次計算的區間","約 95% 的樣本平均值都等於固定的真實參數"],"answer":0,"explanation":"95% 描述建構區間程序的長期覆蓋率。真實參數視為固定，已觀測的區間或包含它或不包含它；這也不是個別資料的涵蓋率或點估計恰好相等的比例。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q354","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22103","topicName":"假設檢定與統計推論","concept":"信賴區間","difficulty":"hard","question":"報告提供母體平均值的點估計與 95% 信賴區間。相較只有點估計，區間最主要增加哪項資訊？","options":["個別觀察值的分布範圍，描述資料本身的離散程度","下一筆觀察值的預測範圍，描述個體預測的不確定性","母體樣本的最小與最大值，描述已收集資料的極端值","平均值估計的可能範圍，描述抽樣估計的不確定性"],"answer":3,"explanation":"母體平均值的信賴區間反映參數估計的不確定性。它不同於原始資料分布、樣本極值或下一筆資料的預測區間；覆蓋率仍依建構方法與假設解讀。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q355","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22103","topicName":"假設檢定與統計推論","concept":"信賴區間","difficulty":"hard","question":"使用相同 95% z 區間公式，母體標準差已知且相同。樣本數由 100 增為 400，平均值區間的半寬變為原本多少？","options":["約四倍，因為半寬與樣本數成正比","約兩倍，因為半寬與樣本數平方根成正比","約一半，因為半寬與樣本數平方根成反比","約四分之一，因為半寬與樣本數成反比"],"answer":2,"explanation":"半寬與 1/√n 成正比，√(100/400)=1/2。因此樣本數增加四倍，半寬縮為一半，而非四分之一。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q356","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22103","topicName":"假設檢定與統計推論","concept":"信賴區間","difficulty":"hard","question":"資料、樣本數與平均值 z 區間方法相同，將信賴水準從 95% 提高為 99%。區間通常如何改變？","options":["變窄，因為更高信賴水準要求更精確的估計","不變，因為點估計與樣本數都沒有發生改變","平移，因為更高信賴水準會提高樣本平均值","變寬，因為更高覆蓋率需要更大的臨界值"],"answer":3,"explanation":"提高信賴水準使 z 臨界值增加，因而擴大區間半寬。樣本平均值並不因此改變；更高覆蓋率與更窄區間是不同要求。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q357","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22103","topicName":"假設檢定與統計推論","concept":"信賴區間","difficulty":"hard","question":"兩研究以相同方法與信賴水準估計同一母體平均值，點估計相同，A 的區間較窄。較合理的解讀是？","options":["A 的估計較精密，因此可排除資料收集的系統性偏誤","A 的估計較精密，但區間寬度不能排除系統性偏誤","A 的估計較不精密，因為較窄區間排除了較多可能值","A 的估計較不精密，因此應以觀察值極差取代區間"],"answer":1,"explanation":"同條件下較窄區間表示較小的抽樣不確定性，即較高精密度；但系統性偏誤或假設違反不會因區間窄而消失。精密度不能等同於沒有偏誤。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q358","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22103","topicName":"假設檢定與統計推論","concept":"Type I / Type II Error","difficulty":"hard","question":"設 H0 為「新流程沒有提升產量」。新流程實際沒有提升，但檢定拒絕 H0。這次判斷屬於哪一類？","options":["第一類錯誤：拒絕了實際為真的 H0","第二類錯誤：未拒絕實際為假的 H0","正確拒絕：排除了實際為假的 H0","正確保留：未拒絕實際為真的 H0"],"answer":0,"explanation":"H0 實際為真卻被拒絕，屬第一類錯誤（Type I）。判斷需同時知道真實狀態與檢定決策；第二類錯誤則是 H0 為假卻未被拒絕。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q359","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22103","topicName":"假設檢定與統計推論","concept":"Type I / Type II Error","difficulty":"hard","question":"設 H0 為「新製程未降低不良率」。新製程實際降低了不良率，但本次檢定未拒絕 H0。應如何分類？","options":["第二類錯誤：未拒絕實際為假的虛無假設","第一類錯誤：拒絕了實際為真的虛無假設","正確拒絕：成功偵測到實際存在的改善","正確保留：未拒絕實際為真的虛無假設"],"answer":0,"explanation":"題目已提供真實改善存在，因此 H0 為假；檢定卻未拒絕，屬第二類錯誤（Type II）。未拒絕不等於證明 H0 成立，也不表示已證明新舊製程等效。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q360","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22103","topicName":"假設檢定與統計推論","concept":"Type I / Type II Error","difficulty":"hard","question":"在指定效果大小下，某檢定的第二類錯誤機率 β＝0.20。該條件下的檢定力 power 為何？","options":["0.20，等於未能偵測效果的機率","0.05，等於慣用的顯著水準設定","0.25，等於 β 除以一減 β 的值","0.80，等於一減 β 的偵測機率"],"answer":3,"explanation":"Power＝1−β＝0.80，是在指定對立情況下拒絕 H0 的機率。它依效果大小、樣本數、變異及檢定設計而變，不能直接套用慣用 α，也不等於 p-value。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q361","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22103","topicName":"假設檢定與統計推論","concept":"Type I / Type II Error","difficulty":"hard","question":"同一固定樣本檢定維持樣本數、變異、對立效果及方法不變，僅將 α 從 0.05 降至 0.01，使拒絕域縮小。通常對 β 與 power 有何影響？","options":["β 降低、power 提高，因拒絕 H0 更容易","β 降低、power 降低，因兩者同向變動","β 提高、power 提高，因兩者互相獨立","β 提高、power 降低，因拒絕 H0 更難"],"answer":3,"explanation":"在其他條件固定且拒絕域縮小時，更難拒絕 H0，對指定對立效果會增加漏失機率 β、降低 power。若同時增加樣本數，則可能改善 power；本題已排除該變動。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q362","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22103","topicName":"假設檢定與統計推論","concept":"Type I / Type II Error","difficulty":"hard","question":"校準檢定在 H0 為真的情況下重複執行，第一類錯誤率為 α＝0.05。若進行 1,000 次這類檢定，錯誤拒絕的期望次數為何？","options":["5 次，以檢定總次數乘上 0.005 計算","20 次，以顯著水準 0.05 的倒數計算","50 次，以檢定總次數乘上 0.05 計算","950 次，以檢定總次數乘上 0.95 計算"],"answer":2,"explanation":"每次在 H0 為真時錯誤拒絕的機率為 0.05，期望次數為 1,000×0.05＝50。這是長期平均而非保證每次恰有 50 次；也不是說已拒絕結果中必有 5% 為假。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q363","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22103","topicName":"假設檢定與統計推論","concept":"Type I / Type II Error","difficulty":"hard","question":"研究希望更容易偵測預先指定的小幅改善，且不提高 α。假設抽樣方式、變異與檢定方法固定，哪項設計調整通常能降低 β？","options":["事前增加樣本數，提升對該效果的檢定力","事前減少樣本數，降低估計所需的成本","事後提高拒絕門檻，縮小原設定的拒絕域","事後只保留顯著結果，再估計成功的比例"],"answer":0,"explanation":"在設計假設成立下，事前增加樣本數通常能提高指定效果下的 power，因而降低 β。減少樣本或縮小拒絕域通常不利；只保留顯著結果會造成選擇偏差，並非有效的檢定力改善。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q364","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22202","topicName":"數據儲存與管理","concept":"NoSQL 選型","difficulty":"hard","question":"社群主要查詢沿著好友關係走兩到三層，並依關係屬性過濾路徑。就資料表示與走訪模式，哪種 NoSQL 模型最直接？","options":["鍵值模型，以單一使用者鍵取得不解析的資料塊","文件模型，以每篇貼文的內容作為主要存取單位","圖形模型，以節點與邊表達並走訪人際關係","寬欄模型，以裝置與日期分區讀取連續時間列"],"answer":2,"explanation":"多跳關係與路徑是圖形模型的自然表示。其他模型也可能實作相關功能，但題目的核心存取是關係走訪，而非單鍵讀取、文件內容或時間分區掃描；實際效能仍需驗證。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q365","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22202","topicName":"數據儲存與管理","concept":"NoSQL 選型","difficulty":"hard","question":"商品欄位依類別不同，包含巢狀 JSON 規格；主要按商品 ID 讀寫整筆，也要索引其中的規格欄位。哪種模型最符合這個存取單位？","options":["鍵值模型，將 JSON 視為不可索引的整塊值","圖形模型，將商品間路徑作為主要查詢單位","寬欄模型，將每筆規格依固定時間窗分區","文件模型，保存巢狀欄位並建立所需索引"],"answer":3,"explanation":"文件模型可自然保存商品聚合及巢狀欄位，並依查詢設計索引。彈性結構不等於不用 schema 管理，仍需型別、必要欄位和版本驗證；其他模型須依其實際功能評估。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q366","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22202","topicName":"數據儲存與管理","concept":"NoSQL 選型","difficulty":"hard","question":"工作階段快取只需依 session_id 取得或替換整份 session_data，並支援到期失效；沒有欄位查詢或關係走訪。哪種資料模型最直接？","options":["文件模型，以多欄位條件索引作為主要存取","圖形模型，以多跳節點走訪作為主要存取","鍵值模型，以 session_id 查找對應資料","寬欄模型，以跨時間區間掃描作為主要存取"],"answer":2,"explanation":"此需求是單鍵對應整份值，鍵值模型最直接；到期失效需確認所選產品支援 TTL。這不代表其他資料庫無法做到，而是本題沒有需要額外欄位索引或關係查詢。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q367","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22202","topicName":"數據儲存與管理","concept":"NoSQL 選型","difficulty":"hard","question":"團隊已選 Cassandra，主要查詢「某裝置某日內的一段時間資料」。為限制分區大小並支援時間範圍讀取，哪個主鍵設計較符合查詢？","options":["以固定常數作分區鍵，將所有裝置資料存入同區","以每筆隨機 UUID 作分區鍵，時間不納入排序","以裝置加日期作分區鍵，以時間作叢集排序鍵","以溫度值作分區鍵，以不同裝置名稱作排序鍵"],"answer":2,"explanation":"Cassandra 採查詢導向建模；裝置加日期能定位有界分區，時間叢集鍵支援區內範圍讀取。仍須按流量調整時間桶與容量，避免熱點或過大分區；單一常數或隨機分區不符合此存取路徑。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q368","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22202","topicName":"數據儲存與管理","concept":"NoSQL 選型","difficulty":"hard","question":"兩個候選資料庫都宣稱可水平擴展，但新需求包含跨紀錄更新與讀後立即可見。選型前哪項驗證最有助於判斷是否符合需求？","options":["比較產品宣傳的最大資料量，選標示容量較大者","比較預設安裝所需的時間，選部署步驟較少者","比較產品是否使用 NoSQL 名稱，選分類符合者","以實際交易與一致性設定測試，核對失敗行為"],"answer":3,"explanation":"擴展能力不能代替交易與一致性語意。應核對特定產品、版本及設定下的原子性、讀寫可見性、失敗與重試行為，再以代表性負載驗證；不能只靠 NoSQL 標籤判定支援或不支援。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q369","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22202","topicName":"數據儲存與管理","concept":"NoSQL 選型","difficulty":"hard","question":"既有關聯式資料庫已符合跨表交易、一致性及負載要求，團隊只因資料筆數增加就提議全面改用 NoSQL。哪項決策較合理？","options":["依資料筆數決定遷移，達到門檻後不必檢查交易","依 NoSQL 類型決定遷移，先接受跨表語意差異","依新產品發布日期遷移，將相容性留待上線確認","先驗證瓶頸與交易需求，再比較保留或遷移成本"],"answer":3,"explanation":"資料量增加不是單獨淘汰關聯式資料庫的理由。應以已量測瓶頸、查詢與交易需求、擴展選項和遷移成本決策；NoSQL 產品能力各異，不能一概認為有或沒有強一致與交易。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q370","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22202","topicName":"數據儲存與管理","concept":"Lakehouse","difficulty":"hard","question":"團隊希望在物件儲存保留多型態原始資料，同時讓分析表具備交易、版本與 SQL 查詢能力。哪項設計最符合 Lakehouse 的核心方向？","options":["只保存原始檔案，讓每位分析師自行推定表格版本","每天匯出獨立副本，讓各部門自行維護欄位與版本","在資料湖加上表格管理層，供相容引擎一致讀寫","僅在物件目錄建立索引，讓索引取代表格交易紀錄"],"answer":2,"explanation":"Lakehouse 在資料湖儲存之上加入表格管理與分析能力，結合資料湖的彈性與資料倉儲式管理。只有檔案或個別匯出副本，並未建立受控交易與版本語意；實際能力仍取決於格式、引擎與治理設定。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q371","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22202","topicName":"數據儲存與管理","concept":"Lakehouse","difficulty":"hard","question":"Lakehouse 表格更新需寫入多個檔案，讀者不能看到只完成一半的批次。哪種機制最直接提供一致的讀取版本？","options":["依檔案最後修改時間排序，讀取目前已出現的檔案","每寫完一個檔案就更新報表，讓讀者逐步取得資料","以檔案名稱包含相同日期為準，推定整批都已完成","完成檔案後原子提交表格快照，讀者使用已提交版本"],"answer":3,"explanation":"交易表格透過原子提交快照或交易紀錄，使讀者取得完整的已提交版本，而非任意混讀正在寫入的檔案。檔名與修改時間不能單獨建立多檔案交易的一致性。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q372","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22202","topicName":"數據儲存與管理","concept":"Lakehouse","difficulty":"hard","question":"某 Lakehouse 已保存歷史表格快照。分析師要重現昨天報表的輸入資料，今天表格已更新，應採哪種做法？","options":["查詢最新表格，再把報表日期欄位改為昨天","只依報表產生時間排序，不指定資料版本","重新執行今天的匯入流程，推定結果與昨天一致","使用昨天報表記錄的快照版本，讀取當時資料"],"answer":3,"explanation":"重現資料輸入需要鎖定當時使用的版本，並確保快照與其引用檔案仍在保留期內。改日期或查最新表格不能恢復過去資料；完整報表重現還需保留查詢程式與其他依賴。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q373","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22202","topicName":"數據儲存與管理","concept":"Lakehouse","difficulty":"hard","question":"BI 與機器學習團隊想直接共用同一份 Lakehouse 表格，避免各自維護不同副本。啟用第二個引擎前，最應先驗證什麼？","options":["兩個引擎是否支援相同表格格式、版本及讀寫語意","兩個引擎是否能開啟底層檔案，無須核對表格協定","兩個引擎是否支援 SQL 語法，無須核對快照處理","兩個引擎是否能列出相同目錄，無須核對交易紀錄"],"answer":0,"explanation":"共用資料需驗證格式與版本相容、快照及交易語意，並核對實際讀寫功能。都能讀 Parquet、使用 SQL 或列出目錄，不表示都能正確理解其上的交易表格。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q374","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22202","topicName":"數據儲存與管理","concept":"Lakehouse","difficulty":"hard","question":"Lakehouse 的儲存已集中，但分析帳號可直接讀到未遮罩的敏感欄位。若目標是落實最小資料存取權，應優先補上哪項能力？","options":["增加物件儲存副本數，讓敏感資料更容易被還原","增加查詢工作節點數，讓讀取敏感資料更快完成","增加表格的快照保留天數，讓歷史資料更完整","設定身分與欄位存取政策，驗證各讀取路徑權限"],"answer":3,"explanation":"集中儲存或採用交易格式不會自動落實授權。應依角色設定敏感欄位的存取或遮罩政策，並驗證 SQL 與直接檔案讀取等路徑，避免繞過控制；副本、算力與保留天數處理的是不同需求。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q375","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22202","topicName":"數據儲存與管理","concept":"Lakehouse","difficulty":"hard","question":"Lakehouse 上某彙總查詢很慢，執行計畫顯示掃描大量不相關分區及小檔案。開始調校時，哪項工作最直接對應已觀察到的瓶頸？","options":["先增加結果快取時間，不檢查首次查詢的掃描成本","檢查分區裁剪與檔案整理，再用相同查詢比較效能","先增加歷史快照數量，讓每次查詢有更多版本可選","先提高來源匯入頻率，不調整目前的資料檔案布局"],"answer":1,"explanation":"應根據掃描與檔案開啟成本檢查分區設計、裁剪條件及小檔案整理，再用可比較負載驗證。結果快取可能幫助重複查詢，但不能修正首次掃描成本；增加快照或匯入頻率也沒有直接對應此瓶頸。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q376","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22203","topicName":"數據處理技術與工具","concept":"Spark 與記憶體運算","difficulty":"hard","question":"Spark 作業把同一份昂貴的清理結果用於多輪迭代，且結果可容納於可用快取。哪項調整最直接減少每輪重算？","options":["持久化重複使用的結果，在使用完畢後釋放快取","每輪都重新讀取來源，僅將輸出檔案名稱保持相同","每輪都增加一次 count，以此取代結果持久化","每輪只快取最終彙總，不保留重用的清理結果"],"answer":0,"explanation":"persist/cache 可讓後續操作重用已物化的分區，避免反覆執行昂貴轉換；用完釋放可降低記憶體壓力。單純 count 不等同持久化，只快取最終彙總也未保留題目要重用的清理結果；實際效益仍需測量。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q377","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22203","topicName":"數據處理技術與工具","concept":"Spark 與記憶體運算","difficulty":"hard","question":"Spark 程式對 RDD 連續呼叫 map 與 filter，尚未呼叫任何 action。此時轉換結果通常處於什麼狀態？","options":["所有分區已完成運算，且結果已自動寫回來源","已建立轉換的相依關係，等 action 觸發實際運算","所有資料已集中到 driver，等待程式列印結果","每個轉換都已產生永久備份，等待清除過期檔案"],"answer":1,"explanation":"RDD 轉換採延遲求值，先記錄相依關係，action 才觸發需要的計算。map/filter 本身不表示所有結果已運算、集中到 driver 或永久落盤。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q378","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22203","topicName":"數據處理技術與工具","concept":"Spark 與記憶體運算","difficulty":"hard","question":"RDD 使用 MEMORY_ONLY 持久化，但部分分區放不進記憶體。依這個儲存層級，後續再次需要未快取分區時通常如何取得？","options":["依相依關係重新計算未快取分區，再提供結果","自動把整個 RDD 轉成資料庫表格後重新查詢","永遠略過未快取分區，直接回傳剩餘資料結果","自動保證全部分區落盤，直接從磁碟取回結果"],"answer":0,"explanation":"MEMORY_ONLY 無法容納的分區不會因此自動成為磁碟快取，通常在需要時重算。若要記憶體不足時使用磁碟，可評估適當的 MEMORY_AND_DISK 等層級；這與運算中可能發生的 spill 是不同概念。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q379","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22203","topicName":"數據處理技術與工具","concept":"Spark 與記憶體運算","difficulty":"hard","question":"Spark 聚合時一個熱門 key 佔大部分資料，少數 task 遠慢於其他 task。執行紀錄顯示資料傾斜，哪項改善最有針對性？","options":["檢查熱門 key 的分布，評估預聚合或分散其工作量","只增加 driver 記憶體，保留現有熱門 key 分區","只延長 task 的逾時時間，保留現有聚合方式","只減少輸出檔案個數，保留聚合階段的資料分布"],"answer":0,"explanation":"熱門 key 可能使聚合工作集中於少數分區。需依運算語意評估預聚合、拆分熱門 key 後再合併或其他傾斜處理；增加 driver 記憶體、延長逾時或改最終輸出檔數，不會直接重分配聚合時的熱門 key 負載。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q380","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22203","topicName":"數據處理技術與工具","concept":"Spark 與記憶體運算","difficulty":"hard","question":"大型 Spark DataFrame 的處理結果超過 driver 記憶體。團隊只需各地區彙總數字與少量預覽，應如何取得？","options":["對完整結果 collect，之後才在 driver 計算彙總","把完整結果轉成本機清單，再篩出需要的地區","把完整結果列印到日誌，再由人工挑選預覽列","在叢集先彙總並限制預覽列數，再取回小型結果"],"answer":3,"explanation":"collect 會把全部結果帶回 driver，可能造成記憶體不足。應在分散式端完成聚合，僅取回可容納的小結果或有限預覽；分散式運算不代表 driver 能容納全資料。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q381","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22203","topicName":"數據處理技術與工具","concept":"Spark 與記憶體運算","difficulty":"hard","question":"Spark 團隊把每個只用一次的中間結果都 cache，之後出現記憶體壓力與較長執行時間。哪項調整較合理？","options":["只增加來源檔案副本，保留所有中間結果快取","依重用成本選擇快取結果，釋放不用的持久化資料","將所有資料 collect 到 driver，取代 executor 快取","一律改用磁碟持久化，省略各結果的重用成本評估"],"answer":1,"explanation":"快取有儲存與管理成本，對只使用一次的結果不一定有利。應依重用頻率、計算成本及記憶體容量選擇持久化，並適時 unpersist；不能假設快取越多就越快。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q382","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22203","topicName":"數據處理技術與工具","concept":"Exactly-once / Idempotency","difficulty":"hard","question":"付款 API 支援冪等鍵。同一付款事件因 consumer 重試可能執行兩次，如何避免重複扣款？","options":["每次重試產生新的請求鍵，讓 API 分別記錄每次扣款","每次重試增加請求間隔，讓 API 有時間完成前次扣款","同一付款沿用相同冪等鍵，讓 API 辨識已完成的扣款","同一付款更換 consumer，讓不同程序各自完成扣款"],"answer":2,"explanation":"同一付款的重試應沿用穩定冪等鍵，由支援此機制的付款 API 辨識並返回既有結果。新鍵、延後重試或換程序不會消除重複扣款風險。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q383","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22203","topicName":"數據處理技術與工具","concept":"Exactly-once / Idempotency","difficulty":"hard","question":"事件重送可能重複增加 DB 餘額。若 DB 支援交易與事件 ID 唯一約束，哪種處理能避免重複加值？","options":["先增加餘額再另存事件 ID，兩者各自提交成功","先查事件 ID 再增加餘額，兩者不使用交易協調","同一交易新增事件 ID 並加值，遇重複鍵便不加值","在每次重送時建立新的 ID，再依新 ID 增加餘額"],"answer":2,"explanation":"將事件 ID 的唯一約束與餘額更新放在同一交易中，使去重紀錄和加值一起提交或回滾。分開提交會留下失敗空窗，無交易的先查再寫還有並行競爭風險。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q384","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22203","topicName":"數據處理技術與工具","concept":"Exactly-once / Idempotency","difficulty":"hard","question":"資料管線可能重放同一事件。哪種寫入操作在相同輸入下重複執行，最符合冪等性？","options":["將帳戶累計值加上本次事件的金額","向明細表新增一筆隨機 ID 的資料","以相同事件鍵設定同一筆完整紀錄","將通知計數器加上一次處理的次數"],"answer":2,"explanation":"以相同鍵寫入相同紀錄，重做後最終狀態不再改變，符合冪等性。累加、產生新 ID 的新增或增加計數都會隨重做而改變結果；此處假設寫入不另觸發非冪等副作用。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q385","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22203","topicName":"數據處理技術與工具","concept":"Exactly-once / Idempotency","difficulty":"hard","question":"Kafka 管線將處理結果寫入外部 DB。要評估端到端 exactly-once，為何不能只檢查 broker 的設定？","options":["還需檢查消費進度與 DB 寫入的協調及失敗恢復","還需檢查訊息壓縮比，依壓縮結果判斷交易完成","還需檢查訊息保留期，依保留天數判斷寫入成功","還需檢查分區數量，依分區數量判斷是否重複扣款"],"answer":0,"explanation":"外部 DB 的結果提交與消費進度需協調，否則失敗恢復可能重做或漏做。Kafka 內部的保證不會自動涵蓋任意外部副作用；壓縮、保留期及分區數不能替代此檢查。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q386","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22203","topicName":"數據處理技術與工具","concept":"Exactly-once / Idempotency","difficulty":"hard","question":"訂單聚合服務把 DB 金額加總成功後，尚未提交消費進度就當機。重啟後同一事件再來一次，應如何設計？","options":["持久化去重事件鍵，並與加總在同一交易提交","把去重事件鍵放在記憶體，重啟時重新建立集合","依事件到達的時間排序，再對所有事件重新加總","每次重啟改用新的聚合鍵，再對重送事件進行加總"],"answer":0,"explanation":"可恢復的去重紀錄要持久化，且與加總更新原子提交，才能在重啟後辨識已套用事件。記憶體集合會遺失，排序或換鍵不會消除重複加總。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q387","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22203","topicName":"數據處理技術與工具","concept":"Exactly-once / Idempotency","difficulty":"hard","question":"具冪等寫入能力的 sink 接收相同事件多次。在冪等鍵與有效範圍一致的前提下，它最直接提供何種價值？","options":["讓來源免於重送，降低訊息在網路上出現的次數","讓來源依次送達，維持不同事件的原始時間順序","讓事件自動校正，修復不同事件中的錯誤欄位","讓重複套用不改變結果，降低重試的重複副作用"],"answer":3,"explanation":"冪等 sink 著重同一操作重做後的效果，不能阻止來源重送、保證不同事件順序或修正內容。仍需管理冪等鍵、保存範圍與其他端到端條件。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q388","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22302","topicName":"常見的大數據分析方法","concept":"時間序列切分","difficulty":"hard","question":"零售團隊用一年資料開發隔日銷量模型，需選超參數並保留一次未參與選型的未來表現評估。假設各日期的特徵都在預測當時可得，哪個方案最合適？","options":["隨機抽六成日期訓練、兩成選型，剩下兩成作最終測試","以 1–6 月訓練、10–12 月選型，再以 7–9 月作最終測試","以 1–6 月訓練、7–9 月選型，再以該選型分數作最終評估","以 1–6 月訓練、7–9 月選型，再以 10–12 月作最終測試"],"answer":3,"explanation":"訓練、選型與最終測試依時間向前安排，且不以最終測試資料決定設定，較符合用過去預測未來的目的。隨機切分可能用到較晚資料；先以 10–12 月選型再測 7–9 月引入較晚資訊；將選型分數當最終表現則缺少未參與選型的評估。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q389","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22302","topicName":"常見的大數據分析方法","concept":"時間序列切分","difficulty":"hard","question":"月資料的預測目標是下一個月，且每月結束後才取得當月結果。用 expanding-window 驗證時，第一折以 1–6 月訓練、7 月驗證；下一折應如何安排？","options":["以 2–7 月訓練，再以 8 月資料驗證","以 1–8 月訓練，再以 7 月資料驗證","以 1–6 月訓練，再以 8 月資料驗證","以 1–7 月訓練，再以 8 月資料驗證"],"answer":3,"explanation":"Expanding window 保留原訓練資料，向前推進時加入新近已取得的月份，因此下一折為 1–7 月訓練、8 月驗證。2–7 月屬固定長度滑動窗口；用到 8 月再驗證 7 月洩漏未來；固定 1–6 月則未擴展且改變預測距離。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q390","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22302","topicName":"常見的大數據分析方法","concept":"時間序列切分","difficulty":"hard","question":"需求分布近期變動，團隊決定每次只用最近 6 個月資料訓練，再驗證緊接的 1 個月。首折為 1–6 月訓練、7 月驗證，下一折應如何切分？","options":["以 1–7 月訓練，再以 8 月資料驗證","以 2–7 月訓練，再以 8 月資料驗證","以 2–8 月訓練，再以 7 月資料驗證","以 1–6 月訓練，再以 9 月資料驗證"],"answer":1,"explanation":"固定長度 rolling window 向後移動一個月時，移除 1 月並加入已取得的 7 月，以 2–7 月訓練、8 月驗證。1–7 月增加窗口長度；用到 8 月驗證 7 月違反時間順序；跳到 9 月也不符合緊接一個月的要求。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q391","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22302","topicName":"常見的大數據分析方法","concept":"時間序列切分","difficulty":"hard","question":"團隊以 1–6 月訓練、7 月驗證，但先用 1–12 月資料估計缺失值插補的平均數。要模擬 6 月底可建立的模型，應如何修正？","options":["分別以 1–6 月及 7 月均值，處理訓練與驗證資料","以 1–7 月均值統一插補，排除更晚月份的資訊","以 1–6 月估計插補參數，再原樣套用於 7 月資料","以 7–12 月估計插補參數，再統一套用所有月份"],"answer":2,"explanation":"在該驗證折，插補等前處理參數應只從訓練期間估計，再套用於驗證資料。用全年、截至驗證月底或驗證期自身的統計量，都使用了 6 月底尚不可得的分布資訊；後續折應各自重新擬合前處理。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q392","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22302","topicName":"常見的大數據分析方法","concept":"時間序列切分","difficulty":"hard","question":"金融模型在每日 t 收盤時預測接下來 5 個交易日的累積報酬。驗證從第 101 日開始，訓練原點到第 100 日；其中部分訓練標籤要到驗證期才完整。應如何避免此處的洩漏？","options":["保留全部訓練原點，只將驗證日期改為隨機抽樣","保留全部訓練原點，只移除輸入特徵中的日期欄位","依標籤涵蓋區間剔除邊界樣本，確保訓練標籤當時已知","依訓練原點先後排序樣本，仍使用完整的未來報酬標籤"],"answer":2,"explanation":"僅依原點切分不足以保證標籤可用。多日報酬標籤可能跨入驗證期，應依實際預測截止時間及標籤涵蓋區間，剔除邊界樣本或設適當間隔。隨機抽樣、刪日期欄或排序都無法使未來標籤提前可得。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q393","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22302","topicName":"常見的大數據分析方法","concept":"時間序列切分","difficulty":"hard","question":"零售模型在每天開始時預測當日銷量，以過去 7 天的銷量平均作為特徵。資料已依日期切分，以下哪種特徵計算最符合驗證時的資訊可得性？","options":["用當日及前 6 天的實際銷量，計算七日平均","用前 3 天至後 3 天的實際銷量，計算七日平均","用當日所在週全部的實際銷量，計算該週平均","用前 7 天且不含當日的實際銷量，計算七日平均"],"answer":3,"explanation":"當日開始時尚無當日或未來的實際銷量，應使用 t−7 到 t−1 的歷史資料。含當日、置中窗口或整週平均都可能洩漏預測時未知的資訊；依日期切分後仍需檢查特徵計算的時間邊界。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q394","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22303","topicName":"數據可視化工具","concept":"視覺化誠信","difficulty":"medium","question":"兩產品銷售量分別為 100 與 103 件，柱狀圖從 99 件開始畫，使第二根柱高看似第一根的四倍。若要用柱長比較總量，應如何修正？","options":["保留 99 件起點，只把較高的柱子改成較淡顏色","保留 99 件起點，只在較低的柱子加上醒目外框","保留 99 件起點，只將圖表寬度增加為原本兩倍","將數值軸改從零開始，保留件數標籤與一致尺度"],"answer":3,"explanation":"柱長代表數值大小，截去共同基線會誇大比例；從零起畫可如實呈現 100 與 103 的相對量。顏色、外框或寬度不會修正柱長的比例問題；這不是要求所有類型圖表一律從零起畫。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q395","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22303","topicName":"數據可視化工具","concept":"視覺化誠信","difficulty":"medium","question":"部門占比用傾斜的 3D 圓餅圖呈現，前方扇區因透視看起來較大。若要保留占比訊息並減少視覺扭曲，哪項修改最直接？","options":["保留傾斜視角，增加前方扇區的陰影與厚度","保留透視效果，將最大的扇區移到畫面最前方","保留立體造型，只把圖例依部門名稱重新排序","改成平面條形圖，以共同尺度標示各部門占比"],"answer":3,"explanation":"平面條形圖以共同基線及長度比較占比，可避免 3D 透視造成的面積判斷偏差。陰影、旋轉或重排圖例不會消除透視；平面圓餅圖在適當情境下也可使用。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q396","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22303","topicName":"數據可視化工具","concept":"視覺化誠信","difficulty":"medium","question":"氣泡圖以圓的面積代表人數。B 組人數為 A 組的四倍，若 A 的半徑為 10，B 的半徑應設為多少才符合比例？","options":["20，讓半徑平方後的面積成為四倍","40，讓半徑本身直接成為人數的四倍","80，讓直徑數值乘上人數的四倍","10，讓所有群組保留相同的圓形大小"],"answer":0,"explanation":"圓面積與半徑平方成正比，半徑應為 10×√4＝20。若把半徑放大四倍，面積會放大十六倍，誇大差距；應清楚標示面積編碼及圖例。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q397","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22303","topicName":"數據可視化工具","concept":"視覺化誠信","difficulty":"medium","question":"兩張等高小圖並排比較兩季的營收水準，第一張軸範圍 0–100，第二張 0–1,000，卻未提示尺度不同。若目的是直接比較柱高，應怎麼處理？","options":["各自縮放到填滿圖框，讓每張圖的最高柱一樣高","各自隱藏數值軸標籤，避免讀者注意尺度差異","使用相同單位與軸範圍，再保留清楚的期間標示","將第二張的柱子加寬，藉此補償兩張圖的軸差"],"answer":2,"explanation":"直接比較柱高需要相同單位與尺度，否則相同高度可能代表差十倍的值。獨立尺度可用於其他分析目的，但必須明示且不能引導讀者把柱高當作可直接比較的總量。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q398","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22303","topicName":"數據可視化工具","concept":"視覺化誠信","difficulty":"medium","question":"年度營收圖漏掉虧損最嚴重的一季，只連接其他季的數值並標成「全年持續改善」。若要忠實呈現全年趨勢，應如何修正？","options":["保留省略的季度，改用更平滑的曲線連接其他點","補回完整期間資料，對缺值或排除理由明確註記","保留改善標題，僅把資料來源字體縮小移到角落","只挑最高與最低兩個觀測值，取代原本全年資料"],"answer":1,"explanation":"呈現全年趨勢應保留完整期間及一致口徑，不應挑選有利時間點。若確有缺值或合理排除，須註明且避免用連線暗示已觀測的連續趨勢；平滑或修改裝飾不能修正選樣偏差。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q399","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22303","topicName":"數據可視化工具","concept":"視覺化誠信","difficulty":"medium","question":"兩組調查比例分別為 51% 與 49%，圖表只畫點估計就宣稱存在可靠差異。讀者要判斷估計精度，最應補充什麼？","options":["加大兩組配色差異，讓接近的點更容易被區分","增加百分比的小數位數，讓估計值看起來更精細","只顯示兩組的排名順序，省略差距大小與誤差","提供樣本與估計方法，並呈現定義清楚的區間"],"answer":3,"explanation":"點估計差異不等於已有可靠差異證據。應提供樣本、估計方法及適當的不確定性區間，並使用符合設計的比較方法；僅由兩個區間是否重疊也不宜一概判定顯著性。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q400","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22404","topicName":"大數據隱私保護、安全與合規","concept":"K-anonymity 與差分隱私","difficulty":"hard","question":"每人一列的釋出表，以年齡區間與地區作為全部準識別欄位，分組後人數為 4、7、9。只就這些欄位而言，表格可達到的最大 k 是多少？","options":["4，由最小準識別等價群的人數決定","7，由各等價群人數的中位數決定","9，由最大準識別等價群的人數決定","20，由釋出表格的總人數直接決定"],"answer":0,"explanation":"k-anonymity 要求每個準識別組合至少對應 k 筆紀錄，因此最大可達 k 為最小群的人數 4。這取決於選定的準識別欄位及每人一列假設，不代表所有敏感屬性推斷都被阻止。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q401","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22404","topicName":"大數據隱私保護、安全與合規","concept":"K-anonymity 與差分隱私","difficulty":"hard","question":"分析服務聲稱提供個體層級差分隱私，鄰接資料集定義為增減一人的所有紀錄。這項保證主要約束什麼？","options":["相鄰資料集經隨機機制後，輸出事件的機率差異","相鄰資料集的每筆明文內容，必須變成相同字串","每次查詢的實際輸出值，必須與上次完全相同","每個準識別群組的人數，必須與總樣本數相同"],"answer":0,"explanation":"差分隱私限制鄰接資料集下各輸出事件的機率關係，以 ε（以及適用時的 δ）量化。它不是要求輸出完全相同，也不是 k-anonymity 的群組大小條件；個體保護範圍必須由鄰接定義說清楚。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q402","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22404","topicName":"大數據隱私保護、安全與合規","concept":"K-anonymity 與差分隱私","difficulty":"hard","question":"固定相同鄰接定義與計數查詢，使用 Laplace 機制且敏感度不變。把 ε 從 1 降為 0.5，對噪聲尺度與隱私約束有何影響？","options":["噪聲尺度加倍，隱私約束更嚴格","噪聲尺度減半，隱私約束更嚴格","噪聲尺度不變，隱私約束更寬鬆","噪聲尺度加倍，隱私約束更寬鬆"],"answer":0,"explanation":"Laplace 機制的尺度為敏感度／ε；敏感度固定時 ε 減半，尺度加倍。較小 ε 對機率比施加更嚴格的隱私約束，通常付出較多噪聲的代價；不能脫離機制與假設直接比較效用。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q403","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22404","topicName":"大數據隱私保護、安全與合規","concept":"K-anonymity 與差分隱私","difficulty":"hard","question":"某釋出表達到 5-anonymity，但某個五人準識別群的敏感屬性全是同一值。已知某人屬於該群，仍可能洩漏什麼？","options":["只能推得該人的敏感值機率為五分之一，無法再提高","只能推得該人屬於五人之一，敏感屬性仍被完整隱藏","可推得該人的敏感屬性，即使無法區分五筆身分","可直接區分五筆各自的身分，因敏感值相同可作連結"],"answer":2,"explanation":"這是同質性造成的屬性洩漏：無法唯一辨識群內哪一列，仍可能因整群屬性相同而推得敏感值。k-anonymity 並不保證敏感屬性多樣性，也不會憑空揭露表格與背景資料中沒有的資訊。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q404","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22404","topicName":"大數據隱私保護、安全與合規","concept":"K-anonymity 與差分隱私","difficulty":"hard","question":"同一資料集依序發布三個各自滿足 ε＝0.2 的純差分隱私結果。若使用基本循序組合定理，整體 ε 的保證上界是多少？","options":["0.2，只取其中最大的單次 ε 值","0.008，將三個單次 ε 相乘","0.6，將三個單次 ε 相加","0.0，因每次查詢都加入噪聲"],"answer":2,"explanation":"基本循序組合提供 ε 總和的上界：0.2＋0.2＋0.2＝0.6。對同一批人的多次發布需累計隱私預算；此上界不一定是所有機制可得到的最緊界，也不是互斥人群的平行組合情境。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q405","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22404","topicName":"大數據隱私保護、安全與合規","concept":"K-anonymity 與差分隱私","difficulty":"hard","question":"系統對每列事件加噪並宣稱「保護每個使用者」，但一位使用者可能貢獻數千列。評估這項宣稱時，應優先確認什麼？","options":["輸出檔案是否改名，避免保留原始事件的日期","事件資料是否排序，避免同一人的紀錄相鄰","查詢介面是否隱藏姓名，避免顯示使用者標籤","鄰接定義與貢獻界限，是否涵蓋一人的全部紀錄"],"answer":3,"explanation":"逐列保護不自動等同個體層級保護。需明確定義一人增減所涉及的紀錄，限制或處理個體貢獻並據此校準敏感度與機制；移除姓名、排序或改檔名不能建立所宣稱的差分隱私保證。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q406","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23101","topicName":"機率／統計之機器學習基礎應用","concept":"Conditional Probability","difficulty":"medium","question":"平台共有 1,000 位使用者，其中 200 人屬於付費方案，這 200 人中有 30 人流失。以這組頻數估計 P(流失｜付費)，應計算哪個比例？","options":["30／200，以付費使用者為分母","200／30，以流失付費者為分母","30／全體人數，以全部使用者為分母","200／全體人數，以全部使用者為分母"],"answer":0,"explanation":"條件為付費方案，分母應限制在 200 位付費使用者；其中 30 位流失，條件機率估計為 0.15。全體分母得到不同的機率。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q407","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23101","topicName":"機率／統計之機器學習基礎應用","concept":"Conditional Probability","difficulty":"medium","question":"A 表示詐欺、B 表示海外交易，且 P(B)>0。P(A｜B) 表示哪個方向的機率？","options":["已知交易是海外交易後，該交易為詐欺的機率","已知交易已被判為詐欺後，該交易為海外的機率","隨機選到一筆交易後，該交易同時為海外及詐欺的機率","隨機選到一筆交易後，該交易為海外或詐欺的機率"],"answer":0,"explanation":"P(A｜B) 以 B 為已知條件，詢問 A 的機率。反向條件機率、聯合機率與聯集機率回答的是不同問題。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q408","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23101","topicName":"機率／統計之機器學習基礎應用","concept":"Conditional Probability","difficulty":"medium","question":"已知 P(A∩B)=0.12、P(B)=0.30。依條件機率定義，P(A｜B) 為何？","options":["0.036，將聯合機率乘上條件事件機率","0.18，將條件事件機率減去聯合機率","0.42，將條件事件機率加上聯合機率","0.40，將聯合機率除以條件事件機率"],"answer":3,"explanation":"P(A｜B)=P(A∩B)/P(B)=0.12/0.30=0.40，前提是 P(B)>0。乘法、加法或相減都不符合此定義。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q409","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23101","topicName":"機率／統計之機器學習基礎應用","concept":"Conditional Probability","difficulty":"medium","question":"A 與 B 獨立，P(A)=0.20、P(B)=0.50。已知 B 發生後，P(A｜B) 為何？","options":["0.20，獨立使條件機率等於 A 的邊際機率","0.10，獨立使條件機率等於兩機率的乘積","0.50，獨立使條件機率等於 B 的邊際機率","0.40，獨立使條件機率等於兩機率的比值"],"answer":0,"explanation":"獨立且 P(B)>0 時，P(A｜B)=P(A)=0.20。0.10 是聯合機率，並非條件機率；條件機率也不等於條件事件本身的機率。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q410","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23101","topicName":"機率／統計之機器學習基礎應用","concept":"Conditional Probability","difficulty":"medium","question":"檢測評估資料中，100 人為陽性，其中 20 人實際患病。以這組頻數估計「陽性後實際患病」的機率，應計算？","options":["20／實際患病總人數，估計患病後陽性的機率","100／全體受測人數，估計受測後陽性的機率","20／全體受測人數，估計同時陽性及患病的機率","20／100，以陽性者為分母估計其患病機率"],"answer":3,"explanation":"詢問已知陽性後患病，分母是陽性者的 100 人，因此估計為 20%。以實際患病者為分母則是反向條件機率；此題為抽樣資料的機率估計，不是個人診斷。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q411","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23101","topicName":"機率／統計之機器學習基礎應用","concept":"Conditional Probability","difficulty":"medium","question":"若 P(B)>0，下列哪個關係式正確連結聯合機率與條件機率？","options":["P(A∩B)=P(A｜B)×P(B)","P(A∩B)=P(A｜B)×P(A)","P(A∩B)=P(A｜B)／P(B)","P(A∩B)=P(A｜B)＋P(B)"],"answer":0,"explanation":"將 P(A｜B)=P(A∩B)/P(B) 移項，可得 P(A∩B)=P(A｜B)P(B)。此關係不要求 A、B 獨立，分母及乘回的項應是條件事件 B。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q412","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23102","topicName":"線性代數之機器學習基礎應用","concept":"Dot Product / Cosine","difficulty":"medium","question":"在同一向量空間比較兩個非零向量，目標是只比較方向，且不受任一向量乘上正數的影響。哪種分數符合這項需求？","options":["原始內積，以各座標乘積的總和作為分數","歐氏距離，以各座標差的平方和開根號","餘弦相似度，以內積除以兩向量範數乘積","範數乘積，以兩向量的長度相乘作為分數"],"answer":2,"explanation":"餘弦相似度為內積除以範數乘積，對非零向量的正倍數縮放不變。原始內積、歐氏距離及範數乘積一般會受大小影響；方向相似也不保證語意或任務結果一定正確。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q413","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23102","topicName":"線性代數之機器學習基礎應用","concept":"Dot Product / Cosine","difficulty":"medium","question":"線性層的一個輸出為 w·x＋b，其中 w＝(2,−1)、x＝(3,4)、b＝1。這個輸出值是多少？","options":["11，將兩項乘積都視為正值再加偏置","9，將各座標與偏置直接相加而未相乘","3，將相同位置的元素相乘求和再加偏置","2，只計算元素乘積總和而未加入偏置"],"answer":2,"explanation":"w·x＝2×3＋(−1)×4＝2，再加偏置 1 得 3。內積需保留符號並對齊座標；此處沒有再除以向量範數，也不是先逐項相加。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q414","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23102","topicName":"線性代數之機器學習基礎應用","concept":"Dot Product / Cosine","difficulty":"medium","question":"兩個非零向量皆已做 L2 正規化，範數各為 1；它們的內積為 0.6。餘弦相似度為多少？","options":["0.6，因分母的兩個範數乘積為 1","0.3，因分母需改成兩個範數相加","0.36，因正規化後還要把內積平方","1.0，因單位向量之間必定方向相同"],"answer":0,"explanation":"Cosine＝dot／(norms)＝0.6／(1×1)＝0.6。單位長度不表示方向相同；正規化後的內積已等於 cosine，不需另除以 2 或平方。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q415","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23102","topicName":"線性代數之機器學習基礎應用","concept":"Dot Product / Cosine","difficulty":"medium","question":"保持非零向量 b 不變，把非零向量 a 改成 3a。比較原本與修改後的內積及餘弦相似度，哪項正確？","options":["內積不變，餘弦相似度變為原本三倍","內積變為原本三倍，餘弦相似度不變","內積與餘弦相似度都變為原本三倍","內積與餘弦相似度都不受此次縮放影響"],"answer":1,"explanation":"(3a)·b＝3(a·b)，而 ||3a||＝3||a||，因此 cosine 的分子與分母同倍放大而相消。這裡是正倍數縮放；負倍數會翻轉方向與 cosine 的符號。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q416","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23102","topicName":"線性代數之機器學習基礎應用","concept":"Dot Product / Cosine","difficulty":"medium","question":"兩個非零向量滿足 b＝−2a，且座標位於同一向量空間。它們的餘弦相似度是多少？","options":["1，因兩個向量位於同一直線上","−1，因兩個向量方向完全相反","0，因一個向量含有負的比例係數","−2，因相似度等於兩向量的比例"],"answer":1,"explanation":"負比例係數表示方向相反，cosine＝−1。共線不一定同向；cosine 在 −1 到 1 之間，不會等於縮放倍率 −2。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q417","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23102","topicName":"線性代數之機器學習基礎應用","concept":"Dot Product / Cosine","difficulty":"medium","question":"查詢 q＝(1,0)，候選 a＝(2,0)、b＝(3,4)。只比較這兩個候選，使用原始內積與餘弦相似度的 Top-1 各是誰？","options":["內積選 a，餘弦選 b，因兩者使用不同分母","內積選 b，餘弦選 a，因範數影響原始內積","兩者都選 b，因 b 的第一個座標比較大","兩者都選 a，因 a 與查詢的方向完全相同"],"answer":1,"explanation":"q·a＝2、q·b＝3，因此原始內積選 b。cos(q,a)＝1、cos(q,b)＝3/5＝0.6，因此 cosine 選 a。是否保留向量大小資訊應配合模型與檢索目標，不能認定兩種排序永遠相同。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q418","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23103","topicName":"數值優化技術與方法","concept":"Learning Rate","difficulty":"medium","question":"同一訓練設定把學習率提高後，loss 開始大幅震盪。資料及梯度計算已檢查無明顯異常，下一個最直接的對照實驗是？","options":["降低學習率重跑，保持其他設定不變比較曲線","加大學習率重跑，藉較大步幅跳過震盪區域","沿用目前學習率，只延長訓練而不比較步幅","只增加驗證頻率，保持目前更新步幅繼續訓練"],"answer":0,"explanation":"過大步幅可能在低損失區附近反覆跨越或發散，降低學習率的受控實驗可檢查此原因。震盪並非只可能來自學習率，仍需結合梯度、資料及優化器診斷；只延長訓練或增加驗證頻率沒有對照步幅因素。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q419","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23103","topicName":"數值優化技術與方法","concept":"Learning Rate","difficulty":"medium","question":"使用無動量、無正則化的梯度下降，w＝2、梯度為 4、學習率 η＝0.1。依 w_new＝w−ηg 更新一次後，w_new 是多少？","options":["2.4，沿正梯度方向加上更新量","1.6，沿負梯度方向減去更新量","0.4，只保留學習率與梯度乘積","−2.0，直接減去梯度而忽略步幅"],"answer":1,"explanation":"更新量為 0.1×4＝0.4，w_new＝2−0.4＝1.6。題目明定一般梯度下降，沒有動量、正則化或自適應縮放，因此可直接使用給定公式。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q420","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23103","topicName":"數值優化技術與方法","concept":"Learning Rate","difficulty":"medium","question":"同一參數位置、同一非零梯度，使用無動量的 SGD；其他設定不變，學習率由 0.01 改成 0.001。單次更新量的大小如何變化？","options":["變為原本十倍，因較小學習率增加更新幅度","保持原本大小，因梯度相同就會有相同更新","方向改為相反，因學習率跨過小數點門檻","變為原本十分之一，因步幅與學習率成正比"],"answer":3,"explanation":"在給定梯度且無其他修正時，更新量為 −ηg；正學習率縮為十分之一，大小也縮為十分之一而方向不變。這只比較同一位置的單步，不能推出整段訓練一定耗時十倍。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q421","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23103","topicName":"數值優化技術與方法","concept":"Learning Rate","difficulty":"medium","question":"訓練前期需要較快移動，後期希望減小參數更新以細調。學習率排程逐步降低 η，主要是在調整什麼？","options":["逐步減少模型的可訓練參數數量","逐步減少訓練資料中使用的特徵數量","逐步縮小給定梯度下的更新步幅","逐步縮小每筆輸入資料的儲存大小"],"answer":2,"explanation":"降低學習率是在控制優化步幅，不會自動刪除模型參數、輸入特徵或壓縮資料。後期較小步幅可能有助細調，但仍需用實際訓練與驗證曲線判斷排程是否合適。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q422","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23103","topicName":"數值優化技術與方法","concept":"Learning Rate","difficulty":"medium","question":"團隊要從四個候選學習率中選一個，已有固定訓練／驗證／測試切分。哪種比較流程較能避免用測試集調參？","options":["固定比較條件，以驗證表現選擇，再用保留測試集評估","固定比較條件，以測試表現選擇，再回報同一測試分數","只比較訓練第一步的 loss，選最低者作為最終設定","只比較學習率數值大小，選最大者縮短調參流程"],"answer":0,"explanation":"學習率屬超參數，可在可比較訓練預算及資料切分下用驗證集選擇，保留測試集供最後評估。用測試分數反覆挑設定會洩漏評估資訊；單一步 loss 或數值大小不足以決定泛化表現。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q423","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23103","topicName":"數值優化技術與方法","concept":"Learning Rate","difficulty":"medium","question":"對 f(w)＝w²/2 使用完整梯度下降，固定 η＝3、初值 w＝1。由梯度 g＝w 可得 w_new＝(1−η)w。持續更新將如何變化？","options":["保持正號並縮小，逐步靠近零點","正負交替且縮小，逐步靠近零點","維持原值不動，因初始梯度為零","正負交替且放大，逐步遠離零點"],"answer":3,"explanation":"更新倍率為 1−3＝−2，序列為 1、−2、4、−8，正負交替且絕對值放大。這個明確二次函數例子展示過大学習率的發散，不是宣稱 η＝3 對所有模型都必然發散。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q424","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23201","topicName":"機器學習原理與技術","concept":"L1 / L2 正則化","difficulty":"hard","question":"線性迴歸模型已對特徵標準化，團隊希望在控制過擬合時，讓部分係數恰為 0 以利特徵選擇。下列哪個正則化方案最符合這個目標？","options":["採 L2 懲罰係數平方和，以權重縮減產生稀疏解","採 L1 懲罰殘差絕對值和，以預測誤差篩除特徵","採 L1 懲罰係數絕對值和，以稀疏權重篩選特徵","採 L2 懲罰係數絕對值和，以限制權重選出特徵"],"answer":2,"explanation":"L1 正則化懲罰係數絕對值和，可使部分係數恰為 0；是否產生稀疏解仍取決於資料與懲罰強度。L2 懲罰係數平方和，通常縮小係數而不直接產生稀疏解。殘差絕對值和屬於資料擬合損失，不是係數的 L1 懲罰；把係數絕對值和稱為 L2 也不正確。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q425","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23201","topicName":"機器學習原理與技術","concept":"L1 / L2 正則化","difficulty":"hard","question":"目標函數為資料損失＋(λ/2)Σw_i²，採無動量的一般梯度下降，步長 η。資料損失梯度記為 g，更新式應是哪一個？","options":["w_new＝w−ηg−λw，忽略懲罰項的步長縮放","w_new＝w−ηg＋ηλw，沿增加權重方向更新","w_new＝w−ηg−ηλ sign(w)，使用絕對值懲罰梯度","w_new＝w−ηg−ηλw，加入平方懲罰的梯度"],"answer":3,"explanation":"(λ/2)Σw_i² 對 w 的梯度為 λw，因此更新為 (1−ηλ)w−ηg。此等價形式限於題目指定的一般梯度下降；不能直接將自適應優化器的 L2 懲罰與解耦 weight decay 一概視為相同。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q426","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23201","topicName":"機器學習原理與技術","concept":"L1 / L2 正則化","difficulty":"hard","question":"只計算正則化項，權重 w＝(−2,3)，係數 λ＝1，且 L2 定義為平方和、沒有 1/2 因子。L1 與 L2 的值分別為何？","options":["L1＝1、L2＝13，先把帶符號的係數相加","L1＝5、L2＝5，兩者都計算係數絕對值和","L1＝13、L2＝5，將兩種懲罰的公式互換","L1＝5、L2＝13，分別計算絕對值和及平方和"],"answer":3,"explanation":"L1＝|−2|＋|3|＝5；L2 平方懲罰＝(−2)²＋3²＝13。題目明定平方和與係數，避免不同慣例的 1/2 因子或 L2 範數開根號造成歧義。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q427","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23201","topicName":"機器學習原理與技術","concept":"L1 / L2 正則化","difficulty":"hard","question":"特徵已標準化。增加正則化強度後，訓練資料損失略升、驗證資料損失下降；兩者都未含懲罰項。哪個解讀最合理？","options":["限制擬合程度可能減少過擬合，仍應以驗證證據判斷","訓練資料損失上升就代表失敗，無須檢查驗證結果","驗證資料損失下降表示資料被刪除，須先還原樣本","正則化強度愈高泛化必愈好，應持續加大到上限"],"answer":0,"explanation":"正則化可能犧牲部分訓練擬合以降低變異並改善泛化，但不是越強越好，也可能欠擬合。此處比較的是同一定義的資料損失，不應將含懲罰的總目標與純資料損失混為一談。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q428","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23201","topicName":"機器學習原理與技術","concept":"L1 / L2 正則化","difficulty":"hard","question":"同一個線性預測模型把長度特徵由公尺改成公分，對應係數可縮小 100 倍而預測不變。若仍直接套相同 L2 係數懲罰，主要問題是？","options":["預測不變，所以正則化成本也必定保持不變","樣本數沒有改變，所以所有懲罰都會自行抵銷","係數縮小後，L2 對該係數的懲罰會變為一萬倍","單位改變會改變懲罰成本，需處理特徵尺度差異"],"answer":3,"explanation":"係數縮小 100 倍後，其平方懲罰縮為萬分之一，雖然預測可相同，正則化成本卻不同。因此常先標準化或依需求處理尺度；轉換參數應僅由訓練資料估計，不能用完整資料洩漏驗證資訊。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q429","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23201","topicName":"機器學習原理與技術","concept":"L1 / L2 正則化","difficulty":"hard","question":"一個參數的 L1 子問題為最小化 (w−0.3)²/2＋0.5|w|。依軟閾值解 sign(z)max(|z|−λ,0)，最優 w 是多少？","options":["0.3，保留沒有正則化時的解","−0.2，直接減 λ 而略過零門檻","0，因 |0.3| 未超過閾值 0.5","0.8，將 λ 加回資料擬合的解"],"answer":2,"explanation":"代入 z＝0.3、λ＝0.5，max(0.3−0.5,0)＝0，所以最優 w＝0。這說明 L1 可以產生恰為零的係數；並非所有資料或任意懲罰強度都會把所有係數歸零。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q430","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23202","topicName":"常見機器學習演算法","concept":"SVM Kernel","difficulty":"hard","question":"兩類資料呈同心圓分布，線性 SVM 即使調整 C 仍明顯欠擬合。若不手動展開非線性特徵，哪個改動能讓模型表達原空間中的非線性邊界？","options":["保留線性 kernel 並提高 C，增加違反間隔的懲罰","保留線性 kernel 並平移特徵，改變各欄位的中心","改用 RBF kernel 建模，再驗證 C 與 gamma 的設定","保留線性 kernel 並調整閾值，改變正類判定門檻"],"answer":2,"explanation":"RBF kernel 可讓 SVM 表達原空間的非線性決策邊界，是否改善仍須驗證。提高 C 只改變懲罰強度；平移原特徵或調整線性分數的判定閾值，仍無法讓單一線性邊界分隔同心圓。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q431","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23202","topicName":"常見機器學習演算法","concept":"SVM Kernel","difficulty":"hard","question":"某特徵映射 φ(x) 的維度很高，但可直接計算 K(x,z)=φ(x)·φ(z)。SVM 使用 kernel trick 時，主要如何利用這個性質？","options":["以 K(x,z) 取代兩筆樣本的類別標籤，再重新標註訓練集","以 K(x,z) 排列樣本的出現順序，再沿用原始特徵做內積","以 K(x,z) 作為單一新輸入欄位，再捨棄原有的樣本關係","以 K(x,z) 取代映射後的內積，免逐一展開 φ 的各個分量"],"answer":3,"explanation":"當演算法可由樣本間內積表示時，可用 kernel 值取得映射後的內積，而不顯式列出高維特徵。Kernel 不取代類別標籤，也不是只用來排列資料或產生一個脫離樣本配對關係的新欄位。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q432","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23202","topicName":"常見機器學習演算法","concept":"SVM Kernel","difficulty":"hard","question":"RBF kernel 為 K(x,z)=exp(−gamma×||x−z||²)。保持資料尺度與 C 不變，對兩個距離大於 0 的固定樣本提高 gamma，會發生哪項變化？","options":["兩者的 kernel 值上升，單一樣本的影響範圍變廣","兩者的 kernel 值不變，只有違反間隔的懲罰增加","兩者的 kernel 值下降，單一樣本的影響範圍變窄","兩者的 kernel 值下降，特徵空間的維度隨之減少"],"answer":2,"explanation":"距離固定且大於 0 時，提高 gamma 會使指數更負、kernel 值更小，對應較局部的影響範圍。C 才控制違反間隔的懲罰；gamma 並不是直接設定特徵空間維度。過大的 gamma 可能使邊界過度局部化。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q433","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23202","topicName":"常見機器學習演算法","concept":"SVM Kernel","difficulty":"hard","question":"RBF SVM 的兩項數值特徵分別以數十與數萬為常見尺度，且兩者都有預測意義。訓練前標準化特徵的主要理由是？","options":["使每個欄位與目標類別的相關程度變得相同","使原本無法線性分隔的資料轉為線性可分","使每個樣本在決策函數中的權重變得相等","減少數值尺度差異對距離及 kernel 值的支配"],"answer":3,"explanation":"RBF kernel 依賴特徵間的平方距離，數值尺度大的欄位可能主導距離。標準化可減少單位與尺度的影響，但不保證各特徵同樣重要、資料線性可分或樣本權重相等；縮放參數須只由訓練資料估計。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q434","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23202","topicName":"常見機器學習演算法","concept":"SVM Kernel","difficulty":"hard","question":"團隊要比較 RBF SVM 的多組 C、gamma，已保留獨立最終測試集。採交叉驗證選型並需要標準化時，哪個流程較能避免評估資料洩漏？","options":["先在全部開發資料擬合標準化，再切各折比較參數","先在開發與測試資料擬合標準化，再用各折選參數","先在每個驗證折獨立擬合標準化，再轉換該折資料","先在每個訓練折擬合標準化，再轉換對應驗證折"],"answer":3,"explanation":"每個交叉驗證訓練折應獨立擬合標準化與模型，再用同一轉換處理對應驗證折。用全部開發資料、測試資料或驗證折自身估計縮放參數，都使用了該折訓練時不應取得的資訊。C、gamma 選定後才進行最終獨立測試。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q435","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23202","topicName":"常見機器學習演算法","concept":"SVM Kernel","difficulty":"hard","question":"在標準 soft-margin RBF SVM 中固定 gamma 與資料尺度，將 C 調大，最直接改變目標函數中的哪項取捨？","options":["加重違反間隔的損失，相對減弱對較大間隔的偏好","加快 kernel 隨距離衰減，相對縮小樣本的影響範圍","降低違反間隔的損失，相對加強對較大間隔的偏好","增加 kernel 的多項式次數，相對提高邊界的階數"],"answer":0,"explanation":"標準 soft-margin SVM 以 C 加權違反間隔的損失。提高 C 使模型更重視降低這項損失，與維持大間隔形成取捨；不保證驗證表現改善。距離衰減由 RBF 的 gamma 控制，而 RBF 並沒有多項式次數這個參數。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q436","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23202","topicName":"常見機器學習演算法","concept":"Gradient Boosting","difficulty":"hard","question":"典型梯度提升樹每輪新增一棵樹。新樹的學習目標與目前集成模型有何關係？","options":["各輪重複學習原始標籤，再對獨立模型取平均","各輪依目前損失的梯度，學習改善預測的方向","各輪重新訓練獨立模型，再以模型間投票決定輸出","各輪選出單棵最佳的樹，再以該樹取代全部集成"],"answer":1,"explanation":"梯度提升逐輪依當前模型損失的負梯度方向擬合新學習器。平方誤差時此目標對應殘差；獨立訓練後平均、投票或挑選單棵樹都不同於這種逐輪修正。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q437","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23202","topicName":"常見機器學習演算法","concept":"Gradient Boosting","difficulty":"hard","question":"比較典型 Random Forest 與 Gradient Boosting 的樹訓練關係，哪項描述正確？","options":["兩者的新樹都先修正前輪殘差，再把所有樹取平均","兩者的新樹都獨立學習原始標籤，再把所有樹相加","前者各樹可獨立訓練；後者新樹依集成結果學習","前者新樹依前輪結果；後者各樹可獨立平行訓練"],"answer":2,"explanation":"Random Forest 各樹通常在重抽樣及隨機特徵下獨立訓練，再平均或投票。Gradient Boosting 的新增學習器依賴目前集成預測的損失資訊。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q438","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23202","topicName":"常見機器學習演算法","concept":"Gradient Boosting","difficulty":"hard","question":"以平方誤差訓練梯度提升迴歸。某筆資料真值為 10，目前預測為 7，以 y−F(x) 定義殘差。新樹的該筆殘差目標為何？","options":["3，真值減去目前集成的預測","-3，目前集成的預測減去真值","7，沿用目前集成的預測數值","10，沿用該筆資料的原始真值"],"answer":0,"explanation":"殘差 y−F(x)=10−7=3。平方誤差梯度提升以殘差作為下一輪學習訊號，並非每輪直接重學原始真值；符號反轉會改變修正方向。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q439","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23202","topicName":"常見機器學習演算法","concept":"Gradient Boosting","difficulty":"hard","question":"梯度提升的某輪迴歸更新為 F_new(x)=F_old(x)+ηh(x)。若原預測為 7、η=0.1、新樹輸出為 3，更新後為何？","options":["0.3，只保留學習率乘上新樹輸出的數值","7.1，把學習率直接加到原本預測的數值","10.0，把新樹完整輸出加到原本預測的數值","7.3，把縮放後的新樹輸出加到原本預測"],"answer":3,"explanation":"依題設更新式為 7+0.1×3=7.3。新樹逐步修正既有預測，學習率縮放其貢獻；不能只取修正量或省略縮放。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q440","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23202","topicName":"常見機器學習演算法","concept":"Gradient Boosting","difficulty":"hard","question":"一般梯度提升適用可微分的損失。相較平方誤差的殘差擬合，其他損失的下一輪學習訊號應如何取得？","options":["依目前預測計算損失的負梯度，作為修正訊號","依原始標籤設定每輪目標，不使用目前模型的預測","依 y−F(x) 設定每輪目標，所有損失都用相同殘差","依前輪單棵樹的預測值，直接作為本輪學習目標"],"answer":0,"explanation":"梯度提升利用損失對目前預測的負梯度，也稱偽殘差。平方誤差下可對應 y−F(x)，其他損失不一定使用同樣的原始殘差形式。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q441","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23202","topicName":"常見機器學習演算法","concept":"Gradient Boosting","difficulty":"hard","question":"訓練梯度提升樹時，在樹數與其他設定不變下減小 learning rate，最直接改變什麼？","options":["每棵樹的葉節點數，自動變成原本的固定比例","每輪訓練的樣本數，自動變成原本的固定比例","每筆輸入的特徵數，自動變成原本的固定比例","每棵新樹的預測貢獻，按較小係數加入集成"],"answer":3,"explanation":"Learning rate 主要縮放每輪新學習器的貢獻。較小值常需搭配更多輪數評估效果，但不直接固定樹的葉數、樣本數或輸入特徵數。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q442","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23203","topicName":"深度學習原理與框架","concept":"RNN / LSTM","difficulty":"medium","question":"單向 RNN 逐步讀入時間序列，更新式為 h_t＝tanh(Wx_t＋Uh_(t−1)＋b)。哪個項目讓目前狀態可以利用先前資訊？","options":["前一步的 h_(t−1)，經循環權重參與更新","目前的 x_t，單獨包含所有未來時間步","固定的偏置 b，每一步自動保存完整歷史","輸出層的類別數，決定已觀測資料的內容"],"answer":0,"explanation":"h_(t−1) 將先前處理的資訊帶入目前狀態，與當下輸入一起更新。它是學得的有限表示，不是保證保存完整歷史；單向模型也不會因這個式子取得尚未觀測的未來輸入。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q443","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23203","topicName":"深度學習原理與框架","concept":"RNN / LSTM","difficulty":"medium","question":"標準 LSTM 的 cell 更新為 c_t＝f_t⊙c_(t−1)＋i_t⊙g_t。若某維度 f_t 接近 0，對該維度舊 cell 資訊的直接作用為何？","options":["增加舊資訊權重，讓前一刻內容保留更多","減少舊資訊權重，讓前一刻內容保留更少","直接決定最終類別，不再經過後續輸出層","把舊資訊變成新輸入，停止更新 cell 狀態"],"answer":1,"explanation":"forget gate f_t 直接乘上前一刻 cell 狀態，接近 0 時抑制這條路徑的舊資訊。新內容仍由 i_t⊙g_t 決定；forget gate 本身不是分類輸出。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q444","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23203","topicName":"深度學習原理與框架","concept":"RNN / LSTM","difficulty":"medium","question":"某單向、單層 RNN 使用同一組循環權重處理每個時間步，輸入及 hidden 維度固定。序列長度從 10 增為 20，參數數量通常如何變化？","options":["循環權重增為兩倍，因時間步數變為兩倍","輸入權重增為兩倍，因同一特徵被讀取兩次","偏置數量增為兩倍，因每一步需要獨立偏置","可訓練參數不變，因時間步共用同一組權重"],"answer":3,"explanation":"一般 RNN 沿時間共享參數；序列加長增加展開計算及訓練時需處理的狀態，不會在固定架構下自動新增一組可訓練權重。參數量不變不代表運算或記憶體需求不變。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q445","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23203","topicName":"深度學習原理與框架","concept":"RNN / LSTM","difficulty":"medium","question":"stateful LSTM 的兩批資料來自互不相關的客戶，卻把前一批最終狀態接到下一批。若每位客戶的序列應獨立，應如何處理？","options":["在客戶序列邊界重設狀態，避免混入他人歷史","只打亂下一批客戶順序，繼續沿用前批狀態","只把 hidden 維度加倍，繼續沿用前批狀態","只調低輸出分數門檻，讓混入的資訊較難顯示"],"answer":0,"explanation":"互不相關序列不應共用前一人的 hidden/cell 狀態，需在正確邊界重設或明確管理狀態。相同序列的連續區段可能需要延續狀態，但仍需確保樣本對應與訓練截斷設定正確。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q446","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23203","topicName":"深度學習原理與框架","concept":"RNN / LSTM","difficulty":"medium","question":"LSTM 以 cell 狀態與閘門改善基本 RNN 的長期依賴學習。對這項改善的能力界限，哪個說法較準確？","options":["提供較易保留資訊的路徑，但不保證任意長度皆可學好","改以較長序列訓練，就足以取代驗證集的效果檢查","可直接關閉梯度監控，讓閘門自動負責穩定梯度","僅訓練最後時間步，讓 cell 取代跨時間反向傳播"],"answer":0,"explanation":"LSTM 的 cell 與閘門有助保留和選擇資訊、緩解部分梯度問題，但並非對所有長度、資料及訓練設定的保證。仍需檢查梯度、序列長度與驗證表現，也仍使用時間上的反向傳播。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q447","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23203","topicName":"深度學習原理與框架","concept":"RNN / LSTM","difficulty":"medium","question":"串流系統必須在時間 t 當下輸出預測，且不能等待未來資料。比較完整序列的雙向 LSTM 與單向 LSTM，哪個設計較符合這項限制？","options":["採雙向模型並讀取完整未來序列，再稱為即時結果","採雙向模型並使用未來真實值，只在測試時補齊","採單向模型只讀到 t，訓練評估也遵守可用資訊","隨機打亂時間順序訓練，讓未來資料不再有順序"],"answer":2,"explanation":"即時因果預測只能使用當下可取得的資料。完整序列的雙向 LSTM 會利用未來上下文，適用於可取得全序列的工作，但不符合本題限制；訓練與評估也需避免未來資訊洩漏。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q448","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23301","topicName":"數據準備與特徵工程","concept":"Target Leakage","difficulty":"hard","question":"急診團隊要在入院決策前預測病人是否住院，歷史資料含本次就醫的「出院結算金額」，且加入後離線分數大增。最直接的問題是？","options":["結算金額在決策後產生，將事後資訊帶入預測","未住院樣本比例偏高，使多數類預測拉高分數","模型參數數量過多，使模型記住訓練樣本雜訊","訓練與驗證來自不同院區，使資料分布有落差"],"answer":0,"explanation":"本次出院結算金額在入院決策時尚不可得，可能間接揭露本次住院結果，形成 Target Leakage。類別不平衡、過度擬合與院區分布差異也是評估時應檢查的問題，但題幹未提供這些證據；已明確指出的缺陷是事後資訊。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q449","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23301","topicName":"數據準備與特徵工程","concept":"Target Leakage","difficulty":"hard","question":"銀行在貸款核准時預測未來一年是否違約。「催收完成日期」只有本次違約後才會出現；歷史資料中的缺值也保留。哪個處理能直接排除此欄位的目標洩漏？","options":["移除此欄及其衍生值，改用核准時已知的資料","改成是否有日期的旗標，以避免模型記住日期","用固定日期補齊缺值，再保留日期作為輸入","將日期轉成距今的天數，以減少不同格式差異"],"answer":0,"explanation":"是否存在催收完成日期本身就可能揭露違約，轉成旗標、天數或補值仍保留結果資訊。此情境應排除該欄及衍生值，以核准時可得資料重建特徵；不是所有歷史催收資料都不能使用。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q450","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23301","topicName":"數據準備與特徵工程","concept":"Target Leakage","difficulty":"hard","question":"銀行在每月一日預測客戶當月是否違約。以下特徵中，哪一項最可能造成 Target Leakage？","options":["截至上月底且已入帳的最近三期還款金額","截至上月底且已確認的既有貸款剩餘本金","當月底結算後回填的本月違約處理進度","每月一日預測前已確認的客戶契約利率"],"answer":2,"explanation":"當月底才結算的本月違約處理進度，在月初預測時不可得，且與當月結果直接相關。其餘三項明定在預測前已確認，不會僅因與目標相關就構成洩漏。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q451","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23301","topicName":"數據準備與特徵工程","concept":"Target Leakage","difficulty":"hard","question":"驗證 AUC 為 0.99，上線卻明顯下降。團隊發現模型使用了結果發生後才產生的欄位。要檢驗這項 Target Leakage 對評估的影響，哪個實驗最合適？","options":["保留該欄並提高正則化，再比較原驗證分數","保留該欄並增加驗證量，再比較原驗證分數","保留該欄並改變分類閾值，再比較上線準確率","排除該欄並依預測時點重建資料，再訓練評估"],"answer":3,"explanation":"應以預測當下可取得的資訊重建特徵並重新訓練評估，才能檢驗移除洩漏後的效能。正則化、增加樣本或調整閾值都未消除事後資訊；AUC 高低本身不能證明其他原因不存在。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q452","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23301","topicName":"數據準備與特徵工程","concept":"Target Leakage","difficulty":"hard","question":"每天上午九點預測當日需求。某筆交易發生於八點五十分，但十點才進入可查詢的特徵系統。回測九點的預測時，應採用哪個時間界線？","options":["以交易發生時間為準，將這筆交易納入特徵","以當日結束時間為準，將這筆交易納入特徵","以回測執行時間為準，將這筆交易納入特徵","以預測可取得時間為準，將這筆交易排除特徵"],"answer":3,"explanation":"回測必須重現九點可查詢的資料，而不只是檢查事件發生時間。這筆交易雖已發生，仍未進入可用系統；事後回填會讓回測使用當時不可得的資訊。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q453","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23301","topicName":"數據準備與特徵工程","concept":"Target Leakage","difficulty":"hard","question":"留存模型在月初預測客戶當月是否退訂。團隊將月底生成的「退訂結案代碼」加入特徵，並改用時間切分驗證。哪個判斷正確？","options":["時間切分已隔開月份，因此可保留結案代碼","增加歷史月份的數量，因此可保留結案代碼","每筆特徵仍含事後資訊，因此應移除結案代碼","降低模型的參數數量，因此可保留結案代碼"],"answer":2,"explanation":"按月份切分不能修復每筆樣本內的洩漏：月初仍無法取得當月底才生成的結案代碼。增加月份或降低複雜度也不能改變這個可得性限制。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q454","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23301","topicName":"數據準備與特徵工程","concept":"Feature Scaling","difficulty":"medium","question":"KNN 使用未加權的歐氏距離，輸入包含身高（公分）與年收入（元），兩者數值範圍差很多。先做特徵縮放的主要理由是？","options":["調整各維尺度，減少收入數值範圍對距離的主導","調整類別比例，減少多數類樣本對投票的主導","調整樣本數量，減少訓練資料不足對估計的影響","調整鄰居數目，減少單一近鄰對預測結果的影響"],"answer":0,"explanation":"歐氏距離累加各維度差的平方，數值範圍大的收入可能主導鄰居選擇。縮放改變各維相對尺度，不會直接改變類別比例、樣本數或 K；是否縮放仍須配合任務需要。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q455","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23301","topicName":"數據準備與特徵工程","concept":"Feature Scaling","difficulty":"medium","question":"同一份數值資料含差異很大的特徵尺度。比較使用 RBF 核的 SVM 與一般依單一特徵閾值分裂的 Random Forest，哪個描述較合理？","options":["兩者都依單一欄位排序，因此通常較少受尺度影響","兩者都依樣本間的距離，因此通常較易受尺度影響","前者的核涉及距離，因此通常比後者更受尺度影響","後者的分裂涉及距離，因此通常比前者更受尺度影響"],"answer":2,"explanation":"RBF 核使用平方距離，特徵尺度會影響核值。一般 Random Forest 的分裂主要依欄位排序與閾值，通常較少受正向線性縮放影響；這不保證所有實作或任何資料轉換都完全不變。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q456","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23301","topicName":"數據準備與特徵工程","concept":"Feature Scaling","difficulty":"medium","question":"某欄位以訓練集平均數 50、標準差 10 做標準化 z＝(x−平均數)／標準差。驗證集的一筆原值為 70；沿用訓練集參數後應得到多少？","options":["7，將原值直接除以訓練集標準差","2，將原值減去平均數後除以標準差","20，將原值減去平均數後作為結果","1.4，將原值直接除以訓練集平均數"],"answer":1,"explanation":"z＝(70−50)／10＝2。標準化同時中心化與縮放，不能只做其中一步或改除以平均數；驗證與推論應沿用訓練階段取得的參數。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q457","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23301","topicName":"數據準備與特徵工程","concept":"Feature Scaling","difficulty":"medium","question":"以歐氏距離做 K-means，金額欄位的數值範圍遠大於其他欄位。團隊希望各欄位具有較接近的尺度，哪個做法最直接符合目的？","options":["逐欄縮放到可比較的尺度，再以轉換後資料分群","增加群集中心的初始候選，再以原始資料分群","提高群集中心的更新次數，再以原始資料分群","增加預先指定的群集數目，再以原始資料分群"],"answer":0,"explanation":"逐欄縮放直接改變各維度在歐氏距離中的相對貢獻。初始化、迭代次數與群數會影響分群，但不直接修正量綱差異；縮放方法也應符合各特徵在任務中的意義。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q458","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23301","topicName":"數據準備與特徵工程","concept":"Feature Scaling","difficulty":"medium","question":"一般決策樹對單一數值欄位做閾值分裂。將此欄全部由公分改為公尺，忽略浮點誤差且重新訓練時，為何通常可得到相同的樣本分組？","options":["正向線性縮放保留排序，對應閾值仍可分出相同樣本","正向線性縮放保留距離，因此相鄰樣本的距離不變","正向線性縮放保留變異，因此每個欄位的變異數不變","正向線性縮放保留閾值，因此節點使用的數值門檻不變"],"answer":0,"explanation":"除以 100 保留大小排序，原門檻也除以 100 就能對應相同分組。距離、變異數及門檻的數值會改變；此敘述針對一般單欄閾值樹，不泛指所有樹模型或有限精度實作。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q459","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23301","topicName":"數據準備與特徵工程","concept":"Feature Scaling","difficulty":"medium","question":"團隊要為含離群值的數值特徵選擇標準化、Min-Max 或穩健縮放。哪個評估程序最合理？","options":["依模型與資料分布提出候選，在訓練折擬合後用驗證折比較","依測試集分數逐一挑選候選，再回到訓練集擬合最佳方法","先用全部資料估計縮放參數，再切成訓練折與驗證折比較","先將每個資料子集各自縮放，再比較各自重新擬合後的結果"],"answer":0,"explanation":"縮放方法要配合模型、分布及離群值，並在每個訓練折擬合參數後套用至驗證折。用測試集選方法或先擬合全部資料會洩漏評估資訊；各子集各自擬合則改變特徵轉換基準。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q460","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"Stratified CV","difficulty":"medium","question":"獨立分類樣本共 1,000 筆，含 50 筆正類，欲做五折驗證並讓各折類別比例接近整體。哪種切分最符合需求？","options":["依類別分層分配樣本，再組成互不重疊的五折","依資料原始順序分段，再組成互不重疊的五折","依各筆樣本特徵排序，再組成互不重疊的五折","依模型預測信心排序，再組成互不重疊的五折"],"answer":0,"explanation":"Stratified K-fold 依標籤分層，使各折比例接近整體。原始順序、特徵值或預測信心不直接維持真實類別比例；此題假設樣本獨立。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q461","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"Stratified CV","difficulty":"medium","question":"分類資料含 10% 正類。分層 train/test split 的主要目的為何？","options":["讓兩個子集的類別比例接近原始的 10%","讓兩個子集的正負樣本比例都變為 50%","讓測試子集只包含正類以強化少數類評估","讓訓練子集只包含負類以維持主要類分布"],"answer":0,"explanation":"分層切分維持原始類別比例，不是把資料平衡成 50%／50%，也不是將某一類單獨放到訓練或測試集。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q462","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"Stratified CV","difficulty":"medium","question":"使用 Stratified K-fold 的某一輪驗證時，對同一筆樣本的訓練與驗證歸屬，哪項描述正確？","options":["該輪只屬於訓練或驗證之一，兩者不重疊","該輪可同時屬於訓練與驗證，以維持比例","該輪必須同時屬於訓練與驗證，以增加樣本","該輪由預測是否正確決定歸屬，以修正分布"],"answer":0,"explanation":"同一輪的訓練與驗證樣本互斥；每筆樣本在一折作驗證，在其他輪可作訓練。分層保留比例不需要同輪重複使用樣本，也不依預測結果分配。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q463","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"Stratified CV","difficulty":"medium","question":"獨立分類資料共 1,000 筆，正類 100 筆，以五折分層切分成等大的驗證折。每折理想上有多少正類？","options":["100 筆，將所有正類複製到每一折","50 筆，將每折的正負類調成相同數量","20 筆，將正類平均分到五個驗證折","10 筆，將五折數再乘上原始正類比例"],"answer":2,"explanation":"各驗證折 200 筆，維持 10% 正類即為 20 筆；等同 100 筆正類分配到五折。分層切分不複製正類，也不自動改成平衡資料。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q464","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"Stratified CV","difficulty":"medium","question":"資料只含 3 筆少數類樣本，卻希望五個互不重疊驗證折各至少有 1 筆少數類。哪項判斷正確？","options":["啟用洗牌即可達成，因為洗牌會增加少數類數量","啟用分層即可達成，因為分層會複製少數類樣本","目前無法達成，應減少折數或增加少數類樣本","提高模型容量即可達成，因為容量會改變切分數量"],"answer":2,"explanation":"三筆樣本不能分到五個互斥折且每折至少一筆。分層或洗牌不增加樣本，模型容量也不解決此限制；折數須配合少數類樣本數。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q465","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"Stratified CV","difficulty":"medium","question":"同一客戶有多筆紀錄。一般 Stratified K-fold 保留類別比例，但可能把同客戶分到訓練與驗證。若要評估新客戶，應如何調整？","options":["只依類別分層，不再考慮每筆紀錄所屬客戶","依客戶分組隔離，並在可行時兼顧類別分層","只依紀錄字數排序，不再考慮同客戶的關聯","依模型預測分組，將預测相似的紀錄放一起"],"answer":1,"explanation":"新客戶評估需隔離客戶群組，以免同客戶資訊洩漏。可使用分組切分並在可行時兼顧分層；一般類別分層本身不保證客戶隔離。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q466","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"ROC-AUC / PR-AUC","difficulty":"hard","question":"詐欺僅占交易的 0.1%，全猜正常也有 99.9% Accuracy。團隊改用 PR 曲線檢視候選模型，最主要能補充哪項資訊？","options":["正常交易的判對比例，與全部交易正確率之間的變化","警示中詐欺的比例，與實際詐欺被找回比例之間的取捨","風險分數的數值大小，與預測機率校準程度之間的差異","不同模型的訓練時間，與部署時每秒處理量之間的關係"],"answer":1,"explanation":"PR 曲線呈現不同閾值下的 Precision 與 Recall：警示中有多少是真正詐欺，以及實際詐欺有多少被找出。它不會讓大量真負類直接主導這兩個比例，也不等同機率校準或執行效率評估。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q467","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"ROC-AUC / PR-AUC","difficulty":"hard","question":"二元分類模型以較高分數表示較可能為正類。若無同分情況，ROC-AUC 為 0.90，哪個解讀最符合其排序意義？","options":["使用預設閾值時，全部樣本約有九成被正確分類","使用預設閾值時，模型找回約九成的實際正類","從預測為正的樣本抽一筆，約九成機率為真實正類","隨機抽一正一負樣本，約九成機率是正類分數較高"],"answer":3,"explanation":"無同分時，ROC-AUC 可解讀為隨機抽取一個正類與一個負類，正類分數高於負類的機率。它不是單一閾值的 Accuracy、Recall 或 Precision；即使 AUC 高，仍須另行選擇適合業務的閾值。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q468","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"ROC-AUC / PR-AUC","difficulty":"hard","question":"驗證集有 100 個正類、9,900 個負類。某閾值的 TPR=80%、FPR=1%，以 PR 曲線檢視該點時，Precision 約為多少？","options":["44.7%，以 80 ÷ (80 + 99) 計算","80.0%，以 80 ÷ (80 + 20) 計算","99.0%，以 9,801 ÷ 9,900 計算","0.8%，以 80 ÷ 10,000 計算"],"answer":0,"explanation":"TP=100×80%=80，FP=9,900×1%=99，故 Precision=80/(80+99)≈44.7%。80% 是 Recall，99% 是負類召回率，0.8% 是 TP 占全部樣本的比例。正類稀少時，低 FPR 仍可能對應不少誤報。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q469","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"ROC-AUC / PR-AUC","difficulty":"hard","question":"金融模型在某閾值下的混淆矩陣為 TP=80、FN=20、FP=90、TN=810。若 ROC 圖以 FPR 為橫軸、TPR 為縱軸，該閾值對應哪個座標？","options":["(0.90, 0.80)，以負類召回率搭配正類召回率","(0.10, 0.80)，以假陽性率搭配真陽性率","(0.20, 0.90)，以假陰性率搭配真陰性率","(0.80, 0.10)，以真陽性率搭配假陽性率"],"answer":1,"explanation":"FPR=FP/(FP+TN)=90/900=0.10，TPR=TP/(TP+FN)=80/100=0.80，因此座標為 (0.10,0.80)。其餘選項分別混淆補數、陰性相關率或橫縱軸順序。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q470","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"ROC-AUC / PR-AUC","difficulty":"hard","question":"同一模型在兩個母體中的正類及負類條件分數分布相同，但正類比例不同，兩條件分布又有重疊。忽略有限樣本誤差，比較 ROC-AUC 與 PR 曲線時，何者較合理？","options":["正類比例降低會使 ROC-AUC 降低，PR 曲線則維持不變","兩者皆由分數排序決定，因此都不受正類比例變動影響","先依正類比例調整分數閾值，就能保證兩條 PR 曲線相同","ROC-AUC 可維持不變，但 PR 曲線會受到正類比例影響"],"answer":3,"explanation":"固定類別條件分數分布時，各閾值的 TPR、FPR 不變，ROC-AUC 因而不變。Precision 還取決於正類比例：πTPR/[πTPR+(1−π)FPR]，因此 PR 曲線及其摘要分數可能改變。跨資料集比較 PR-AUC 時應交代類別比例與計算方式。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q471","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"ROC-AUC / PR-AUC","difficulty":"hard","question":"同一模型在驗證集的三個候選閾值分別為：0.2 時 Precision=20%、Recall=95%；0.4 時 Precision=40%、Recall=90%；0.6 時 Precision=60%、Recall=80%。業務要求 Recall 至少 90%，並在符合條件者中最大化 Precision，應選哪個方案？","options":["選 0.4，在達標方案中取最高 Precision","選 0.2，在全部方案中取最高 Recall","選 0.6，在全部方案中取最高 Precision","三者任選，因為同一模型的 ROC-AUC 相同"],"answer":0,"explanation":"0.2 與 0.4 都達 Recall≥90%，其中 0.4 的 Precision 較高，故應選 0.4。0.6 未達召回率限制。ROC-AUC 是跨閾值的排序摘要，不能取代業務限制下的操作點選擇；此選擇仍須在獨立測試資料確認表現。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q472","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23304","topicName":"模型調整與優化","concept":"Early Stopping","difficulty":"medium","question":"訓練 loss 持續下降，但 validation loss 已連續多輪上升。若用 Early Stopping 選擇停止時點，哪種監控較適當？","options":["依 training loss 的最低值，繼續追求訓練資料表現","依 validation loss 改善情況，設定等待輪數","依 test loss 的每輪變化，反覆用測試資料選擇模型","依完成的固定 epoch 數，不考慮驗證資料的變化"],"answer":1,"explanation":"驗證 loss 有助觀察泛化表現，搭配 patience 可避免因單次波動立即停止。只看訓練 loss 可能繼續過擬合，反覆用測試集決定停止時點會污染最終評估，固定輪數則不依驗證表現自適應。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q473","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23304","topicName":"模型調整與優化","concept":"Early Stopping","difficulty":"medium","question":"最多訓練 200 epochs。Early Stopping 規則為連續 5 輪 validation loss 未低於歷史最佳值便停止；第 60 輪最佳，61–65 輪皆未改善。何時停止？","options":["第 60 輪結束，剛達到目前最佳驗證表現時","第 61 輪結束，首次出現未改善的情況時","第 65 輪結束，連續未改善已達設定輪數時","第 200 輪結束，完成原本設定的最大輪數時"],"answer":2,"explanation":"本題已明定連續 5 輪未改善就停止。第 61 至 65 輪共五輪，因此第 65 輪結束停止；最大 epochs 是上限而非必須完成的輪數。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q474","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23304","topicName":"模型調整與優化","concept":"Early Stopping","difficulty":"medium","question":"Early Stopping 用 validation loss 選停止時點。若改為監控 validation accuracy，最需要同步確認哪項設定？","options":["將改善方向維持越低越好，並檢查最小改善幅度","維持原本 loss 的比較規則，只更換指標紀錄名稱","將改善方向改成越高越好，並檢查最小改善幅度","改用訓練 accuracy 的改善，只比較訓練資料表現"],"answer":2,"explanation":
