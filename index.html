規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Function Calling","difficulty":"medium","question":"生成式 AI 要完成『查庫存→下單→回覆結果』，關鍵能力是？","options":["工具／Function Calling 整合","把所有 API 結果預先寫死在模型中","只提高 Temperature","只把 Prompt 寫長"],"answer":0,"explanation":"Tool/Function Calling 讓模型選擇並呼叫外部工具，再根據真實回傳結果作答。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q160","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"Attention","difficulty":"medium","question":"Transformer 中用來計算序列不同位置彼此關聯的重要機制是？","options":["Attention","Apriori","K-means","Random Forest"],"answer":0,"explanation":"Attention 透過 Query、Key、Value 計算 token 間關聯，是 Transformer 的核心機制。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q161","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"Attention","difficulty":"medium","question":"Query、Key、Value 是哪種機制的重要元件？","options":["Apriori","K-means","Attention","Random Forest"],"answer":2,"explanation":"Attention 透過 Query、Key、Value 計算 token 間關聯，是 Transformer 的核心機制。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q162","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"Attention","difficulty":"medium","question":"模型要動態決定哪些 token 對目前輸出更重要，主要依靠？","options":["Random Forest","Apriori","Attention","K-means"],"answer":2,"explanation":"Attention 透過 Query、Key、Value 計算 token 間關聯，是 Transformer 的核心機制。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q163","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22101","topicName":"敘述性統計與資料摘要技術","concept":"標準差","difficulty":"easy","question":"製造團隊用標準差摘要感測器讀值。這個統計量主要描述哪種特性？","options":["讀值分布中心的位置","讀值相對平均值的離散程度","讀值分布左右的不對稱程度","讀值隨時間增加的變化方向"],"answer":1,"explanation":"標準差描述讀值相對平均值的離散程度，單位與原資料相同。分布中心可用平均數或中位數描述，不對稱程度可用偏態描述，時間變化方向則需要趨勢分析。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編（中級情境強化版）"},{"id":"Q164","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22101","topicName":"敘述性統計與資料摘要技術","concept":"標準差","difficulty":"easy","question":"兩台設備各量測五次，讀值分別為甲組 9、10、10、10、11，乙組 6、8、10、12、14。兩組平均數皆為 10；哪個統計量在乙組較大？","options":["算術平均數","資料中位數","資料標準差","觀測樣本數"],"answer":2,"explanation":"兩組樣本數都是 5，平均數與中位數都是 10。乙組相對平均值的偏差平方和為 40，甲組為 2；無論一致採用母體或樣本標準差公式，乙組標準差都較大。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編（中級情境強化版）"},{"id":"Q165","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22101","topicName":"敘述性統計與資料摘要技術","concept":"標準差","difficulty":"easy","question":"一組溫度讀值原本的標準差為 2。若每筆讀值都加上 5，其標準差會如何變化？","options":["比原本增加 5","變成原本的 5 倍","變成原本的平方","維持原本的數值"],"answer":3,"explanation":"每筆讀值都加上同一常數時，平均值也增加相同常數，各筆相對平均值的偏差不變，因此標準差不變。若每筆乘以常數，標準差才會乘以該常數的絕對值；平方則與變異數的關係有關。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q166","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22203","topicName":"數據處理技術與工具","concept":"MapReduce","difficulty":"medium","question":"某金融機構準備用大數據支援風險分析，團隊需要確認資料處理與統計方法。 在此情境下，MapReduce 中，Map 與 Reduce 的功能何者較正確？","options":["Reduce 一定在 Map 前執行","Map 將輸入映射為中間鍵值資料；Reduce 再彙整同鍵資料","Map 與 Reduce 都只負責資料加密","Map 只畫地圖；Reduce 只刪檔案"],"answer":1,"explanation":"Map 對輸入做平行轉換產生中間鍵值資料，Reduce 再依 key 聚合／彙總。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編（中級情境強化版）"},{"id":"Q167","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22203","topicName":"數據處理技術與工具","concept":"MapReduce","difficulty":"medium","question":"大規模資料平行處理中，MapReduce 的基本概念是？","options":["Map 只畫地圖；Reduce 只刪檔案","Map 將輸入映射為中間鍵值資料；Reduce 再彙整同鍵資料","Reduce 一定在 Map 前執行","Map 與 Reduce 都只負責資料加密"],"answer":1,"explanation":"Map 對輸入做平行轉換產生中間鍵值資料，Reduce 再依 key 聚合／彙總。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q168","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22203","topicName":"數據處理技術與工具","concept":"MapReduce","difficulty":"medium","question":"Map 階段與 Reduce 階段通常分別做什麼？","options":["Map 將輸入映射為中間鍵值資料；Reduce 再彙整同鍵資料","Map 只畫地圖；Reduce 只刪檔案","Reduce 一定在 Map 前執行","Map 與 Reduce 都只負責資料加密"],"answer":0,"explanation":"Map 對輸入做平行轉換產生中間鍵值資料，Reduce 再依 key 聚合／彙總。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q169","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"分類評估","difficulty":"medium","question":"二元分類以正類為關注對象，Precision 為 0.75、Recall 為 0.50。兩者等權的 F1-score 為何？","options":["0.600，依兩者的調和平均計算","0.625，依兩者的算術平均計算","0.375，依兩者直接相乘來計算","0.750，依兩者較大的數值計算"],"answer":0,"explanation":"F1 = 2PR / (P + R) = 2 × 0.75 × 0.50 / 1.25 = 0.60。算術平均、直接相乘與取最大值都不是 F1；調和平均會對較低的那一項較敏感。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q170","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"分類評估","difficulty":"medium","question":"正類占 1% 的二元分類任務中，模型全部預測為負類，Accuracy 仍為 99%。團隊要以單一指標同時反映正類的漏報與誤報，並對 Precision、Recall 等權衡量，應補充哪項指標？","options":["負類的召回率，用負類辨識能力評估模型","正類的 F1 分數，用精確率與召回率評估模型","正類的召回率，用找回正類的比例評估模型","整體的正確率，用全部預測正確比例評估模型"],"answer":1,"explanation":"正類 F1 同時反映 Precision 與 Recall，符合題目等權兼顧漏報與誤報的要求。只看正類召回率不反映誤報，只看負類召回率或整體正確率會掩蓋此例的漏報。全猜負類時 TP 為 0，依 F1 = 2TP / (2TP + FP + FN) 得 0。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編"},{"id":"Q171","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"分類評估","difficulty":"medium","question":"金融機構評估二元分類模型，令 P 為正類 Precision、R 為正類 Recall，且兩者皆大於 0。哪個式子是 F1-score？","options":["(P + R) / 2，即兩者的算術平均","2 × P × R，即兩者乘積的兩倍","2 × P × R / (P + R)，即兩者的調和平均","P × R / (P + R)，即乘積除以兩者總和"],"answer":2,"explanation":"F1 是 Precision 與 Recall 的調和平均，公式為 2PR / (P + R)。算術平均不是 F1，2PR 少了分母，PR / (P + R) 則少了係數 2；F1 不納入真負類數量，使用時仍應依任務搭配其他指標。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開樣題風格自編（中級情境強化版）"},{"id":"Q172","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11201","topicName":"資料基本概念與來源","concept":"大數據 4V","difficulty":"medium","question":"某製造商每天新增數十 TB 感測資料，來源包含影像、JSON 與機台數值，且每秒持續寫入。若用大數據常見的 4V 概念描述，最適合的是哪一組？","options":["Volume、Velocity、Variety、Veracity","Accuracy、Recall、F1、AUC","CPU、RAM、SSD、GPU","ETL、API、SQL、HTML"],"answer":0,"explanation":"大數據常以 4V 描述：資料量（Volume）、速度（Velocity）、多樣性（Variety）與可信度／真實性（Veracity）。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q173","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11201","topicName":"資料基本概念與來源","concept":"大數據 4V","difficulty":"medium","question":"零售平台的交易、影音瀏覽與客服文字同時快速累積。下列何者最完整描述這類大數據特性？","options":["CPU、RAM、SSD、GPU","Volume、Velocity、Variety、Veracity","Accuracy、Recall、F1、AUC","ETL、API、SQL、HTML"],"answer":1,"explanation":"大數據常以 4V 描述：資料量（Volume）、速度（Velocity）、多樣性（Variety）與可信度／真實性（Veracity）。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q174","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11201","topicName":"資料基本概念與來源","concept":"大數據 4V","difficulty":"medium","question":"智慧城市資料同時具有大量、即時、多格式與品質不一等特性。這通常對應哪一組概念？","options":["Accuracy、Recall、F1、AUC","CPU、RAM、SSD、GPU","ETL、API、SQL、HTML","Volume、Velocity、Variety、Veracity"],"answer":3,"explanation":"大數據常以 4V 描述：資料量（Volume）、速度（Velocity）、多樣性（Variety）與可信度／真實性（Veracity）。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q175","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11201","topicName":"資料基本概念與來源","concept":"大數據 4V","difficulty":"medium","question":"企業評估是否屬於大數據情境時，常檢查資料規模、產生速度、型態與可信度。這四項合稱？","options":["CPU、RAM、SSD、GPU","ETL、API、SQL、HTML","Accuracy、Recall、F1、AUC","Volume、Velocity、Variety、Veracity"],"answer":3,"explanation":"大數據常以 4V 描述：資料量（Volume）、速度（Velocity）、多樣性（Variety）與可信度／真實性（Veracity）。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q176","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11201","topicName":"資料基本概念與來源","concept":"大數據 4V","difficulty":"medium","question":"IoT 平台面臨高頻串流、影像與表格混合、資料品質不穩與巨量儲存需求，最符合哪一組特性？","options":["Accuracy、Recall、F1、AUC","ETL、API、SQL、HTML","Volume、Velocity、Variety、Veracity","CPU、RAM、SSD、GPU"],"answer":2,"explanation":"大數據常以 4V 描述：資料量（Volume）、速度（Velocity）、多樣性（Variety）與可信度／真實性（Veracity）。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q177","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11201","topicName":"資料基本概念與來源","concept":"大數據 4V","difficulty":"medium","question":"下列哪一組最接近大數據常用的 4V，而不是模型評估指標或硬體規格？","options":["ETL、API、SQL、HTML","Accuracy、Recall、F1、AUC","CPU、RAM、SSD、GPU","Volume、Velocity、Variety、Veracity"],"answer":3,"explanation":"大數據常以 4V 描述：資料量（Volume）、速度（Velocity）、多樣性（Variety）與可信度／真實性（Veracity）。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q178","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"Train/Validation/Test","difficulty":"medium","question":"團隊已切分訓練、驗證與測試資料。要以梯度下降更新模型權重時，標準開發流程應使用哪份資料計算訓練損失？","options":["驗證集，以候選模型比較用的樣本更新權重","訓練集，以供模型學習的樣本計算損失並更新","測試集，以最終評估用的樣本持續修正權重","三者合併，以增加每次更新可使用的樣本數"],"answer":1,"explanation":"模型權重由訓練資料的損失來學習；驗證資料用於選型與調參，保留測試資料用於最終評估。用後兩者更新權重或直接合併，會破壞原先的獨立評估分工。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q179","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"Train/Validation/Test","difficulty":"medium","question":"開發者已反覆查看測試集分數來挑學習率。若仍要估計選定模型對未見資料的表現，下一步較合理的是？","options":["另保留未參與選型的代表性資料，待方案固定後評估","把原測試集重新命名為驗證集，再以同一分數作最終成績","把原測試集的資料列重新排序，再評估一次作最終成績","把歷次測試分數取平均值，用平均成績消除選型的影響"],"answer":0,"explanation":"已參與選型的測試集不再提供獨立的最終評估，應以未參與選型且具代表性的資料確認表現。重新命名、排序或平均歷次分數都不能消除反覆選型造成的偏誤。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q180","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"Train/Validation/Test","difficulty":"medium","question":"團隊用歷年銷售紀錄預測未來月份，部署時無法取得未來資訊。哪種資料切分較貼近實際使用情境？","options":["以月份隨機分配資料，讓各集合都混合早期與晚期紀錄","以最近月份訓練模型，再用較早的月份評估預測能力","以早期月份訓練、後續月份驗證，保留更晚月份測試","以銷售額排序後切分，讓低額資料訓練而高額資料測試"],"answer":2,"explanation":"時間預測應模擬用過去預測未來，按時間先後安排訓練、驗證與測試，並避免特徵使用未來資訊。隨機混合、逆向時間及依金額切分都不如題述方式貼近部署情境。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q181","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"Train/Validation/Test","difficulty":"medium","question":"設備資料中，同一台機器有多筆高度相似的紀錄。若要評估模型對全新機器的表現，應採哪種切分？","options":["逐筆隨機切分，讓每台機器的紀錄分散到各資料集","依檔案筆數切分，使每個資料集包含相近的紀錄量","依機器識別分組，使同台機器不跨訓練與測試資料","依量測數值排序，使不同資料集分別涵蓋高值與低值"],"answer":2,"explanation":"目標是全新機器，須在機器層級隔離資料，避免同機近似紀錄跨集合而高估表現。逐筆隨機與按檔案筆數切分未保證隔離；依量測數值切分也不對應評估目標。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q182","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"Train/Validation/Test","difficulty":"medium","question":"團隊已保留最終測試集，現在用五折交叉驗證挑模型。每一折含需由資料估計的補值步驟，應如何執行？","options":["以該折訓練部分估計補值參數，再轉換該折驗證部分","以五折全部資料估計補值參數，再固定參數評估各折","以保留測試集估計補值參數，再套用到各折驗證部分","以該折驗證部分估計補值參數，再反向轉換訓練部分"],"answer":0,"explanation":"每折的驗證部分應模擬未見資料，因此補值參數只能由該折訓練部分估計。使用全部資料、最終測試集或該折驗證資料估計，都將評估資料資訊帶入開發流程。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q183","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"Train/Validation/Test","difficulty":"medium","question":"訓練損失持續下降，但驗證損失開始上升。團隊使用早停法選擇訓練輪次，並保留最終測試集。何者較合適？","options":["選訓練損失最低的輪次，以擬合訓練資料的程度為依據","依預定早停規則選驗證表現較佳的輪次，再做最終測試","逐輪查看測試集的損失，以測試表現最佳的輪次作選擇","先合併驗證資料再繼續訓練，以合併後的損失決定輪次"],"answer":1,"explanation":"早停通常以驗證表現及事先設定的規則選擇輪次，模型選定後才做最終測試。訓練損失較低不代表泛化較好；逐輪看測試集或先合併驗證資料會破壞這項分工。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q184","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"缺失值處理","difficulty":"medium","question":"工廠某感測欄位有 18% 缺值，尚不清楚是設備停機、傳輸失敗或匯入錯誤。決定刪除或插補前，應先做什麼？","options":["依其他工廠慣用的補值方式，先產生完整資料表","依缺值比例套用固定刪欄門檻，先縮減資料欄位","依模型能否接受空值，先選定模型再解讀缺值原因","核對缺值發生條件與來源紀錄，釐清欄位及缺失意義"],"answer":3,"explanation":"不同原因的缺失可能有不同業務意義，應先核對來源與發生條件。套用他廠方法、固定比例門檻或只看模型是否支援空值，都不足以判斷這些資料應如何處理。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q185","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"缺失值處理","difficulty":"medium","question":"某數值欄位少量缺值，團隊要先做單一常數插補基準。已知有效值明顯右偏且有極端高值，希望補值較不受極端值影響，應優先試哪個統計量？","options":["訓練資料的平均數，利用所有數值的總和計算","訓練資料的最大值，保留觀察到的最高數值","訓練資料的全距，以最大值減最小值計算","訓練資料的中位數，以排序後的中央位置代表"],"answer":3,"explanation":"中位數較不易受少數極端值影響，適合作為此條件下的簡單插補基準。平均數容易受極端高值拉動；最大值及全距不是典型中央值。此選擇仍須經驗證，並非所有缺值的最佳解。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q186","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"缺失值處理","difficulty":"medium","question":"訓練資料某欄位的已知值為 10、20、30，驗證資料的已知值為 100。若以訓練集平均數插補，驗證資料的缺值應補多少？","options":["補 20，沿用訓練集已知值所算出的平均數","補 40，使用訓練與驗證全部已知值的平均數","補 100，使用驗證集本身已知值所算的平均數","補 30，使用訓練集最後一筆已知值作為補值"],"answer":0,"explanation":"訓練集已知值平均為（10＋20＋30）/3＝20，應將這個已估計的參數套用到驗證集。合併後平均為 40，使用它或驗證集的 100 都會使用評估資料估參數；30 則不是訓練平均。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q187","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"缺失值處理","difficulty":"medium","question":"客戶表的「公司名稱」在個人客戶列為空白，查證後確認這表示不適用，並非漏填。較合理的處理方式是？","options":["以最常見公司名稱插補，讓所有客戶都對應一家公司","將空白列移出客戶表，讓公司名稱欄位沒有缺值","標示為不適用並保留客戶型態，與真正漏填情況區分","以相鄰資料列的公司名稱插補，維持原始資料排列"],"answer":2,"explanation":"這是結構性的「不適用」，應保留其語意，並與未知或漏填區別。填入其他公司名稱會創造不實資訊；刪除個人客戶則會改變資料涵蓋的客群。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q188","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"缺失值處理","difficulty":"medium","question":"客戶收入欄位的缺值多集中於某職業類型。若直接刪除所有缺收入的資料列，最需要檢查哪項影響？","options":["剩餘資料的檔案大小是否降低，作為資料更可靠的依據","該職業類型是否被過度排除，改變樣本的代表性","欄位名稱是否維持一致，作為不同客群仍可比較的依據","剩餘資料是否已沒有空值，作為原有偏誤消失的依據"],"answer":1,"explanation":"當缺失集中於特定群體，刪列可能使該群體被過度排除，導致代表性改變。檔案變小、欄名相同或沒有空值，都不能證明資料仍具代表性或偏誤已消失。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q189","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11202","topicName":"資料整理與分析流程","concept":"缺失值處理","difficulty":"medium","question":"某欄位的缺失狀態在預測當下即可得，可能帶有訊息。團隊要插補數值，同時讓模型區分「原值」與「補值」，應採哪種方式？","options":["插補後將整欄標準化，以縮放結果表示哪些值原本缺失","插補時另加缺失旗標，以二元欄位保留原本缺失狀態","插補後重新排列資料列，以列的位置表示哪些值原本缺失","插補時統一增加小數位，以數值精度表示哪些值原本缺失"],"answer":1,"explanation":"另加缺失旗標可明確保留原始缺失狀態，再由驗證結果判斷是否有用。標準化、排序或統一增加小數位都不能可靠區分原值與補值；也應確認旗標在實際預測時可取得。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q190","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"分類與迴歸","difficulty":"medium","question":"公司要分別預測「明日用電量」與「客戶是否流失」，這兩項任務通常分別屬於？","options":["分類只能有兩類，超過兩類就不是分類","迴歸只能使用線性模型","連續數值一定使用分群；類別一定使用迴歸","預測連續數值通常是迴歸；預測離散類別通常是分類"],"answer":3,"explanation":"監督式學習中，分類預測離散標籤；迴歸預測連續數值。兩者都可使用多種不同演算法。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q191","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"分類與迴歸","difficulty":"medium","question":"預測房屋成交價格與判斷產品瑕疵類型，在機器學習任務分類上最適合如何區分？","options":["連續數值一定使用分群；類別一定使用迴歸","分類只能有兩類，超過兩類就不是分類","迴歸只能使用線性模型","預測連續數值通常是迴歸；預測離散類別通常是分類"],"answer":3,"explanation":"監督式學習中，分類預測離散標籤；迴歸預測連續數值。兩者都可使用多種不同演算法。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q192","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"分類與迴歸","difficulty":"medium","question":"模型 A 輸出 325.7 元，模型 B 輸出「高風險／低風險」。兩者通常分別是？","options":["連續數值一定使用分群；類別一定使用迴歸","分類只能有兩類，超過兩類就不是分類","迴歸只能使用線性模型","預測連續數值通常是迴歸；預測離散類別通常是分類"],"answer":3,"explanation":"監督式學習中，分類預測離散標籤；迴歸預測連續數值。兩者都可使用多種不同演算法。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q193","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"分類與迴歸","difficulty":"medium","question":"客服團隊預測處理分鐘數；風控團隊預測違約／不違約。任務型態何者正確？","options":["迴歸只能使用線性模型","預測連續數值通常是迴歸；預測離散類別通常是分類","連續數值一定使用分群；類別一定使用迴歸","分類只能有兩類，超過兩類就不是分類"],"answer":1,"explanation":"監督式學習中，分類預測離散標籤；迴歸預測連續數值。兩者都可使用多種不同演算法。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q194","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"分類與迴歸","difficulty":"medium","question":"下列對 Classification 與 Regression 的敘述，哪一項較正確？","options":["連續數值一定使用分群；類別一定使用迴歸","迴歸只能使用線性模型","預測連續數值通常是迴歸；預測離散類別通常是分類","分類只能有兩類，超過兩類就不是分類"],"answer":2,"explanation":"監督式學習中，分類預測離散標籤；迴歸預測連續數值。兩者都可使用多種不同演算法。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q195","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"分類與迴歸","difficulty":"medium","question":"若目標值一個是連續溫度、一個是離散設備狀態，應如何選擇任務類型？","options":["迴歸只能使用線性模型","預測連續數值通常是迴歸；預測離散類別通常是分類","連續數值一定使用分群；類別一定使用迴歸","分類只能有兩類，超過兩類就不是分類"],"answer":1,"explanation":"監督式學習中，分類預測離散標籤；迴歸預測連續數值。兩者都可使用多種不同演算法。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q196","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"Precision 與 Recall 取捨","difficulty":"medium","question":"瑕疵檢測將「有瑕疵」視為陽性。驗證資料有 100 件真正瑕疵，系統找出其中 90 件，並將 30 件良品誤報為瑕疵。Precision 與 Recall 分別為何？","options":["Precision 為 90%，Recall 為 75%","Precision 為 75%，Recall 為 90%","Precision 為 75%，Recall 為 30%","Precision 為 90%，Recall 為 30%"],"answer":1,"explanation":"Precision＝真正陽性／預測陽性＝90／（90＋30）＝75%；Recall＝真正陽性／實際陽性＝90／100＝90%。兩者分母不同，不能把找到瑕疵的比例當成預測陽性的可信度。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q197","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"Precision 與 Recall 取捨","difficulty":"medium","question":"告警系統要盡量找出真正故障，人工複核量仍有餘裕。同一模型與同一批資料中，故障分數越高越可能為陽性。降低判陽性門檻時，哪項敘述成立？","options":["預測陽性不會增加，Recall 可能降低","預測陽性不會減少，但 Precision 未必提升","漏報件數不會增加，Precision 必定提升","誤報件數不會增加，Recall 不會降低"],"answer":1,"explanation":"在分數固定的同一批資料上降低門檻，原有陽性預測仍被保留，並可能納入更多樣本。漏報不會增加、Recall 不會降低，但新納入樣本也可能是誤報，因此不能保證誤報不增加或 Precision 提升。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q198","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"Precision 與 Recall 取捨","difficulty":"medium","question":"郵件系統把「垃圾信」視為陽性。團隊要知道被攔截信件中，有多少比例確實是垃圾信，以評估攔截結果的可靠性。應查看哪個指標？","options":["Recall：所有垃圾信中被攔截的比例","Accuracy：全部信件中分類正確的比例","Precision：被攔截信件中真正垃圾信的比例","Specificity：正常信件中未被攔截的比例"],"answer":2,"explanation":"問題以被攔截的預測陽性為分母，對應 Precision。Recall 以實際垃圾信為分母，Accuracy 看所有信件，Specificity 看實際正常信件，衡量的面向不同。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q199","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"Precision 與 Recall 取捨","difficulty":"medium","question":"兩個門檻在同一驗證集的結果為：甲漏報 5 件、誤報 30 件；乙漏報 15 件、誤報 10 件。若每件漏報成本為 10 單位、誤報為 1 單位，僅按總錯誤成本應選哪個？","options":["選乙，因總錯誤件數較少，成本為 25 單位","選甲，因加權錯誤成本較低，成本為 80 單位","選乙，因誤報件數較少，成本為 10 單位","選甲，因漏報件數較少，成本為 5 單位"],"answer":1,"explanation":"甲的成本為 5×10＋30×1＝80；乙為 15×10＋10×1＝160。當漏報與誤報代價不同，應比較加權成本，而不是只數總錯誤或只看其中一類錯誤。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q200","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"Precision 與 Recall 取捨","difficulty":"medium","question":"團隊要求 Recall 至少 90%，達標後再選 Precision 較高的門檻。候選結果為甲 P＝85%／R＝88%、乙 P＝78%／R＝93%、丙 P＝70%／R＝97%、丁 P＝92%／R＝80%。應選何者？","options":["選甲，其 Precision 為 85%、Recall 為 88%","選乙，其 Precision 為 78%、Recall 為 93%","選丙，其 Precision 為 70%、Recall 為 97%","選丁，其 Precision 為 92%、Recall 為 80%"],"answer":1,"explanation":"先依 Recall≥90% 排除甲與丁，再比較乙和丙的 Precision，乙的 78% 較高。不能因丁的 Precision 最高就忽略必要門檻，也不必在達標後仍一律選 Recall 最高者。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q201","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11302","topicName":"常見的機器學習模型","concept":"Precision 與 Recall 取捨","difficulty":"medium","question":"分類器甲的 Precision／Recall 為 95%／40%，乙為 80%／80%。團隊決定以 F1 同等兼顧兩者，應如何選擇？","options":["選甲，因 Precision 較高，F1 就會較高","選甲，因兩指標差距較大，F1 就會較高","選乙，其 F1 為 80%，高於甲的約 56%","選乙，其 F1 為 160%，高於甲的 135%"],"answer":2,"explanation":"F1 是 Precision 與 Recall 的調和平均：2PR／（P＋R）。甲約為 56%，乙為 80%。F1 不是只看 Precision，也不是兩者直接相加；題目已指定以 F1 作選擇標準。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q202","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11401","topicName":"鑑別式 AI 與生成式 AI 的基本原理","concept":"生成模型類型","difficulty":"medium","question":"某影像生成方法在訓練時對影像逐步加噪，讓模型學習去噪；生成時再從雜訊逐步得到影像。這個核心機制對應哪類模型？","options":["生成對抗模型，以生成器與鑑別器的競爭為核心","變分自編碼器，以潛在分布與重建學習為核心","擴散生成模型，以加噪過程的反向去噪為核心","自回歸生成模型，以已生成內容預測下一單位為核心"],"answer":2,"explanation":"題述是典型擴散模型的加噪與反向去噪流程。GAN 以對抗學習為核心，VAE 學習潛在分布與解碼，典型自回歸模型則逐單位條件生成，與題述機制不同。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q203","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11401","topicName":"鑑別式 AI 與生成式 AI 的基本原理","concept":"生成模型類型","difficulty":"medium","question":"在標準 GAN 訓練中，鑑別器接收真實資料與生成器產生的樣本。鑑別器主要學習哪項任務？","options":["從隨機潛在向量產生樣本，改善生成影像內容","將每張影像編碼為潛在分布，改善重建影像內容","估計每個去噪步驟的雜訊，改善反向採樣流程","判斷樣本來自真實資料或生成器，提供對抗訊號"],"answer":3,"explanation":"GAN 的鑑別器學習區分真實與生成樣本，形成生成器可利用的對抗訓練訊號。從潛在向量生成樣本是生成器的工作；潛在分布編碼與去噪估計則屬其他模型的典型機制。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q204","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11401","topicName":"鑑別式 AI 與生成式 AI 的基本原理","concept":"生成模型類型","difficulty":"medium","question":"某生成模型用編碼器估計輸入的潛在分布，再透過解碼器重建資料，訓練時同時考量重建與潛在分布正則化。最符合哪一類？","options":["變分自編碼器，結合潛在變數推論與解碼","生成對抗網路，結合生成器與真假鑑別器","擴散生成模型，結合逐步加噪與反向去噪","自回歸語言模型，依前文逐一預測後續詞元"],"answer":0,"explanation":"VAE 透過編碼器近似潛在分布、解碼器重建資料，並以分布正則化約束潛在空間。對抗真假判別、擴散去噪及逐詞元預測不是題述的核心訓練安排。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q205","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11401","topicName":"鑑別式 AI 與生成式 AI 的基本原理","concept":"生成模型類型","difficulty":"medium","question":"某文字生成器先讀取前文，預測下一個詞元，將產生的詞元接回前文後重複此步驟。這是哪種生成方式？","options":["自回歸生成，讓下一步依賴前面已產生的內容","擴散式生成，讓整段內容經由多步去噪逐漸成形","對抗式訓練，讓真假判別結果引導生成器更新","變分式重建，讓潛在分布的樣本經解碼器還原"],"answer":0,"explanation":"依先前內容逐次預測下一詞元，是典型自回歸生成。其他選項分別描述擴散、GAN 訓練與 VAE 的機制，並非題述逐詞元條件生成流程。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q206","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11401","topicName":"鑑別式 AI 與生成式 AI 的基本原理","concept":"生成模型類型","difficulty":"medium","question":"標準 GAN 已完成訓練，現在只需從隨機潛在向量生成新影像，不做額外品質篩選。推論時主要需要哪個元件？","options":["鑑別器，將潛在向量轉換成完整影像內容","編碼器，將潛在向量轉換成真實影像標籤","生成器，將潛在向量映射為新的影像樣本","去噪器，按固定反向擴散步驟還原影像內容"],"answer":2,"explanation":"標準 GAN 的生成器在訓練後可直接把潛在向量映射為樣本。鑑別器主要用於訓練中的真假判別，並非生成影像所必需；標準 GAN 也不要求編碼器或反向擴散流程。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q207","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11401","topicName":"鑑別式 AI 與生成式 AI 的基本原理","concept":"生成模型類型","difficulty":"medium","question":"產品團隊已有 GAN 與擴散模型兩個原型，需兼顧影像品質與回應時間。選型時，哪種比較方式較能支持部署決策？","options":["比較兩模型的參數數量，以參數較多者代表品質較佳","比較兩模型的訓練輪次，以輪次較多者代表生成較快","比較兩模型的展示圖片，以最好的一張代表日常品質","在目標環境測代表性案例，同時量測品質與回應時間"],"answer":3,"explanation":"GAN 與擴散模型的機制不同，但產品表現仍取決於具體模型、資料與執行設定。應在目標環境以代表性案例比較品質及時間；參數量、訓練輪次或單張最佳展示不足以支持部署決策。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q208","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11102","topicName":"AI 治理概念","concept":"可解釋性與責任","difficulty":"hard","question":"銀行用 AI 拒絕貸款申請，若要提升治理品質，下列哪種設計較適當？","options":["模型供應商應承擔所有最終決策責任","完全隱藏模型邏輯可提升信任","只要模型平均準確率高就可取消人工覆核","對高影響決策提供適當可解釋資訊、保留人工覆核與責任歸屬"],"answer":3,"explanation":"高影響 AI 應兼顧透明度、可解釋性、人工監督與責任歸屬；不能用高準確率取代治理。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q209","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11102","topicName":"AI 治理概念","concept":"可解釋性與責任","difficulty":"hard","question":"保險理賠模型直接影響客戶權益，組織應如何兼顧可解釋性與責任？","options":["對高影響決策提供適當可解釋資訊、保留人工覆核與責任歸屬","模型供應商應承擔所有最終決策責任","完全隱藏模型邏輯可提升信任","只要模型平均準確率高就可取消人工覆核"],"answer":0,"explanation":"高影響 AI 應兼顧透明度、可解釋性、人工監督與責任歸屬；不能用高準確率取代治理。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q210","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11102","topicName":"AI 治理概念","concept":"可解釋性與責任","difficulty":"hard","question":"高風險 AI 決策系統若只能輸出「拒絕」卻無法被人工覆核，主要缺少什麼治理觀念？","options":["模型供應商應承擔所有最終決策責任","只要模型平均準確率高就可取消人工覆核","對高影響決策提供適當可解釋資訊、保留人工覆核與責任歸屬","完全隱藏模型邏輯可提升信任"],"answer":2,"explanation":"高影響 AI 應兼顧透明度、可解釋性、人工監督與責任歸屬；不能用高準確率取代治理。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q211","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11102","topicName":"AI 治理概念","concept":"可解釋性與責任","difficulty":"hard","question":"企業導入會影響升遷或信用的 AI 時，下列哪種做法較符合負責任 AI？","options":["對高影響決策提供適當可解釋資訊、保留人工覆核與責任歸屬","只要模型平均準確率高就可取消人工覆核","模型供應商應承擔所有最終決策責任","完全隱藏模型邏輯可提升信任"],"answer":0,"explanation":"高影響 AI 應兼顧透明度、可解釋性、人工監督與責任歸屬；不能用高準確率取代治理。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q212","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11102","topicName":"AI 治理概念","concept":"可解釋性與責任","difficulty":"hard","question":"模型準確率 95% 是否代表可以取消解釋與人工覆核？下列何者最合理？","options":["模型供應商應承擔所有最終決策責任","對高影響決策提供適當可解釋資訊、保留人工覆核與責任歸屬","只要模型平均準確率高就可取消人工覆核","完全隱藏模型邏輯可提升信任"],"answer":1,"explanation":"高影響 AI 應兼顧透明度、可解釋性、人工監督與責任歸屬；不能用高準確率取代治理。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q213","level":"初級","subject":"L11","subjectName":"人工智慧基礎概論","topic":"L11102","topicName":"AI 治理概念","concept":"可解釋性與責任","difficulty":"hard","question":"關於 AI 可解釋性與責任機制，下列哪一項較正確？","options":["完全隱藏模型邏輯可提升信任","只要模型平均準確率高就可取消人工覆核","模型供應商應承擔所有最終決策責任","對高影響決策提供適當可解釋資訊、保留人工覆核與責任歸屬"],"answer":3,"explanation":"高影響 AI 應兼顧透明度、可解釋性、人工監督與責任歸屬；不能用高準確率取代治理。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q214","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Zero-shot / Few-shot","difficulty":"medium","question":"提示甲只有任務指令與待分類文字；提示乙另外提供三組已完成的輸入／類別示例。兩者都不更新模型權重，分別屬於哪種提示方式？","options":["甲為 Few-shot，乙為 Zero-shot","甲為模型微調，乙為 Few-shot","甲為 Zero-shot，乙為 Few-shot","甲為 Zero-shot，乙為模型微調"],"answer":2,"explanation":"Zero-shot 不提供任務示例；Few-shot 在提示上下文中放少量示例。這兩種用法都可不更新模型權重，不能把提示中加入示例直接視為微調。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q215","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Zero-shot / Few-shot","difficulty":"medium","question":"資訊擷取提示已列出 JSON 欄位，但輸出格式仍不穩定。團隊想用 Few-shot 引導格式，應加入哪種內容？","options":["加入更多欄位名稱說明，但不呈現完整輸出樣本","加入數組原始文字及對應的正確 JSON 輸出範例","加入較長的領域背景介紹，但不呈現輸入輸出配對","加入幾段原始文字片段，讓模型自行猜測輸出形式"],"answer":1,"explanation":"Few-shot 需要示範任務如何由輸入得到理想輸出，完整且正確的文字／JSON 配對可展示格式。欄位說明、背景文字或只有輸入的片段不等同這類任務示例；格式仍需驗證。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q216","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Zero-shot / Few-shot","difficulty":"medium","question":"團隊只把三個示例放入一次請求的上下文，沒有訓練程序，也未啟用跨請求記憶。對這次 Few-shot 的理解何者正確？","options":["示例會更新模型權重，後續請求可直接沿用新權重","示例僅影響與範例相同的輸入，無法引導其他案例","示例在當次上下文引導回應，不代表模型權重更新","示例會留在後續請求的上下文，省略示例仍可沿用"],"answer":2,"explanation":"Few-shot 在當次上下文中示範任務，能引導模型處理類似但未出現的輸入，並非只複製範例。這不等於微調或權重更新；未啟用記憶時，後續請求若未再提供示例，不能假設上下文會自動沿用。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q217","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Zero-shot / Few-shot","difficulty":"medium","question":"情緒分類指令規定「抱怨且未解決」標為負面，但某個 Few-shot 示例卻把同類文字標為正面。改善提示時應優先做什麼？","options":["核對標註並修正矛盾示例，使規則與示範保持一致","複製該矛盾示例多次，讓模型更熟悉這個標註結果","把矛盾示例移到最後，以位置決定應遵循哪個標準","為矛盾示例增加篇幅，以更長文字提高示範的權重"],"answer":0,"explanation":"指令與示例互相矛盾會造成判斷標準不清，應先對齊規則與標註。重複、換位置或增加長度都不能解決標準衝突，甚至可能強化錯誤訊號。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q218","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Zero-shot / Few-shot","difficulty":"medium","question":"團隊要比較 Zero-shot 與加入三個示例的 Few-shot，判斷是否改善客服分類。模型設定相同時，哪種評估較可靠？","options":["以提示中的三個示例測試，選能完整重現示例的方案","由各方案各挑容易的案件，以各自最佳成績作比較","以同一份未作示例的代表性題集，依相同指標比較","以各方案輸出的文字長度，推估分類判斷是否更完整"],"answer":2,"explanation":"應以未用作示例的共同代表性資料與相同指標比較，避免記住示例或挑選樣本造成偏誤。Few-shot 不保證比 Zero-shot 好；能重現示例或輸出較長也不能證明分類品質改善。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q219","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Zero-shot / Few-shot","difficulty":"medium","question":"系統甲在提示中附上三組客服分類示例；系統乙依提問檢索最新手冊段落，供模型回答引用。兩者的主要作用分別為何？","options":["甲提供最新事實依據；乙用輸入輸出配對示範分類","甲示範任務的判斷方式；乙補入與提問相關的資料","甲以示例更新模型權重；乙以文件更新模型的詞表","甲以示例建立永久記憶；乙將檢索結果存入模型權重"],"answer":1,"explanation":"Few-shot 示例主要示範任務格式或判斷模式；RAG 檢索內容主要補充相關資料。兩者可以併用，但不因此等同，也都不代表自動更新權重、詞表或永久記憶。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q220","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Temperature","difficulty":"medium","question":"法規摘要希望每次輸出較穩定，創意標語則希望更多變化。Temperature 通常應如何設定？","options":["Temperature 是向量資料庫的相似度指標","Temperature 決定模型可讀取的檔案大小","降低 Temperature 通常讓輸出較穩定一致；提高則通常增加隨機性與多樣性","提高 Temperature 可保證事實正確"],"answer":2,"explanation":"Temperature 主要影響取樣分布的隨機程度。低溫通常較穩定，高溫通常較多樣，但不能把它當成事實正確率控制器。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q221","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Temperature","difficulty":"medium","question":"同一 Prompt 回覆過於發散，團隊希望降低隨機性，最直接可調哪個生成參數？","options":["降低 Temperature 通常讓輸出較穩定一致；提高則通常增加隨機性與多樣性","提高 Temperature 可保證事實正確","Temperature 決定模型可讀取的檔案大小","Temperature 是向量資料庫的相似度指標"],"answer":0,"explanation":"Temperature 主要影響取樣分布的隨機程度。低溫通常較穩定，高溫通常較多樣，但不能把它當成事實正確率控制器。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q222","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Temperature","difficulty":"medium","question":"下列對 LLM Temperature 的敘述何者較正確？","options":["提高 Temperature 可保證事實正確","Temperature 是向量資料庫的相似度指標","降低 Temperature 通常讓輸出較穩定一致；提高則通常增加隨機性與多樣性","Temperature 決定模型可讀取的檔案大小"],"answer":2,"explanation":"Temperature 主要影響取樣分布的隨機程度。低溫通常較穩定，高溫通常較多樣，但不能把它當成事實正確率控制器。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q223","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Temperature","difficulty":"medium","question":"創意腦暴與固定格式抽取相比，哪一類任務通常可接受較高 Temperature？","options":["降低 Temperature 通常讓輸出較穩定一致；提高則通常增加隨機性與多樣性","提高 Temperature 可保證事實正確","Temperature 是向量資料庫的相似度指標","Temperature 決定模型可讀取的檔案大小"],"answer":0,"explanation":"Temperature 主要影響取樣分布的隨機程度。低溫通常較穩定，高溫通常較多樣，但不能把它當成事實正確率控制器。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q224","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Temperature","difficulty":"medium","question":"如果把 Temperature 從 0.2 提高到 1.0，通常最可能看到哪種變化？","options":["Temperature 決定模型可讀取的檔案大小","Temperature 是向量資料庫的相似度指標","提高 Temperature 可保證事實正確","降低 Temperature 通常讓輸出較穩定一致；提高則通常增加隨機性與多樣性"],"answer":3,"explanation":"Temperature 主要影響取樣分布的隨機程度。低溫通常較穩定，高溫通常較多樣，但不能把它當成事實正確率控制器。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q225","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"Temperature","difficulty":"medium","question":"生成參數 Temperature 最主要控制什麼？","options":["提高 Temperature 可保證事實正確","Temperature 決定模型可讀取的檔案大小","Temperature 是向量資料庫的相似度指標","降低 Temperature 通常讓輸出較穩定一致；提高則通常增加隨機性與多樣性"],"answer":3,"explanation":"Temperature 主要影響取樣分布的隨機程度。低溫通常較穩定，高溫通常較多樣，但不能把它當成事實正確率控制器。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q226","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"RAG Chunking","difficulty":"medium","question":"手冊的一條規則與其例外條件經常被固定字數切到不同區塊，檢索只取到規則而漏掉例外。優先調整哪個切塊策略較直接？","options":["依規則段落保留語意邊界，必要時帶入相鄰例外條件","將每個段落平均切成更短字串，維持完全相同的長度","依頁碼將不同章節交錯合併，讓每塊包含更多主題","將每個段落改按關鍵字排序，讓相同詞彙集中保存"],"answer":0,"explanation":"此問題出在規則與例外的語意關係被切斷，應調整邊界或適度保留相鄰上下文。更短的固定切割、跨章混合或重排文字，都不能直接維持原規則及例外的關係。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q227","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"RAG Chunking","difficulty":"medium","question":"RAG 增加相鄰區塊的重疊後，邊界資訊較完整，但檢索結果出現大量重複文字。下一步較合理的是？","options":["持續提高重疊比例，以更多重複內容推估更高的涵蓋率","把重疊部分當成獨立證據，以重複次數提高答案信心","維持切塊但提高輸出長度，讓模型把重複文字一併呈現","比較不同重疊量與去重效果，兼顧內容完整及上下文成本"],"answer":3,"explanation":"重疊可補足邊界資訊，也會增加索引及上下文中的重複。應以代表性問題比較重疊量與去重策略，不能把相同來源的重複文字視為更多獨立證據，或假設重疊越多越好。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q228","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"RAG Chunking","difficulty":"medium","question":"某切塊方案產生超過 embedding 模型輸入上限的區塊，送入時尾段被截斷。若要讓尾段內容也能被檢索，應優先如何處理？","options":["依 token 上限再切分，保留各子塊必要的上下文","保留原區塊並增加向量維度，讓向量記住被截斷尾段","保留原區塊並延長回答上限，讓生成器補回未索引內容","保留原區塊並增加檢索筆數，重複取回相同截斷向量"],"answer":0,"explanation":"未送入 embedding 模型的尾段不會因向量維度、回答長度或取回次數而自動補入。應先依輸入 token 上限重新切分，避免截斷，再評估上下文與檢索品質。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q229","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"RAG Chunking","difficulty":"medium","question":"客服知識庫需要在回答旁顯示可核對的文件版本及章節。每個區塊應保留哪組中繼資料，才能直接支援來源追溯？","options":["向量維度、相似度分數及查詢耗時，作為內容來源標記","區塊字數、平均句長及詞頻分布，作為內容來源標記","檢索名次、回傳筆數及回答長度，作為內容來源標記","文件識別、版本及章節位置，建立區塊與原文的對應"],"answer":3,"explanation":"文件識別、版本和章節位置可將區塊連回確切原文，支援引用核對。相似度、字數或排名屬計算與檢索資訊，不能單獨指出內容來自哪個版本的哪個章節。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q230","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"RAG Chunking","difficulty":"medium","question":"兩套 chunking 方案在相同文件與檢索模型下產生不同數量的區塊。若要選出較能支援問答的方案，應優先比較什麼？","options":["代表性問題的證據檢索與回答品質，以及上下文用量","全部區塊的總數量，以產生較多區塊者判定效果較佳","區塊長度的整齊程度，以每塊等長者判定效果較佳","建庫後的索引檔大小，以檔案較大者判定涵蓋較完整"],"answer":0,"explanation":"切塊目的是支援檢索與回答，應在一致條件下比較相關證據是否取得、回答品質及上下文成本。區塊數、長度一致性或索引大小只是結構特徵，不能取代實際任務評估。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q231","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"RAG Chunking","difficulty":"medium","question":"費率表切成數個區塊後，某塊只剩數值列，沒有欄名與適用方案；模型因此把數值套到錯誤方案。切塊時應如何改善？","options":["依數值大小重新排列各列，讓同一數值範圍集中在同塊","將每個儲存格獨立切塊，讓檢索直接比對最短的內容","保留數值列對應的欄名與方案標題，使區塊可被理解","把表格數值轉成未附欄名的字串，讓區塊格式更一致"],"answer":2,"explanation":"表格數值須搭配欄名與方案等結構脈絡才能正確解讀，切塊應保留或附上這些資訊。按數值重排、逐格切碎或移除標頭，容易繼續丟失數值與語意的對應。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q232","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"向量相似度","difficulty":"medium","question":"查詢寫「車子發不動」，文件寫「引擎無法啟動」。團隊希望補強不同用詞但意思相近的搜尋，哪種方法最直接？","options":["以語意 embedding 表示查詢與文件，再比較向量相似度","以原始關鍵字統計查詢與文件，再依相同詞彙數量排序","以完整查詢字串比對各份文件，再依連續字串命中排序","以文件標題比對查詢的字詞，再依標題命中字數排序"],"answer":0,"explanation":"語意 embedding 可把相關語意映射到可比較的向量表示，補強不同用詞的檢索。其他方法仍以字面命中為主要依據；實際效果仍需用代表性查詢驗證，不能保證每個同義表達都能找到。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q233","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"向量相似度","difficulty":"medium","question":"非零向量甲＝(1, 2)，乙＝(2, 4)。使用 cosine similarity 比較兩者時，結果為何？","options":["相似度為 0，因兩向量的各維數值不同","相似度為 0.5，因甲的長度為乙的一半","相似度為 1，因兩向量具有相同的方向","相似度為 2，因乙的長度為甲的兩倍"],"answer":2,"explanation":"Cosine similarity 是內積除以兩向量長度的乘積。乙是甲的正倍數，方向相同，結果為 1；它不把長度倍數直接當作相似度，也不是逐維相等比對。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q234","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"向量相似度","difficulty":"medium","question":"同一 embedding 模型對查詢與四段文件計算 cosine similarity，甲 0.82、乙 0.75、丙 0.91、丁 0.68。未套其他規則且採精確排序，Top-1 應取哪段？","options":["取甲，因相似度為 0.82","取乙，因相似度為 0.75","取丙，因相似度為 0.91","取丁，因相似度為 0.68"],"answer":2,"explanation":"以 cosine similarity 由高到低排序時，0.91 的丙為 Top-1。若使用距離則可能是由小到大，不能混用排序方向；最高相似度也不等於內容必定正確。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q235","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"向量相似度","difficulty":"medium","question":"某段文件與查詢的 cosine similarity 為 0.88，系統未做機率校準。對這個數值的解讀何者合理？","options":["代表該段文件有 88% 機率能正確回答查詢","代表該段文件與查詢有 88% 的字詞相同","代表兩者向量方向接近，仍需核對內容相關性","代表本次搜尋已找回全部相關文件中的 88%"],"answer":2,"explanation":"0.88 是向量方向相近程度的分數，不是未經校準即可使用的正確率、字詞重疊率或檢索召回率。語意相近的內容仍可能過時、條件不符或不含答案。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q236","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"向量相似度","difficulty":"medium","question":"文件以模型甲建立向量，查詢改用獨立訓練的模型乙；兩者維度相同，但未訓練跨模型映射。檢索品質下降時，應優先修正什麼？","options":["改用相容的查詢與文件編碼器，必要時重建文件向量","保留兩個編碼器，將所有向量補零成相同的更高維度","保留兩個編碼器，把 cosine 分數乘上相同的常數","保留兩個編碼器，將檢索結果改依文件建立時間排序"],"answer":0,"explanation":"維度相同不代表向量座標的語意一致。應使用同一模型或經共同訓練、明確相容的查詢／文件編碼器；更換模型可能需重建索引。補零、共同縮放分數或改按日期排序不會建立跨模型語意對應。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q237","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12202","topicName":"如何善用生成式 AI 工具","concept":"向量相似度","difficulty":"medium","question":"產品搜尋同時需要找「省電的筆電」等語意描述，並精確命中「ZX-410」等料號。單純向量搜尋常把相似料號混在一起，較合適的改善是？","options":["增加語意檢索的回傳筆數，直接依原向量分數排序","將查詢中的料號改成產品類別，再送入原向量檢索","降低語意檢索的相似度門檻，納入更多相近產品","結合詞彙與向量檢索，依驗證集調整結果合併方式"],"answer":3,"explanation":"詞彙檢索可補強精確料號，向量檢索可補強語意描述；混合檢索需評估合併策略。增加回傳數或降低門檻不會直接優先命中精確料號；將料號改成類別還可能丟失必要識別資訊。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q238","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12201","topicName":"生成式 AI 應用領域與常見工具","concept":"Tool Calling / MCP","difficulty":"medium","question":"AI 助理要查 ERP 即時庫存再建立補貨單，而不能憑模型記憶回答。最適合的架構是？","options":["只提高 Temperature 就能讓模型取得即時庫存","工具呼叫等同把外部資料永久訓練進模型","讓模型以受控方式呼叫外部工具／資料來源，並用真實回傳結果完成任務","把 API 金鑰寫進 Prompt 即可安全使用"],"answer":2,"explanation":"Tool/Function Calling 與工具協定可讓模型存取外部能力；安全上仍需權限、參數驗證、最小權限與輸出檢查。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q239","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12201","topicName":"生成式 AI 應用領域與常見工具","concept":"Tool Calling / MCP","difficulty":"medium","question":"模型需要讀 低：甲 130 萬，乙 80 萬","甲較低：甲 150 萬，乙 180 萬","乙較低：甲 390 萬，乙 240 萬","甲較低：甲 30 萬，乙 150 萬"],"answer":1,"explanation":"三年 TCO＝一次性導入費＋三年維運費。甲為 120＋3×10＝150 萬，乙為 30＋3×50＝180 萬。只算一年、重複計入導入費或漏掉導入費都會偏離題目期間。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q257","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12301","topicName":"生成式 AI 導入評估","concept":"ROI / TCO","difficulty":"hard","question":"AI 專案第一年的可量化效益為 100 萬，含導入及營運的總成本為 80 萬。依 ROI＝（效益－成本）／成本計算，不折現且無其他項目，ROI 為何？","options":["ROI 為 20%，以效益作分母","ROI 為 25%，以成本作分母","ROI 為 80%，以成本除以效益","ROI 為 125%，以效益除以成本"],"answer":1,"explanation":"依題目定義，淨效益為 100－80＝20 萬，ROI＝20／80＝25%。20% 的分母錯置；80% 是成本效益比，125% 是未扣成本的效益成本比。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q258","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12301","topicName":"生成式 AI 導入評估","concept":"ROI / TCO","difficulty":"hard","question":"摘要工具每月省下原作業 500 小時，但新增覆核 100 小時。以每小時 300 元估算人力時間價值，另付 API 及維運 4 萬元。無其他成本，每月淨效益估值為何？","options":["8 萬元：先扣覆核時間，再扣營運費用","11 萬元：採原節省時間，再扣營運費用","12 萬元：先扣覆核時間，不扣營運費用","14 萬元：加上覆核時間，再扣營運費用"],"answer":0,"explanation":"淨時間價值＝（500－100）×300＝12 萬元，再扣 4 萬元為 8 萬元。這是時間價值估算；若薪資支出未減少，不應直接宣稱已有同額現金節省。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q259","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12301","topicName":"生成式 AI 導入評估","concept":"ROI / TCO","difficulty":"hard","question":"某方案一次性整合費 20 萬、每月 API 與監控費 3 萬，24 個月後結束服務另付資料移轉費 8 萬。合約無其他費用且不折現，完整期間 TCO 為何？","options":["92 萬元：整合費加上 24 個月營運費","100 萬元：整合、營運與結束移轉費合計","72 萬元：24 個月 API 與監控費的合計","28 萬元：初始整合費加上結束移轉費"],"answer":1,"explanation":"TCO 應包含指定生命週期內的必要成本：20＋24×3＋8＝100 萬元。終止與移轉費也是成本，不能只算購置或使用期間的其中一部分。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q260","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12301","topicName":"生成式 AI 導入評估","concept":"ROI / TCO","difficulty":"hard","question":"兩模型經覆核後皆達品質門檻。每件甲 API 費 0.2 元、10% 需覆核；乙 API 費 0.5 元、2% 需覆核。每次覆核 5 元，無其他成本，何者每件期望成本較低？","options":["乙較低：甲 0.7 元，乙 0.6 元","甲較低：甲 0.2 元，乙 0.5 元","甲較低：甲 5.2 元，乙 5.5 元","乙較低：甲 0.5 元，乙 0.1 元"],"answer":0,"explanation":"期望成本＝每件 API 費＋覆核率×每次覆核費。甲 0.2＋0.10×5＝0.7 元，乙 0.5＋0.02×5＝0.6 元。另三項分別漏算覆核、假設每件均覆核或漏算 API。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q261","level":"初級","subject":"L12","subjectName":"生成式 AI 應用與規劃","topic":"L12301","topicName":"生成式 AI 導入評估","concept":"ROI / TCO","difficulty":"hard","question":"某 AI 流程每年固定成本 12 萬元，每件變動成本 2 元，可取代每件成本 5 元的原流程。兩者品質相同且無其他成本或效益，一年處理多少件達到成本損益兩平？","options":["40,000 件，以固定成本除以每件淨節省","60,000 件，以固定成本除以每件變動成本","24,000 件，以固定成本除以原流程單件成本","約 17,143 件，以固定成本除以兩單件成本之和"],"answer":0,"explanation":"每件淨節省為 5－2＝3 元，令 120,000＋2N＝5N，可得 N＝40,000。不能用變動成本本身、原單價或兩者之和作為每件可回收的金額。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q262","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21101","topicName":"自然語言處理技術與應用","concept":"NER 與文本抽取","difficulty":"medium","question":"合約抽取服務要在原文標出公司名稱、日期及金額的起訖位置與類型，暫不產生摘要或判斷合約種類。哪種輸出最符合此 NER 任務？","options":["每份合約的主題類別，以及各類別的信心分數","每份合約的重點句子，以及各句子的排序分數","每個實體的原文範圍，以及對應的實體類型","每段文字的情緒標籤，以及對應的情緒強度"],"answer":2,"explanation":"NER 辨識文字中的實體範圍並給予類型標籤，例如組織、日期或金額。文件分類、摘要句排序與情緒分析的輸出單位及目標都不同。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q263","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21101","topicName":"自然語言處理技術與應用","concept":"NER 與文本抽取","difficulty":"medium","question":"新聞句子為「蘋果公司宣布在台北設立研發中心」。標註規範含組織、地點、人名與產品，要求依語境標完整實體。何者符合規範？","options":["蘋果＝組織；台北＝地點","蘋果公司＝產品；台北＝地點","蘋果公司＝組織；台北＝地點","蘋果公司＝組織；台北＝組織"],"answer":2,"explanation":"此句的蘋果公司是宣布設立中心的組織，台北是設立地點。NER 應依上下文及標註規範判斷，不能只因名稱中出現某個詞就套用固定類型。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q264","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21101","topicName":"自然語言處理技術與應用","concept":"NER 與文本抽取","difficulty":"medium","question":"NER 評估採「範圍與類型皆完全相符」才算正確。某句唯一標準實體為「台灣數據科技股份有限公司／組織」，模型只標「數據科技／組織」。此句應如何計數？","options":["TP＝0、FP＝1、FN＝1","TP＝1、FP＝0、FN＝0","TP＝0、FP＝0、FN＝1","TP＝0、FP＝1、FN＝0"],"answer":0,"explanation":"嚴格實體層級比對要求邊界和類型都正確。預測的短範圍不是標準實體，記一個 FP；完整標準實體沒有被正確找到，另記一個 FN。不能當成完整命中或只記其中一項。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q265","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21101","topicName":"自然語言處理技術與應用","concept":"NER 與文本抽取","difficulty":"medium","question":"NER 已標出交易文件中的公司名稱，但「甲向乙採購」與「乙供貨給甲」兩種句型並存。若要填入採購方與供應方欄位，接下來最直接需要哪一步？","options":["分析實體間的語意關係，判定各自交易角色","固定把句中最先提到的公司，設為交易的採購方","固定把句中最後提到的公司，設為交易的採購方","比較組織實體的信心分數，較高者設為採購方"],"answer":0,"explanation":"NER 找出組織不等於已判定買賣關係，還需關係抽取或依句意解析角色。兩種句型的採購方都是甲，但提及順序不同；實體辨識信心也不是交易角色的判斷依據。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q266","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21101","topicName":"自然語言處理技術與應用","concept":"NER 與文本抽取","difficulty":"medium","question":"通用 NER 模型能辨識人名與地點，卻常漏掉企業自訂產品代號。團隊要提升 PRODUCT 類型的抽取品質，何者最直接？","options":["增加產品文章的摘要長度，再從摘要重做相同辨識","降低所有實體的信心門檻，將新增結果一律標為產品","制定產品邊界與類型規則，以領域標註資料訓練驗證","沿用人名地點的標註資料，把輸出類型名稱改成產品"],"answer":2,"explanation":"新增領域實體類型需要一致的標註規範與代表性資料，才能訓練並驗證邊界及類型。拉長摘要、任意降低門檻或重新命名既有標籤，都不能提供正確的產品判斷依據。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q267","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21101","topicName":"自然語言處理技術與應用","concept":"NER 與文本抽取","difficulty":"medium","question":"NER 已找出「台積電」與「台灣積體電路製造公司」兩個組織提及。下游需要把它們連到同一公司主檔 ID，最適合補上哪項處理？","options":["再做文件主題分類，將兩段文字歸入同一主題","進行實體連結與別名解析，對應共同的主檔識別","再做詞性標註，將兩個名稱都歸入同一詞性","進行情緒分類，將兩個名稱都歸入同一情緒"],"answer":1,"explanation":"NER 辨識文字提及與類型；實體連結則利用別名及語境，對應知識庫或主檔的唯一識別。相同主題、詞性或情緒不代表同一現實實體。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q268","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21101","topicName":"自然語言處理技術與應用","concept":"上下文長度與摘要","difficulty":"medium","question":"某製造企業正在建置 AI 應用，PM 與工程師需要確認下列技術觀念。 在此情境下，數百頁報告超過模型 context window，團隊仍要產生全書摘要，較合理的做法是？","options":["長文件超過 context window 時，可採切分、分層摘要或檢索，只放最相關內容進上下文","將所有文件重複貼多次可避免截斷","context window 越小越能保留完整文件"," 張畫面並視為即時影像，維持原融合權重","以聲音的預測複製成影像預測，再將兩份結果平均","標記畫面缺失並驗證聲音備援，調整融合及信心呈現"],"answer":3,"explanation":"缺失模態應被明確標記，並驗證模型或備援流程在此條件下的表現與不確定性。零值或過期畫面不能直接視為有效同步觀測；複製聲音結果也不會增加獨立的影像證據。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q289","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21104","topicName":"多模態人工智慧應用","concept":"多模態對齊","difficulty":"hard","question":"文件問答先在原圖取得 OCR 文字框座標，之後把影像旋轉並裁切才送入視覺編碼器。若要讓文字框對應正確影像區域，應如何處理？","options":["保留原圖文字框座標，直接套用到處理後的影像","依 OCR 文字的字數重排座標，配合文字內容長度","只按新圖寬高縮放座標，忽略旋轉角度與裁切位移","套用相同幾何轉換更新座標，處理落在裁切外的文字框"],"answer":3,"explanation":"空間對齊需讓文字框與影像使用一致的座標系，包含旋轉及裁切的轉換，並處理已不在影像內的框。僅保留舊座標、按字數重排或只縮放寬高都不足以維持區域對應。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q290","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21104","topicName":"多模態人工智慧應用","concept":"多模態對齊","difficulty":"hard","question":"圖像與文字編碼器各自訓練、輸出皆為 512 維；團隊直接計算跨模態 cosine similarity，結果接近隨機。若兩者未做任何跨模態訓練，最主要缺口是？","options":["兩者向量維度不足，將維度同時加倍即可建立對應","兩者向量長度不同，各自正規化即可建立語意對應","兩者座標語意未對齊，需要配對資料或學得的映射","兩者分數範圍不同，將分數平移到正值即可建立對應"],"answer":2,"explanation":"相同維度只代表可以進行數值運算，不保證不同編碼器的座標具有共同語意。跨模態配對訓練或適當映射才能學習對應；增加維度、長度正規化或分數平移不會自行完成語意對齊。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q291","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21104","topicName":"多模態人工智慧應用","concept":"多模態對齊","difficulty":"hard","question":"圖文問答模型在測試集表現良好，但團隊懷疑它只靠文字線索猜答案。要檢查是否利用圖文對應關係，哪種驗證最有辨識力？","options":["在相同配對上增加輸出字數，觀察回答是否更詳細","重測訓練時看過的圖文配對，觀察答案是否更穩定","固定問題換入會改變答案的圖片，檢查答案是否隨之改變","只測文字就能作答的題目，檢查語言模型的答題能力"],"answer":2,"explanation":"固定文字但替換會改變正解的影像，可檢查模型是否依視覺證據調整答案，並需預先確認新配對的標準答案。回答長度、訓練集重現或純文字可解題目，無法有效區分是否使用跨模態對應。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q292","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21201","topicName":"AI 導入評估","concept":"技術與商業可行性","difficulty":"hard","question":"某製造企業正在建置 AI 應用，PM 與工程師需要確認下列技術觀念。 在此情境下，AI PoC 準確率很高，但正式場域沒有穩定資料介接、延遲也不符需求。這表示評估時漏了什麼？","options":["只要業務主管支持即可跳過 問題：商業價值、資料、技術、流程、資安法遵、成本、維運與組織能力都需評估。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q297","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21201","topicName":"AI 導入評估","concept":"技術與商業可行性","difficulty":"hard","question":"一個成熟的 AI feasibility assessment 應涵蓋？","options":["只要業務主管支持即可跳過資料評估","PoC 成功等於已證明可大規模營運","同時評估使用者價值、資料、技術效能、系統整合、法遵、成本與營運條件","只要模型 benchmark 高就代表專案可行"],"answer":2,"explanation":"AI 導入可行性是多面向問題：商業價值、資料、技術、流程、資安法遵、成本、維運與組織能力都需評估。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q298","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21202","topicName":"AI 導入規劃","concept":"MLOps 生命週期","difficulty":"hard","question":"模型每月更新，事故調查需要確認目前線上模型究竟由哪份資料及哪版程式產生。哪種紀錄最能直接建立這條追溯鏈？","options":["保存部署日期與負責人，依時間接近程度推定訓練來源","保存模型檔名與測試分數，依分數相同與否推定來源","保存資料筆數與模型大小，依檔案規模推定訓練來源","把模型版本連到訓練執行紀錄，記錄資料快照與程式版本"],"answer":3,"explanation":"追溯需要模型、訓練執行、資料快照與程式版本的明確關聯。日期、分數或檔案大小可能相同，無法唯一識別來源；這些輔助資訊不能取代版本關聯。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q299","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21202","topicName":"AI 導入規劃","concept":"MLOps 生命週期","difficulty":"hard","question":"候選模型訓練成功、容器也能啟動，但尚未驗證重要客群品質與推論介面。自動部署流程此時應採哪種晉級條件？","options":["以訓練作業成功作為條件，直接晉級至正式服務","以分群品質及介面測試達標為條件，再晉級部署","以容器映像建置成功為條件，直接晉級正式服務","以本次訓練損失低於前版為條件，再晉級部署"],"answer":1,"explanation":"訓練或建置成功只表示流程的一部分可執行。晉級前仍需驗證代表性資料及重要分群的品質、輸入輸出契約與推論整合；訓練損失不能取代部署驗證。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q300","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21202","topicName":"AI 導入規劃","concept":"MLOps 生命週期","difficulty":"hard","question":"新版模型同時改了特徵前處理。上線後品質下降，團隊要快速回到已驗證的前版行為，且資料介面仍相容。部署前應準備哪種回滾單位？","options":["保存前版模型權重，回滾時繼續搭配新版前處理","保存前版評估分數，回滾時重新調整新版的門檻","保存前版訓練資料，回滾時重新訓練相似的權重","保存已驗證的模型與前處理套件，連同相容環境切回"],"answer":3,"explanation":"模型行為依賴權重、前處理及執行環境；回滾應恢復相容且已驗證的組合，並演練切換。只還原權重可能造成特徵不一致，臨時改門檻或重訓也不等同恢復前版。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q301","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21202","topicName":"AI 導入規劃","concept":"MLOps 生命週期","difficulty":"hard","question":"同一筆原始資料在離線訓練與線上推論產生不同標準化特徵。權重版本相同，差異來自兩套前處理實作。哪項 MLOps 改善最直接？","options":["增加訓練輪次，使模型適應兩套前處理的差異","增加推論副本，使更多請求可同時完成運算","共用版本化前處理並加入一致性測試，核對特徵","增加模型登錄欄位，僅記錄每次推論的回應時間"],"answer":2,"explanation":"這是訓練與服務前處理不一致的問題。應對齊轉換實作及參數，並用相同輸入驗證特徵一致性；增加訓練、服務容量或只記延遲不會直接修正特徵差異。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q302","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21202","topicName":"AI 導入規劃","concept":"MLOps 生命週期","difficulty":"hard","question":"團隊希望日後能重跑某次實驗，並說明模型表現差異來自哪些設定。下列哪組紀錄最能支援這項工作？","options":["實驗名稱、執行日期、訓練耗時與最後的模型分數","資料與程式版本、參數及環境，並關聯產物與評估結果","模型檔案大小、訓練設備型號與當次的資源使用率","專案負責人、部署網址、服務流量與每月營運費用"],"answer":1,"explanation":"重跑及比較實驗需要可取得的資料版本、程式、訓練參數與環境，並將產物及評估連到該次執行。隨機種子等設定也應記錄；硬體及非確定性運算仍可能造成差異，紀錄完整不保證逐位元相同。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q303","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21202","topicName":"AI 導入規劃","concept":"MLOps 生命週期","difficulty":"hard","question":"漂移告警觸發再訓練，產生了新模型，但新版尚未通過品質檢查。哪個流程較符合有驗證關卡的 MLOps 生命週期？","options":["訓練完成後直接取代線上模型，再等下一次監控告警","先比較候選模型與部署門檻，通過後再受控發布","先以原訓練集確認新版準確率，再直接替換正式版","以訓練使用的資料量較多為依據，將新版設為正式版"],"answer":1,"explanation":"再訓練產物仍是候選模型，需通過品質、相容性及其他部署門檻，再進入受控發布流程。告警、資料量增加或訓練完成不代表新版較好；只在訓練集評估也不能確認泛化品質。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q304","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"線上／批次部署","difficulty":"medium","question":"推薦名單每天凌晨計算，隔天使用即可；交易攔截則需在當次請求 200ms 內回覆。兩者的主要推論部署型態應如何選？","options":["推薦採排程批次，交易攔截採低延遲線上服務","推薦採低延遲線上服務，交易攔截採每日批次","兩者皆採每日排程批次，統一等待整批完成","兩者皆先累積一小時資料，再提交非同步作業"],"answer":0,"explanation":"隔日名單可容忍等待整批計算，適合批次；當次交易需要低延遲回應，應使用能符合 SLA 的線上推論。部署方式由時效和工作量決定，不是由資料型態決定。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q305","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"線上／批次部署","difficulty":"medium","question":"夜間批次需在 4 小時內處理 100 萬筆資料。假設吞吐率穩定、無啟動或重試開銷，下列哪個實測方案符合期限？","options":["每小時 30 萬筆，約需 3.33 小時","每小時 20 萬筆，約需 5 小時","每小時 24 萬筆，約需 4.17 小時","每小時 10 萬筆，約需 10 小時"],"answer":0,"explanation":"至少需要 100 萬／4＝25 萬筆每小時，只有每小時 30 萬筆能在期限內完成。批次 SLA 要看總工作量與完成時間；實務上還需預留啟動、失敗重試和負載波動空間。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q306","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"線上／批次部署","difficulty":"medium","question":"線上客服要求 P95 端到端延遲小於 800ms。某次壓測平均延遲 300ms、P95 為 1,200ms，成功率達標。依這項延遲要求，該如何判定？","options":["已達標，因平均延遲 300ms 低於 800ms","未達標，因 P95 延遲 1,200ms 高於上限","已達標，因成功率達標可抵銷較慢的請求","資料不足，必須取得每筆延遲才能判定是否達標"],"answer":1,"explanation":"規格指定的是 P95，而非平均值；即使平均延遲很低，尾端延遲仍可能超標。成功率與延遲是不同要求；題目已提供 P95，可直接與門檻比較，不必等到取得每筆延遲才能判定。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q307","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"線上／批次部署","difficulty":"medium","question":"文件推論通常需 2 分鐘，使用者可接受 5 分鐘內取回結果，但網站 HTTP 請求逾時為 30 秒。哪種介面設計較符合需求？","options":["維持同步回應，讓使用者每次逾時後重新送出整份文件","將 HTTP 成功碼提早回傳，並把尚未完成的結果當作完成","縮短模型運算至 30 秒時強制停止，直接採用部分結果","先回傳作業 ID，以佇列執行並提供狀態與結果查詢"],"answer":3,"explanation":"可容忍分鐘級等待的長作業可採非同步處理，將請求接收與作業完成分開，以 ID 查詢狀態和結果。反覆重送、提早假稱完成或截斷計算，不能提供可靠的完整結果。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q308","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"線上／批次部署","difficulty":"medium","question":"夜間批次部分分區失敗，成功分區已寫入結果。系統採至少一次重試，要求每筆資料只保留一份最終預測。哪種寫入設計較合適？","options":["每次重試均附加全部結果，事後以總列數判斷是否完成","任一分區失敗就略過整批，沿用前一天結果並標為成功","以資料及模型版本作唯一鍵，重試時使用冪等寫入","每次重試都產生新的隨機鍵，讓每次結果保留獨立紀錄"],"answer":2,"explanation":"重試可能重複處理同一輸入，使用資料識別與模型版本等穩定鍵進行冪等寫入，可避免同一預測重複累積。隨機新鍵或直接附加不會去重；略過失敗資料則無法完成本批需求。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q309","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"線上／批次部署","difficulty":"medium","question":"每晚預先計算的推薦能快速回傳，但新需求要求反映使用者剛完成的操作，不能等到隔天。評估部署調整時應優先確認什麼？","options":["夜間作業的平均吞吐量，是否高於前一晚的處理量","預先計算結果的檔案大小，是否小於服務的記憶體","批次輸出資料的欄位名稱，是否與線上 API 相同","特徵與預測的更新時效，是否能在所需時間內反映操作"],"answer":3,"explanation":"查詢已算好的結果很快，不代表結果包含最新資訊。需確認特徵及預測更新時效，再評估線上推論、增量更新或其他方案；吞吐量、檔案大小及欄位名稱本身不能證明時效達標。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q310","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Data / Concept Drift","difficulty":"hard","question":"新客戶來源改變後，輸入年齡分布與訓練期不同，但尚未取得新一批真實標籤。僅根據這項觀察，哪個判斷有直接證據？","options":["已證實 Concept Drift，因年齡與結果的關係必定改變","已證實模型準確率下降，因輸入分布和以前不同","已證實標籤品質下降，因新客戶來自不同的管道","已觀察到 Data Drift，但尚不能判定品質或條件關係變化"],"answer":3,"explanation":"輸入分布 P(X) 改變支持 Data Drift 的判斷。這不直接證明 P(Y|X) 改變或模型品質下降；仍需取得標籤、評估切片及調查資料品質，不能把漂移指標當成正確率。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q311","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Data / Concept Drift","difficulty":"hard","question":"在標籤定義與蒐集方式不變的前提下，可靠追蹤資料顯示：相同交易特徵下，詐欺機率由 5% 變為 30%，而特徵分布保持相近。這最直接支持哪種變化？","options":["Data Drift：輸入特徵的邊際分布已明顯改變","Schema Drift：輸入欄位的資料型別已明顯改變","服務效能退化：推論請求的回應時間已明顯增加","Concept Drift：給定特徵時目標的條件分布改變"],"answer":3,"explanation":"題目描述相同 X 對應的 Y 機率改變，即 P(Y|X) 改變，符合 Concept Drift。特徵邊際分布可以維持相近；資料型別與延遲則沒有題目提供的變化證據。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q312","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Data / Concept Drift","difficulty":"hard","question":"模型每筆預測的真實結果要 30 天後才能確認。團隊已能監控輸入與預測分布，若要檢查 Concept Drift 及實際品質，還應建立什麼？","options":["把當天模型預測當作標準答案，立即計算每日準確率","待標籤成熟後回連原始預測，依時間窗與客群評估","以當天輸入漂移分數代替準確率，使用相同百分比報表","只比較每日預測的平均信心，視為真實結果的替代值"],"answer":1,"explanation":"有延遲的真實標籤應回連當時輸入與預測，依成熟的時間窗評估品質及關係變化，避免未成熟標籤偏差。預測、自信程度或輸入漂移指標都不是可靠的真實答案替代品。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q313","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Data / Concept Drift","difficulty":"hard","question":"零售模型每到週末都出現輸入分布告警；目前監控將週末資料與平日基準比較。模型品質尚未確認，下一步較合理的是？","options":["檢查週期性與可比較基準，再用成熟標籤評估影響","將所有週末告警直接關閉，視為已排除品質風險","每次告警即以當天資料重訓，省略基準與品質比較","把週末輸入分布複製成平日比例，直接送入原模型"],"answer":0,"explanation":"告警可能反映正常週期，也可能伴隨真正品質變化，應採可比較的季節／週期基準並評估結果。僅關閉告警或自動重訓沒有確認原因；強行改比例也可能扭曲實際輸入。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q314","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Data / Concept Drift","difficulty":"hard","question":"感測器欄位仍叫 temperature，但上游更新後由攝氏改成華氏，模型輸入分布與錯誤率同時異常。已確認模型訓練時使用攝氏，應優先怎麼處理？","options":["直接用華氏資料重訓模型，不再核對原資料契約","修正單位轉換與資料契約，再重評品質及是否需重訓","提高漂移告警門檻，讓新溫度範圍回到可接受區間","只把模型輸出重新縮放，讓預測平均值回到原先水準"],"answer":1,"explanation":"已知根因是資料管線違反單位契約，應先修正轉換並驗證輸入及品質。不能把所有分布異常都當成必須重訓的自然概念變化；調整告警或輸出均未修正根因。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q315","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21203","topicName":"AI 風險管理","concept":"Data / Concept Drift","difficulty":"hard","question":"各輸入特徵的單變量分布檢查皆未告警，但成熟標籤顯示模型錯誤率升高。哪項解讀較正確？","options":["輸入檢查未告警，已足以排除輸入與目標關係改變","單變量檢查未涵蓋所有變化，仍須檢查聯合分布與目標關係","錯誤率升高，已足以證明所有特徵的邊際分布改變","模型程式未修改，已足以把異常歸因於標籤蒐集故障"],"answer":1,"explanation":"各特徵邊際分布相近，不表示特徵間聯合關係或 P(Y|X) 相同。應進一步檢查資料品質、聯合分布及目標關係；不能由沒有輸入告警排除 Concept Drift，也不能僅憑錯誤率指定根因。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q316","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"A/B 與 Shadow Deployment","difficulty":"hard","question":"新模型需接收當下的真實請求以量測延遲及預測差異，但對外回應仍須完全由舊模型決定。哪種流量安排符合要求？","options":["複製請求給新版作影子推論，對外仍採用舊版結果","將 10% 請求交給新版回應，其餘請求採用舊版","將新舊結果加權平均，對所有請求回傳混合結果","每天更換對外使用的版本，交替比較兩版的表現"],"answer":0,"explanation":"Shadow 複製線上請求給候選模型，但不讓其結果成為對外決策。少量真實回應、混合結果或交替上線都會改變部分使用者結果，不符合這裡的限制。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q317","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"A/B 與 Shadow Deployment","difficulty":"hard","question":"推薦 A/B 實驗要讓 10% 使用者看到新版、90% 看到舊版，比較轉換率；同一使用者反覆造訪不應換組。哪種分派方式較合適？","options":["由使用者自行選新舊版，再直接比較兩組轉換率","以使用者為單位隨機且固定分組，同期觀察結果","每次請求重新抽籤分組，使同一人可交替看到兩版","白天全部使用新版、晚上使用舊版，再比較結果"],"answer":1,"explanation":"以使用者為單位的穩定隨機分派可避免反覆造訪時換組，並減少自選或時段差異的混淆。仍需檢查分派與樣本品質，以及適當的不確定性分析，不能僅憑隨機化就忽略實驗設計。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q318","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"A/B 與 Shadow Deployment","difficulty":"hard","question":"Shadow 測試記錄了新版每筆鏡像請求的延遲、錯誤與新舊推薦結果；使用者實際只看舊版。這些紀錄仍不能直接回答哪個問題？","options":["新版處理鏡像請求時，量測到的延遲分布為何","新舊模型收到同一請求時，推薦清單的差異為何","新版處理鏡像請求時，出現推論錯誤的比例為何","使用者看到新版推薦後，轉換率相對舊版會增加多少"],"answer":3,"explanation":"使用者未接觸新版推薦，因此 Shadow 不能直接觀察其行為反應或估計實際轉換提升。它可以量測鏡像路徑的延遲、錯誤與輸出差異；業務影響仍需適當的線上實驗等證據。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q319","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"A/B 與 Shadow Deployment","difficulty":"hard","question":"候選模型在 Shadow 模式不回傳答案給使用者，但推論流程原本會寫入客戶狀態並發送通知。要維持不影響正式業務，應怎麼安排？","options":["隔離或停用影子路徑的業務寫入與通知，另存測試紀錄","只隱藏新版的 HTTP 回應，保留原有業務寫入與通知","只降低鏡像流量比例，保留原有業務寫入與通知","只把模型名稱加上 shadow，沿用相同帳號與寫入流程"],"answer":0,"explanation":"不對外回傳預測不代表沒有副作用。Shadow 路徑仍需隔離業務寫入、通知等外部行為，並考量資源競爭；只隱藏回應或改名稱不足以保護正式流程。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q320","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21302","topicName":"AI 技術系統集成與部署","concept":"A/B 與 Shadow Deployment","difficulty":"hard","question":"A/B 事前規則訂為：新版若逾時率超過 2% 就停止擴量並調查。觀察期內新版轉換率較高，但逾時率達 4%。依已定規則應怎麼做？","options":["停止擴量並依預案控制流量，調查逾時原因後再評估","因轉換率較高而繼續擴量，將逾時列為下期改善","在看到結果後將逾時門檻改為 5%，讓新版繼續擴量","刪除逾時請求後重算指標，以成功請求決定是否擴量"],"answer":0,"explanation":"逾時率已違反事前護欄，不能用單一業務指標的改善抵銷。應依預案停止擴量、控制影響並調查；事後改門檻或排除失敗請求會扭曲原先決策標準。","sourceType":"依 iPAS 評測集調整提示，可能對該資料集過度適配。保留未參與開發且具代表性的測試集，才能較可靠地估計新案例品質。複製或重抽已看過的題目未消除資訊使用；只保留答對案例則有選擇偏差。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q337","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"LLM 評測資料集","difficulty":"hard","question":"摘要任務要求事實正確、重要資訊完整且符合指定格式。評測者對同一份摘要的分數分歧很大。哪項改善最能讓這三項要求被一致評分？","options":["用摘要與參考答案的字詞重疊率，取代三項要求的分項評分","以摘要長度是否接近參考答案，作為三項要求的共同代理","為三項要求訂定分項規準與範例，再以共同樣本校準評分","讓每位評測者自行設定三項權重，再將個別總分直接平均"],"answer":2,"explanation":"分項規準、正反例與共同樣本校準，可協助評測者對事實、完整性及格式採取一致判準。字詞重疊或長度不足以涵蓋三項品質；各自使用不同權重則難以解釋總分差異。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q338","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"LLM 評測資料集","difficulty":"hard","question":"客服模型改版後，平均分上升，但過去曾修好的權限洩漏案例再次失敗。要及早發現這類品質退步，最應維護哪種評測資產？","options":["版本化的歷史失敗案例集，搭配預期行為與分項通過門檻","定期替換的熱門問題樣本，搭配當期流量與總體平均分數","各版最高分的成功回覆集，搭配示範提示與輸出格式紀錄","供應商發布的標準測試集，搭配公開分數與模型版本資訊"],"answer":0,"explanation":"將已知失敗案例與預期安全行為納入可重跑的回歸評測，可檢查舊問題是否復發。熱門樣本、成功展示及公開測試各有用途，但不能代替這些案例。安全門檻宜獨立檢查，避免被總體平均分掩蓋。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q339","level":"中級","subject":"L21","subjectName":"人工智慧技術應用與規劃","topic":"L21103","topicName":"生成式 AI 技術與應用","concept":"LLM 評測資料集","difficulty":"hard","question":"團隊以 LLM 裁判評分客服回答，發現交換兩個候選回答的展示順序後，勝負常隨之改變。哪項評測流程調整最直接處理這個問題？","options":["固定較新模型的回答在前，讓每次比較採用一致順序","延長所有候選回答的篇幅，讓裁判取得更多文字線索","平衡候選回答的展示順序，並抽樣以人工判斷校準裁判","增加相同展示順序的題數，讓整體平均分更快趨於穩定"],"answer":2,"explanation":"展示順序影響判斷屬於位置偏差。平衡順序並以人工抽查校準，可檢查和降低此偏差。固定新模型在前或擴增同順序題數仍可能保留系統性偏差；延長回答則改變被評內容，未直接解決順序問題。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q340","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22101","topicName":"敘述性統計與資料摘要技術","concept":"Percentile / IQR","difficulty":"medium","question":"薪資資料呈右偏，且含少數極高薪資。若要描述中間 50% 資料的分散程度，應選哪個統計量？","options":["全距：最大薪資減最小薪資","標準差：薪資對平均值的離散程度","中位數：排序後位居中央的薪資","四分位距：第三四分位數減第一四分位數"],"answer":3,"explanation":"四分位距 IQR = Q3 − Q1，描述中央一半資料的跨度。全距依賴兩端極值，標準差反映全體相對平均值的離散，中位數則描述位置而非分散程度。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q341","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22101","topicName":"敘述性統計與資料摘要技術","concept":"Percentile / IQR","difficulty":"medium","question":"某人成績位於參照群體的第 90 百分位。忽略同分與百分位計算慣例的細微差異，最合理的解讀為何？","options":["其答對題數約占全部題目的九成","參照群體約九成的成績不高於他","其成績約為群體最高分數的九成","參照群體約九成的成績不低於他"],"answer":1,"explanation":"百分位描述在參照群體中的相對位置，而非答題正確率或相對最高分的比例。第 90 百分位約表示九成成績不高於該值；同分與計算慣例可能使精確比例略有不同。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q342","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22101","topicName":"敘述性統計與資料摘要技術","concept":"Percentile / IQR","difficulty":"medium","question":"某資料集已算得 Q1 = 20、Q3 = 50。其四分位距 IQR 與意義為何？","options":["30，表示中央一半資料的跨度","70，表示中央一半資料的總和","35，表示全體資料的中位位置","2.5，表示全體資料的離散倍數"],"answer":0,"explanation":"IQR = Q3 − Q1 = 50 − 20 = 30。Q1 與 Q3 的和、平均或比值均不是 IQR；尤其 (Q1 + Q3)/2 不一定等於中位數。題目已給定四分位數，無須另選樣本分位數算法。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q343","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22101","topicName":"敘述性統計與資料摘要技術","concept":"Percentile / IQR","difficulty":"medium","question":"一組大型資料中，最大值再增加 100，其餘值與排序不變，且計算 Q1、Q3 所用的位置及數值均未改變。全距與 IQR 如何變化？","options":["全距維持不變，IQR 增加 100","全距增加 100，IQR 維持不變","全距增加 100，IQR 也增加 100","全距維持不變，IQR 也維持不變"],"answer":1,"explanation":"最大值增加 100、最小值未變，因此全距增加 100。題目明訂 Q1、Q3 均未變，故 IQR 不變。這說明 IQR 不直接依賴最極端值，但不代表任何資料改動都不影響四分位數。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q344","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22101","topicName":"敘述性統計與資料摘要技術","concept":"Percentile / IQR","difficulty":"medium","question":"以同一套分位數定義整理連續數值資料時，Q1、Q2、Q3 分別對應哪些百分位？","options":["第 10、第 50、第 90 百分位","第 25、第 50、第 75 百分位","第 20、第 40、第 60 百分位","第 33、第 50、第 67 百分位"],"answer":1,"explanation":"三個四分位數分別對應第 25、50、75 百分位，將排序資料分成四個部分；Q2 即中位數。不同樣本分位數算法可能給出不同數值，但不改變這些百分位的對應關係。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q345","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22101","topicName":"敘述性統計與資料摘要技術","concept":"Percentile / IQR","difficulty":"medium","question":"箱型圖以 Q1 − 1.5×IQR、Q3 + 1.5×IQR 作為潛在離群值的下、上界。若 Q1 = 20、Q3 = 40，哪一組界線正確？","options":["下界 0、上界 60","下界 10、上界 50","下界 −30、上界 70","下界 −10、上界 70"],"answer":3,"explanation":"IQR = 40 − 20 = 20，1.5×IQR = 30，因此下界 20 − 30 = −10，上界 40 + 30 = 70。超出界線的值只是待查核的潛在離群值，不能據此直接判定資料錯誤。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q346","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22102","topicName":"機率分佈與資料分佈模型","concept":"Binomial / Poisson","difficulty":"medium","question":"獨立抽查 20 件產品，每件瑕疵機率同為 p；另假設客服來電近似獨立發生且平均速率穩定。瑕疵品數與一小時來電數的典型分布模型分別為何？","options":["前者為卜瓦松分布，後者為二項分布","前者為二項分布，後者為卜瓦松分布","前者為幾何分布，後者為二項分布","前者為二項分布，後者為指數分布"],"answer":1,"explanation":"固定 20 次獨立、同成功機率的二元試驗，其成功次數服從二項分布。卜瓦松過程在固定時間內的事件數服從卜瓦松分布；幾何分布描述等待首次成功的試驗次數，指數分布則可描述該過程的事件間隔。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q347","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22102","topicName":"機率分佈與資料分佈模型","concept":"Binomial / Poisson","difficulty":"medium","question":"廣告共曝光 100 次，每次是否點擊視為獨立事件，點擊機率固定為 0.05。以二項分布建模時，點擊次數的期望值為何？","options":["5 次，由 100 × 0.05 計算","0.05 次，由單次點擊機率計算","95 次，由 100 × 0.95 計算","20 次，由 1 ÷ 0.05 計算"],"answer":0,"explanation":"二項分布的期望值為 np，故為 100×0.05 = 5 次。0.05 是單次成功機率，95 是未點擊次數的期望，20 則是相同條件下等待首次點擊所需試驗次數的期望。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q348","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22102","topicName":"機率分佈與資料分佈模型","concept":"Binomial / Poisson","difficulty":"medium","question":"伺服器錯誤近似服從每小時平均 4 次的齊次卜瓦松過程。要建立任意連續半小時內錯誤次數的分布，其參數 λ 應設為多少？","options":["λ = 4，沿用每小時的事件平均數","λ = 2，使用半小時的事件平均數","λ = 8，依時間縮短而加倍參數值","λ = 0.5，直接使用半小時的長度"],"answer":1,"explanation":"卜瓦松計數的 λ 是所選區間內的期望事件數，應將速率乘以區間長度。每小時 4 次乘以 0.5 小時，得到 λ = 2；λ 不是時間長度本身。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q349","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22102","topicName":"機率分佈與資料分佈模型","concept":"Binomial / Poisson","difficulty":"medium","question":"令 X 服從 Binomial(n=10, p=0.2)，Y 服從 Poisson(λ=2)。兩者期望值相同，下列哪項正確比較其可能取值？","options":["X 與 Y 的取值上限都等於各自期望值 2","X 可取任意非負整數，Y 的最大取值為 2","X 的最大取值為 10，Y 沒有有限的取值上限","X 與 Y 的最大取值都等於固定試驗次數 10"],"answer":2,"explanation":"二項分布的成功次數介於 0 與 n，故 X 最大為 10。卜瓦松分布可取任意非負整數，λ 是期望值而非上限；這是模型的數學支持範圍，不表示極大計數很常見。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q350","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22102","topicName":"機率分佈與資料分佈模型","concept":"Binomial / Poisson","difficulty":"medium","question":"某路口的通報數原擬採用單一固定 λ 的卜瓦松分布。資料顯示事件常成群出現，且尖峰與離峰速率差異很大。最合理的下一步是？","options":["將整日計數合併求平均，再以單一 λ 取代分時差異","先把每次成群事件合成一次，再沿用原本的計數定義","檢查群聚與速率變化，再評估分時模型或其他計數分布","改以固定樣本數的二項分布，並略過事件相依性的檢查"],"answer":2,"explanation":"事件群聚與明顯時變速率，提示簡單齊次卜瓦松模型的假設可能不適合。應檢查原因，考慮分時速率或能處理額外變異的計數模型。合併平均、改變事件定義或直接換分布，都不能取代假設檢查。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q351","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22102","topicName":"機率分佈與資料分佈模型","concept":"Binomial / Poisson","difficulty":"medium","question":"抽驗 10 件產品，假設各件是否瑕疵相互獨立且瑕疵機率固定為 0.1。以二項分布計算「恰有 1 件瑕疵」的機率，哪個式子正確？","options":["0.1 × 0.9⁹，只計一個固定位置出現瑕疵","1 − 0.9¹⁰，計算至少出現一件瑕疵","10 × 0.1 × 0.9⁹，加總十種瑕疵位置","10 × 0.9 × 0.1⁹，加總十種良品位置"],"answer":2,"explanation":"恰有一件瑕疵包含十個互斥的位置安排，每種機率為 0.1×0.9⁹，故總機率為 10×0.1×0.9⁹，約 0.3874。未乘 10 只算單一位置；1−0.9¹⁰ 是至少一件；最後一式是恰有九件瑕疵。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q352","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22103","topicName":"假設檢定與統計推論","concept":"信賴區間","difficulty":"hard","question":"某電商資料平台正在重新設計資料管線與分析架構，工程師遇到以下問題。 在此情境下，同樣變異下，樣本從 100 增加到 1000，平均值的 95% 信賴區間通常會如何變化？","options":["信賴區間可完全取代假設檢定","樣本越大信賴區間一定越寬","95% 信賴區間代表參數有 95% 機率落在已計算出的固定區間內","信賴區間反映估計的不確定性；在其他條件相同時樣本越大通常區間越窄"],"answer":3,"explanation":"頻率學派下，信賴區間是重複抽樣程序的覆蓋率概念；樣本數增加通常降低標準誤，使 7 月訓練、8 月驗證。2–7 月屬固定長度滑動窗口；用到 8 月再驗證 7 月洩漏未來；固定 1–6 月則未擴展且改變預測距離。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q390","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22302","topicName":"常見的大數據分析方法","concept":"時間序列切分","difficulty":"hard","question":"需求分布近期變動，團隊決定每次只用最近 6 個月資料訓練，再驗證緊接的 1 個月。首折為 1–6 月訓練、7 月驗證，下一折應如何切分？","options":["以 1–7 月訓練，再以 8 月資料驗證","以 2–7 月訓練，再以 8 月資料驗證","以 2–8 月訓練，再以 7 月資料驗證","以 1–6 月訓練，再以 9 月資料驗證"],"answer":1,"explanation":"固定長度 rolling window 向後移動一個月時，移除 1 月並加入已取得的 7 月，以 2–7 月訓練、8 月驗證。1–7 月增加窗口長度；用到 8 月驗證 7 月違反時間順序；跳到 9 月也不符合緊接一個月的要求。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q391","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22302","topicName":"常見的大數據分析方法","concept":"時間序列切分","difficulty":"hard","question":"團隊以 1–6 月訓練、7 月驗證，但先用 1–12 月資料估計缺失值插補的平均數。要模擬 6 月底可建立的模型，應如何修正？","options":["分別以 1–6 月及 7 月均值，處理訓練與驗證資料","以 1–7 月均值統一插補，排除更晚月份的資訊","以 1–6 月估計插補參數，再原樣套用於 7 月資料","以 7–12 月估計插補參數，再統一套用所有月份"],"answer":2,"explanation":"在該驗證折，插補等前處理參數應只從訓練期間估計，再套用於驗證資料。用全年、截至驗證月底或驗證期自身的統計量，都使用了 6 月底尚不可得的分布資訊；後續折應各自重新擬合前處理。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q392","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22302","topicName":"常見的大數據分析方法","concept":"時間序列切分","difficulty":"hard","question":"金融模型在每日 t 收盤時預測接下來 5 個交易日的累積報酬。驗證從第 101 日開始，訓練原點到第 100 日；其中部分訓練標籤要到驗證期才完整。應如何避免此處的洩漏？","options":["保留全部訓練原點，只將驗證日期改為隨機抽樣","保留全部訓練原點，只移除輸入特徵中的日期欄位","依標籤涵蓋區間剔除邊界樣本，確保訓練標籤當時已知","依訓練原點先後排序樣本，仍使用完整的未來報酬標籤"],"answer":2,"explanation":"僅依原點切分不足以保證標籤可用。多日報酬標籤可能跨入驗證期，應依實際預測截止時間及標籤涵蓋區間，剔除邊界樣本或設適當間隔。隨機抽樣、刪日期欄或排序都無法使未來標籤提前可得。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q393","level":"中級","subject":"L22","subjectName":"大數據處理分析與應用","topic":"L22302","topicName":"常見的大數據分析方法","concept":"時間序列切分","difficulty":"hard","question":"零售模型在每天開始時預測當日銷量，以過去 7 天的銷量平均作為特徵。資料已依日期切分，以下哪種特徵計算最符合驗證時的資訊可得性？","options":["用當日及前 6 天的實際銷量，計算七日平均","用前 3 天至後 3 天的實際銷量，計算七日平均","用當日所在週全部的實際銷量，計算該週 "中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23202","topicName":"常見機器學習演算法","concept":"SVM Kernel","difficulty":"hard","question":"RBF kernel 為 K(x,z)=exp(−gamma×||x−z||²)。保持資料尺度與 C 不變，對兩個距離大於 0 的固定樣本提高 gamma，會發生哪項變化？","options":["兩者的 kernel 值上升，單一樣本的影響範圍變廣","兩者的 kernel 值不變，只有違反間隔的懲罰增加","兩者的 kernel 值下降，單一樣本的影響範圍變窄","兩者的 kernel 值下降，特徵空間的維度隨之減少"],"answer":2,"explanation":"距離固定且大於 0 時，提高 gamma 會使指數更負、kernel 值更小，對應較局部的影響範圍。C 才控制違反間隔的懲罰；gamma 並不是直接設定特徵空間維度。過大的 gamma 可能使邊界過度局部化。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q433","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23202","topicName":"常見機器學習演算法","concept":"SVM Kernel","difficulty":"hard","question":"RBF SVM 的兩項數值特徵分別以數十與數萬為常見尺度，且兩者都有預測意義。訓練前標準化特徵的主要理由是？","options":["使每個欄位與目標類別的相關程度變得相同","使原本無法線性分隔的資料轉為線性可分","使每個樣本在決策函數中的權重變得相等","減少數值尺度差異對距離及 kernel 值的支配"],"answer":3,"explanation":"RBF kernel 依賴特徵間的平方距離，數值尺度大的欄位可能主導距離。標準化可減少單位與尺度的影響，但不保證各特徵同樣重要、資料線性可分或樣本權重相等；縮放參數須只由訓練資料估計。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q434","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23202","topicName":"常見機器學習演算法","concept":"SVM Kernel","difficulty":"hard","question":"團隊要比較 RBF SVM 的多組 C、gamma，已保留獨立最終測試集。採交叉驗證選型並需要標準化時，哪個流程較能避免評估資料洩漏？","options":["先在全部開發資料擬合標準化，再切各折比較參數","先在開發與測試資料擬合標準化，再用各折選參數","先在每個驗證折獨立擬合標準化，再轉換該折資料","先在每個訓練折擬合標準化，再轉換對應驗證折"],"answer":3,"explanation":"每個交叉驗證訓練折應獨立擬合標準化與模型，再用同一轉換處理對應驗證折。用全部開發資料、測試資料或驗證折自身估計縮放參數，都使用了該折訓練時不應取得的資訊。C、gamma 選定後才進行最終獨立測試。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q435","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23202","topicName":"常見機器學習演算法","concept":"SVM Kernel","difficulty":"hard","question":"在標準 soft-margin RBF SVM 中固定 gamma 與資料尺度，將 C 調大，最直接改變目標函數中的哪項取捨？","options":["加重違反間隔的損失，相對減弱對較大間隔的偏好","加快 kernel 隨距離衰減，相對縮小樣本的影響範圍","降低違反間隔的損失，相對加強對較大間隔的偏好","增加 kernel 的多項式次數，相對提高邊界的階數"],"answer":0,"explanation":"標準 soft-margin SVM 以 C 加權違反間隔的損失。提高 C 使模型更重視降低這項損失，與維持大間隔形成取捨；不保證驗證 m","question":"不平衡分類驗證中，如何降低切分造成指標大幅波動？","options":["Stratified K-fold 會把同一筆資料同時放在 train/test","Stratification 只適用迴歸","分類資料不平衡時，Stratified K-fold 可讓各 fold 類別比例較一致","類別越不平衡越應完全隨機且不看標籤"],"answer":2,"explanation":"Stratified split 在分類任務中盡量維持各折的類別比例，能降低某 fold 幾乎沒有少數類別的問題。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q465","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"Stratified CV","difficulty":"medium","question":"某金融機構正在訓練風險模型，工程師需要在模型效能與泛化能力間取得平衡。 在此情境下，Stratification 的主要目的不是提高模型容量，而是？","options":["類別越不平衡越應完全隨機且不看標籤","分類資料不平衡時，Stratified K-fold 可讓各 fold 類別比例較一致","Stratification 只適用迴歸","Stratified K-fold 會把同一筆資料同時放在 train/test"],"answer":1,"explanation":"Stratified split 在分類任務中盡量維持各折的類別比例，能降低某 fold 幾乎沒有少數類別的問題。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q466","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"ROC-AUC / PR-AUC","difficulty":"hard","question":"詐欺僅占交易的 0.1%，全猜正常也有 99.9% Accuracy。團隊改用 PR 曲線檢視候選模型，最主要能補充哪項資訊？","options":["正常交易的判對比例，與全部交易正確率之間的變化","警示中詐欺的比例，與實際詐欺被找回比例之間的取捨","風險分數的數值大小，與預測機率校準程度之間的差異","不同模型的訓練時間，與部署時每秒處理量之間的關係"],"answer":1,"explanation":"PR 曲線呈現不同閾值下的 Precision 與 Recall：警示中有多少是真正詐欺，以及實際詐欺有多少被找出。它不會讓大量真負類直接主導這兩個比例，也不等同機率校準或執行效率評估。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q467","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"ROC-AUC / PR-AUC","difficulty":"hard","question":"二元分類模型以較高分數表示較可能為正類。若無同分情況，ROC-AUC 為 0.90，哪個解讀最符合其排序意義？","options":["使用預設閾值時，全部樣本約有九成被正確分類","使用預設閾值時，模型找回約九成的實際正類","從預測為正的樣本抽一筆，約九成機率為真實正類","隨機抽一正一負樣本，約九成機率是正類分數較高"],"answer":3,"explanation":"無同分時，ROC-AUC 可解讀為隨機抽取一個正類與一個負類，正類分數高於負類的機率。它不是單一閾值的 Accuracy、Recall 或 Precision；即使 AUC 高，仍須另行選擇適合業務的閾值。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q468","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"ROC-AUC / PR-AUC","difficulty":"hard","question":"驗證集有 100 個正類、9,900 個負類。某閾值的 TPR=80%、FPR=1%，以 PR 曲線檢視該點時，Precision 約為多少？","options":["44.7%，以 80 ÷ (80 + 99) 計算","80.0%，以 80 ÷ (80 + 20) 計算","99.0%，以 9,801 ÷ 9,900 計算","0.8%，以 80 ÷ 10,000 計算"],"answer":0,"explanation":"TP=100×80%=80，FP=9,900×1%=99，故 Precision=80/(80+99)≈44.7%。80% 是 Recall，99% 是負類召回率，0.8% 是 TP 占全部樣本的比例。正類稀少時，低 FPR 仍可能對應不少誤報。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q469","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"ROC-AUC / PR-AUC","difficulty":"hard","question":"金融模型在某閾值下的混淆矩陣為 TP=80、FN=20、FP=90、TN=810。若 ROC 圖以 FPR 為橫軸、TPR 為縱軸，該閾值對應哪個座標？","options":["(0.90, 0.80)，以負類召回率搭配正類召回率","(0.10, 0.80)，以假陽性率搭配真陽性率","(0.20, 0.90)，以假陰性率搭配真陰性率","(0.80, 0.10)，以真陽性率搭配假陽性率"],"answer":1,"explanation":"FPR=FP/(FP+TN)=90/900=0.10，TPR=TP/(TP+FN)=80/100=0.80，因此座標為 (0.10,0.80)。其餘選項分別混淆補數、陰性相關率或橫縱軸順序。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q470","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"ROC-AUC / PR-AUC","difficulty":"hard","question":"同一模型在兩個母體中的正類及負類條件分數分布相同，但正類比例不同，兩條件分布又有重疊。忽略有限樣本誤差，比較 ROC-AUC 與 PR 曲線時，何者較合理？","options":["正類比例降低會使 ROC-AUC 降低，PR 曲線則維持不變","兩者皆由分數排序決定，因此都不受正類比例變動影響","先依正類比例調整分數閾值，就能保證兩條 PR 曲線相同","ROC-AUC 可維持不變，但 PR 曲線會受到正類比例影響"],"answer":3,"explanation":"固定類別條件分數分布時，各閾值的 TPR、FPR 不變，ROC-AUC 因而不變。Precision 還取決於正類比例：πTPR/[πTPR+(1−π)FPR]，因此 PR 曲線及其摘要分數可能改變。跨資料集比較 PR-AUC 時應交代類別比例與計算方式。","sourceType":"依 iPAS 115 年官方評鑑範圍與公開題型風格自編（情境強化版）"},{"id":"Q471","level":"中級","subject":"L23","subjectName":"機器學習技術與應用","topic":"L23303","topicName":"模型訓練、評估與驗證","concept":"ROC-AUC / PR-AUC","difficulty":"hard","question":"同一模型在驗證集的三個候選閾值分別為：0.2 時 Precision=20%、Recall=95%；0.4 時 Precision=40%、Recall=90%；0.6 時 Precision=60%、Recall=80%。業務要求 Recall 至少 90%，並在符合條件者中最大化 Precision，應選哪個方案？","options":["選 0.4，在達標方案中取最高 Precision","選 0.2，在全部方案中取最高 Recall","選 0.6， function buildStratifiedExam(pool,n){
  const groups={};
  shuffle(pool).forEach(q=>(groups[q.topic]||(groups[q.topic]=[])).push(q));
  const keys=shuffle(Object.keys(groups)); const out=[];
  let safety=0;
  while(out.length<n && safety++<5000){
    let moved=false;
    for(const k of keys){
      if(groups[k].length && out.length<n){out.push(groups[k].pop());moved=true;}
    }
    if(!moved)break;
  }
  return shuffle(out);
}

async function ensurePdfJs(){
  if(window.pdfjsLib) return window.pdfjsLib;
  if(pdfJsLoading) return pdfJsLoading;
  pdfJsLoading = new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{
      if(window.pdfjsLib){
        window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        resolve(window.pdfjsLib);
      }else reject(new Error('PDF.js 載入失敗'));
    };
    s.onerror=()=>reject(new Error('無法載入 PDF.js，請確認網路連線'));
    document.head.appendChild(s);
  });
  return pdfJsLoading;
}

async function extractPdfTextFromBuffer(buf){
  await ensurePdfJs();
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  let fullText='';
  for(let pn=1;pn<=pdf.numPages;pn++){
    const page=await pdf.getPage(pn);
    const tc=await page.getTextContent();
    let pageText='',lastY=null;
    for(const item of tc.items){
      const y=item.transform?item.transform[5]:null;
      if(lastY!==null && y!==null && Math.abs(y-lastY)>3) pageText+='\n';
      else if(pageText) pageText+=' ';
      pageText+=item.str||'';
      lastY=y;
    }
    fullText+='\n'+pageText+'\n';
  }
  return fullText;
}

async function fetchArrayBufferWithFallback(url){
  const attempts=[
    url,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    `https://corsproxy.io/?${encodeURIComponent(url)}`
  ];
  let lastErr=null;
  for(const u of attempts){
    try{
      const r=await fetch(u,{cache:'no-store'});
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      const b=await r.arrayBuffer();
      if(b.byteLength<5000) throw new Error('回傳內容過小，可能不是 PDF');
      return b;
    }catch(e){lastErr=e;}
  }
  throw lastErr||new Error('無法取得官方 PDF');
}


function mirrorExamName(paper){
  if(paper.year==='115' && paper.session==='第二次') return '115年第二次';
  if(paper.year==='115' && paper.session==='第一次') return '115年第一次';
  if(paper.year==='114' && paper.session==='第四梯次') return '114年第四梯次';
  if(paper.year==='114' && paper.session==='第二梯次') return '114年第二梯次';
  return null;
}
function mirrorSubjectNo(subject){
  return ({L11:1,L12:2,L21:1,L22:2,L23:3})[subject]||null;
}
async function loadOfficialStructuredMirror(){
  if(officialMirrorData)return officialMirrorData;
  const r=await fetch(OFFICIAL_STRUCTURED_MIRROR,{cache:'force-cache'});
  if(!r.ok)throw new Error(`結構化題庫來源 HTTP ${r.status}`);
  const raw=await r.text();
  const m=raw.match(/window\.APP_DATA\s*=\s*([\s\S]*?)\s*;\s*<\/script>/);
  if(!m)throw new Error('無法辨識結構化題庫資料');
  const data=JSON.parse(m[1]);
  if(!Array.isArray(data.questions)||data.questions.length<500)throw new Error('結構化題庫內容不完整');
  officialMirrorData=data;
  return data;
}

function cleanMirrorQuestion(text,n){
  let s=cleanOfficialPageFurniture(text).replace(/\s+/g,' ').trim();
  // 公開轉檔的 PDF 文字層偶爾把原題號插進中文字中，例如「主要用5.來」。只移除「中文 + 本題號 + . + 中文/括號」型態，避免誤傷 0.5 等小數。
  try{
    const re=new RegExp(`(?<=[\\u4e00-\\u9fff）)])${n}\\.(?=[\\u4e00-\\u9fff（(]|$)`,'g');
    s=s.replace(re,'');
  }catch(e){}
  return s.replace(/\s{2,}/g,' ').trim();
}
async function loadPaperFromStructuredMirror(paper){
  const exam=mirrorExamName(paper), subjectNo=mirrorSubjectNo(paper.subject);
  if(!exam||!subjectNo||paper.id.startsWith('115-3-'))return null;
  const data=await loadOfficialStructuredMirror();
  const rows=data.questions.filter(q=>q.level===paper.level && q.subject===subjectNo && q.exam===exam).sort((a,b)=>(a.id||0)-(b.id||0));
  if(rows.length<45)throw new Error(`結構化題庫只找到 ${rows.length} 題，未達完整考卷門檻`);
  const questions=rows.slice(0,50).map((r,i)=>{
    const n=i+1; const letters=['A','B','C','D'];
    const options=letters.map(k=>cleanOfficialPageFurniture(r.options?.[k]).replace(/\s+/g,' ').trim());
    return {
      id:`PAST-${paper.id}-${n}`,number:n,level:paper.level,subject:paper.subject,
      topic:`PAST-${paper.year}-${paper.session}`,topicName:`${paper.year} 年 ${paper.session} ${paper.name}`,
      difficulty:'official',question:cleanMirrorQuestion(r.q,n),options,
      answer:letters.indexOf(String(r.answer||'').normalize('NFKC').trim()),
      hasVisual:/下圖|如圖|參考下圖|附圖|圖示|表格|程式碼|執行結果/i.test(String(r.q||'')),
      explanation:`官方公告試題正解：${String(r.answer||'').normalize('NFKC').trim()}`,
      sourceType:'iPAS 官方公告試題（結構化轉檔；答案以官方公告核對）'
    };
  }).filter(q=>q.answer>=0 && q.options.length===4);
  return {meta:{paperId:paper.id,title:`${paper.year} 年 ${paper.session} ${paper.subject} ${paper.name}`,pdf:paper.pdf,source:'structured-mirror',contentVersion:1},questions};
}

async function fetchPaperText(paper){
  try{
    const buf=await fetchArrayBufferWithFallback(paper.pdf);
    return await extractPdfTextFromBuffer(buf);
  }catch(pdfErr){
    console.warn('PDF 直接載入失敗，改用文字備援',pdfErr);
    try{
      const jina=`https://r.jina.ai/${paper.pdf}`;
      const r=await fetch(jina,{cache:'no-store'});
      if(!r.ok) throw new Error(`文字備援 HTTP ${r.status}`);
      const t=await r.text();
      if(t.length<1000) throw new Error('文字備援內容不足');
      return t;
    }catch(textErr){
      const e=new Error('目前瀏覽器無法自動讀取這份官方考卷。可先點「查看官方 PDF」；換到 GitHub Pages / Safari / Chrome 後再試。');
      e.cause={pdfErr,textErr};
      throw e;
    }
  }
}
